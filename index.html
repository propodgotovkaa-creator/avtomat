<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Поймай игрушку</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;

  background: #eee8e3;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  user-select: none;
}

button {
  font: inherit;

  -webkit-tap-highlight-color: transparent;

  touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ
========================================================= */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;

  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  background:
    url("fon.png")
    center center / cover
    no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding:
    30px
    35px;

  border-radius: 34px;

  background:
    rgba(255,255,255,.94);

  box-shadow:
    0 15px 40px
    rgba(77,67,72,.13);

  text-align: center;

  color: #40506a;

  z-index: 20;
}


.task-small {
  font-size: 24px;
  font-weight: 800;

  opacity: .72;
}


.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}


.task-main b {
  color: #ed5573;
}


/* =========================================================
   РАУНД
========================================================= */

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px;

  border-radius: 28px;

  background:
    rgba(255,255,255,.92);

  box-shadow:
    0 12px 30px
    rgba(77,67,72,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;

  z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
  position: absolute;

  left: 780px;
  top: 25px;

  width: 735px;
  height: 1030px;

  z-index: 10;
}


/* =========================================================
   ВНУТРЕННЯЯ КАМЕРА

   ВСЁ:
   - игрушки
   - рельс
   - клешня
   - трос

   находится ВНУТРИ этого блока.

   overflow:hidden не позволит им
   вылезти за стекло.
========================================================= */

#machineInside {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  border-radius: 12px;

  background:

    radial-gradient(
      ellipse at 50% 10%,
      rgba(255,249,207,.85) 0%,
      rgba(255,255,255,0) 38%
    ),

    linear-gradient(
      180deg,
      #eefcf9 0%,
      #f9fffd 45%,
      #fffdf7 78%,
      #fff3e9 100%
    );

  z-index: 1;
}


/* =========================================================
   СВЕТ
========================================================= */

.inside-light {
  position: absolute;

  left: 55px;
  top: 17px;

  width: 457px;
  height: 12px;

  border-radius: 20px;

  background: #fff5b8;

  box-shadow:

    0 0 12px
    rgba(255,239,150,.8),

    0 0 30px
    rgba(255,239,150,.45);

  z-index: 2;
}


/* =========================================================
   ПОЛ
========================================================= */

.inside-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 90px;

  background:

    linear-gradient(
      180deg,
      #fffdf7 0%,
      #fff1e7 100%
    );

  border-top:
    4px solid
    rgba(238,166,181,.55);

  z-index: 3;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
  position: absolute;

  left: 40px;
  top: 44px;

  width: 487px;
  height: 14px;

  border-radius: 20px;

  background:

    linear-gradient(
      180deg,
      #ffffff 0%,
      #dce4e6 24%,
      #8d989d 55%,
      #687277 76%,
      #dce3e5 100%
    );

  border:
    2px solid
    rgba(88,98,103,.45);

  box-shadow:

    0 4px 6px
    rgba(0,0,0,.14),

    inset 0 2px 2px
    rgba(255,255,255,.9);

  z-index: 8;
}


/* =========================================================
   ВЕСЬ МЕХАНИЗМ

   Двигается по X только этот блок.
========================================================= */

#clawRig {
  /*
     ОЧЕНЬ ВАЖНО.

     Это единственная переменная,
     которая управляет высотой троса
     И положением клешни.

     Поэтому разрыв между ними
     невозможен.
  */

  --cable-length: 78px;


  position: absolute;

  left: 189px;
  top: 15px;

  width: 190px;
  height: 545px;

  z-index: 30;

  transition:
    left .75s
    cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
  position: absolute;

  left: 34px;
  top: 0;

  width: 122px;
  height: 83px;

  object-fit: contain;

  z-index: 35;

  pointer-events: none;
}


/* =========================================================
   ТОЧКА ВЫХОДА ТРОСА

   Низ каретки.
========================================================= */

#cableAnchor {
  position: absolute;

  left: 92px;
  top: 62px;

  width: 6px;

  z-index: 31;
}


/* =========================================================
   ТРОС

   Высота = --cable-length
========================================================= */

#cable {
  position: absolute;

  left: 0;
  top: 0;

  width: 6px;

  height:
    var(--cable-length);

  border-radius: 5px;

  background:

    repeating-linear-gradient(
      135deg,

      #fafafa 0px,
      #fafafa 3px,

      #7f898e 3px,
      #7f898e 6px
    );

  box-shadow:
    1px 0 2px
    rgba(0,0,0,.20);

  transition:
    height .85s
    cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КЛЕШНЯ

   ВАЖНО:

   top = длина троса.

   То есть верх корпуса находится
   ровно там, где закончился трос.

   БОЛЬШЕ НЕТ ОТДЕЛЬНОГО top,
   который мог бы создать разрыв.
========================================================= */

#clawAssembly {
  position: absolute;

  left: -74px;

  top:
    var(--cable-length);

  width: 154px;
  height: 185px;

  z-index: 40;

  transition:
    top .85s
    cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КОРПУС КЛЕШНИ

   Верх корпуса слегка заходит
   на конец троса.

   Так визуально они точно соединены.
========================================================= */

#clawBody {
  position: absolute;

  left: 50px;
  top: -8px;

  width: 54px;
  height: 80px;

  object-fit: contain;

  z-index: 48;

  pointer-events: none;
}


/* =========================================================
   ЛЕВАЯ ЛАПКА
========================================================= */

#clawLeft {
  position: absolute;

  left: 11px;
  top: 43px;

  width: 83px;
  height: 135px;

  object-fit: contain;

  /*
     Шарнир находится в районе
     розового кружка.
  */

  transform-origin:
    66px 16px;

  z-index: 45;

  pointer-events: none;

  transition:
    transform .42s
    cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ПРАВАЯ ЛАПКА
========================================================= */

#clawRight {
  position: absolute;

  right: 11px;
  top: 43px;

  width: 83px;
  height: 135px;

  object-fit: contain;

  transform-origin:
    17px 16px;

  z-index: 45;

  pointer-events: none;

  transition:
    transform .42s
    cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   NEUTRAL

   ЭТО СОСТОЯНИЕ ДО НАЖАТИЯ.

   Клешня НЕ открытая.

   Она выглядит обычной —
   лапки немного сведены.
========================================================= */

#clawAssembly.neutral #clawLeft {
  transform:
    rotate(17deg);
}


#clawAssembly.neutral #clawRight {
  transform:
    rotate(-17deg);
}


/* =========================================================
   OPEN

   Только после нажатия
   красной кнопки.
========================================================= */

#clawAssembly.open #clawLeft {
  transform:
    rotate(-17deg);
}


#clawAssembly.open #clawRight {
  transform:
    rotate(17deg);
}


/* =========================================================
   CLOSED

   Захватила игрушку.
========================================================= */

#clawAssembly.closed #clawLeft {
  transform:
    rotate(32deg);
}


#clawAssembly.closed #clawRight {
  transform:
    rotate(-32deg);
}


/* =========================================================
   ИГРУШКА ВНУТРИ КЛЕШНИ

   После захвата появляется здесь.

   Поскольку carriedToy является
   дочерним элементом clawAssembly,
   игрушка автоматически едет:

   ↑
   →
   ↓

   вместе с клешнёй.
========================================================= */

#carriedToy {
  position: absolute;

  left: 27px;
  top: 89px;

  width: 100px;
  height: 100px;

  display: none;

  align-items: center;
  justify-content: center;

  font-size: 78px;
  line-height: 1;

  z-index: 43;

  pointer-events: none;
}


#carriedToy.show {
  display: flex;
}


/* =========================================================
   ИГРУШКИ

   Они находятся именно
   ВНУТРИ #machineInside.
========================================================= */

.toy {
  position: absolute;

  bottom: 48px;

  width: 105px;
  height: 120px;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  font-size: 82px;
  line-height: 1;

  z-index: 15;

  transition:
    opacity .25s ease,
    transform .35s ease;
}


/* =========================================================
   ТРИ ПОЗИЦИИ

   Не прижаты к стенкам.
========================================================= */

#toy0 {
  left: 82px;
}


#toy1 {
  left: 231px;
}


#toy2 {
  left: 380px;
}


/* =========================================================
   ТЕНИ
========================================================= */

.toy::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -7px;

  width: 74px;
  height: 14px;

  transform:
    translateX(-50%);

  border-radius: 50%;

  background:
    rgba(62,58,70,.14);

  filter:
    blur(5px);

  z-index: -1;
}


/* =========================================================
   НЕУДАЧНЫЙ ЗАХВАТ
========================================================= */

.toy.wrong-drop {
  animation:
    wrongDrop .65s ease;
}


@keyframes wrongDrop {

  0% {
    transform:
      translateY(-45px)
      rotate(0deg);
  }

  45% {
    transform:
      translateY(5px)
      rotate(-7deg);
  }

  70% {
    transform:
      translateY(-4px)
      rotate(5deg);
  }

  100% {
    transform:
      translateY(0)
      rotate(0deg);
  }
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  pointer-events: none;

  z-index: 80;
}


#glass::before {
  content: "";

  position: absolute;

  left: 48px;
  top: -100px;

  width: 65px;
  height: 800px;

  transform:
    rotate(18deg);

  background:

    linear-gradient(
      90deg,

      transparent,

      rgba(255,255,255,.22),

      transparent
    );
}


#glass::after {
  content: "";

  position: absolute;

  right: 70px;
  top: -100px;

  width: 34px;
  height: 800px;

  transform:
    rotate(18deg);

  background:

    linear-gradient(
      90deg,

      transparent,

      rgba(255,255,255,.13),

      transparent
    );
}


/* =========================================================
   ПЕРЕДНЯЯ PNG-РАМА

   Она лежит ПОВЕРХ внутренностей.

   Поэтому:
   игрушки,
   клешня,
   трос

   визуально действительно находятся
   ЗА рамой и ВНУТРИ автомата.
========================================================= */

#machineFront {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  z-index: 100;

  pointer-events: none;
}


/* =========================================================
   КНОПКИ

   Это прозрачные кликабельные зоны
   поверх кнопок на machine-front.png.
========================================================= */

.control {
  position: absolute;

  z-index: 150;

  border: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;
}


/* ЛЕВАЯ */

#leftButton {
  left: 105px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}


/* ПРАВАЯ */

#rightButton {
  left: 225px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}


/* КРАСНАЯ */

#grabButton {
  left: 400px;
  top: 810px;

  width: 128px;
  height: 128px;

  border-radius: 50%;
}


.control::after {
  content: "";

  position: absolute;

  inset: 5px;

  border-radius: inherit;

  transition:
    transform .1s,
    background .1s;
}


.control:active::after {
  transform:
    scale(.87);

  background:
    rgba(0,0,0,.08);
}


/* =========================================================
   ПРИЗ
========================================================= */

#prizeToy {
  position: absolute;

  left: 493px;
  top: 852px;

  width: 95px;
  height: 95px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 69px;
  line-height: 1;

  opacity: 0;

  transform:
    translateY(-30px)
    scale(.55);

  transition:

    opacity .3s ease,

    transform .55s
    cubic-bezier(.2,.9,.3,1.25);

  z-index: 125;

  pointer-events: none;
}


#prizeToy.show {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);
}

</style>

</head>


<body>


<div id="viewport">

<div id="game">


<!-- =====================================================
     ЗАДАНИЕ
===================================================== -->

<div class="task">

  <div class="task-small">
    Поймай нужную игрушку
  </div>

  <div class="task-main">

    Найди звук <b>С</b><br>

    В СЕРЕДИНЕ слова

  </div>

</div>


<!-- =====================================================
     РАУНД
===================================================== -->

<div class="progress">

  🧸 Раунд 1 из 10

</div>


<!-- =====================================================
     АВТОМАТ
===================================================== -->

<div id="machine">


  <!-- ===================================================
       ВСЁ ВНУТРИ АВТОМАТА
  =================================================== -->

  <div id="machineInside">


    <div class="inside-light"></div>


    <div class="inside-floor"></div>


    <div id="rail"></div>


    <!-- =================================================
         МЕХАНИЗМ КЛЕШНИ
    ================================================= -->

    <div id="clawRig">


      <!-- КАРЕТКА -->

      <img
        id="clawCart"
        src="claw-cart.png"
        alt=""
        draggable="false"
      >


      <!-- =================================================
           ТОЧКА ТРОСА
      ================================================= -->

      <div id="cableAnchor">


        <!-- ТРОС -->

        <div id="cable"></div>


        <!-- =================================================
             КЛЕШНЯ

             Изначально NEUTRAL.

             НЕ OPEN.
        ================================================= -->

        <div
          id="clawAssembly"
          class="neutral"
        >


          <img
            id="clawBody"
            src="claw-body.png"
            alt=""
            draggable="false"
          >


          <img
            id="clawLeft"
            src="claw-left.png"
            alt=""
            draggable="false"
          >


          <img
            id="clawRight"
            src="claw-right.png"
            alt=""
            draggable="false"
          >


          <!--
            После захвата игрушка
            помещается СЮДА.

            Поэтому она физически
            движется вместе с клешнёй.
          -->

          <div id="carriedToy"></div>


        </div>


      </div>


    </div>


    <!-- =================================================
         ТРИ ИГРУШКИ

         ВСЕ ВНУТРИ machineInside
    ================================================= -->


    <!-- НЕПРАВИЛЬНО -->

    <div
      class="toy"
      id="toy0"
      data-correct="false"
    >
      🦉
    </div>


    <!-- ПРАВИЛЬНО -->

    <div
      class="toy"
      id="toy1"
      data-correct="true"
    >
      🦊
    </div>


    <!-- НЕПРАВИЛЬНО -->

    <div
      class="toy"
      id="toy2"
      data-correct="false"
    >
      🍍
    </div>


  </div>


  <!-- ===================================================
       СТЕКЛО
  =================================================== -->

  <div id="glass"></div>


  <!-- ===================================================
       ПЕРЕДНЯЯ PNG РАМА
  =================================================== -->

  <img
    id="machineFront"
    src="machine-front.png"
    alt=""
    draggable="false"
  >


  <!-- ===================================================
       ПРИЗ
  =================================================== -->

  <div id="prizeToy"></div>


  <!-- ===================================================
       КНОПКИ
  =================================================== -->

  <button
    id="leftButton"
    class="control"
    aria-label="Влево"
  ></button>


  <button
    id="rightButton"
    class="control"
    aria-label="Вправо"
  ></button>


  <button
    id="grabButton"
    class="control"
    aria-label="Поймать"
  ></button>


</div>


</div>

</div>


<script>

/* =========================================================
   МАСШТАБ 1920 × 1080
========================================================= */

const GAME_WIDTH = 1920;

const GAME_HEIGHT = 1080;


const viewport =
  document.getElementById("viewport");


const game =
  document.getElementById("game");


function resizeGame() {

  const scale =
    Math.min(

      window.innerWidth /
      GAME_WIDTH,

      window.innerHeight /
      GAME_HEIGHT

    );


  viewport.style.width =
    GAME_WIDTH * scale + "px";


  viewport.style.height =
    GAME_HEIGHT * scale + "px";


  game.style.transform =
    `scale(${scale})`;

}


window.addEventListener(
  "resize",
  resizeGame
);


resizeGame();


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const clawRig =
  document.getElementById(
    "clawRig"
  );


const clawAssembly =
  document.getElementById(
    "clawAssembly"
  );


const carriedToy =
  document.getElementById(
    "carriedToy"
  );


const prizeToy =
  document.getElementById(
    "prizeToy"
  );


const leftButton =
  document.getElementById(
    "leftButton"
  );


const rightButton =
  document.getElementById(
    "rightButton"
  );


const grabButton =
  document.getElementById(
    "grabButton"
  );


const toys = [

  document.getElementById(
    "toy0"
  ),

  document.getElementById(
    "toy1"
  ),

  document.getElementById(
    "toy2"
  )

];


/* =========================================================
   ГОРИЗОНТАЛЬНЫЕ ПОЗИЦИИ

   Каждая позиция соответствует игрушке.

   Клешня остаётся внутри автомата.
========================================================= */

const SLOT_X = [

  50,

  189,

  328

];


/* =========================================================
   ПОЗИЦИЯ СБРОСА

   Максимально вправо,
   но всё ещё внутри камеры.
========================================================= */

const DROP_X = 328;


/* =========================================================
   ДЛИНА ТРОСА

   ВАЖНО:

   Теперь мы НЕ задаём отдельно
   top клешни.

   Меняем ТОЛЬКО длину троса.

   А clawAssembly автоматически
   находится в его конце.
========================================================= */


/* НАВЕРХУ */

const CABLE_HOME = 78;


/* У ИГРУШКИ */

const CABLE_GRAB = 295;


/* ПРИ СБРОСЕ */

const CABLE_DROP = 270;


/* НЕПРАВИЛЬНАЯ ИГРУШКА —
   немного подняли */

const CABLE_WRONG_LIFT = 185;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentSlot = 1;

let busy = false;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

  return new Promise(

    resolve =>
      setTimeout(
        resolve,
        ms
      )

  );

}


/* =========================================================
   ДЛИНА ТРОСА

   ОДНА ФУНКЦИЯ управляет
   и тросом, и положением клешни.
========================================================= */

function setCableLength(length) {

  clawRig.style.setProperty(
    "--cable-length",
    `${length}px`
  );

}


/* =========================================================
   СОСТОЯНИЕ ЛАПОК
========================================================= */

function setClawState(state) {

  clawAssembly.classList.remove(
    "neutral",
    "open",
    "closed"
  );


  clawAssembly.classList.add(
    state
  );

}


/* =========================================================
   NEUTRAL

   Обычное положение.

   Именно так клешня выглядит,
   пока ребёнок двигает её стрелками.
========================================================= */

async function neutralClaw() {

  setClawState(
    "neutral"
  );


  await wait(430);

}


/* =========================================================
   OPEN

   Только после красной кнопки.
========================================================= */

async function openClaw() {

  setClawState(
    "open"
  );


  await wait(430);

}


/* =========================================================
   CLOSE

   Захват.
========================================================= */

async function closeClaw() {

  setClawState(
    "closed"
  );


  await wait(430);

}


/* =========================================================
   СПУСК

   Состояние лапок НЕ меняется.

   Поэтому если до этого был OPEN,
   вниз едет открытая клешня.
========================================================= */

async function lowerClaw() {

  setCableLength(
    CABLE_GRAB
  );


  await wait(900);

}


/* =========================================================
   ПОДЪЁМ

   Если клешня CLOSED,
   она поднимается закрытой.
========================================================= */

async function raiseClaw() {

  setCableLength(
    CABLE_HOME
  );


  await wait(900);

}


/* =========================================================
   ГОРИЗОНТАЛЬНОЕ ПЕРЕМЕЩЕНИЕ
========================================================= */

function updateHorizontalPosition() {

  clawRig.style.left =
    SLOT_X[currentSlot] +
    "px";

}


updateHorizontalPosition();


/* =========================================================
   ВЛЕВО
========================================================= */

leftButton.addEventListener(
  "click",
  () => {


    if (busy) {
      return;
    }


    if (
      currentSlot > 0
    ) {

      currentSlot--;

      updateHorizontalPosition();

    }

  }
);


/* =========================================================
   ВПРАВО
========================================================= */

rightButton.addEventListener(
  "click",
  () => {


    if (busy) {
      return;
    }


    if (
      currentSlot < 2
    ) {

      currentSlot++;

      updateHorizontalPosition();

    }

  }
);


/* =========================================================
   ПРИКРЕПИТЬ ИГРУШКУ

   Исходная игрушка исчезает.

   Такая же появляется внутри
   clawAssembly.

   После этого она автоматически
   движется вместе с клешнёй.
========================================================= */

function attachToy(toy) {

  carriedToy.textContent =
    toy.textContent.trim();


  carriedToy.style.opacity =
    "1";


  carriedToy.style.top =
    "89px";


  carriedToy.classList.add(
    "show"
  );


  toy.style.opacity =
    "0";

}


/* =========================================================
   УБРАТЬ ИГРУШКУ ИЗ КЛЕШНИ
========================================================= */

function detachToy() {

  carriedToy.classList.remove(
    "show"
  );


  carriedToy.textContent =
    "";


  carriedToy.style.opacity =
    "1";


  carriedToy.style.top =
    "89px";

}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА

   К этому моменту уже:

   1 OPEN
   2 ↓
   3 CLOSE
========================================================= */

async function correctCycle(toy) {


  /* =====================================================
     ИГРУШКА СХВАЧЕНА
  ===================================================== */

  attachToy(
    toy
  );


  await wait(150);


  /* =====================================================
     ЗАКРЫТАЯ КЛЕШНЯ
     ПОДНИМАЕТ ИГРУШКУ
  ===================================================== */

  await raiseClaw();


  /* =====================================================
     ВЕЗЁМ ВПРАВО

     Игрушка внутри clawAssembly,
     поэтому едет вместе с ней.
  ===================================================== */

  clawRig.style.left =
    DROP_X + "px";


  await wait(850);


  /* =====================================================
     ОПУСКАЕМСЯ У ПРАВОЙ СТОРОНЫ
  ===================================================== */

  setCableLength(
    CABLE_DROP
  );


  await wait(850);


  /* =====================================================
     ОТКРЫВАЕМ ЛАПКИ

     Только теперь игрушка отпускается.
  ===================================================== */

  await openClaw();


  /* =====================================================
     ИГРУШКА ПАДАЕТ ИЗ ЛАПОК
  ===================================================== */

  carriedToy.style.transition =
    "top .48s ease-in, opacity .2s ease";


  carriedToy.style.top =
    "220px";


  await wait(480);


  carriedToy.style.opacity =
    "0";


  await wait(200);


  /* =====================================================
     УБИРАЕМ ЕЁ ИЗ КЛЕШНИ
  ===================================================== */

  detachToy();


  carriedToy.style.transition =
    "";


  /* =====================================================
     ПОЯВЛЯЕТСЯ В ОТСЕКЕ ПРИЗ
  ===================================================== */

  prizeToy.textContent =
    toy.textContent.trim();


  prizeToy.classList.add(
    "show"
  );


  await wait(650);


  /* =====================================================
     ОТКРЫТАЯ ПУСТАЯ КЛЕШНЯ
     ПОДНИМАЕТСЯ
  ===================================================== */

  await raiseClaw();


  /* =====================================================
     ВОЗВРАЩАЕТСЯ В ЦЕНТР
  ===================================================== */

  currentSlot = 1;


  updateHorizontalPosition();


  await wait(800);


  /* =====================================================
     ВОЗВРАЩАЕМ ОБЫЧНОЕ СОСТОЯНИЕ

     НЕ CLOSED.
     НЕ OPEN.

     NEUTRAL.
  ===================================================== */

  await neutralClaw();

}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function wrongCycle(toy) {


  /* =====================================================
     СХВАТИЛА
  ===================================================== */

  attachToy(
    toy
  );


  await wait(150);


  /* =====================================================
     НЕМНОГО ПОДНИМАЕТ
  ===================================================== */

  setCableLength(
    CABLE_WRONG_LIFT
  );


  await wait(650);


  /* =====================================================
     ИГРУШКА ВЫСКАЛЬЗЫВАЕТ

     Лапки открываются.
  ===================================================== */

  await openClaw();


  /* =====================================================
     ВИЗУАЛЬНО ПАДАЕТ
  ===================================================== */

  carriedToy.style.transition =
    "top .42s ease-in, opacity .18s ease";


  carriedToy.style.top =
    "200px";


  await wait(420);


  carriedToy.style.opacity =
    "0";


  await wait(180);


  /* =====================================================
     УБИРАЕМ КОПИЮ
  ===================================================== */

  detachToy();


  carriedToy.style.transition =
    "";


  /* =====================================================
     ОРИГИНАЛ ВОЗВРАЩАЕТСЯ НА ПОЛ
  ===================================================== */

  toy.style.opacity =
    "1";


  toy.classList.add(
    "wrong-drop"
  );


  await wait(650);


  toy.classList.remove(
    "wrong-drop"
  );


  /* =====================================================
     КЛЕШНЯ ВВЕРХ
  ===================================================== */

  await raiseClaw();


  /* =====================================================
     ОБЫЧНОЕ СОСТОЯНИЕ
  ===================================================== */

  await neutralClaw();

}


/* =========================================================
   КРАСНАЯ КНОПКА

   ВОТ ЗДЕСЬ ВСЯ МЕХАНИКА
   В НУЖНОМ ПОРЯДКЕ.
========================================================= */

grabButton.addEventListener(
  "click",
  async () => {


    if (busy) {
      return;
    }


    const toy =
      toys[currentSlot];


    if (!toy) {
      return;
    }


    /*
       Если правильная игрушка
       уже забрана.
    */

    if (
      toy.style.opacity === "0"
    ) {

      return;

    }


    busy = true;


    /* =====================================================
       ДО ЭТОГО МОМЕНТА:

       КЛЕШНЯ NEUTRAL.

       Она НЕ раскрыта.
    ===================================================== */


    /* =====================================================
       1.

       НАЖАЛИ КРАСНУЮ КНОПКУ.

       ТОЛЬКО ТЕПЕРЬ
       КЛЕШНЯ ОТКРЫВАЕТСЯ.
    ===================================================== */

    await openClaw();


    /* =====================================================
       2.

       ОТКРЫТАЯ КЛЕШНЯ
       СПУСКАЕТСЯ К ИГРУШКЕ.
    ===================================================== */

    await lowerClaw();


    /* =====================================================
       3.

       ДОЕХАЛА ДО ИГРУШКИ.

       ТОЛЬКО ТЕПЕРЬ
       ЗАКРЫВАЕТСЯ.
    ===================================================== */

    await closeClaw();


    /* =====================================================
       4.

       ТЕПЕРЬ ИГРУШКА СХВАЧЕНА.
    ===================================================== */

    const correct =
      toy.dataset.correct ===
      "true";


    if (correct) {

      await correctCycle(
        toy
      );

    }

    else {

      await wrongCycle(
        toy
      );

    }


    busy = false;

  }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
  "keydown",
  event => {


    if (
      event.key ===
      "ArrowLeft"
    ) {

      leftButton.click();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      rightButton.click();

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      grabButton.click();

    }

  }
);


/* =========================================================
   СТАРТОВОЕ СОСТОЯНИЕ

   ОБЫЧНАЯ КЛЕШНЯ.

   НЕ ОТКРЫТА.
========================================================= */

setCableLength(
  CABLE_HOME
);


setClawState(
  "neutral"
);

</script>


</body>

</html>
