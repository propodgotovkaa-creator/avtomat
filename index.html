<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
    position: absolute;

    left: 115px;
    top: 145px;

    width: 520px;

    padding: 30px 35px;

    border-radius: 34px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 24px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 42px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}


/* =========================================================
   РАУНД
========================================================= */

.progress {
    position: absolute;

    left: 165px;
    top: 390px;

    width: 420px;

    padding: 20px;

    border-radius: 28px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 27px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
    position: absolute;

    left: 780px;
    top: 25px;

    width: 735px;
    height: 1030px;

    z-index: 10;
}


/* =========================================================
   ВНУТРЕННЯЯ КАМЕРА

   Здесь находятся:
   рельс
   клешня
   игрушки
========================================================= */

#machineInside {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    border-radius: 12px;

    background:
        radial-gradient(
            ellipse at 50% 5%,
            rgba(255,248,195,.8),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #eefcf9 0%,
            #fafffe 52%,
            #fff9f2 100%
        );

    z-index: 1;
}


/* =========================================================
   СВЕТ
========================================================= */

.inside-light {
    position: absolute;

    left: 50px;
    top: 17px;

    width: 467px;
    height: 11px;

    border-radius: 20px;

    background: #fff5b8;

    box-shadow:
        0 0 15px rgba(255,239,150,.8),
        0 0 30px rgba(255,239,150,.4);

    z-index: 2;
}


/* =========================================================
   ПОЛ
========================================================= */

.inside-floor {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 92px;

    background:
        linear-gradient(
            180deg,
            #fffdf7,
            #fff0e6
        );

    border-top:
        4px solid rgba(238,166,181,.5);

    z-index: 3;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
    position: absolute;

    left: 42px;
    top: 42px;

    width: 483px;
    height: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #dce4e6 22%,
            #8b969b 52%,
            #606a70 72%,
            #dce3e5 100%
        );

    border:
        2px solid rgba(88,98,103,.45);

    box-shadow:
        0 4px 6px rgba(0,0,0,.14),
        inset 0 2px 2px rgba(255,255,255,.9);

    z-index: 8;
}


/* =========================================================
   КЛЕШНЯ

   ВАЖНО:
   весь механизм имеет одну систему координат.
========================================================= */

#clawRig {
    --cable: 65px;

    position: absolute;

    left: 189px;
    top: 15px;

    width: 190px;
    height: 550px;

    z-index: 30;

    transition:
        left .8s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   ТОЧКА ТРОСА
========================================================= */

#cableAnchor {
    position: absolute;

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 34;
}


/* =========================================================
   ТРОС
========================================================= */

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;
    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КОРПУС + ЛАПКИ
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 40;

    transition:
        top .9s cubic-bezier(.45,0,.25,1);
}


#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;
    height: auto;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 66px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 16px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ОБЫЧНАЯ КЛЕШНЯ

   Именно такая стоит до нажатия.
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


/* =========================================================
   ОТКРЫТАЯ

   После красной кнопки.
========================================================= */

#clawAssembly.open #clawLeft {
    transform: rotate(25deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-25deg);
}


/* =========================================================
   ЗАКРЫТАЯ

   Только непосредственно у игрушки.
========================================================= */

#clawAssembly.closed #clawLeft {
    transform: rotate(-25deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(25deg);
}


/* =========================================================
   ИГРУШКИ

   Это настоящие PNG.

   Никаких emoji.
========================================================= */

.toy {
    position: absolute;

    bottom: 73px;

    width: 112px;
    height: 125px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 15;

    pointer-events: none;

    transform-origin: center center;
}


/* =========================================================
   СОБАКА
========================================================= */

#toy0 {
    left: 83px;
}


/* =========================================================
   ЛИСА
========================================================= */

#toy1 {
    left: 228px;
}


/* =========================================================
   АНАНАС
========================================================= */

#toy2 {
    left: 373px;
}


/* =========================================================
   ИГРУШКА В МОМЕНТ ЗАХВАТА

   ВАЖНО:

   это НЕ копия.

   Класс добавляется непосредственно тому же IMG.
========================================================= */

.toy.caught {
    z-index: 43;

    transition: none;
}


/* =========================================================
   ЛЁГКОЕ ПОКАЧИВАНИЕ ПРИ ПЕРЕНОСЕ
========================================================= */

.toy.swing {
    animation:
        toySwing .75s ease-in-out infinite alternate;
}

@keyframes toySwing {

    from {
        rotate: -2deg;
    }

    to {
        rotate: 2deg;
    }
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    pointer-events: none;

    z-index: 80;
}

#glass::before {
    content: "";

    position: absolute;

    left: 52px;
    top: -100px;

    width: 62px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.21),
            transparent
        );
}

#glass::after {
    content: "";

    position: absolute;

    right: 72px;
    top: -100px;

    width: 32px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* =========================================================
   ПЕРЕДНЯЯ РАМА
========================================================= */

#machineFront {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   КНОПКИ
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;
}


#leftButton {
    left: 105px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


#rightButton {
    left: 225px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


#grabButton {
    left: 400px;
    top: 810px;

    width: 128px;
    height: 128px;

    border-radius: 50%;
}


.control::after {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: inherit;

    transition:
        transform .1s,
        background .1s;
}


.control:active::after {
    transform: scale(.86);

    background: rgba(0,0,0,.08);
}


/* =========================================================
   ИГРУШКА В ОТСЕКЕ ПРИЗА
========================================================= */

#prizeToy {
    position: absolute;

    left: 493px;
    top: 850px;

    width: 95px;
    height: 95px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-20px)
        scale(.75);

    transition:
        opacity .25s ease,
        transform .45s cubic-bezier(.2,.9,.3,1.25);

    z-index: 125;

    pointer-events: none;
}


#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


    <!-- ===================================================
         ЗАДАНИЕ
    ==================================================== -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>



    <!-- ===================================================
         АВТОМАТ
    ==================================================== -->

    <div id="machine">


        <!-- =================================================
             ВНУТРЕННОСТЬ
        ================================================== -->

        <div id="machineInside">


            <div class="inside-light"></div>

            <div class="inside-floor"></div>

            <div id="rail"></div>



            <!-- =============================================
                 КЛЕШНЯ
            ============================================== -->

            <div id="clawRig">


                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">


                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >


                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >


                    </div>

                </div>

            </div>



            <!-- =============================================
                 НАШИ НАСТОЯЩИЕ ИГРУШКИ
            ============================================== -->


            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                alt="Ананас"
                draggable="false"
            >


        </div>



        <!-- =================================================
             СТЕКЛО
        ================================================== -->

        <div id="glass"></div>



        <!-- =================================================
             ПЕРЕДНЯЯ РАМА
        ================================================== -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >



        <!-- =================================================
             ПРИЗ
        ================================================== -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >



        <!-- =================================================
             КНОПКИ
        ================================================== -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>



<script>

/* =========================================================
   РАЗМЕР ИГРЫ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;


const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();



/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];



/* =========================================================
   БЕЗОПАСНЫЕ ПОЗИЦИИ КЛЕШНИ

   Крайние позиции специально НЕ около стенок.

   Даже OPEN-клешня остаётся внутри автомата.
========================================================= */

const SLOT_X = [

    51,     // собака

    196,    // лиса

    341     // ананас

];


/*
   Зона сброса.

   Это крайняя безопасная правая позиция,
   но клешня всё ещё полностью внутри стекла.
*/

const DROP_X = 341;



/* =========================================================
   ТРОС
========================================================= */

const CABLE_HOME = 65;


/*
   Длина до игрушки.

   Здесь лапки должны оказаться
   примерно вокруг верхней/средней части игрушки.
*/

const CABLE_GRAB = 285;


/*
   После захвата поднимаем полностью.
*/

const CABLE_LIFT = 78;


/*
   Немного опускаемся перед сбросом.
*/

const CABLE_DROP = 225;



/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;



/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}



/* =========================================================
   СОСТОЯНИЕ ЛАПОК
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}



async function neutralClaw() {

    setClaw("neutral");

    await wait(430);
}



async function openClaw() {

    setClaw("open");

    await wait(470);
}



async function closeClaw() {

    setClaw("closed");

    await wait(470);
}



/* =========================================================
   ТРОС
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}



/* =========================================================
   ПЕРЕМЕЩЕНИЕ ПО РЕЛЬСУ
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


updatePosition();



/* =========================================================
   КНОПКИ ВЛЕВО / ВПРАВО
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot <= 0) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);



rightButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot >= 2) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);



/* =========================================================
   ПОЛОЖЕНИЕ ЦЕНТРА КЛЕШНИ
   В КООРДИНАТАХ machineInside
========================================================= */

function getClawCenter() {

    /*
       clawRig.left
       +
       положение cableAnchor
    */

    return (
        parseFloat(clawRig.style.left) +
        95
    );
}



/* =========================================================
   НАЧАЛЬНЫЕ ПОЗИЦИИ ИГРУШЕК

   Сохраняем их, чтобы неправильную игрушку
   можно было вернуть ТОЧНО туда же.
========================================================= */

const toyHome = toys.map(
    toy => ({
        left: parseFloat(
            getComputedStyle(toy).left
        ),

        bottom: parseFloat(
            getComputedStyle(toy).bottom
        )
    })
);



/* =========================================================
   ЗАХВАТ

   САМОЕ ВАЖНОЕ ИЗМЕНЕНИЕ.

   Никакой копии игрушки.

   Мы берём ТОТ ЖЕ САМЫЙ <img>.
========================================================= */

function grabToy(toy) {

    grabbedToy = toy;


    /*
       Получаем фактическую текущую позицию
       игрушки внутри автомата.
    */

    const insideRect =
        machineInside.getBoundingClientRect();

    const toyRect =
        toy.getBoundingClientRect();


    /*
       Из-за масштабирования игры getBoundingClientRect
       выдаёт экранные размеры.

       Поэтому берём масштаб.
    */

    const scale =
        insideRect.width / 567;


    const currentLeft =
        (toyRect.left - insideRect.left) /
        scale;

    const currentTop =
        (toyRect.top - insideRect.top) /
        scale;


    /*
       Переводим bottom-позиционирование
       в top-позиционирование.
    */

    toy.style.bottom = "auto";

    toy.style.left =
        `${currentLeft}px`;

    toy.style.top =
        `${currentTop}px`;

    toy.classList.add(
        "caught"
    );
}



/* =========================================================
   СИНХРОНИЗАЦИЯ ИГРУШКИ С КЛЕШНЁЙ

   Мы не переносим её в другой DOM.

   Просто двигаем тот же PNG
   точно вместе с центром клешни.
========================================================= */

function setGrabbedToyPosition(
    rigX,
    cableLength
) {

    if (!grabbedToy) {
        return;
    }


    const toyWidth =
        grabbedToy.offsetWidth;


    /*
       Центр троса:

       rigX + 95
    */

    const centerX =
        rigX + 95;


    /*
       Игрушка должна находиться
       непосредственно между лапками.
    */

    const left =
        centerX -
        toyWidth / 2;


    /*
       cableAnchor начинается около 73px
       от верха machineInside.

       + cableLength
       + положение игрушки между лапками.
    */

    const top =
        58 +
        cableLength +
        86;


    grabbedToy.style.left =
        `${left}px`;

    grabbedToy.style.top =
        `${top}px`;
}



/* =========================================================
   ПЛАВНО ДВИГАЕМ ИГРУШКУ ВМЕСТЕ С КЛЕШНЁЙ

   requestAnimationFrame следит
   за реальным положением механизма.
========================================================= */

let followAnimation = null;


function startFollowingToy() {

    stopFollowingToy();


    function follow() {

        if (!grabbedToy) {
            return;
        }


        const rigX =
            parseFloat(
                getComputedStyle(clawRig).left
            );


        const cable =
            parseFloat(
                getComputedStyle(
                    document.getElementById("cable")
                ).height
            );


        setGrabbedToyPosition(
            rigX,
            cable
        );


        followAnimation =
            requestAnimationFrame(
                follow
            );
    }


    follow();
}



function stopFollowingToy() {

    if (followAnimation) {

        cancelAnimationFrame(
            followAnimation
        );

        followAnimation = null;
    }
}



/* =========================================================
   ОПУСКАНИЕ

   ВАЖНО:

   здесь лапки НЕ меняют состояние.

   Они уже OPEN.
========================================================= */

async function lowerOpenClaw() {

    setCable(
        CABLE_GRAB
    );

    await wait(950);
}



/* =========================================================
   ПОДЪЁМ С ИГРУШКОЙ
========================================================= */

async function liftCaughtToy() {

    grabbedToy.classList.add(
        "swing"
    );


    setCable(
        CABLE_LIFT
    );


    await wait(1000);
}



/* =========================================================
   ДВИЖЕНИЕ С ИГРУШКОЙ К ЗОНЕ СБРОСА
========================================================= */

async function moveCaughtToyToDrop() {

    moveRigTo(
        DROP_X
    );

    await wait(900);
}



/* =========================================================
   ОПУСКАНИЕ НАД ЗОНОЙ СБРОСА
========================================================= */

async function lowerAtDrop() {

    setCable(
        CABLE_DROP
    );

    await wait(900);
}



/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА

   Никаких скачков.

   Один и тот же PNG:
   пол -> лапки -> вверх -> вправо -> вниз -> отпускание.
========================================================= */

async function correctSequence(toy) {


    /* -----------------------------------------------------
       Клешня только что закрылась вокруг игрушки.
    ----------------------------------------------------- */

    grabToy(toy);


    /*
       С этого момента этот же PNG
       начинает следовать за клешнёй.
    */

    startFollowingToy();


    await wait(150);



    /* -----------------------------------------------------
       Поднимаем
    ----------------------------------------------------- */

    await liftCaughtToy();



    /* -----------------------------------------------------
       Едем вправо
    ----------------------------------------------------- */

    await moveCaughtToyToDrop();



    /* -----------------------------------------------------
       Немного опускаемся
    ----------------------------------------------------- */

    await lowerAtDrop();



    /* -----------------------------------------------------
       Убираем покачивание перед отпусканием
    ----------------------------------------------------- */

    toy.classList.remove(
        "swing"
    );



    /* -----------------------------------------------------
       ОТКРЫВАЕМ ЛАПКИ.

       Только здесь игрушка освобождается.
    ----------------------------------------------------- */

    await openClaw();



    /* -----------------------------------------------------
       Перестаём привязывать её к клешне.
    ----------------------------------------------------- */

    stopFollowingToy();



    /* -----------------------------------------------------
       Теперь ТОТ ЖЕ PNG падает вниз.

       Не исчезает мгновенно.
    ----------------------------------------------------- */

    const currentTop =
        parseFloat(
            getComputedStyle(toy).top
        );


    toy.style.transition =
        "top .55s cubic-bezier(.55,.05,.75,.45), transform .55s ease";


    toy.style.top =
        `${currentTop + 150}px`;

    toy.style.transform =
        "rotate(8deg)";


    await wait(520);



    /*
       Только когда игрушка физически ушла вниз
       внутри автомата, скрываем её.

       Для глаза это выглядит так,
       будто она провалилась во внутренний канал.
    */

    toy.style.opacity =
        "0";


    await wait(170);



    /* -----------------------------------------------------
       Показываем ЭТУ ЖЕ КАРТИНКУ
       в окне выдачи.
    ----------------------------------------------------- */

    prizeToy.src =
        toy.src;

    prizeToy.classList.add(
        "show"
    );


    await wait(600);



    /* -----------------------------------------------------
       Пустая открытая клешня возвращается наверх
    ----------------------------------------------------- */

    setCable(
        CABLE_HOME
    );

    await wait(950);



    /* -----------------------------------------------------
       Возвращаем каретку в центр
    ----------------------------------------------------- */

    currentSlot = 1;

    updatePosition();

    await wait(850);



    /* -----------------------------------------------------
       Возвращаем обычное положение лапок
    ----------------------------------------------------- */

    await neutralClaw();


    grabbedToy = null;
}



/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА

   Здесь тоже НЕ создаётся копия.

   Клешня:
   хватает ->
   чуть поднимает ->
   открывается ->
   та же игрушка падает обратно.
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    grabToy(toy);

    startFollowingToy();


    await wait(150);



    /* -----------------------------------------------------
       Немного поднимаем
    ----------------------------------------------------- */

    toy.classList.add(
        "swing"
    );


    setCable(
        190
    );


    await wait(700);



    toy.classList.remove(
        "swing"
    );



    /* -----------------------------------------------------
       Открываем лапки
    ----------------------------------------------------- */

    await openClaw();



    /* -----------------------------------------------------
       Игрушка больше не следует за клешнёй
    ----------------------------------------------------- */

    stopFollowingToy();



    /* -----------------------------------------------------
       Реальное падение обратно
    ----------------------------------------------------- */

    const currentTop =
        parseFloat(
            getComputedStyle(toy).top
        );


    const targetTop =
        570 -
        toyHome[index].bottom -
        toy.offsetHeight;


    toy.style.transition =
        "top .55s cubic-bezier(.55,.05,.75,.45), transform .55s ease";


    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(-5deg)";


    await wait(520);


    toy.style.transform =
        "rotate(0deg)";


    await wait(180);



    /* -----------------------------------------------------
       Возвращаем исходное CSS-позиционирование
    ----------------------------------------------------- */

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";



    /* -----------------------------------------------------
       Клешня наверх
    ----------------------------------------------------- */

    setCable(
        CABLE_HOME
    );


    await wait(950);



    await neutralClaw();


    grabbedToy = null;
}



/* =========================================================
   КРАСНАЯ КНОПКА

   ТОЧНАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ:

   ДО НАЖАТИЯ:
   обычная клешня

             ↓

   🔴 НАЖАЛИ

             ↓

   ОТКРЫЛАСЬ

             ↓

   ОТКРЫТОЙ СПУСТИЛАСЬ

             ↓

   ДОШЛА ДО ИГРУШКИ

             ↓

   ЗАКРЫЛАСЬ ВОКРУГ ИГРУШКИ

             ↓

   ТОЛЬКО ТЕПЕРЬ ИГРУШКА ЗАХВАЧЕНА
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (toy.style.opacity === "0") {
            return;
        }


        busy = true;



        /* =================================================
           ШАГ 1

           Нажали красную кнопку.

           Клешня РАСКРЫВАЕТСЯ.
        ================================================= */

        await openClaw();



        /* =================================================
           ШАГ 2

           Она уже раскрыта.

           Теперь раскрытой идёт вниз.
        ================================================= */

        await lowerOpenClaw();



        /* =================================================
           ШАГ 3

           Она дошла до игрушки.

           ТОЛЬКО СЕЙЧАС закрываем.
        ================================================= */

        await closeClaw();



        /* =================================================
           ШАГ 4

           Только после закрытия считаем,
           что игрушка действительно схвачена.
        ================================================= */

        const correct =
            toy.dataset.correct === "true";


        if (correct) {

            await correctSequence(
                toy
            );

        } else {

            await wrongSequence(
                toy,
                currentSlot
            );
        }


        busy = false;
    }
);



/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (event.key === "ArrowLeft") {

            leftButton.click();
        }


        if (event.key === "ArrowRight") {

            rightButton.click();
        }


        if (event.code === "Space") {

            event.preventDefault();

            grabButton.click();
        }
    }
);



/* =========================================================
   СТАРТ

   Клешня ОБЫЧНАЯ.

   Она НЕ раскрыта.
========================================================= */

setCable(
    CABLE_HOME
);

setClaw(
    "neutral"
);

updatePosition();

</script>
