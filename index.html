<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

/* =========================================================
   ОБЩЕЕ
========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #eee7e1;
  font-family: "Trebuchet MS", Arial, sans-serif;
  user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ 1920 × 1080
========================================================= */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;
  transform-origin: top left;

  background:
    url("fon.png")
    center center / cover
    no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding: 30px 35px;

  border-radius: 34px;

  background: rgba(255,255,255,.94);

  box-shadow:
    0 15px 40px rgba(77,67,72,.13);

  text-align: center;
  color: #40506a;

  z-index: 20;
}

.task-small {
  font-size: 24px;
  font-weight: 800;
  opacity: .72;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;
  font-weight: 900;
}

.task-main b {
  color: #ed5573;
}


/* =========================================================
   РАУНД
========================================================= */

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px;

  border-radius: 28px;

  background: rgba(255,255,255,.92);

  box-shadow:
    0 12px 30px rgba(77,67,72,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;

  z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
  position: absolute;

  left: 780px;
  top: 25px;

  width: 735px;
  height: 1030px;

  z-index: 10;
}


/* =========================================================
   ВНУТРЕННЯЯ ОБЛАСТЬ АВТОМАТА
========================================================= */

#machineInside {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  border-radius: 12px;

  background:
    radial-gradient(
      ellipse at 50% 10%,
      rgba(255,250,214,.95) 0%,
      rgba(255,255,255,0) 38%
    ),
    linear-gradient(
      180deg,
      #ebfbf8 0%,
      #f8fffd 48%,
      #fffdf8 78%,
      #fff4ea 100%
    );

  z-index: 1;
}


/* =========================================================
   ВЕРХНИЙ СВЕТ
========================================================= */

.inside-light {
  position: absolute;

  left: 55px;
  top: 18px;

  width: 457px;
  height: 12px;

  border-radius: 20px;

  background: #fff7ca;

  box-shadow:
    0 0 12px rgba(255,239,150,.75),
    0 0 26px rgba(255,239,150,.45);

  z-index: 2;
}


/* =========================================================
   ПОЛ
========================================================= */

.inside-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 92px;

  background:
    linear-gradient(
      180deg,
      #fffdf5 0%,
      #fff3e9 100%
    );

  border-top:
    4px solid rgba(239,170,183,.55);

  z-index: 3;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
  position: absolute;

  left: 42px;
  top: 45px;

  width: 483px;
  height: 14px;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #dce4e6 24%,
      #8d989d 55%,
      #687277 76%,
      #dce3e5 100%
    );

  border: 2px solid rgba(88,98,103,.45);

  box-shadow:
    0 4px 6px rgba(0,0,0,.14),
    inset 0 2px 2px rgba(255,255,255,.9);

  z-index: 8;
}


/* =========================================================
   КАРЕТКА + ТРОС + КЛЕШНЯ

   Это вся движущаяся система.
========================================================= */

#clawRig {
  position: absolute;

  left: 190px;
  top: 17px;

  width: 190px;
  height: 535px;

  z-index: 30;

  transition:
    left .75s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
  position: absolute;

  left: 34px;
  top: 0;

  width: 122px;
  height: 83px;

  object-fit: contain;

  z-index: 35;

  pointer-events: none;
}


/* =========================================================
   ТРОС
========================================================= */

#cable {
  position: absolute;

  left: 92px;
  top: 62px;

  width: 6px;
  height: 70px;

  border-radius: 5px;

  background:
    repeating-linear-gradient(
      135deg,
      #fafafa 0px,
      #fafafa 3px,
      #879196 3px,
      #879196 6px
    );

  box-shadow:
    1px 0 2px rgba(0,0,0,.18);

  z-index: 20;

  transition:
    height .85s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   ЕДИНАЯ КЛЕШНЯ

   ВАЖНО:
   корпус + обе лапки находятся внутри одного блока.

   Вниз/вверх двигается именно весь #clawAssembly.
========================================================= */

#clawAssembly {
  position: absolute;

  left: 18px;
  top: 125px;

  width: 154px;
  height: 190px;

  z-index: 40;

  transition:
    top .85s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   ЦЕНТРАЛЬНЫЙ КОРПУС
========================================================= */

#clawBody {
  position: absolute;

  left: 50px;
  top: 0;

  width: 54px;
  height: 82px;

  object-fit: contain;

  z-index: 46;

  pointer-events: none;
}


/* =========================================================
   ЛЕВАЯ ЛАПКА

   Розовый шарнир должен заходить
   непосредственно под корпус.
========================================================= */

#clawLeft {
  position: absolute;

  left: 11px;
  top: 48px;

  width: 83px;
  height: 135px;

  object-fit: contain;

  transform-origin: 66px 15px;

  /*
     Исходно клешня ЗАКРЫТА.
  */

  transform: rotate(30deg);

  transition:
    transform .42s cubic-bezier(.4,0,.2,1);

  z-index: 44;

  pointer-events: none;
}


/* =========================================================
   ПРАВАЯ ЛАПКА
========================================================= */

#clawRight {
  position: absolute;

  right: 11px;
  top: 48px;

  width: 83px;
  height: 135px;

  object-fit: contain;

  transform-origin: 17px 15px;

  /*
     Исходно клешня ЗАКРЫТА.
  */

  transform: rotate(-30deg);

  transition:
    transform .42s cubic-bezier(.4,0,.2,1);

  z-index: 44;

  pointer-events: none;
}


/* =========================================================
   ОТКРЫТАЯ КЛЕШНЯ

       \         /
        \       /

========================================================= */

#clawAssembly.open #clawLeft {
  transform: rotate(-17deg);
}

#clawAssembly.open #clawRight {
  transform: rotate(17deg);
}


/* =========================================================
   ЗАКРЫТАЯ КЛЕШНЯ

          \ /
           V

========================================================= */

#clawAssembly.closed #clawLeft {
  transform: rotate(30deg);
}

#clawAssembly.closed #clawRight {
  transform: rotate(-30deg);
}


/* =========================================================
   ИГРУШКА, КОТОРАЯ УЖЕ СХВАЧЕНА

   ВАЖНО:
   она находится ВНУТРИ clawAssembly.

   Поэтому больше не надо отдельно синхронизировать
   её координаты с клешнёй.
========================================================= */

#carriedToy {
  position: absolute;

  left: 27px;
  top: 93px;

  width: 100px;
  height: 100px;

  display: none;

  align-items: center;
  justify-content: center;

  font-size: 78px;
  line-height: 1;

  z-index: 43;

  pointer-events: none;
}

#carriedToy.show {
  display: flex;
}


/* =========================================================
   ТРИ ИГРУШКИ
========================================================= */

.toy {
  position: absolute;

  bottom: 54px;

  width: 110px;
  height: 125px;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  font-size: 88px;
  line-height: 1;

  z-index: 15;

  transition:
    opacity .25s ease,
    transform .4s ease;
}


/* =========================================================
   ПОЗИЦИИ ИГРУШЕК

   Все достаточно далеко от стенок.
========================================================= */

#toy0 {
  left: 82px;
}

#toy1 {
  left: 228px;
}

#toy2 {
  left: 374px;
}


/* =========================================================
   ТЕНИ
========================================================= */

.toy::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -8px;

  width: 76px;
  height: 15px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: rgba(62,58,70,.13);

  filter: blur(5px);

  z-index: -1;
}


/* =========================================================
   ПАДЕНИЕ НЕПРАВИЛЬНОЙ ИГРУШКИ
========================================================= */

.toy.wrong-drop {
  animation:
    wrongDrop .7s ease;
}

@keyframes wrongDrop {

  0% {
    transform:
      translateY(-50px)
      rotate(0deg);
  }

  45% {
    transform:
      translateY(5px)
      rotate(-7deg);
  }

  70% {
    transform:
      translateY(-5px)
      rotate(5deg);
  }

  100% {
    transform:
      translateY(0)
      rotate(0deg);
  }
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  pointer-events: none;

  z-index: 80;
}

#glass::before {
  content: "";

  position: absolute;

  left: 48px;
  top: -100px;

  width: 65px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );
}

#glass::after {
  content: "";

  position: absolute;

  right: 70px;
  top: -100px;

  width: 34px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.13),
      transparent
    );
}


/* =========================================================
   ПЕРЕДНЯЯ РАМА АВТОМАТА
========================================================= */

#machineFront {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  z-index: 100;

  pointer-events: none;
}


/* =========================================================
   КНОПКИ

   Невидимые кликабельные области
   поверх нарисованных кнопок.
========================================================= */

.control {
  position: absolute;

  z-index: 150;

  border: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;
}


/* ВЛЕВО */

#leftButton {
  left: 105px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}


/* ВПРАВО */

#rightButton {
  left: 225px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}


/* КРАСНАЯ */

#grabButton {
  left: 400px;
  top: 810px;

  width: 128px;
  height: 128px;

  border-radius: 50%;
}


.control::after {
  content: "";

  position: absolute;
  inset: 5px;

  border-radius: inherit;

  transition:
    transform .1s,
    background .1s;
}

.control:active::after {
  transform: scale(.87);

  background:
    rgba(0,0,0,.08);
}


/* =========================================================
   ИГРУШКА В ОТСЕКЕ ПРИЗА
========================================================= */

#prizeToy {
  position: absolute;

  left: 493px;
  top: 852px;

  width: 95px;
  height: 95px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 69px;
  line-height: 1;

  opacity: 0;

  transform:
    translateY(-35px)
    scale(.55);

  transition:
    opacity .3s ease,
    transform .55s cubic-bezier(.2,.9,.3,1.25);

  z-index: 125;

  pointer-events: none;
}

#prizeToy.show {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


<!-- =====================================================
     ЗАДАНИЕ
===================================================== -->

<div class="task">

  <div class="task-small">
    Поймай нужную игрушку
  </div>

  <div class="task-main">
    Найди звук <b>С</b><br>
    В СЕРЕДИНЕ слова
  </div>

</div>


<div class="progress">
  🧸 Раунд 1 из 10
</div>


<!-- =====================================================
     АВТОМАТ
===================================================== -->

<div id="machine">


  <!-- ===================================================
       ВНУТРЕННОСТЬ
  =================================================== -->

  <div id="machineInside">


    <div class="inside-light"></div>

    <div class="inside-floor"></div>

    <div id="rail"></div>


    <!-- =================================================
         ВСЯ СИСТЕМА КЛЕШНИ
    ================================================= -->

    <div id="clawRig">


      <!-- КАРЕТКА -->

      <img
        id="clawCart"
        src="claw-cart.png"
        alt=""
        draggable="false"
      >


      <!-- ТРОС -->

      <div id="cable"></div>


      <!-- ===============================================
           ЕДИНЫЙ БЛОК КЛЕШНИ
      =============================================== -->

      <div
        id="clawAssembly"
        class="closed"
      >


        <!-- КОРПУС -->

        <img
          id="clawBody"
          src="claw-body.png"
          alt=""
          draggable="false"
        >


        <!-- ЛЕВАЯ ЛАПКА -->

        <img
          id="clawLeft"
          src="claw-left.png"
          alt=""
          draggable="false"
        >


        <!-- ПРАВАЯ ЛАПКА -->

        <img
          id="clawRight"
          src="claw-right.png"
          alt=""
          draggable="false"
        >


        <!--
          СЮДА ПОМЕЩАЕТСЯ ИГРУШКА
          ПОСЛЕ ЗАХВАТА.

          Поэтому она автоматически
          ездит вместе с клешнёй.
        -->

        <div id="carriedToy"></div>


      </div>

    </div>


    <!-- =================================================
         ИГРУШКИ

         ПОКА ТЕСТ:
         сова    = неправильно
         лиса    = правильно
         ананас  = неправильно
    ================================================= -->

    <div
      class="toy"
      id="toy0"
      data-correct="false"
    >
      🦉
    </div>


    <div
      class="toy"
      id="toy1"
      data-correct="true"
    >
      🦊
    </div>


    <div
      class="toy"
      id="toy2"
      data-correct="false"
    >
      🍍
    </div>


  </div>


  <!-- ===================================================
       СТЕКЛО
  =================================================== -->

  <div id="glass"></div>


  <!-- ===================================================
       ПЕРЕДНЯЯ РАМА
  =================================================== -->

  <img
    id="machineFront"
    src="machine-front.png"
    alt=""
    draggable="false"
  >


  <!-- ===================================================
       ПРИЗ
  =================================================== -->

  <div id="prizeToy"></div>


  <!-- ===================================================
       КЛИКАБЕЛЬНЫЕ КНОПКИ
  =================================================== -->

  <button
    id="leftButton"
    class="control"
    aria-label="Влево"
  ></button>


  <button
    id="rightButton"
    class="control"
    aria-label="Вправо"
  ></button>


  <button
    id="grabButton"
    class="control"
    aria-label="Поймать"
  ></button>


</div>

</div>

</div>


<script>

/* =========================================================
   МАСШТАБ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");


function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );


  viewport.style.width =
    GAME_WIDTH * scale + "px";


  viewport.style.height =
    GAME_HEIGHT * scale + "px";


  game.style.transform =
    `scale(${scale})`;
}


window.addEventListener(
  "resize",
  resizeGame
);


resizeGame();


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const clawRig =
  document.getElementById("clawRig");

const clawAssembly =
  document.getElementById("clawAssembly");

const cable =
  document.getElementById("cable");

const carriedToy =
  document.getElementById("carriedToy");

const prizeToy =
  document.getElementById("prizeToy");

const leftButton =
  document.getElementById("leftButton");

const rightButton =
  document.getElementById("rightButton");

const grabButton =
  document.getElementById("grabButton");


const toys = [

  document.getElementById("toy0"),

  document.getElementById("toy1"),

  document.getElementById("toy2")

];


/* =========================================================
   ПОЗИЦИИ

   Три безопасные точки.

   Клешня не может выйти за стенки.
========================================================= */

const SLOT_X = [
  50,
  190,
  330
];


let currentSlot = 1;

let busy = false;


/* =========================================================
   ВЕРТИКАЛЬНЫЕ ПОЗИЦИИ
========================================================= */

/*
   Клешня наверху.
*/

const CLAW_TOP = 125;

const CABLE_TOP = 70;


/*
   Клешня у игрушек.
*/

const CLAW_BOTTOM = 345;

const CABLE_BOTTOM = 290;


/*
   Позиция справа для сброса.

   Это всё ещё внутри стекла.
*/

const DROP_X = 330;


/*
   При сбросе клешня опускается
   немного ниже.
*/

const DROP_CLAW_TOP = 330;

const DROP_CABLE = 275;


/* =========================================================
   ВРЕМЯ
========================================================= */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}


/* =========================================================
   OPEN
========================================================= */

async function openClaw() {

  clawAssembly.classList.remove(
    "closed"
  );

  clawAssembly.classList.add(
    "open"
  );


  await wait(450);
}


/* =========================================================
   CLOSE
========================================================= */

async function closeClaw() {

  clawAssembly.classList.remove(
    "open"
  );

  clawAssembly.classList.add(
    "closed"
  );


  await wait(450);
}


/* =========================================================
   ОПУСТИТЬ

   Состояние лапок НЕ МЕНЯЕТСЯ.

   Если она была открыта —
   вниз едет открытой.
========================================================= */

async function lowerClaw() {

  cable.style.height =
    CABLE_BOTTOM + "px";


  clawAssembly.style.top =
    CLAW_BOTTOM + "px";


  await wait(900);
}


/* =========================================================
   ПОДНЯТЬ

   Состояние лапок тоже НЕ МЕНЯЕТСЯ.
========================================================= */

async function raiseClaw() {

  cable.style.height =
    CABLE_TOP + "px";


  clawAssembly.style.top =
    CLAW_TOP + "px";


  await wait(900);
}


/* =========================================================
   ГОРИЗОНТАЛЬНАЯ ПОЗИЦИЯ
========================================================= */

function updateHorizontalPosition() {

  clawRig.style.left =
    SLOT_X[currentSlot] + "px";
}


/* =========================================================
   СТРЕЛКА ВЛЕВО
========================================================= */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;


    if (currentSlot > 0) {

      currentSlot--;

      updateHorizontalPosition();
    }

  }
);


/* =========================================================
   СТРЕЛКА ВПРАВО
========================================================= */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;


    if (currentSlot < 2) {

      currentSlot++;

      updateHorizontalPosition();
    }

  }
);


updateHorizontalPosition();


/* =========================================================
   ВЗЯТЬ ИГРУШКУ В КЛЕШНЮ

   ВАЖНО:

   Исходная игрушка исчезает.

   Её копия появляется ВНУТРИ clawAssembly.

   После этого мы вообще НЕ двигаем игрушку отдельно.

   Она физически является дочерним элементом клешни.
========================================================= */

function pickUpToy(toy) {

  carriedToy.textContent =
    toy.textContent.trim();


  carriedToy.classList.add(
    "show"
  );


  toy.style.opacity = "0";
}


/* =========================================================
   УБРАТЬ ИГРУШКУ ИЗ КЛЕШНИ
========================================================= */

function removeCarriedToy() {

  carriedToy.classList.remove(
    "show"
  );


  carriedToy.textContent = "";
}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА

   К ЭТОМУ МОМЕНТУ:

   OPEN
   ↓
   CLOSE

   уже произошли.
========================================================= */

async function correctToyCycle(toy) {


  /* -------------------------------------------------------
     ИГРУШКА ТЕПЕРЬ ВНУТРИ КЛЕШНИ
  ------------------------------------------------------- */

  pickUpToy(toy);


  await wait(150);


  /* -------------------------------------------------------
     1. ЗАКРЫТАЯ КЛЕШНЯ + ИГРУШКА ПОДНИМАЮТСЯ
  ------------------------------------------------------- */

  await raiseClaw();


  /* -------------------------------------------------------
     2. ЕДУТ ВПРАВО
  ------------------------------------------------------- */

  clawRig.style.left =
    DROP_X + "px";


  await wait(850);


  /* -------------------------------------------------------
     3. ОПУСКАЮТСЯ У ПРАВОЙ СТОРОНЫ
  ------------------------------------------------------- */

  cable.style.height =
    DROP_CABLE + "px";


  clawAssembly.style.top =
    DROP_CLAW_TOP + "px";


  await wait(800);


  /* -------------------------------------------------------
     4. КЛЕШНЯ ОТКРЫВАЕТСЯ

     ВОТ ТОЛЬКО ЗДЕСЬ ОТПУСКАЕМ.
  ------------------------------------------------------- */

  await openClaw();


  /* -------------------------------------------------------
     5. ИГРУШКА ВЫПАДАЕТ
  ------------------------------------------------------- */

  carriedToy.style.transition =
    "top .5s ease-in, opacity .25s ease";


  carriedToy.style.top =
    "235px";


  await wait(450);


  carriedToy.style.opacity =
    "0";


  await wait(250);


  /* -------------------------------------------------------
     6. УБИРАЕМ ЕЁ ИЗ КЛЕШНИ
  ------------------------------------------------------- */

  removeCarriedToy();


  carriedToy.style.transition = "";

  carriedToy.style.top =
    "93px";

  carriedToy.style.opacity =
    "1";


  /* -------------------------------------------------------
     7. ПОКАЗЫВАЕМ В ОКНЕ ПРИЗА
  ------------------------------------------------------- */

  prizeToy.textContent =
    toy.textContent.trim();


  prizeToy.classList.add(
    "show"
  );


  await wait(700);


  /* -------------------------------------------------------
     8. ПУСТАЯ ОТКРЫТАЯ КЛЕШНЯ ПОДНИМАЕТСЯ
  ------------------------------------------------------- */

  await raiseClaw();


  /* -------------------------------------------------------
     9. ВОЗВРАЩАЕТСЯ В ЦЕНТР
  ------------------------------------------------------- */

  currentSlot = 1;


  updateHorizontalPosition();


  await wait(800);


  /* -------------------------------------------------------
     10. ЗАКРЫВАЕТСЯ

     ГОТОВА К СЛЕДУЮЩЕМУ ХОДУ.
  ------------------------------------------------------- */

  await closeClaw();

}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА

   Она тоже сначала реально захватывается.

   Потом немного поднимается
   и выскальзывает.
========================================================= */

async function wrongToyCycle(toy) {


  /* -------------------------------------------------------
     ИГРУШКА В КЛЕШНЕ
  ------------------------------------------------------- */

  pickUpToy(toy);


  await wait(150);


  /* -------------------------------------------------------
     НЕМНОГО ПОДНИМАЕМ
  ------------------------------------------------------- */

  cable.style.height =
    "195px";


  clawAssembly.style.top =
    "250px";


  await wait(650);


  /* -------------------------------------------------------
     КЛЕШНЯ СЛУЧАЙНО РАСКРЫВАЕТСЯ
  ------------------------------------------------------- */

  await openClaw();


  /* -------------------------------------------------------
     ИГРУШКА ПАДАЕТ ИЗ ЛАПОК
  ------------------------------------------------------- */

  carriedToy.style.transition =
    "top .42s ease-in, opacity .2s ease";


  carriedToy.style.top =
    "205px";


  await wait(400);


  carriedToy.style.opacity =
    "0";


  await wait(180);


  /* -------------------------------------------------------
     УБИРАЕМ КОПИЮ
  ------------------------------------------------------- */

  removeCarriedToy();


  carriedToy.style.transition = "";

  carriedToy.style.top =
    "93px";

  carriedToy.style.opacity =
    "1";


  /* -------------------------------------------------------
     ВОЗВРАЩАЕМ ОРИГИНАЛЬНУЮ ИГРУШКУ
  ------------------------------------------------------- */

  toy.style.opacity =
    "1";


  toy.classList.add(
    "wrong-drop"
  );


  await wait(700);


  toy.classList.remove(
    "wrong-drop"
  );


  /* -------------------------------------------------------
     ПУСТАЯ ОТКРЫТАЯ КЛЕШНЯ ВВЕРХ
  ------------------------------------------------------- */

  await raiseClaw();


  /* -------------------------------------------------------
     ЗАКРЫВАЕМ
  ------------------------------------------------------- */

  await closeClaw();

}


/* =========================================================
   КРАСНАЯ КНОПКА

   ОДНО НАЖАТИЕ = ВЕСЬ ЦИКЛ.

   ИМЕННО В ТАКОМ ПОРЯДКЕ:

   CLOSED
      ↓
   OPEN
      ↓
   открытая едет вниз
      ↓
   CLOSE на игрушке
      ↓
   игрушка прикрепляется
      ↓
   закрытая едет вверх
========================================================= */

grabButton.addEventListener(
  "click",
  async () => {


    if (busy) return;


    const toy =
      toys[currentSlot];


    if (!toy) return;


    if (
      toy.style.opacity === "0"
    ) {
      return;
    }


    busy = true;


    /* =====================================================
       ШАГ 1

       НАЖАЛИ КРАСНУЮ КНОПКУ.

       ПЕРВОЕ ДЕЙСТВИЕ —
       КЛЕШНЯ ОТКРЫВАЕТСЯ.
    ===================================================== */

    await openClaw();


    /* =====================================================
       ШАГ 2

       ОНА УЖЕ ОТКРЫТА.

       И В ТАКОМ ВИДЕ ЕДЕТ ВНИЗ.
    ===================================================== */

    await lowerClaw();


    /* =====================================================
       ШАГ 3

       ДОЕХАЛА ДО ИГРУШКИ.

       ТОЛЬКО ТЕПЕРЬ ЗАКРЫВАЕТСЯ.
    ===================================================== */

    await closeClaw();


    /* =====================================================
       ШАГ 4

       ИГРУШКА ТЕПЕРЬ ЗАХВАЧЕНА.
    ===================================================== */

    const correct =
      toy.dataset.correct === "true";


    if (correct) {

      await correctToyCycle(toy);

    } else {

      await wrongToyCycle(toy);

    }


    busy = false;

  }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
  "keydown",
  event => {


    if (
      event.key ===
      "ArrowLeft"
    ) {

      leftButton.click();

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      rightButton.click();

    }


    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      grabButton.click();

    }

  }
);

</script>
