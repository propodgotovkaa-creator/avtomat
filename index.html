<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #eee3dc;
  font-family: "Trebuchet MS", Arial, sans-serif;
  user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  background:
    url("fon.png")
    center / cover
    no-repeat;
}

/* =====================================================
   ЗАДАНИЕ
===================================================== */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding: 31px 38px;

  border-radius: 34px;

  background:
    rgba(255,255,255,.92);

  border:
    3px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 14px 35px
    rgba(87,68,71,.13);

  text-align: center;

  color: #40506a;

  backdrop-filter:
    blur(7px);
}

.task-small {
  font-size: 24px;
  font-weight: 800;
  opacity: .75;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #ed5573;
}

/* =====================================================
   РАУНД
===================================================== */

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px 30px;

  border-radius: 28px;

  background:
    rgba(255,255,255,.90);

  box-shadow:
    0 12px 30px
    rgba(87,68,71,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;
}

/* =====================================================
   АВТОМАТ
===================================================== */

#machine {
  position: absolute;

  left: 790px;
  top: 30px;

  width: 730px;
  height: 1020px;

  z-index: 10;
}

/* =====================================================
   ВНУТРЕННЯЯ ВИТРИНА

   ВСЁ ВНУТРИ НЕЁ НАХОДИТСЯ
   ЗА PNG-КОРПУСОМ.
===================================================== */

#glassArea {
  position: absolute;

  /*
     Эти размеры соответствуют
     прозрачной области machine.png.
  */

  left: 78px;
  top: 168px;

  width: 574px;
  height: 600px;

  overflow: hidden;

  z-index: 10;
}

/* =====================================================
   ЛЁГКОЕ СТЕКЛО
===================================================== */

#glassArea::after {
  content: "";

  position: absolute;
  inset: 0;

  z-index: 90;

  pointer-events: none;

  background:
    linear-gradient(
      112deg,

      transparent 0%,
      transparent 10%,

      rgba(255,255,255,.13) 17%,

      transparent 24%,

      transparent 65%,

      rgba(255,255,255,.07) 71%,

      transparent 77%
    );
}

/* =====================================================
   РЕЛЬС
===================================================== */

#rail {
  position: absolute;

  left: 38px;
  top: 28px;

  width: 498px;
  height: 14px;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #e9edef 18%,
      #a6b0b4 45%,
      #677176 72%,
      #e1e6e8 100%
    );

  border:
    2px solid
    rgba(90,100,105,.45);

  box-shadow:
    0 4px 6px
    rgba(0,0,0,.13),

    inset 0 2px 2px
    rgba(255,255,255,.9);

  z-index: 15;
}

/* =====================================================
   ПОДВИЖНАЯ СИСТЕМА КЛЕШНИ
===================================================== */

#clawSystem {
  position: absolute;

  left: 192px;
  top: 0;

  width: 190px;
  height: 580px;

  z-index: 30;

  transition:
    left .34s
    cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   КАРЕТКА
===================================================== */

#clawCart {
  position: absolute;

  left: 32px;
  top: 0;

  width: 126px;
  height: 82px;

  object-fit: contain;

  z-index: 35;

  pointer-events: none;
}

/* =====================================================
   ТРОС
===================================================== */

#cable {
  position: absolute;

  left: 91px;
  top: 55px;

  width: 7px;
  height: 85px;

  border-radius: 5px;

  background:
    repeating-linear-gradient(
      135deg,

      #f5f5f5 0px,
      #f5f5f5 3px,

      #858f94 3px,
      #858f94 6px
    );

  box-shadow:
    1px 0 2px
    rgba(0,0,0,.20);

  z-index: 20;

  transition:
    height .78s
    cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   КЛЕШНЯ
===================================================== */

#claw {
  position: absolute;

  left: 18px;
  top: 130px;

  width: 154px;
  height: 190px;

  z-index: 40;

  transition:
    top .78s
    cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   КОРПУС КЛЕШНИ
===================================================== */

#clawBody {
  position: absolute;

  left: 50px;
  top: 0;

  width: 54px;
  height: 75px;

  object-fit: contain;

  z-index: 45;

  pointer-events: none;
}

/* =====================================================
   ЛЕВАЯ ЛАПКА
===================================================== */

#clawLeft {
  position: absolute;

  left: 0;
  top: 42px;

  width: 90px;
  height: 148px;

  object-fit: contain;

  z-index: 42;

  pointer-events: none;

  transform-origin:
    73px 18px;

  transform:
    rotate(0deg);

  transition:
    transform .38s
    cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   ПРАВАЯ ЛАПКА
===================================================== */

#clawRight {
  position: absolute;

  right: 0;
  top: 42px;

  width: 90px;
  height: 148px;

  object-fit: contain;

  z-index: 42;

  pointer-events: none;

  transform-origin:
    17px 18px;

  transform:
    rotate(0deg);

  transition:
    transform .38s
    cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   ОТКРЫТА
===================================================== */

#claw.open #clawLeft {
  transform:
    rotate(-22deg);
}

#claw.open #clawRight {
  transform:
    rotate(22deg);
}

/* =====================================================
   ЗАКРЫТА
===================================================== */

#claw.closed #clawLeft {
  transform:
    rotate(30deg);
}

#claw.closed #clawRight {
  transform:
    rotate(-30deg);
}

/* =====================================================
   ИГРУШКИ

   ПОКА ТЕСТОВЫЕ.
   ОНИ ТОЖЕ НАХОДЯТСЯ ВНУТРИ glassArea.
===================================================== */

.toy {
  position: absolute;

  bottom: 25px;

  width: 135px;
  height: 155px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  font-size: 95px;

  z-index: 25;

  transform-origin:
    center bottom;

  transition:
    transform .35s ease,
    bottom .65s ease,
    left .65s ease,
    opacity .3s ease;
}

.toy[data-slot="0"] {
  left: 30px;
}

.toy[data-slot="1"] {
  left: 220px;
}

.toy[data-slot="2"] {
  left: 410px;
}

/* =====================================================
   ТЕНЬ ИГРУШЕК
===================================================== */

.toy::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  width: 90px;
  height: 17px;

  border-radius: 50%;

  background:
    rgba(60,50,60,.13);

  filter:
    blur(5px);

  z-index: -1;
}

/* =====================================================
   PNG КОРПУС

   ВАЖНО:
   ОН ЛЕЖИТ ПОВЕРХ ВСЕЙ ВНУТРЕННОСТИ.
===================================================== */

.machine-image {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  z-index: 100;

  pointer-events: none;
}

/* =====================================================
   КЛИКАБЕЛЬНЫЕ ЗОНЫ КНОПОК

   ЛЕЖАТ ПОВЕРХ machine.png
===================================================== */

.hotspot {
  position: absolute;

  z-index: 150;

  padding: 0;
  margin: 0;

  border: none;

  background:
    transparent;

  cursor: pointer;
}

/* ЛЕВАЯ */

#leftButton {
  left: 103px;
  top: 824px;

  width: 110px;
  height: 95px;

  border-radius: 50%;
}

/* ПРАВАЯ */

#rightButton {
  left: 222px;
  top: 824px;

  width: 110px;
  height: 95px;

  border-radius: 50%;
}

/* КРАСНАЯ */

#grabButton {
  left: 400px;
  top: 807px;

  width: 125px;
  height: 125px;

  border-radius: 50%;
}

/* =====================================================
   ЭФФЕКТ НАЖАТИЯ
===================================================== */

.hotspot::after {
  content: "";

  position: absolute;

  inset: 5px;

  border-radius: inherit;

  background:
    transparent;

  transition:
    background .1s,
    transform .1s;
}

.hotspot:active::after {
  background:
    rgba(0,0,0,.10);

  transform:
    scale(.88);
}

/* =====================================================
   ТЕСТОВАЯ ПОДПИСЬ
===================================================== */

.test-label {
  position: absolute;

  right: 75px;
  bottom: 45px;

  padding:
    12px 20px;

  border-radius: 20px;

  background:
    rgba(255,255,255,.65);

  color:
    rgba(70,70,80,.62);

  font-size: 17px;
  font-weight: 800;

  backdrop-filter:
    blur(5px);
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

  <!-- =================================================
       ЗАДАНИЕ
  ================================================== -->

  <div class="task">

    <div class="task-small">
      Поймай нужную игрушку
    </div>

    <div class="task-main">
      Найди звук <b>С</b><br>
      В СЕРЕДИНЕ слова
    </div>

  </div>

  <!-- =================================================
       РАУНД
  ================================================== -->

  <div class="progress">
    🧸 Раунд 1 из 10
  </div>

  <!-- =================================================
       АВТОМАТ
  ================================================== -->

  <div id="machine">

    <!-- ===============================================
         ВНУТРЕННЯЯ ЧАСТЬ АВТОМАТА
    ================================================ -->

    <div id="glassArea">

      <!-- РЕЛЬС -->

      <div id="rail"></div>

      <!-- =============================================
           КЛЕШНЯ
      ============================================== -->

      <div id="clawSystem">

        <!-- КАРЕТКА -->

        <img
          id="clawCart"
          src="claw-cart.png"
          alt=""
          draggable="false"
        >

        <!-- ТРОС -->

        <div id="cable"></div>

        <!-- ЛАПКИ -->

        <div id="claw">

          <img
            id="clawBody"
            src="claw-body.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawLeft"
            src="claw-left.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawRight"
            src="claw-right.png"
            alt=""
            draggable="false"
          >

        </div>

      </div>

      <!-- =============================================
           ТЕСТОВЫЕ ИГРУШКИ
      ============================================== -->

      <div
        class="toy"
        data-slot="0"
      >
        🦉
      </div>

      <div
        class="toy"
        data-slot="1"
      >
        🦊
      </div>

      <div
        class="toy"
        data-slot="2"
      >
        🍍
      </div>

    </div>

    <!-- ===============================================
         ПЕРЕДНЯЯ РАМА АВТОМАТА
    ================================================ -->

    <img
      class="machine-image"
      src="machine.png"
      alt=""
      draggable="false"
    >

    <!-- ===============================================
         НЕВИДИМЫЕ КНОПКИ
    ================================================ -->

    <button
      id="leftButton"
      class="hotspot"
      aria-label="Влево"
    ></button>

    <button
      id="rightButton"
      class="hotspot"
      aria-label="Вправо"
    ></button>

    <button
      id="grabButton"
      class="hotspot"
      aria-label="Поймать игрушку"
    ></button>

  </div>

  <div class="test-label">
    Тест механизма клешни
  </div>

</div>

</div>

<script>

/* =====================================================
   МАСШТАБ 1920 × 1080
===================================================== */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );

  viewport.style.width =
    GAME_WIDTH * scale + "px";

  viewport.style.height =
    GAME_HEIGHT * scale + "px";

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawSystem =
  document.getElementById(
    "clawSystem"
  );

const claw =
  document.getElementById(
    "claw"
  );

const cable =
  document.getElementById(
    "cable"
  );

const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );

const grabButton =
  document.getElementById(
    "grabButton"
  );

/* =====================================================
   ТРИ ПОЗИЦИИ КЛЕШНИ
===================================================== */

const SLOT_X = [
  4,
  192,
  380
];

let currentSlot = 1;

let busy = false;

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

/* =====================================================
   ПЕРЕМЕЩЕНИЕ КЛЕШНИ
===================================================== */

function updateClawPosition() {

  clawSystem.style.left =
    SLOT_X[currentSlot] +
    "px";

}

updateClawPosition();

/* =====================================================
   ВЛЕВО
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();

    }

  }
);

/* =====================================================
   ВПРАВО
===================================================== */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();

    }

  }
);

/* =====================================================
   ЗАХВАТ

   ОДНО НАЖАТИЕ:

   1. раскрывается
   2. опускается
   3. закрывается
   4. поднимается
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy) return;

    busy = true;

    /* =============================================
       1. РАСКРЫВАЕМ
    ============================================== */

    claw.classList.remove(
      "closed"
    );

    claw.classList.add(
      "open"
    );

    await wait(450);

    /* =============================================
       2. ОПУСКАЕМ
    ============================================== */

    cable.style.height =
      "315px";

    claw.style.top =
      "360px";

    await wait(850);

    /* =============================================
       3. ЗАКРЫВАЕМ
    ============================================== */

    claw.classList.remove(
      "open"
    );

    claw.classList.add(
      "closed"
    );

    await wait(550);

    /* =============================================
       4. ПОДНИМАЕМ
    ============================================== */

    cable.style.height =
      "85px";

    claw.style.top =
      "130px";

    await wait(850);

    /* =============================================
       ПОКА ОСТАВЛЯЕМ ЗАКРЫТОЙ
       НА КОРОТКИЙ МОМЕНТ
    ============================================== */

    await wait(350);

    /* =============================================
       ВОЗВРАЩАЕМ В ОБЫЧНОЕ СОСТОЯНИЕ
    ============================================== */

    claw.classList.remove(
      "closed"
    );

    await wait(300);

    busy = false;

  }
);

/* =====================================================
   КЛАВИАТУРА ДЛЯ ТЕСТА
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "ArrowLeft"
    ) {

      leftButton.click();

    }

    if (
      event.key ===
      "ArrowRight"
    ) {

      rightButton.click();

    }

    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      grabButton.click();

    }

  }
);

</script>

</body>
</html>
