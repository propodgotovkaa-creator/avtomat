<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: top left;
    background: url("fon.png") center / cover no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;
    left: 70px;
    top: 155px;
    width: 440px;
    padding: 24px 28px 26px;
    border-radius: 32px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 15px 40px rgba(77,67,72,.13);
    text-align: center;
    color: #40506a;
    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;
    width: 330px;
    height: 125px;
    margin: 15px auto 0;
    object-fit: contain;
    pointer-events: none;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;
    left: 55px;
    bottom: 52px;
    width: 465px;
    height: 352px;
    z-index: 25;
    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;
    left: 72px;
    top: 95px;
    width: 320px;
    height: 215px;
    overflow: visible;
    z-index: 2;
    pointer-events: none;
}

.pouch-toy {
    position: absolute;
    object-fit: contain;
    object-position: center bottom;
    transform-origin: center bottom;
    filter: drop-shadow(0 5px 4px rgba(45,35,40,.15));
    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;
    left: 570px;
    top: 60px;
    width: 1280px;
    height: 906px;
    z-index: 10;
}

#machineBack {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 1;
    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;
    left: 170px;
    top: 170px;
    width: 940px;
    height: 455px;
    overflow: hidden;
    z-index: 20;
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;
    left: 20px;
    top: 2px;
    width: 900px;
    height: 105px;
    object-fit: fill;
    z-index: 12;
    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;
    left: 295px;
    top: 5px;
    width: 170px;
    height: 445px;
    z-index: 30;

    transition: left .92s cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;
    left: 31px;
    top: 0;
    width: 108px;
    height: 74px;
    object-fit: contain;
    z-index: 34;
    pointer-events: none;
}

#cableAnchor {
    position: absolute;
    left: 82px;
    top: 52px;
    width: 6px;
    z-index: 31;
}

#cable {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: var(--cable);
    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow: 1px 0 2px rgba(0,0,0,.2);
    z-index: 31;

    transition: height .92s cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;
    left: -77px;
    top: calc(var(--cable) - 10px);
    width: 160px;
    height: 180px;
    z-index: 32;

    transition: top .92s cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;
    left: 42px;
    top: 0;
    width: 77px;
    object-fit: contain;
    z-index: 33;
    pointer-events: none;
}

#clawLeft {
    position: absolute;
    left: 20px;
    top: 53px;
    width: 72px;
    object-fit: contain;
    transform-origin: 58px 15px;
    z-index: 32;
    transition: transform .46s cubic-bezier(.34,1.02,.64,1);
    pointer-events: none;
}

#clawRight {
    position: absolute;
    left: 68px;
    top: 53px;
    width: 72px;
    object-fit: contain;
    transform-origin: 14px 15px;
    z-index: 32;
    transition: transform .46s cubic-bezier(.34,1.02,.64,1);
    pointer-events: none;
}

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   BALL PIT
========================================================= */

#ballPitBack,
#ballPitFront {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 735px;
    height: 188px;
    overflow: hidden;
    pointer-events: none;
}

#ballPitBack {
    z-index: 40;
}

#ballPitFront {
    z-index: 50;
}

.ball {
    position: absolute;
    object-fit: contain;
    pointer-events: none;
    transform-origin: center center;
    will-change: left, top, transform;
    filter: drop-shadow(0 3px 3px rgba(60,50,70,.12));
}

/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;
    bottom: 13px;
    width: 128px;
    height: 138px;
    object-fit: contain;
    object-position: center bottom;
    z-index: 45;
    pointer-events: none;
    transform-origin: 50% 16%;

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

.toy.caught {
    z-index: 62;
}

.toy.dropping {
    z-index: 72;

/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {

    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 100;
    pointer-events: none;

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    z-index: 150;
}

#leftButton {
    left: 275px;
    top: 690px;
    width: 125px;
    height: 110px;
    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;
    width: 125px;
    height: 110px;
    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;
    width: 150px;
    height: 140px;
    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   PRIZE
========================================================= */

#prizeWindow {
    position: absolute;
    left: 948px;
    top: 690px;
    width: 170px;
    height: 132px;
    z-index: 160;
    pointer-events: none;
}

#prizeToy {
    position: absolute;

    /*
       Чуть левее визуального центра полочки.
    */
    left: 46%;
    bottom: 10px;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position: center bottom;

    opacity: 0;

    transform:
        translateX(-55%)
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;
    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateX(-55%)
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;
    inset: 0;
    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(55,48,55,.30);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;
    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;
    transform: translateY(100px) scale(.28);

    transition:
        transform .60s cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;
    transform: translateY(0) scale(1);
}

#bigPrizeToy {
    display: block;
    width: 390px;
    height: 390px;
    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}

#nextButton {
    margin-top: 16px;
    min-width: 330px;
    padding: 21px 40px;
    border: 0;
    border-radius: 28px;
    background: #ed5573;
    color: #fff;
    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform: translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;
    margin-top: 20px;
    padding: 20px 38px;
    border-radius: 28px;
    background: rgba(255,255,255,.96);
    color: #40506a;
    font-size: 32px;
    font-weight: 900;
    text-align: center;
}
</style>
</head>

/* =========================================================

const BALL_IMAGES = [

const BALL_DRAG = .989;

const BALL_BOUNCE = .34;

/* =========================================================
   CREATE BALLS
========================================================= */

function createBalls() {

    ballPitBack.innerHTML = "";
    ballPitFront.innerHTML = "";

    BALLS.length = 0;

    BALL_LAYOUT.forEach(
        (data, index) => {

            const [
                x,
                y,
                size,
                layer
            ] = data;

            const img =
                document.createElement("img");

            img.className =
                "ball";

            img.src =
                BALL_IMAGES[
                    index %
                    BALL_IMAGES.length
                ];

            img.draggable =
                false;

            img.style.width =
                `${size}px`;

            img.style.height =
                `${size}px`;

            if (layer === "front") {

                ballPitFront.appendChild(
                    img
                );

            } else {

                ballPitBack.appendChild(
                    img
                );
            }

            BALLS.push({

                element: img,
                layer,

                x,
                y,

                homeX: x,
                homeY: y,

                size,

                vx: 0,
                vy: 0,

                angle:
                    ((index * 13) % 16) - 8,

                va: 0,

                sleeping: true,
                sleepCounter: 0
            });
        }
    );

    renderBalls();
}

/* =========================================================
   RENDER
========================================================= */

function renderBalls() {

    BALLS.forEach(
        ball => {

            ball.element.style.left =
                `${ball.x}px`;

            ball.element.style.top =
                `${ball.y}px`;

            ball.element.style.transform =
                `rotate(${ball.angle}deg)`;
        }
    );
}

/* =========================================================
   WAKE BALL
========================================================= */

function wakeBall(ball) {

    ball.sleeping = false;
    ball.sleepCounter = 0;
}

/* =========================================================
   BALL COLLISION
========================================================= */

function resolveBallCollision(a, b) {

    const ra =
        a.size * .43;

    const rb =
        b.size * .43;

    const ax =
        a.x +
        a.size / 2;

    const ay =
        a.y +
        a.size / 2;

    const bx =
        b.x +
        b.size / 2;

    const by =
        b.y +
        b.size / 2;

    let dx =
        bx - ax;

    let dy =
        by - ay;

    let dist =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const minDist =
        ra + rb;

    if (dist >= minDist) {
        return;
    }

    if (dist < .01) {

        dx = .01;
        dy = 0;
        dist = .01;
    }

    const nx =
        dx / dist;

    const ny =
        dy / dist;

    const overlap =
        minDist - dist;

    a.x -=
        nx * overlap * .52;

    a.y -=
        ny * overlap * .52;

    b.x +=
        nx * overlap * .52;

    b.y +=
        ny * overlap * .52;

    const relativeX =
        b.vx - a.vx;

    const relativeY =
        b.vy - a.vy;

    const velocityNormal =
        relativeX * nx +
        relativeY * ny;

    if (velocityNormal < 0) {

        const restitution =
            .48;

        const impulse =
            -(
                1 +
                restitution
            ) *
            velocityNormal /
            2;

        a.vx -=
            impulse * nx;

        a.vy -=
            impulse * ny;

        b.vx +=
            impulse * nx;

        b.vy +=
            impulse * ny;

        a.va -=
            impulse * nx * .12;

        b.va +=
            impulse * nx * .12;
    }

    if (
        Math.abs(a.vx) +
        Math.abs(a.vy) >
        .12
    ) {

        wakeBall(b);
    }

    if (
        Math.abs(b.vx) +
        Math.abs(b.vy) >
        .12
    ) {

        wakeBall(a);
    }
}

/* =========================================================
   BALL PHYSICS
========================================================= */

function startBallPhysics() {

    if (ballPhysicsRunning) {
        return;
    }

    ballPhysicsRunning = true;

    function frame() {

        BALLS.forEach(
            ball => {

                if (ball.sleeping) {
                    return;
                }

                ball.vy +=
                    BALL_GRAVITY;

                ball.vx *=
                    BALL_DRAG;

                ball.vy *=
                    BALL_DRAG;

                ball.va *=
                    .97;

                ball.x +=
                    ball.vx;

                ball.y +=
                    ball.vy;

                ball.angle +=
                    ball.va;

                const maxX =
                    BALL_PIT_WIDTH -
                    ball.size;

                const maxY =
                    BALL_PIT_HEIGHT -
                    ball.size;

                if (ball.x < 0) {

                    ball.x = 0;

                    ball.vx =
                        Math.abs(ball.vx) *
                        BALL_BOUNCE;
                }

                if (ball.x > maxX) {

                    ball.x = maxX;

                    ball.vx =
                        -Math.abs(ball.vx) *
                        BALL_BOUNCE;
                }

                if (ball.y < 0) {

                    ball.y = 0;

                    ball.vy =
                        Math.abs(ball.vy) *
                        BALL_BOUNCE;
                }

                if (ball.y > maxY) {

                    ball.y = maxY;

                    if (
                        Math.abs(ball.vy) >
                        .65
                    ) {

                        ball.vy =
                            -Math.abs(ball.vy) *
                            BALL_BOUNCE;

                    } else {

                        ball.vy = 0;
                    }

                    ball.vx *=
                        BALL_FLOOR_DRAG;

                    ball.va +=
                        ball.vx * .09;
                }
            }
        );

        for (
            let pass = 0;
            pass < 4;
            pass++
        ) {

            for (
                let i = 0;
                i < BALLS.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < BALLS.length;
                    j++
                ) {

                    resolveBallCollision(
                        BALLS[i],
                        BALLS[j]
                    );
                }
            }
        }

        BALLS.forEach(
            ball => {

                const maxX =
                    BALL_PIT_WIDTH -
                    ball.size;

                const maxY =
                    BALL_PIT_HEIGHT -
                    ball.size;

                ball.x =
                    Math.max(
                        0,
                        Math.min(
                            maxX,
                            ball.x
                        )
                    );

                ball.y =
                    Math.max(
                        0,
                        Math.min(
                            maxY,
                            ball.y
                        )
                    );

                if (ball.sleeping) {
                    return;
                }

                const speed =
                    Math.abs(ball.vx) +
                    Math.abs(ball.vy) +
                    Math.abs(ball.va) * .03;

                if (speed < .065) {

                    ball.sleepCounter++;

                } else {

                    ball.sleepCounter = 0;
                }

                if (
                    ball.sleepCounter >
                    32
                ) {

                    ball.vx = 0;
                    ball.vy = 0;
                    ball.va = 0;

                    ball.sleeping = true;
                }
            }
        );

        renderBalls();

        const moving =
            BALLS.some(
                ball =>
                    !ball.sleeping
            );

        if (moving) {

            ballPhysicsFrame =
                requestAnimationFrame(
                    frame
                );

        } else {

            ballPhysicsFrame = null;
            ballPhysicsRunning = false;
        }
    }

    ballPhysicsFrame =
        requestAnimationFrame(
            frame
        );
}

/* =========================================================
   CLAW PUSHES BALLS
========================================================= */

function pushBallsByClaw(slot) {

    const clawCenter =
        toyHome[slot].left +
        toyHome[slot].width / 2;

    BALLS.forEach(
        (ball, index) => {

            const bx =
                ball.x +
                ball.size / 2;

            const dx =
                bx -
                clawCenter;

            const distance =
                Math.abs(dx);

            if (distance > 105) {
                return;
            }

            const power =
                1 -
                distance / 105;

            let direction =
                Math.sign(dx);

            if (direction === 0) {

                direction =
                    index % 2
                        ? 1
                        : -1;
            }

            ball.vx +=
                direction *
                (
                    2.8 +
                    4.5 * power
                );

            ball.vy -=
                .7 +
                1.4 * power;

            ball.va +=
                direction *
                (
                    2 +
                    3 * power
                );

            wakeBall(ball);
        }
    );

    startBallPhysics();
}

/* =========================================================
   TOY PUSHES BALLS
========================================================= */

function pushBallsByRisingToy(slot) {

    const toyLeft =
        toyHome[slot].left;

    const toyRight =
        toyLeft +
        toyHome[slot].width;

    const toyCenter =
        (
            toyLeft +
            toyRight
        ) / 2;

    BALLS.forEach(
        (ball, index) => {

            const center =
                ball.x +
                ball.size / 2;

            if (
                center <
                toyLeft - 45 ||
                center >
                toyRight + 45
            ) {
                return;
            }

            const dx =
                center -
                toyCenter;

            const normalized =
                Math.min(
                    1,
                    Math.abs(dx) /
                    (
                        toyHome[slot].width /
                        2 +
                        45
                    )
                );

            let direction =
                dx < 0
                    ? -1
                    : 1;

            if (
                Math.abs(dx) <
                5
            ) {

                direction =
                    index % 2
                        ? 1
                        : -1;
            }

            const power =
                1 -
                normalized;

            ball.vx +=
                direction *
                (
                    2.1 +
                    4.4 * power
                );

            ball.vy -=
                .45 +
                1.25 * power;

            ball.va +=
                direction *
                (
                    1.7 +
                    2.5 * power
                );

            wakeBall(ball);
        }
    );

    startBallPhysics();
}

/* =========================================================
   BALLS FALL INTO GAP
========================================================= */

function collapseBallsIntoGap(slot) {

    const gapCenter =
        toyHome[slot].left +
        toyHome[slot].width / 2;

    BALLS.forEach(
        (ball, index) => {

            const center =
                ball.x +
                ball.size / 2;

            const dx =
                gapCenter -
                center;

            const distance =
                Math.abs(dx);

            if (distance > 155) {
                return;
            }

            const power =
                1 -
                distance / 155;

            ball.vx +=
                Math.sign(dx) *
                (
                    .35 +
                    1.15 * power
                );

            ball.vy +=
                .25 +
                .35 * power;

            ball.va +=
                Math.sign(dx) *
                .8;

            wakeBall(ball);
        }
    );

    startBallPhysics();
}

/* =========================================================
   RESET BALLS
========================================================= */

function resetBalls() {

    if (
        ballPhysicsFrame !==
        null
    ) {

        cancelAnimationFrame(
            ballPhysicsFrame
        );

        ballPhysicsFrame = null;
    }

    ballPhysicsRunning = false;

    BALLS.forEach(
        ball => {

            ball.x =
                ball.homeX;

            ball.y =
                ball.homeY;

            ball.vx = 0;
            ball.vy = 0;
            ball.va = 0;

            ball.sleeping = true;
            ball.sleepCounter = 0;
        }
    );

    renderBalls();
}

const POUCH_LAYOUT = [

    {left:34, top:108, width:108, height:108, rotate:-10, z:1},
    {left:106, top:105, width:110, height:110, rotate:7, z:2},
    {left:183, top:107, width:108, height:108, rotate:-5, z:3},
    {left:54, top:68, width:104, height:104, rotate:11, z:4},
    {left:157, top:66, width:105, height:105, rotate:-9, z:5},
    {left:104, top:43, width:103, height:103, rotate:4, z:6},
    {left:50, top:30, width:98, height:98, rotate:-8, z:7},
    {left:174, top:29, width:98, height:98, rotate:9, z:8}

];

function addToyToPouch(src) {

    const index =
        collectedToys.length;

    if (
        index >=
        POUCH_LAYOUT.length
    ) {
        return;
    }

    collectedToys.push(src);

    const layout =
        POUCH_LAYOUT[index];

    const img =
        document.createElement("img");

    img.src = src;
    img.className = "pouch-toy";
    img.draggable = false;

    img.style.left =
        `${layout.left}px`;

    img.style.top =
        `${layout.top}px`;

    img.style.width =
        `${layout.width}px`;

    img.style.height =
        `${layout.height}px`;

    img.style.zIndex =
        String(layout.z);

    img.style.opacity =
        "0";

    img.style.transform =
        `translateY(-30px)
         rotate(${layout.rotate}deg)
         scale(.88)`;

    img.style.transition =
        "transform .48s cubic-bezier(.22,.8,.3,1.15), opacity .22s ease";

    pouchToys.appendChild(
        img
    );

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    img.style.opacity =
                        "1";

                    img.style.transform =
                        `translateY(0)
                         rotate(${layout.rotate}deg)
                         scale(1)`;
                }
            );
        }
    );
}

/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside
        .getBoundingClientRect();

    const rect =
        element
        .getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}

/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "caught"
    );

    grabbedToy =
        toy;
}

/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (!grabbedToy) {
        return;
    }

    const toyRect =
        getLocalRect(
            grabbedToy
        );

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    heldOffsetX =
        toyRect.left -
        anchorX;

    heldOffsetY =
        toyRect.top -
        anchorY;
}

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}

/* =========================================================
   FOLLOW TOY
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }

    const target =
        getHeldTarget();

    if (!target) {
        return;
    }

    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );

    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }

    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }

    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .58;

    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(
            followToy
        );
}

function startFollowingToy() {

    stopFollowingToy();

    followToy();
}

function stopFollowingToy() {

    if (
        followFrame !==
        null
    ) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame =
            null;
    }
}

/* =========================================================
   VERTICAL DROP
========================================================= */

function animateVerticalDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const startTime =
                performance.now();

            function frame(now) {

                const t =
                    Math.min(
                        (
                            now -
                            startTime
                        ) /
                        duration,
                        1
                    );

                const eased =
                    t * t;

                const y =
                    startTop +
                    (
                        endTop -
                        startTop
                    ) *
                    eased;

                toy.style.top =
                    `${y}px`;

                toy.style.transform =
                    `rotate(${t * 1.4}deg)`;

                if (t < 1) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}

}

    pushBallsByRisingToy(
        index
    );

    await wait(400);

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-2deg)";

    await wait(150);

    setClaw(
        "open"
    );

    await wait(190);

    const pos =
        getLocalRect(
            toy
        );

    stopFollowingToy();

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    const lockedLeft =
        pos.left;

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;

    await wait(60);

    toy.style.left =
        `${lockedLeft}px`;

    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";

    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(3deg)";

    await wait(440);

    collapseBallsIntoGap(
        index
    );

    toy.style.transition =
        "transform .09s ease-out";

    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";

    await wait(90);

    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";

    toy.style.transform =
        "rotate(.6deg) scaleY(1)";

    await wait(180);

    toy.style.transition =
        "transform .14s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(150);

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";

    toy.classList.remove(
        "caught",
        "dropping"
    );

    setCable(
        CABLE_HOME
    );

    await wait(980);

    await neutralClaw();

    grabbedToy =
        null;
}

/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }

        const toy =
            toys[currentSlot];

        if (!toy) {
            return;
        }

        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }

        busy =
            true;

        try {

            await openClaw();

            await wait(90);

            await lowerClawToToy(
                toy
            );

            await wait(140);

            await grabToyNaturally(
                toy
            );

            const correct =
                toy.dataset.correct ===
                "true";

            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);

/* =========================================================
   PRIZE CLICK
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (!waitingForPrize) {
            return;
        }

        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }

        const wonToySrc =
            prizeToy.src;

        prizeToy.style.pointerEvents =
            "none";

        bigPrizeToy.src =
            wonToySrc;

        prizeToy.classList.remove(
            "show"
        );

        addToyToPouch(
            wonToySrc
        );

        prizeOverlay.classList.add(
            "show"
        );

        if (
            roundIndex ===
            ROUNDS.length - 1
        ) {

            nextButton.style.display =
                "none";

            finalText.style.display =
                "block";
        }
    }
);

/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length - 1
        ) {
            return;
        }

        nextButton.disabled =
            true;

        prizeOverlay.classList.remove(
            "show"
        );

        await wait(380);

        bigPrizeToy.src =
            "";

        roundIndex++;

        loadRound(
            roundIndex
        );

        nextButton.disabled =
            false;
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);

/* =========================================================
   START
========================================================= */

createBalls();

loadRound(
    roundIndex
);

</script>

</body>
</html>
