<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

/* =====================================================
   ОСНОВА
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;

  background: #f6e5dc;

  font-family: "Trebuchet MS", Arial, sans-serif;

  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  background-image: url("fon.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* =====================================================
   ЗАДАНИЕ
===================================================== */

.task {
  position: absolute;

  left: 80px;
  top: 80px;

  width: 520px;

  padding: 30px 35px;

  border-radius: 35px;

  background: rgba(255,255,255,.88);

  border: 3px solid rgba(255,255,255,.7);

  box-shadow:
    0 15px 35px rgba(94,66,82,.13),
    inset 0 2px 0 rgba(255,255,255,.9);

  text-align: center;

  color: #684c70;

  backdrop-filter: blur(7px);
}

.task-small {
  font-size: 25px;
  font-weight: 800;

  opacity: .7;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #e84d68;
}

/* =====================================================
   ПРОГРЕСС
===================================================== */

.progress {
  position: absolute;

  left: 120px;
  top: 315px;

  width: 440px;

  padding: 22px 30px;

  border-radius: 28px;

  background: rgba(255,255,255,.78);

  border: 2px solid rgba(255,255,255,.7);

  text-align: center;

  font-size: 27px;
  font-weight: 900;

  color: #745577;

  box-shadow:
    0 12px 30px rgba(94,66,82,.10);

  backdrop-filter: blur(7px);
}

/* =====================================================
   ТЕНЬ АВТОМАТА
===================================================== */

.machine-shadow {
  position: absolute;

  left: 700px;
  top: 1010px;

  width: 730px;
  height: 55px;

  border-radius: 50%;

  background: rgba(87,55,67,.18);

  filter: blur(18px);
}

/* =====================================================
   АВТОМАТ
===================================================== */

.machine {
  position: absolute;

  left: 670px;
  top: 20px;

  width: 790px;
  height: 1040px;

  border-radius: 34px 34px 24px 24px;

  /*
    Основной пастельный корпус
  */

  background:
    linear-gradient(
      90deg,
      #dc7f9c 0%,
      #f2a8bc 8%,
      #f7b8c8 48%,
      #efa0b7 92%,
      #d77a98 100%
    );

  border: 10px solid #ca718f;

  box-shadow:
    0 17px 0 #ad5e7a,
    0 28px 45px rgba(83,49,65,.25),
    inset 0 3px 0 rgba(255,255,255,.55);

  isolation: isolate;
}

/* светлая внутренняя окантовка */

.machine::before {
  content: "";

  position: absolute;

  inset: 12px;

  border-radius: 24px 24px 16px 16px;

  border: 4px solid rgba(255,239,230,.65);

  pointer-events: none;

  z-index: 100;
}

/* =====================================================
   ВЕРХНЯЯ ВЫВЕСКА
===================================================== */

.machine-sign {
  position: absolute;

  left: 31px;
  right: 31px;
  top: 24px;

  height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;

  background:
    linear-gradient(
      180deg,
      #fffdf5 0%,
      #fff4dc 65%,
      #f5dfc5 100%
    );

  border: 6px solid #fff0dc;

  box-shadow:
    0 7px 0 rgba(168,91,112,.25),
    0 10px 22px rgba(117,73,91,.14),
    inset 0 4px 8px rgba(255,255,255,.95),
    inset 0 -5px 10px rgba(226,189,161,.18);

  color: #d75e7d;

  font-size: 38px;
  font-weight: 900;

  letter-spacing: 2px;

  text-shadow:
    0 2px 0 white;
}

/* =====================================================
   ЛАМПОЧКИ НА ВЫВЕСКЕ
===================================================== */

.sign-lights {
  position: absolute;

  left: 58px;
  right: 58px;
  top: 38px;

  height: 72px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  pointer-events: none;

  z-index: 5;
}

.light {
  width: 15px;
  height: 15px;

  border-radius: 50%;

  background: #ffd86e;

  border: 2px solid #f2bd54;

  box-shadow:
    0 0 8px rgba(255,210,95,.85),
    0 0 15px rgba(255,218,111,.45),
    inset 0 2px 2px rgba(255,255,255,.8);
}

/* =====================================================
   РАМА ВИТРИНЫ
===================================================== */

.glass-frame {
  position: absolute;

  left: 34px;
  top: 135px;

  width: 702px;
  height: 645px;

  padding: 10px;

  border-radius: 19px;

  background:
    linear-gradient(
      135deg,
      #fff6ed 0%,
      #f6d7d7 28%,
      #fff3ea 50%,
      #e7bdc9 100%
    );

  box-shadow:
    0 8px 0 rgba(151,76,99,.20),
    0 12px 20px rgba(100,62,78,.13),
    inset 0 3px 3px rgba(255,255,255,.9);
}

/* =====================================================
   СТЕКЛЯННАЯ ВИТРИНА
===================================================== */

.glass {
  position: relative;

  width: 682px;
  height: 625px;

  overflow: hidden;

  border-radius: 10px;

  /*
    ПОЧТИ ПРОЗРАЧНОЕ СТЕКЛО.

    Через него слегка просматривается
    фон магазина.
  */

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.25) 0%,
      rgba(255,255,255,.06) 17%,
      rgba(255,255,255,.01) 18%,
      rgba(205,240,247,.05) 58%,
      rgba(255,255,255,.12) 100%
    );

  border:
    2px solid rgba(255,255,255,.72);

  box-shadow:
    inset 0 0 28px rgba(154,212,226,.10),
    inset 0 0 3px rgba(255,255,255,.8);
}

/* =====================================================
   БЛИКИ НА СТЕКЛЕ
===================================================== */

.glass-shine-one {
  position: absolute;

  left: 70px;
  top: -150px;

  width: 70px;
  height: 950px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );

  z-index: 70;

  pointer-events: none;
}

.glass-shine-two {
  position: absolute;

  right: 90px;
  top: -100px;

  width: 25px;
  height: 850px;

  transform: rotate(18deg);

  background:
    rgba(255,255,255,.15);

  z-index: 70;

  pointer-events: none;
}

/* =====================================================
   ВНУТРЕННЯЯ ЗАДНЯЯ СТЕНКА
===================================================== */

.machine-inside-back {
  position: absolute;

  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(225,247,249,.07),
      rgba(255,235,240,.10)
    );

  pointer-events: none;

  z-index: 0;
}

/* =====================================================
   ПОЛ ДЛЯ ИГРУШЕК
===================================================== */

.toy-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 108px;

  background:
    linear-gradient(
      180deg,
      rgba(255,236,235,.92),
      rgba(234,191,201,.96)
    );

  border-top:
    6px solid rgba(255,255,255,.75);

  box-shadow:
    inset 0 8px 12px rgba(187,117,139,.12);

  z-index: 1;
}

/* небольшая линия глубины */

.toy-floor::before {
  content: "";

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 15px;

  background:
    linear-gradient(
      rgba(139,91,109,.14),
      transparent
    );
}

/* =====================================================
   РЕЛЬС
===================================================== */

.rail {
  position: absolute;

  left: 38px;
  right: 38px;
  top: 32px;

  height: 18px;

  border-radius: 15px;

  background:
    linear-gradient(
      180deg,
      #dfe7ea 0%,
      #9da9b0 35%,
      #65727a 100%
    );

  border: 3px solid #68757d;

  box-shadow:
    0 5px 7px rgba(50,60,65,.17),
    inset 0 3px 2px rgba(255,255,255,.75);

  z-index: 20;
}

/* =====================================================
   КЛЕШНЯ
===================================================== */

#clawAssembly {
  position: absolute;

  left: 276px;
  top: 26px;

  width: 110px;
  height: 480px;

  z-index: 30;

  transition: left .18s linear;
}

.claw-cart {
  position: absolute;

  left: 23px;
  top: -4px;

  width: 64px;
  height: 44px;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      #f0f4f5 0%,
      #aab6bc 45%,
      #75828a 100%
    );

  border: 4px solid #66737b;

  box-shadow:
    inset 0 3px 3px rgba(255,255,255,.8),
    0 4px 6px rgba(50,60,65,.16);

  z-index: 4;
}

#cable {
  position: absolute;

  left: 52px;
  top: 35px;

  width: 6px;
  height: 75px;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #3e464b,
      #7b858b,
      #353c41
    );

  transition:
    height .62s ease-in-out;
}

#clawHead {
  position: absolute;

  left: 5px;
  top: 105px;

  width: 100px;
  height: 100px;

  transition:
    top .62s ease-in-out;
}

.claw-center {
  position: absolute;

  left: 32px;
  top: 0;

  width: 36px;
  height: 35px;

  border-radius:
    10px 10px 16px 16px;

  background:
    linear-gradient(
      180deg,
      #f0f4f5,
      #9da9af 55%,
      #68757c
    );

  border:
    4px solid #647178;

  box-shadow:
    inset 0 3px 3px rgba(255,255,255,.7),
    0 4px 5px rgba(48,57,61,.15);
}

.claw-arm {
  position: absolute;

  top: 27px;

  width: 11px;
  height: 74px;

  border-radius: 10px;

  background:
    linear-gradient(
      90deg,
      #77848b,
      #c1cbd0,
      #69767d
    );

  transform-origin:
    top center;

  transition:
    transform .22s ease;
}

.claw-arm.left {
  left: 31px;

  transform:
    rotate(32deg);
}

.claw-arm.right {
  right: 31px;

  transform:
    rotate(-32deg);
}

#clawHead.closed
.claw-arm.left {
  transform:
    rotate(11deg);
}

#clawHead.closed
.claw-arm.right {
  transform:
    rotate(-11deg);
}

.claw-tip {
  position: absolute;

  bottom: -2px;

  width: 28px;
  height: 11px;

  border-radius: 10px;

  background:
    linear-gradient(
      #c0c9cd,
      #727e84
    );
}

.left .claw-tip {
  left: -16px;

  transform:
    rotate(24deg);
}

.right .claw-tip {
  right: -16px;

  transform:
    rotate(-24deg);
}

/* =====================================================
   ИГРУШКИ
===================================================== */

.toy {
  position: absolute;

  top: 390px;

  width: 155px;
  height: 180px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  z-index: 10;

  transition:
    left .55s ease,
    top .55s ease,
    transform .45s ease,
    opacity .3s ease;

  transform-origin:
    center bottom;
}

.toy-body {
  position: relative;

  width: 140px;
  height: 140px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius:
    48% 48% 42% 42%;

  background:
    linear-gradient(
      145deg,
      #ffd4dd,
      #e99bb0
    );

  border:
    6px solid rgba(255,255,255,.82);

  box-shadow:
    0 9px 0 rgba(115,65,82,.10),
    0 14px 18px rgba(76,59,72,.10),
    inset 0 4px 7px rgba(255,255,255,.4);

  font-size: 82px;
}

/* разные оттенки временных игрушек */

.toy[data-slot="0"]
.toy-body {
  background:
    linear-gradient(
      145deg,
      #cceaff,
      #92c7ea
    );
}

.toy[data-slot="1"]
.toy-body {
  background:
    linear-gradient(
      145deg,
      #ffd6df,
      #eda5b7
    );
}

.toy[data-slot="2"]
.toy-body {
  background:
    linear-gradient(
      145deg,
      #d6efc7,
      #a9d38f
    );
}

/* ножки временных игрушек */

.toy-body::before,
.toy-body::after {
  content: "";

  position: absolute;

  bottom: -19px;

  width: 38px;
  height: 42px;

  border-radius: 50%;

  background: inherit;

  border:
    5px solid rgba(255,255,255,.78);

  z-index: -1;
}

.toy-body::before {
  left: 18px;

  transform:
    rotate(17deg);
}

.toy-body::after {
  right: 18px;

  transform:
    rotate(-17deg);
}

/* =====================================================
   ТРИ ПОЗИЦИИ ИГРУШЕК
===================================================== */

.toy[data-slot="0"] {
  left: 48px;
}

.toy[data-slot="1"] {
  left: 255px;
}

.toy[data-slot="2"] {
  left: 462px;
}

/* =====================================================
   НИЖНЯЯ ЧАСТЬ АВТОМАТА
===================================================== */

.lower-machine {
  position: absolute;

  left: 34px;
  top: 795px;

  width: 702px;
  height: 215px;

  border-radius:
    18px 18px 16px 16px;

  background:
    linear-gradient(
      180deg,
      #f6b2c3 0%,
      #e98ca7 100%
    );

  border:
    7px solid #f7d5da;

  box-shadow:
    0 7px 0 rgba(164,82,108,.30),
    inset 0 5px 5px rgba(255,255,255,.35),
    inset 0 -7px 12px rgba(157,75,102,.10);
}

/* =====================================================
   ПАНЕЛЬ УПРАВЛЕНИЯ
===================================================== */

.control-panel {
  position: absolute;

  left: 27px;
  top: 28px;

  width: 305px;
  height: 145px;

  border-radius: 24px;

  background:
    linear-gradient(
      180deg,
      #fff8e6,
      #f7e0bd
    );

  border:
    5px solid #fff0d5;

  box-shadow:
    0 7px 0 rgba(163,104,89,.20),
    inset 0 4px 4px rgba(255,255,255,.8);
}

.arrows {
  position: absolute;

  left: 22px;
  top: 26px;

  display: flex;
  gap: 18px;
}

.arrow-button {
  width: 105px;
  height: 86px;

  border: 4px solid #bfe7f5;
  border-radius: 50%;

  background:
    linear-gradient(
      180deg,
      #bdefff,
      #6dc4e5
    );

  color: white;

  font-size: 53px;
  line-height: 1;

  font-weight: 900;

  cursor: pointer;

  text-shadow:
    0 3px 0 rgba(55,132,166,.25);

  box-shadow:
    0 8px 0 #58a8c7,
    0 11px 15px rgba(68,105,120,.15),
    inset 0 5px 5px rgba(255,255,255,.55);
}

.arrow-button:active {
  transform:
    translateY(6px);

  box-shadow:
    0 2px 0 #58a8c7,
    inset 0 4px 5px rgba(255,255,255,.4);
}

/* =====================================================
   КРАСНАЯ КНОПКА
===================================================== */

.red-base {
  position: absolute;

  left: 365px;
  top: 48px;

  width: 125px;
  height: 112px;

  border-radius: 50%;

  background:
    #8d4451;

  box-shadow:
    0 8px 0 #713641;
}

#grabButton {
  position: absolute;

  left: 8px;
  top: -8px;

  width: 109px;
  height: 94px;

  border: 0;
  border-radius: 50%;

  cursor: pointer;

  background:
    radial-gradient(
      circle at 35% 24%,
      #ff9c9c 0%,
      #ff4b54 28%,
      #e31932 62%,
      #aa0b23 100%
    );

  box-shadow:
    inset 0 8px 9px rgba(255,255,255,.42),
    inset 0 -9px 11px rgba(90,0,10,.28),
    0 9px 0 #900d23,
    0 14px 18px rgba(96,25,39,.25);
}

#grabButton:active {
  top: 0;

  box-shadow:
    inset 0 4px 7px rgba(255,255,255,.30),
    inset 0 -5px 8px rgba(90,0,10,.25),
    0 2px 0 #900d23;
}

.button-hint {
  position: absolute;

  left: 365px;
  top: 155px;

  width: 125px;

  text-align: center;

  color: #a64b66;

  font-size: 14px;
  font-weight: 900;
}

/* =====================================================
   ОКНО ВЫДАЧИ
===================================================== */

.prize-section {
  position: absolute;

  right: 25px;
  top: 24px;

  width: 155px;
  height: 170px;
}

.prize-label {
  position: absolute;

  top: 0;

  width: 100%;

  text-align: center;

  color: #a64b66;

  font-size: 17px;
  font-weight: 900;
}

#prizeDoor {
  position: absolute;

  left: 4px;
  top: 30px;

  width: 147px;
  height: 120px;

  overflow: hidden;

  border-radius: 18px;

  background:
    linear-gradient(
      180deg,
      #423640,
      #171318
    );

  border:
    8px solid #f7d7dc;

  box-shadow:
    inset 0 13px 27px rgba(0,0,0,.72),
    0 5px 0 rgba(164,82,108,.20);

  cursor: default;
}

/* резиновая шторка */

#prizeDoor::before {
  content: "";

  position: absolute;

  left: 8px;
  right: 8px;
  top: 7px;

  height: 34px;

  border-radius:
    7px 7px 18px 18px;

  background:
    linear-gradient(
      #544750,
      #2e272d
    );

  box-shadow:
    0 5px 8px rgba(0,0,0,.25);

  z-index: 1;
}

#doorToy {
  position: absolute;

  left: 50%;
  top: 58%;

  transform:
    translate(-50%,-42%)
    scale(.65);

  font-size: 82px;

  opacity: 0;

  z-index: 3;

  transition:
    opacity .3s,
    transform .35s;
}

#prizeDoor.ready {
  cursor: pointer;
}

#prizeDoor.ready
#doorToy {
  opacity: 1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

/* =====================================================
   БОЛЬШОЙ ПРИЗ
===================================================== */

#prizeOverlay {
  position: absolute;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  background:
    rgba(85,58,75,.27);

  backdrop-filter:
    blur(3px);
}

.prize-card {
  position: relative;

  width: 500px;
  height: 560px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  border-radius: 65px;

  background:
    linear-gradient(
      #fffdf8,
      #fff1e2
    );

  border:
    12px solid #f7c5cf;

  box-shadow:
    0 28px 65px rgba(73,40,58,.28),
    inset 0 4px 5px rgba(255,255,255,.8);

  animation:
    prizePop .55s
    cubic-bezier(.2,1.55,.35,1);
}

#bigPrizeEmoji {
  font-size: 245px;
}

#bigPrizeWord {
  margin-top: 5px;

  font-size: 60px;
  font-weight: 900;

  color: #674d70;
}

#nextButton {
  margin-top: 25px;

  padding: 18px 58px;

  border: 0;
  border-radius: 28px;

  background:
    linear-gradient(
      #f8758e,
      #df4e6d
    );

  color: white;

  font-size: 29px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 0 #b83c59;
}

#nextButton:active {
  transform:
    translateY(6px);

  box-shadow:
    0 2px 0 #b83c59;
}

@keyframes prizePop {

  0% {
    opacity: 0;

    transform:
      scale(.15)
      rotate(-15deg);
  }

  100% {
    opacity: 1;

    transform:
      scale(1)
      rotate(0);
  }

}

/* =====================================================
   КОНФЕТТИ
===================================================== */

.spark {
  position: absolute;

  width: 18px;
  height: 18px;

  border-radius: 5px;

  background: #ffd86c;

  animation:
    sparkFly .8s ease-out forwards;
}

@keyframes sparkFly {

  from {
    opacity: 1;

    transform:
      translate(0,0)
      rotate(0);
  }

  to {
    opacity: 0;

    transform:
      translate(
        var(--x),
        var(--y)
      )
      rotate(360deg);
  }

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

#message {
  position: absolute;

  left: 270px;
  top: 440px;

  transform:
    translateX(-50%);

  padding: 20px 38px;

  border-radius: 28px;

  background:
    rgba(255,255,255,.94);

  border:
    2px solid rgba(255,255,255,.8);

  color: #684d70;

  font-size: 29px;
  font-weight: 900;

  box-shadow:
    0 10px 25px rgba(78,43,58,.15);

  opacity: 0;

  transition:
    opacity .25s;

  pointer-events: none;
}

#message.show {
  opacity: 1;
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

  <!-- ТЕНЬ -->

  <div class="machine-shadow"></div>

  <!-- =================================================
       ЗАДАНИЕ
  ================================================== -->

  <div class="task">

    <div class="task-small">
      Поймай нужную игрушку
    </div>

    <div class="task-main">
      Найди звук <b>С</b><br>
      В СЕРЕДИНЕ слова
    </div>

  </div>

  <div class="progress">
    🧸 Раунд 1 из 10
  </div>

  <!-- =================================================
       АВТОМАТ
  ================================================== -->

  <div class="machine">

    <!-- ВЫВЕСКА -->

    <div class="machine-sign">
      ✦ ПОЙМАЙ ИГРУШКУ ✦
    </div>

    <!-- ЛАМПОЧКИ -->

    <div class="sign-lights">

      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>

      <div style="width:470px;"></div>

      <div class="light"></div>
      <div class="light"></div>
      <div class="light"></div>

    </div>

    <!-- =================================================
         СТЕКЛЯННАЯ ВИТРИНА
    ================================================== -->

    <div class="glass-frame">

      <div class="glass">

        <div class="machine-inside-back"></div>

        <!-- РЕЛЬС -->

        <div class="rail"></div>

        <!-- КЛЕШНЯ -->

        <div id="clawAssembly">

          <div class="claw-cart"></div>

          <div id="cable"></div>

          <div id="clawHead">

            <div class="claw-center"></div>

            <div class="claw-arm left">
              <div class="claw-tip"></div>
            </div>

            <div class="claw-arm right">
              <div class="claw-tip"></div>
            </div>

          </div>

        </div>

        <!-- =================================================
             ТРИ ИГРУШКИ
        ================================================== -->

        <div
          class="toy"
          data-slot="0"
          data-word="СОВА"
          data-emoji="🦉"
          data-correct="false"
        >
          <div class="toy-body">
            🦉
          </div>
        </div>

        <div
          class="toy"
          data-slot="1"
          data-word="ЛИСА"
          data-emoji="🦊"
          data-correct="true"
        >
          <div class="toy-body">
            🦊
          </div>
        </div>

        <div
          class="toy"
          data-slot="2"
          data-word="АНАНАС"
          data-emoji="🍍"
          data-correct="false"
        >
          <div class="toy-body">
            🍍
          </div>
        </div>

        <!-- ПОЛ -->

        <div class="toy-floor"></div>

        <!-- БЛИКИ -->

        <div class="glass-shine-one"></div>
        <div class="glass-shine-two"></div>

      </div>

    </div>

    <!-- =================================================
         НИЖНЯЯ ПАНЕЛЬ
    ================================================== -->

    <div class="lower-machine">

      <!-- СТРЕЛКИ -->

      <div class="control-panel">

        <div class="arrows">

          <button
            class="arrow-button"
            id="leftButton"
          >
            ←
          </button>

          <button
            class="arrow-button"
            id="rightButton"
          >
            →
          </button>

        </div>

      </div>

      <!-- КРАСНАЯ КНОПКА -->

      <div class="red-base">

        <button
          id="grabButton"
          aria-label="Поймать игрушку"
        ></button>

      </div>

      <div class="button-hint">
        ЛОВИ!
      </div>

      <!-- ВЫДАЧА -->

      <div class="prize-section">

        <div class="prize-label">
          ПРИЗ
        </div>

        <div id="prizeDoor">

          <div id="doorToy"></div>

        </div>

      </div>

    </div>

  </div>

  <!-- СООБЩЕНИЕ -->

  <div id="message"></div>

  <!-- =================================================
       БОЛЬШОЙ ПРИЗ
  ================================================== -->

  <div id="prizeOverlay">

    <div class="prize-card">

      <div id="bigPrizeEmoji">
        🦊
      </div>

      <div id="bigPrizeWord">
        ЛИСА
      </div>

      <button id="nextButton">
        ДАЛЬШЕ
      </button>

    </div>

  </div>

</div>

</div>

<script>

/* =====================================================
   МАСШТАБИРОВАНИЕ
===================================================== */

const GAME_W = 1920;
const GAME_H = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale = Math.min(
    window.innerWidth / GAME_W,
    window.innerHeight / GAME_H
  );

  viewport.style.width =
    GAME_W * scale + "px";

  viewport.style.height =
    GAME_H * scale + "px";

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawAssembly =
  document.getElementById(
    "clawAssembly"
  );

const clawHead =
  document.getElementById(
    "clawHead"
  );

const cable =
  document.getElementById(
    "cable"
  );

const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );

const grabButton =
  document.getElementById(
    "grabButton"
  );

const prizeDoor =
  document.getElementById(
    "prizeDoor"
  );

const doorToy =
  document.getElementById(
    "doorToy"
  );

const prizeOverlay =
  document.getElementById(
    "prizeOverlay"
  );

const bigPrizeEmoji =
  document.getElementById(
    "bigPrizeEmoji"
  );

const bigPrizeWord =
  document.getElementById(
    "bigPrizeWord"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const message =
  document.getElementById(
    "message"
  );

/* =====================================================
   ТРИ ПОЗИЦИИ КЛЕШНИ
===================================================== */

const SLOT_X = [
  70,
  277,
  484
];

let currentSlot = 1;

let busy = false;
let prizeReady = false;
let currentPrize = null;

/* =====================================================
   ПОЗИЦИЯ КЛЕШНИ
===================================================== */

function updateClawPosition() {

  clawAssembly.style.left =
    SLOT_X[currentSlot] + "px";

}

updateClawPosition();

/* =====================================================
   СТРЕЛКИ
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy || prizeReady) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();

    }

  }
);

rightButton.addEventListener(
  "click",
  () => {

    if (busy || prizeReady) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();

    }

  }
);

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

async function showMessage(text) {

  message.textContent = text;

  message.classList.add("show");

  await wait(950);

  message.classList.remove("show");

}

/* =====================================================
   ТЕКУЩАЯ ИГРУШКА
===================================================== */

function getCurrentToy() {

  return document.querySelector(
    `.toy[data-slot="${currentSlot}"]`
  );

}

/* =====================================================
   ОПУСКАЕМ КЛЕШНЮ
===================================================== */

async function lowerClaw() {

  clawHead.style.top =
    "380px";

  cable.style.height =
    "350px";

  await wait(680);

}

/* =====================================================
   КРАСНАЯ КНОПКА
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy || prizeReady) return;

    busy = true;

    const toy =
      getCurrentToy();

    if (!toy) {

      busy = false;
      return;

    }

    const correct =
      toy.dataset.correct === "true";

    /* =============================================
       ОПУСКАЕМ
    ============================================= */

    clawHead.classList.remove(
      "closed"
    );

    await lowerClaw();

    /* =============================================
       ЗАКРЫВАЕМ ЛАПКИ
    ============================================= */

    clawHead.classList.add(
      "closed"
    );

    await wait(300);

    /* =============================================
       ПОДЦЕПЛЯЕМ ИГРУШКУ
    ============================================= */

    toy.style.zIndex = "29";

    toy.style.top =
      "335px";

    await wait(300);

    /* =============================================
       ПОДНИМАЕМ
    ============================================= */

    clawHead.style.top =
      "105px";

    cable.style.height =
      "75px";

    toy.style.top =
      "65px";

    await wait(720);

    /* =============================================
       НЕПРАВИЛЬНЫЙ ОТВЕТ
    ============================================= */

    if (!correct) {

      await wait(250);

      /* лапки раскрываются */

      clawHead.classList.remove(
        "closed"
      );

      await wait(130);

      /* игрушка падает */

      toy.style.top =
        "390px";

      toy.style.transform =
        "rotate(11deg)";

      await wait(430);

      toy.style.transform =
        "rotate(-5deg)";

      await wait(130);

      toy.style.transform =
        "rotate(0deg)";

      await wait(180);

      toy.style.zIndex =
        "10";

      await showMessage(
        "Попробуй ещё!"
      );

      busy = false;

      return;
    }

    /* =============================================
       ПРАВИЛЬНЫЙ ОТВЕТ
    ============================================= */

    const dropX = 500;

    /* клешня едет вправо */

    clawAssembly.style.left =
      dropX + "px";

    toy.style.left =
      dropX + 20 + "px";

    await wait(800);

    /* =============================================
       ОТПУСКАЕМ ИГРУШКУ
    ============================================= */

    clawHead.classList.remove(
      "closed"
    );

    await wait(130);

    toy.style.top =
      "570px";

    toy.style.transform =
      "rotate(14deg) scale(.72)";

    await wait(500);

    toy.style.opacity =
      "0";

    await wait(250);

    /* =============================================
       ПРИЗ В ОКНЕ
    ============================================= */

    currentPrize = {
      word: toy.dataset.word,
      emoji: toy.dataset.emoji
    };

    doorToy.textContent =
      currentPrize.emoji;

    prizeDoor.classList.add(
      "ready"
    );

    prizeReady = true;

    /* =============================================
       КЛЕШНЯ ВОЗВРАЩАЕТСЯ
    ============================================= */

    currentSlot = 1;

    clawAssembly.style.left =
      SLOT_X[currentSlot] + "px";

    await wait(500);

    busy = false;

  }
);

/* =====================================================
   ЗАБИРАЕМ ИГРУШКУ
===================================================== */

prizeDoor.addEventListener(
  "click",
  () => {

    if (!prizeReady) return;

    bigPrizeEmoji.textContent =
      currentPrize.emoji;

    bigPrizeWord.textContent =
      currentPrize.word;

    prizeOverlay.style.display =
      "flex";

    createSparks();

  }
);

/* =====================================================
   КОНФЕТТИ
===================================================== */

function createSparks() {

  const card =
    document.querySelector(
      ".prize-card"
    );

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    const spark =
      document.createElement(
        "div"
      );

    spark.className =
      "spark";

    spark.style.left =
      "240px";

    spark.style.top =
      "260px";

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      150 +
      Math.random() * 230;

    spark.style.setProperty(
      "--x",
      Math.cos(angle) *
      distance +
      "px"
    );

    spark.style.setProperty(
      "--y",
      Math.sin(angle) *
      distance +
      "px"
    );

    card.appendChild(
      spark
    );

    setTimeout(
      () => spark.remove(),
      900
    );

  }

}

/* =====================================================
   ДАЛЬШЕ
===================================================== */

nextButton.addEventListener(
  "click",
  async () => {

    prizeOverlay.style.display =
      "none";

    prizeDoor.classList.remove(
      "ready"
    );

    doorToy.textContent =
      "";

    prizeReady = false;

    await showMessage(
      "Игрушка поймана! 🧸"
    );

  }
);

</script>

</body>
</html>
