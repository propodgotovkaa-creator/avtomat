<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: top left;
    background: url("fon.png") center / cover no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;
    left: 70px;
    top: 155px;
    width: 440px;
    padding: 24px 28px 26px;
    border-radius: 32px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 15px 40px rgba(77,67,72,.13);
    text-align: center;
    color: #40506a;
    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;
    width: 330px;
    height: 125px;
    margin: 15px auto 0;
    object-fit: contain;
    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;
    left: 95px;
    top: 400px;
    width: 390px;
    padding: 18px;
    border-radius: 26px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 12px 30px rgba(77,67,72,.10);
    text-align: center;
    color: #4c5870;
    font-size: 25px;
    font-weight: 900;
    z-index: 20;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;
    left: 55px;
    bottom: 52px;
    width: 465px;
    height: 352px;
    z-index: 25;
    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;
    left: 72px;
    top: 95px;
    width: 320px;
    height: 215px;
    overflow: visible;
    z-index: 2;
    pointer-events: none;
}

.pouch-toy {
    position: absolute;
    object-fit: contain;
    object-position: center bottom;
    transform-origin: center bottom;
    filter: drop-shadow(0 5px 4px rgba(45,35,40,.15));
    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;
    left: 570px;
    top: 60px;
    width: 1280px;
    height: 906px;
    z-index: 10;
}

#machineBack {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 1;
    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;
    left: 170px;
    top: 170px;
    width: 940px;
    height: 455px;
    overflow: hidden;
    z-index: 20;
}

/* =========================================================
   BALL PIT

   Шарики заканчиваются ДО шахты.
========================================================= */

.ball-layer {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 735px;
    height: 185px;

    overflow: hidden;

    pointer-events: none;
}

#ballPitBack {
    z-index: 44;
}

#ballPitFront {
    z-index: 64;
}

.ball {
    position: absolute;

    display: block;

    object-fit: contain;

    pointer-events: none;

    transform-origin: 50% 50%;

    will-change:
        transform,
        left,
        top;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(55,45,65,.10)
        );
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;
    left: 20px;
    top: 2px;
    width: 900px;
    height: 105px;
    object-fit: fill;
    z-index: 12;
    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;
    left: 295px;
    top: 5px;

    width: 170px;
    height: 445px;

    z-index: 80;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;
    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 84;

    pointer-events: none;
}

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 81;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;
    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px
        rgba(0,0,0,.2);

    z-index: 81;

    transition:
        height .92s
        cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;

    left: -77px;

    top:
        calc(
            var(--cable) - 10px
        );

    width: 160px;
    height: 180px;

    z-index: 82;

    transition:
        top .92s
        cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 83;

    pointer-events: none;
}

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        58px 15px;

    z-index: 82;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        14px 15px;

    z-index: 82;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   TOYS

   z-index 56:
   задние шарики 44
   игрушки 56
   передние шарики 64

   Поэтому игрушки действительно
   находятся ВНУТРИ шариков.
========================================================= */

.toy {
    position: absolute;

    bottom: 10px;

    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 56;

    pointer-events: none;

    transform-origin:
        50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

.toy.caught {
    z-index: 76;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}

.toy.dropping {
    z-index: 90;
}

/* =========================================================
   SHAFT
========================================================= */

#machineShaftEdge {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 95;

    pointer-events: none;
}

/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color:
        transparent;
}

#leftButton {
    left: 275px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;

    width: 150px;
    height: 140px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   SMALL PRIZE
========================================================= */

#prizeWindow {
    position: absolute;

    left: 948px;
    top: 690px;

    width: 170px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 160;

    pointer-events: none;
}

#prizeToy {
    position: relative;

    display: block;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position: center center;

    opacity: 0;

    transform:
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding:
        21px 40px;

    border: 0;

    border-radius: 28px;

    background: #ed5573;

    color: #fff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px
        rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform:
        translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;

    margin-top: 20px;

    padding:
        20px 38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color: #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;
}

</style>
</head>

function seededNumber(seed) {

    const x =
        Math.sin(
            seed * 999.91
        ) *
        43758.5453;

    return (
        x -
        Math.floor(x)
    );
}


/* =========================================================
   CREATE BALL
========================================================= */

function createBall(
    layer,
    x,
    y,
    size,
    imageIndex,
    depth,
    id
) {

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "ball";


    img.src =
        BALL_IMAGES[
            imageIndex %
            BALL_IMAGES.length
        ];


    img.draggable =
        false;


    img.style.left =
        `${x}px`;


    img.style.top =
        `${y}px`;


    img.style.width =
        `${size}px`;


    img.style.height =
        `${size}px`;


    /*
       Небольшой исходный поворот.

       Из-за этого одинаковые PNG
       не выглядят скопированными.
    */

    const baseRotation =
        (
            seededNumber(
                id + 30
            ) -
            .5
        ) *
        24;


    img.style.transform =
        `translate(0px,0px)
         rotate(${baseRotation}deg)`;


    layer.appendChild(
        img
    );


    BALLS.push({

        id,

        element: img,

        layer,

        depth,

        x,

        y,

        size,

        baseRotation,

        dx: 0,

        dy: 0,

        rotation:
            baseRotation

    });
}

/* =========================================================
   BALL CENTER
========================================================= */

function getBallCenterX(
    ball
) {

    return (
        ball.x +
        ball.size / 2
    );
}


/* =========================================================
   MOVE BALLS AROUND TOY

   Здесь шарики не "разъезжаются
   одной стеной".

   Каждый шарик получает:
   - свою дистанцию
   - свою скорость
   - своё вращение
   - своё направление
   - свой небольшой вертикальный ход

   Поэтому получается раскатывание.
========================================================= */

function moveBallsAroundToy(
    slot
) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width / 2;


    BALLS.forEach(
        (
            ball,
            index
        ) => {

            const centerX =
                getBallCenterX(
                    ball
                );


            const distance =
                centerX -
                toyCenterX;


            const absDistance =
                Math.abs(
                    distance
                );


            /*
               Радиус воздействия.

               Дальние шарики остаются
               практически на месте.
            */

            const radius =
                185;


            if (
                absDistance >
                radius
            ) {

                ball.dx =
                    0;

                ball.dy =
                    0;

                ball.rotation =
                    ball.baseRotation;


                return;
            }


            const power =
                1 -
                absDistance /
                radius;


            /*
               Направление от центра игрушки.
            */

            let direction;


            if (
                Math.abs(
                    distance
                ) <
                6
            ) {

                direction =
                    index % 2 === 0
                        ? -1
                        : 1;

            } else {

                direction =
                    distance < 0
                        ? -1
                        : 1;
            }


            /*
               Индивидуальные параметры.
            */

            const individuality =
                .82 +
                seededNumber(
                    ball.id + 100
                ) *
                .36;


            const rollDistance =
                (
                    28 +
                    78 *
                    power
                ) *
                individuality;


            let dx =
                direction *
                rollDistance;


            /*
               Передние шарики раскатываются
               чуть сильнее.
            */

            if (
                ball.depth ===
                "front"
            ) {

                dx *=
                    1.08;
            }


            /*
               Небольшое вертикальное движение.

               Часть шариков чуть поднимается,
               часть проседает.

               Это убирает эффект
               горизонтальной "шторки".
            */

            const verticalVariation =
                (
                    seededNumber(
                        ball.id + 210
                    ) -
                    .5
                ) *
                22;


            const dy =
                -8 *
                power +
                verticalVariation *
                power;


            /*
               Не выпускаем шарики
               за левую границу.
            */

            const futureX =
                ball.x +
                dx;


            if (
                futureX <
                0
            ) {

                dx =
                    -ball.x;
            }


            /*
               Не выпускаем шарики
               к шахте справа.
            */

            const maxX =
                BALL_PIT_WIDTH -
                ball.size -
                4;


            if (
                ball.x +
                dx >
                maxX
            ) {

                dx =
                    maxX -
                    ball.x;
            }


            ball.dx =
                dx;


            ball.dy =
                dy;


            /*
               Вращение связано с расстоянием,
               которое прокатывает шарик.

               Так он выглядит именно
               КАТЯЩИМСЯ.
            */

            const circumference =
                Math.PI *
                ball.size;


            const rollDegrees =
                circumference > 0
                    ? (
                        dx /
                        circumference
                    ) *
                    360
                    : 0;


            ball.rotation =
                ball.baseRotation +
                rollDegrees;


            /*
               У каждого шарика немного
               разная длительность.

               Ближние начинают быстрее,
               дальние реагируют мягче.
            */

            const duration =
                .34 +
                seededNumber(
                    ball.id + 300
                ) *
                .22;


            const delay =
                seededNumber(
                    ball.id + 400
                ) *
                .07;


            ball.element.style.transition =
                `transform ${duration}s
                 cubic-bezier(.18,.72,.28,1)
                 ${delay}s`;


            ball.element.style.transform =
                `translate(
                    ${ball.dx}px,
                    ${ball.dy}px
                 )
                 rotate(
                    ${ball.rotation}deg
                 )`;
        }
    );
}


/* =========================================================
   SETTLE BALLS

   Шарики возвращаются постепенно,
   а не все одновременно.
========================================================= */

function settleBalls() {

    BALLS.forEach(
        (
            ball,
            index
        ) => {

            const delay =
                50 +
                seededNumber(
                    ball.id + 500
                ) *
                180;


            setTimeout(
                () => {

                    const duration =
                        .52 +
                        seededNumber(
                            ball.id + 600
                        ) *
                        .22;


                    ball.element.style.transition =
                        `transform ${duration}s
                         cubic-bezier(.18,.72,.3,1)`;


                    ball.element.style.transform =
                        `translate(0px,0px)
                         rotate(${ball.baseRotation}deg)`;


                    ball.dx =
                        0;


                    ball.dy =
                        0;


                    ball.rotation =
                        ball.baseRotation;

                },
                delay
            );
        }
    );
}

    src
) {

        collectedToys.length;

        index >=
        POUCH_LAYOUT.length
    ) {
        return;
    }


    collectedToys.push(
        src
    );

        POUCH_LAYOUT[

    img.style.width =

    img.style.height =
        `${layout.height}px`;


    img.style.zIndex =
        String(
            layout.z
        );


    img.style.opacity =
        "0";


    img.style.transform =
        `translateY(-30px)
         rotate(${layout.rotate}deg)
         scale(.88)`;


    img.style.transition =
        "transform .48s cubic-bezier(.22,.8,.3,1.15), opacity .22s ease";


    pouchToys.appendChild(
        img
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    img.style.opacity =
                        "1";


                    img.style.transform =
                        `translateY(0)
                         rotate(${layout.rotate}deg)
                         scale(1)`;
                }
            );
        }
    );
}

function loadRound(
    index
) {

        ROUNDS[
            index
        ];


    waitingForPrize =
        false;


    taskScheme.src =
        round.scheme;


    progress.textContent =
        `🧸 Раунд ${index + 1} из ${ROUNDS.length}`;


    prizeToy.classList.remove(
        "show"
    );


    prizeToy.src =
        "";


    prizeToy.style.pointerEvents =
        "none";


    prizeOverlay.classList.remove(
        "show"
    );


    bigPrizeToy.src =
        "";


    nextButton.style.display =
        "block";


    finalText.style.display =
        "none";


    settleBalls();


    toys.forEach(
        (
            toy,
            toyIndex
        ) => {

            toy.src =
                round.toys[
                    toyIndex
                ];


            toy.dataset.correct =
                toyIndex ===
                round.correct
                    ? "true"
                    : "false";


            toy.dataset.grab =
                toyIndex === 0
                    ? "230"
                    : toyIndex === 1
                        ? "225"
                        : "220";


            toy.style.transition =
                "none";


            toy.style.opacity =
                "1";


            toy.style.top =
                "auto";


            toy.style.left =
                `${toyHome[toyIndex].left}px`;


            toy.style.bottom =
                `${toyHome[toyIndex].bottom}px`;


            toy.style.transform =
                "";


            toy.classList.remove(
                "caught",
                "dropping"
            );
        }
    );


    grabbedToy =
        null;


    currentSlot =
        1;


    setCable(
        CABLE_HOME
    );


    setClaw(
        "neutral"
    );


    updatePosition();
}


/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(
    element
) {

    const insideRect =
        machineInside
        .getBoundingClientRect();


    const rect =
        element
        .getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}


/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(
    toy
) {

    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy =
        toy;
}


/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const toyRect =
        getLocalRect(
            grabbedToy
        );


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    heldOffsetX =
        toyRect.left -
        anchorX;


    heldOffsetY =
        toyRect.top -
        anchorY;
}


/* =========================================================
   HELD TARGET
========================================================= */

function getHeldTarget() {

    if (
        !grabbedToy
    ) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW TOY
========================================================= */

function followToy() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const target =
        getHeldTarget();


    if (
        !target
    ) {
        return;
    }


    let currentLeft =
        parseFloat(
            grabbedToy
            .style
            .left
        );


    let currentTop =
        parseFloat(
            grabbedToy
            .style
            .top
        );


    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }


    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }


    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .42;


    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (
        followFrame !==
        null
    ) {

        cancelAnimationFrame(
            followFrame
        );


        followFrame =
            null;
    }
}


/* =========================================================
   LOWER CLAW

   Сначала клешня подходит к куче.

   Когда она входит в шарики,
   шарики начинают раскатываться.
========================================================= */

async function lowerClawToToy(
    toy
) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );


    setCable(
        grabDepth -
        32
    );


    await wait(
        700
    );


    /*
       Начинаем раскатывать шарики
       чуть ДО полного погружения клешни.
    */

    moveBallsAroundToy(
        currentSlot
    );


    await wait(
        80
    );


    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";


    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";


    setCable(
        grabDepth
    );


    await wait(
        540
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}

) {

    setClaw(

    await wait(

}

    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(
        450
    );


    await wait(
        260
    );


    await settleSwing(
        toy
    );
}


/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(
    toy
) {

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(
        760
    );


    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(
        470
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transition =
        "transform .15s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        220
    );
}


/* =========================================================
   SMOOTH DROP
========================================================= */

function animateSmoothDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const p =
                    Math.min(
                        (
                            now -
                            start
                        ) /
                        duration,
                        1
                    );


                /*
                   Постепенное ускорение,
                   как при падении.
                */

                const eased =
                    p *
                    p;


                const y =
                    startTop +
                    (
                        endTop -
                        startTop
                    ) *
                    eased;


                toy.style.top =
                    `${y}px`;


                toy.style.transform =
                    `rotate(${p * 2}deg)
                     scale(${1 - p * .025})`;


                if (
                    p <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );
        }
    );
}


/* =========================================================
   DROP INTO SHAFT
========================================================= */

async function dropIntoShaft(
    toy
) {

    stopFollowingToy();


    const before =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${before.left}px`;


    toy.style.top =
        `${before.top}px`;


    toy.style.bottom =
        "auto";


    toy.style.transform =
        "rotate(0deg)";


    /*
       Центрируем над шахтой.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width /
        2;


    toy.style.transition =
        "left .26s cubic-bezier(.22,.65,.35,1)";


    toy.style.left =
        `${fixedLeft}px`;


    await wait(
        280
    );


    const releaseTop =
        parseFloat(
            toy.style.top
        );


    /*
       После этого LEFT больше
       не меняется.
    */

    toy.style.transition =
        "none";


    toy.style.left =
        `${fixedLeft}px`;


    toy.style.top =
        `${releaseTop}px`;


    toy.classList.add(
        "dropping"
    );


    await wait(
        70
    );


    setClaw(
        "open"
    );


    await wait(
        180
    );


    /*
       Одно непрерывное падение.
    */

    await animateSmoothDrop(
        toy,
        releaseTop,
        releaseTop + 315,
        520
    );


    toy.style.opacity =
        "0";


    await wait(
        70
    );


    toy.classList.remove(
        "dropping"
    );
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(
    toy
) {

    await liftGrabbedToy();


    await settleSwing(
        toy
    );


    await moveToShaft(
        toy
    );


    await lowerOverShaft(
        toy
    );


    await dropIntoShaft(
        toy
    );


    /*
       Игрушка появляется по центру
       призовой полочки.
    */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    prizeToy.style.pointerEvents =
        "auto";


    waitingForPrize =
        true;


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    currentSlot =
        1;


    updatePosition();


    await wait(
        930
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_WRONG_LIFT
    );


    /*
       Шарики начинают скатываться
       обратно после выхода игрушки.
    */

    await wait(
        300
    );


    settleBalls();


    await wait(
        420
    );


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(
        150
    );


    setClaw(
        "open"
    );


    await wait(
        190
    );


    stopFollowingToy();


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    await wait(
        60
    );


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    const wrongLockedLeft =
        pos.left;


    toy.style.left =
        `${wrongLockedLeft}px`;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(
        440
    );


    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(
        90
    );


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(
        180
    );


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        150
    );


    /*
       Возвращаем игрушку
       в исходную позицию внутри шариков.
    */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught",
        "dropping"
    );


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }


        const toy =
            toys[
                currentSlot
            ];


        if (
            !toy
        ) {
            return;
        }


        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }


        busy =
            true;


        try {

            /*
               1. Открываем.
            */

            await openClaw();


            await wait(
                90
            );


            /*
               2. Опускаем.

               Шарики раскатываются
               при входе клешни.
            */

            await lowerClawToToy(
                toy
            );


            await wait(
                140
            );


            /*
               3. Захватываем.
            */

            await grabToyNaturally(
                toy
            );


            /*
               4. Проверяем.
            */

            const correct =
                toy.dataset.correct ===
                "true";


            if (
                correct
            ) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   CLICK SMALL PRIZE
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }


        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }


        const wonToySrc =
            prizeToy.src;


        prizeToy.style.pointerEvents =
            "none";


        bigPrizeToy.src =
            wonToySrc;


        prizeToy.classList.remove(
            "show"
        );


        addToyToPouch(
            wonToySrc
        );


        prizeOverlay.classList.add(
            "show"
        );


        if (
            roundIndex ===
            ROUNDS.length - 1
        ) {

            nextButton.style.display =
                "none";


            finalText.style.display =
                "block";
        }
    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length - 1
        ) {
            return;
        }


        nextButton.disabled =
            true;


        prizeOverlay.classList.remove(
            "show"
        );


        await wait(
            380
        );


        bigPrizeToy.src =
            "";


        roundIndex++;


        loadRound(
            roundIndex
        );


        nextButton.disabled =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

loadRound(
    roundIndex
);

</script>
