<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
    position: absolute;

    left: 115px;
    top: 145px;

    width: 520px;

    padding: 30px 35px;

    border-radius: 34px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 24px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 42px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 165px;
    top: 390px;

    width: 420px;

    padding: 20px;

    border-radius: 28px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 27px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
    position: absolute;

    left: 805px;
    top: 20px;

    width: 687px;
    height: 1030px;

    z-index: 10;
}


/* =========================================================
   BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   ВНУТРЕННЯЯ ЗОНА
========================================================= */

#machineInside {
    position: absolute;

    left: 80px;
    top: 164px;

    width: 527px;
    height: 507px;

    overflow: hidden;

    z-index: 10;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
    position: absolute;

    left: 22px;
    top: 20px;

    width: 480px;
    height: 12px;

    border-radius: 10px;

    background:
        linear-gradient(
            #f6f8f8,
            #7b878b 45%,
            #4f595e 65%,
            #d8dfe1
        );

    box-shadow:
        0 3px 4px rgba(0,0,0,.15);

    z-index: 12;
}


/* =========================================================
   КЛЕШНЯ
========================================================= */

#clawRig {
    --cable: 48px;

    position: absolute;

    left: 145px;
    top: 5px;

    width: 190px;
    height: 490px;

    z-index: 40;

    transition:
        left .88s cubic-bezier(.25,.65,.35,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 42;

    pointer-events: none;
}


/* =========================================================
   ТРОС
========================================================= */

#cableAnchor {
    position: absolute;

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 41;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .95s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   КОРПУС КЛЕШНИ
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 45;

    transition:
        top .95s cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


/* =========================================================
   ЛАПКИ
========================================================= */

#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;

    object-fit: contain;

    transform-origin: 66px 17px;

    z-index: 50;

    transition:
        transform .52s cubic-bezier(.34,1.08,.64,1);
}

#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;

    object-fit: contain;

    transform-origin: 16px 17px;

    z-index: 50;

    transition:
        transform .52s cubic-bezier(.34,1.08,.64,1);
}


/* обычное положение */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


/* открытая */

#clawAssembly.open #clawLeft {
    transform: rotate(29deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-29deg);
}


/* закрытая */

#clawAssembly.closed #clawLeft {
    transform: rotate(-20deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(20deg);
}


/* =========================================================
   ИГРУШКИ

   Теперь стоят ближе к переднему краю.

   Ананас отодвинут от отверстия.
========================================================= */

.toy {
    position: absolute;

    bottom: 18px;

    width: 104px;
    height: 116px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 22;

    pointer-events: none;

    transform-origin: 50% 18%;

    will-change: left, top, transform;

    filter:
        drop-shadow(
            0 7px 4px
            rgba(62,46,54,.16)
        );
}


/* собака */

#toy0 {
    left: 43px;
}


/* лиса */

#toy1 {
    left: 181px;
}


/* ананас:
   заметно левее отверстия */

#toy2 {
    left: 305px;
}


/* =========================================================
   ЗАХВАЧЕННАЯ ИГРУШКА
========================================================= */

.toy.caught {
    z-index: 38;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


/* =========================================================
   FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
    position: absolute;

    left: 80px;
    top: 164px;

    width: 527px;
    height: 507px;

    overflow: hidden;

    pointer-events: none;

    z-index: 90;
}

#glass::before {
    content: "";

    position: absolute;

    left: 45px;
    top: -120px;

    width: 54px;
    height: 760px;

    transform: rotate(17deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.13),
            transparent
        );
}


/* =========================================================
   КНОПКИ
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 154px;
    top: 735px;

    width: 82px;
    height: 72px;

    border-radius: 50%;
}

#rightButton {
    left: 240px;
    top: 735px;

    width: 82px;
    height: 72px;

    border-radius: 50%;
}

#grabButton {
    left: 367px;
    top: 720px;

    width: 96px;
    height: 96px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.92);
}


/* =========================================================
   ПРИЗ
========================================================= */

#prizeToy {
    position: absolute;

    left: 484px;
    top: 760px;

    width: 105px;
    height: 96px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>
</head>


<body>

<div id="viewport">

<div id="game">


    <!-- ===================================================
         ЗАДАНИЕ
    ==================================================== -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <!-- ===================================================
         АВТОМАТ
    ==================================================== -->

    <div id="machine">


        <!-- BACK -->

        <img
            id="machineBack"
            src="machine-back.png"
            alt=""
            draggable="false"
        >


        <!-- =================================================
             ВНУТРИ
        ================================================== -->

        <div id="machineInside">


            <div id="rail"></div>


            <!-- =============================================
                 КЛЕШНЯ
            ============================================== -->

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <!-- =============================================
                 ИГРУШКИ
            ============================================== -->

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                alt="Ананас"
                draggable="false"
            >


        </div>


        <!-- СТЕКЛО -->

        <div id="glass"></div>


        <!-- FRONT -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >


        <!-- ПРИЗ -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <!-- КНОПКИ -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>
</div>


<script>

/* =========================================================
   CONSTANTS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 527;
const INSIDE_HEIGHT = 507;


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   ПОЗИЦИИ КЛЕШНИ

   Под новые позиции игрушек.
========================================================= */

const SLOT_X = [

    0,

    138,

    262

];


/* =========================================================
   ШАХТА

   Центр клешни:
   rigX + 95.

   Шахта справа.
========================================================= */

const DROP_RIG_X = 335;


/* =========================================================
   ТРОС
========================================================= */

const CABLE_HOME = 48;


/*
   Клешня опускается так,
   чтобы лапки оказались вокруг верхней
   части игрушки, а не в её центре.
*/

const CABLE_GRAB = 246;


/*
   Первый маленький подъём.
*/

const CABLE_TENSION = 234;


/*
   Основной подъём.
*/

const CABLE_LIFT = 62;


/*
   Над шахтой.
*/

const CABLE_DROP = 242;


/*
   Для неправильной игрушки.
*/

const CABLE_WRONG_LIFT = 165;


/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(state);
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(420);
}


async function openClaw() {

    setClaw("open");

    await wait(520);
}


async function closeClaw() {

    setClaw("closed");

    await wait(520);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE RIG
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   BUTTONS
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot <= 0
        ) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot >= 2
        ) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   HOME POSITIONS
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);

        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)
        };
    });


/* =========================================================
   LOCAL POSITION
========================================================= */

function getToyLocalPosition(toy) {

    const insideRect =
        machineInside.getBoundingClientRect();

    const toyRect =
        toy.getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (toyRect.left - insideRect.left) /
            scale,

        top:
            (toyRect.top - insideRect.top) /
            scale
    };
}


/* =========================================================
   FREEZE TOY

   ВАЖНО:

   Мы НЕ перемещаем игрушку.

   Просто переводим её из bottom в top
   на том же самом визуальном месте.

   Поэтому никакого скачка быть не должно.
========================================================= */

function freezeToyExactlyWhereItIs(toy) {

    const position =
        getToyLocalPosition(toy);

    toy.style.transition = "none";

    toy.style.left =
        `${position.left}px`;

    toy.style.top =
        `${position.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add("caught");

    grabbedToy = toy;
}


/* =========================================================
   ТОЧКА, ГДЕ ИГРУШКА ВИСИТ

   Теперь игрушка находится НИЖЕ.

   Лапки держат её за верхнюю часть,
   а не "проглатывают" её внутрь.
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );


    const toyWidth =
        grabbedToy.offsetWidth;


    return {

        left:
            rigX +
            95 -
            toyWidth / 2,

        top:
            58 +
            cableLength +
            102
    };
}


/* =========================================================
   FOLLOW

   Вертикально игрушка следует достаточно точно.

   Горизонтально — немного запаздывает.
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }


    const target =
        getHeldTarget();


    if (!target) {
        return;
    }


    const currentLeft =
        parseFloat(
            grabbedToy.style.left
        );


    const currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .22;


    const nextTop =
        currentTop +
        (target.top - currentTop) * .38;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}


/* =========================================================
   ЗАТУХАЮЩИЙ МАЯТНИК
========================================================= */

async function swingAfterMove(toy) {

    toy.style.transition =
        "transform .16s ease-out";

    toy.style.transform =
        "rotate(-4deg)";

    await wait(160);


    toy.style.transition =
        "transform .22s ease-in-out";

    toy.style.transform =
        "rotate(3deg)";

    await wait(220);


    toy.style.transition =
        "transform .20s ease-in-out";

    toy.style.transform =
        "rotate(-1.5deg)";

    await wait(200);


    toy.style.transition =
        "transform .18s ease-out";

    toy.style.transform =
        "rotate(.5deg)";

    await wait(180);


    toy.style.transform =
        "rotate(0deg)";

    await wait(120);
}


/* =========================================================
   НАТЯЖЕНИЕ

   Это ключевой новый момент.

   Игрушка ещё НЕ следует за клешнёй.

   Клешня сначала поднимается совсем чуть-чуть.
========================================================= */

async function createTension(toy) {

    /*
       Игрушка остаётся на полу.
    */

    freezeToyExactlyWhereItIs(toy);


    /*
       Клешня начинает тянуть вверх.

       Разница всего 12 px.
    */

    setCable(
        CABLE_TENSION
    );


    /*
       Первые 100 мс игрушка вообще
       не двигается.
    */

    await wait(100);


    /*
       Затем появляется первое движение:
       всего 3 px вверх.

       Это момент зацепа лапок.
    */

    const currentTop =
        parseFloat(
            toy.style.top
        );


    toy.style.transition =
        "top .18s ease-out";


    toy.style.top =
        `${currentTop - 3}px`;


    await wait(180);


    /*
       Короткая механическая пауза.
    */

    await wait(90);


    toy.style.transition = "none";
}


/* =========================================================
   ПЛАВНЫЙ ОТРЫВ ОТ ПОЛА

   Теперь включаем follow.

   Игрушка начинает догонять клешню.
========================================================= */

async function liftToyNaturally(toy) {

    startFollowingToy();


    /*
       Основной подъём.
    */

    setCable(
        CABLE_LIFT
    );


    await wait(1020);


    /*
       Небольшое движение от инерции.
    */

    await swingAfterMove(toy);
}


/* =========================================================
   ОПУСКАНИЕ КЛЕШНИ

   Два этапа:

   быстро большая часть пути,
   медленно последние сантиметры.
========================================================= */

async function lowerClawNaturally() {

    /*
       Сначала почти до игрушки.
    */

    setCable(
        CABLE_GRAB - 28
    );


    await wait(780);


    /*
       Последние 28 px значительно медленнее.
    */

    cable.style.transition =
        "height .46s cubic-bezier(.22,.7,.35,1)";

    clawAssembly.style.transition =
        "top .46s cubic-bezier(.22,.7,.35,1)";


    setCable(
        CABLE_GRAB
    );


    await wait(470);


    /*
       Возвращаем обычную скорость.
    */

    cable.style.transition =
        "height .95s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .95s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function correctSequence(toy) {


    /* =====================================================
       1. НАТЯЖЕНИЕ

       Лапки уже закрыты.
       Игрушка ещё стоит на полу.
    ===================================================== */

    await createTension(toy);


    /* =====================================================
       2. ОТРЫВ И ПОДЪЁМ
    ===================================================== */

    await liftToyNaturally(toy);


    /* =====================================================
       3. ЕДЕМ К ШАХТЕ

       При старте игрушка немного
       отклоняется назад.
    ===================================================== */

    toy.style.transition =
        "transform .20s ease-out";

    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(520);


    /*
       Во время движения проходит
       через вертикаль.
    */

    toy.style.transition =
        "transform .25s ease-in-out";

    toy.style.transform =
        "rotate(1.8deg)";


    await wait(390);


    /*
       После остановки — затухание.
    */

    await swingAfterMove(toy);


    /* =====================================================
       4. ОПУСКАЕМ НАД ОТВЕРСТИЕМ
    ===================================================== */

    setCable(
        CABLE_DROP - 25
    );


    await wait(780);


    /*
       Последние 25 px медленно.
    */

    cable.style.transition =
        "height .42s ease-out";

    clawAssembly.style.transition =
        "top .42s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(430);


    cable.style.transition =
        "height .95s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .95s cubic-bezier(.37,0,.18,1)";


    /*
       Даём игрушке успокоиться.
    */

    toy.style.transform =
        "rotate(0deg)";


    await wait(140);


    /* =====================================================
       5. ОТПУСКАЕМ
    ===================================================== */

    setClaw("open");


    /*
       Пока лапки только начинают расходиться,
       игрушка ещё держится.
    */

    await wait(220);


    /*
       Теперь захват реально потерян.
    */

    stopFollowingToy();


    await wait(60);


    /* =====================================================
       6. ПАДЕНИЕ

       Без opacity в видимой части.

       machine-front сам перекрывает игрушку.
    ===================================================== */

    const currentTop =
        parseFloat(
            toy.style.top
        );


    const currentLeft =
        parseFloat(
            toy.style.left
        );


    /*
       Первые миллисекунды падения
       очень маленькие — старт гравитации.
    */

    toy.style.transition =
        "top .14s cubic-bezier(.45,.05,.7,.3)";


    toy.style.top =
        `${currentTop + 8}px`;


    await wait(140);


    /*
       Затем ускорение вниз.
    */

    toy.style.transition =
        "top .38s cubic-bezier(.42,.02,.86,.34), left .38s ease-in, transform .38s ease-in";


    toy.style.left =
        `${currentLeft + 3}px`;


    toy.style.top =
        `${currentTop + 160}px`;


    toy.style.transform =
        "rotate(6deg)";


    await wait(390);


    /*
       Уже за передней кромкой.
    */

    toy.style.transition =
        "top .26s cubic-bezier(.5,.02,.9,.3), transform .26s ease-in";


    toy.style.top =
        `${currentTop + 250}px`;


    toy.style.transform =
        "rotate(10deg) scale(.94)";


    await wait(270);


    /*
       Только теперь скрываем.
       В этот момент игрушка уже физически
       находится за front-слоем.
    */

    toy.style.opacity = "0";


    await wait(320);


    /* =====================================================
       7. ПРИЗ
    ===================================================== */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    await wait(650);


    /* =====================================================
       8. ПУСТАЯ КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    /* =====================================================
       9. В ЦЕНТР
    ===================================================== */

    currentSlot = 1;


    updatePosition();


    await wait(880);


    await neutralClaw();


    grabbedToy = null;
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    /*
       Тот же натуральный момент натяжения.
    */

    await createTension(toy);


    /*
       Теперь игрушка следует.
    */

    startFollowingToy();


    /*
       Поднимаем совсем немного.
    */

    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(720);


    /*
       Маленькое покачивание.
    */

    toy.style.transition =
        "transform .16s ease";

    toy.style.transform =
        "rotate(-2deg)";


    await wait(140);


    /*
       Лапки начинают раскрываться.
    */

    setClaw("open");


    await wait(210);


    /*
       Игрушка выпала.
    */

    stopFollowingToy();


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    /* =====================================================
       ПАДЕНИЕ НА ПОЛ
    ===================================================== */

    toy.style.transition =
        "top .42s cubic-bezier(.42,.02,.8,.34), transform .42s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(430);


    /* =====================================================
       МЯГКОЕ КАСАНИЕ ПОЛА
    ===================================================== */

    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(90);


    toy.style.transition =
        "transform .17s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.7deg) scaleY(1)";


    await wait(170);


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(150);


    /* =====================================================
       ВОЗВРАЩАЕМ ИСХОДНУЮ СИСТЕМУ КООРДИНАТ

       Визуально положение то же.
    ===================================================== */

    toy.style.transition = "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform = "";


    toy.classList.remove(
        "caught"
    );


    /* =====================================================
       КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    await neutralClaw();


    grabbedToy = null;
}


/* =========================================================
   КРАСНАЯ КНОПКА

   НОВАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ:

   1. раскрытие
   2. опускание
   3. замедление перед игрушкой
   4. закрытие лапок
   5. игрушка всё ещё неподвижна
   6. пауза
   7. натяжение
   8. отрыв
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }


        busy = true;


        try {


            /* =============================================
               1. РАСКРЫВАЕМ
            ============================================== */

            await openClaw();


            /*
               Механическая пауза.
            */

            await wait(110);


            /* =============================================
               2. ОПУСКАЕМ

               Последняя часть медленная.
            ============================================== */

            await lowerClawNaturally();


            /*
               Клешня остановилась вокруг игрушки.
            */

            await wait(120);


            /* =============================================
               3. ЗАКРЫВАЕМ ЛАПКИ

               ИГРУШКА ЗДЕСЬ ВООБЩЕ НЕ ДВИГАЕТСЯ.
            ============================================== */

            setClaw("closed");


            /*
               Лапки закрываются примерно 520 ms.

               Мы специально ждём почти всё движение.
            */

            await wait(470);


            /*
               Последняя часть закрытия.
            */

            await wait(80);


            /* =============================================
               4. ПАУЗА ПОСЛЕ ЗАХВАТА

               Очень важна визуально:
               видно, что лапки уже держат игрушку.
            ============================================== */

            await wait(150);


            /* =============================================
               5. ТЕПЕРЬ МОЖНО ПОДНИМАТЬ
            ============================================== */

            const correct =
                toy.dataset.correct === "true";


            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }


        } finally {

            busy = false;
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key === "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

prizeToy.src = "";

prizeToy.classList.remove(
    "show"
);


toys.forEach(
    toy => {

        toy.style.opacity = "1";
    }
);


setCable(
    CABLE_HOME
);

setClaw(
    "neutral"
);

currentSlot = 1;

updatePosition();

</script>
