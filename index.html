<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 28px 30px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 22px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 38px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   ШИРОКИЙ АВТОМАТ

   Исходник:
   1448 × 1086

   Здесь отображаем:
   1280 × 960

   Пропорции сохранены.
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 960px;

    z-index: 10;
}


/* =========================================================
   НИЖНИЙ СЛОЙ
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   ВНУТРЕННЯЯ КАМЕРА

   Координаты пересчитаны под wide-автомат.
========================================================= */

#machineInside {
    position: absolute;

    left: 100px;
    top: 150px;

    width: 1085px;
    height: 490px;

    overflow: hidden;

    z-index: 10;
}


/* =========================================================
   КЛЕШНЯ
========================================================= */

#clawRig {
    --cable: 45px;

    position: absolute;

    left: 398px;
    top: 20px;

    width: 190px;
    height: 460px;

    z-index: 40;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 42;

    pointer-events: none;
}


/* =========================================================
   ТРОС
========================================================= */

#cableAnchor {
    position: absolute;

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 41;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   КОРПУС КЛЕШНИ
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 45;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


/* =========================================================
   ЛАПКИ
========================================================= */

#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;

    object-fit: contain;

    transform-origin: 66px 17px;

    z-index: 50;

    transition:
        transform .50s cubic-bezier(.34,1.08,.64,1);
}

#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;

    object-fit: contain;

    transform-origin: 16px 17px;

    z-index: 50;

    transition:
        transform .50s cubic-bezier(.34,1.08,.64,1);
}


/* нейтрально */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


/* открыта */

#clawAssembly.open #clawLeft {
    transform: rotate(30deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-30deg);
}


/* закрыта */

#clawAssembly.closed #clawLeft {
    transform: rotate(-19deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(19deg);
}


/* =========================================================
   ИГРУШКИ

   Теперь они крупнее и стоят свободно.
========================================================= */

.toy {
    position: absolute;

    bottom: 22px;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 22;

    pointer-events: none;

    transform-origin: 50% 18%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}


/* СОБАКА */

#toy0 {
    left: 120px;
}


/* ЛИСА */

#toy1 {
    left: 435px;
}


/* АНАНАС

   Далеко от шахты.
*/

#toy2 {
    left: 700px;
}


/* =========================================================
   ЗАХВАЧЕННАЯ ИГРУШКА
========================================================= */

.toy.caught {
    z-index: 38;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


/* =========================================================
   FRONT

   Именно он перекрывает игрушку при падении.
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   КНОПКИ

   Невидимые кликабельные зоны
   поверх нарисованных кнопок.
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 230px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#rightButton {
    left: 410px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#grabButton {
    left: 690px;
    top: 700px;

    width: 160px;
    height: 150px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}


/* =========================================================
   ПРИЗ
========================================================= */

#prizeToy {
    position: absolute;

    left: 910px;
    top: 720px;

    width: 170px;
    height: 125px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>
</head>


<body>

<div id="viewport">

<div id="game">


    <!-- ===================================================
         ЗАДАНИЕ
    ==================================================== -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <!-- ===================================================
         АВТОМАТ
    ==================================================== -->

    <div id="machine">


        <!-- BACK -->

        <img
            id="machineBack"
            src="machine-back-wide.png"
            alt=""
            draggable="false"
        >


        <!-- =================================================
             ВСЁ, ЧТО НАХОДИТСЯ ВНУТРИ АВТОМАТА
        ================================================== -->

        <div id="machineInside">


            <!-- =============================================
                 КЛЕШНЯ
            ============================================== -->

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <!-- =============================================
                 ИГРУШКИ
            ============================================== -->

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                alt="Ананас"
                draggable="false"
            >

        </div>


        <!-- FRONT -->

        <img
            id="machineFront"
            src="machine-front-wide.png"
            alt=""
            draggable="false"
        >


        <!-- ПРИЗ -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <!-- КНОПКИ -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>
</div>


<script>

/* =========================================================
   ОСНОВНЫЕ РАЗМЕРЫ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 1085;
const INSIDE_HEIGHT = 490;


/* =========================================================
   RESPONSIVE SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );


    viewport.style.width =
        GAME_WIDTH * scale + "px";


    viewport.style.height =
        GAME_HEIGHT * scale + "px";


    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   ТОЧКИ ИГРУШЕК

   Центр клешни = rigX + 95.

   Центры игрушек:

   собака:
   120 + 67.5 = 187.5

   лиса:
   435 + 67.5 = 502.5

   ананас:
   700 + 67.5 = 767.5
========================================================= */

const SLOT_X = [

    93,

    408,

    673

];


/* =========================================================
   ШАХТА

   Шахта находится справа.

   Эта позиция отдельная от игрушек.
========================================================= */

const DROP_RIG_X = 835;


/* =========================================================
   ТРОС
========================================================= */

const CABLE_HOME = 42;


/*
   Почти до игрушки.
*/

const CABLE_APPROACH = 205;


/*
   Финальное медленное опускание.
*/

const CABLE_GRAB = 235;


/*
   Первое натяжение.
*/

const CABLE_TENSION = 224;


/*
   Полный подъём.
*/

const CABLE_LIFT = 55;


/*
   Над шахтой.
*/

const CABLE_DROP_APPROACH = 195;


/*
   Опущенная клешня над шахтой.
*/

const CABLE_DROP = 225;


/*
   Неправильная игрушка:
   небольшой подъём.
*/

const CABLE_WRONG_LIFT = 155;


/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   CLAW
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(400);
}


async function openClaw() {

    setClaw("open");

    await wait(500);
}


async function closeClaw() {

    setClaw("closed");

    await wait(500);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE CLAW
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   BUTTONS
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot <= 0
        ) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot >= 2
        ) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   ИСХОДНЫЕ ПОЗИЦИИ ИГРУШЕК
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);

        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)
        };
    });


/* =========================================================
   ФАКТИЧЕСКАЯ ЛОКАЛЬНАЯ ПОЗИЦИЯ
========================================================= */

function getToyLocalPosition(toy) {

    const insideRect =
        machineInside.getBoundingClientRect();


    const toyRect =
        toy.getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (toyRect.left - insideRect.left) /
            scale,

        top:
            (toyRect.top - insideRect.top) /
            scale
    };
}


/* =========================================================
   ЗАМОРАЖИВАЕМ ИГРУШКУ ТОЧНО НА МЕСТЕ

   НИКАКОГО СКАЧКА.

   Мы лишь переводим координаты
   bottom -> top.
========================================================= */

function freezeToy(toy) {

    const position =
        getToyLocalPosition(toy);


    toy.style.transition =
        "none";


    toy.style.left =
        `${position.left}px`;


    toy.style.top =
        `${position.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy = toy;
}


/* =========================================================
   ТОЧКА УДЕРЖАНИЯ

   Игрушка висит НИЖЕ лапок.

   Это принципиально важно:
   клешня не должна "проглатывать"
   картинку игрушки.
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );


    const toyWidth =
        grabbedToy.offsetWidth;


    return {

        left:
            rigX +
            95 -
            toyWidth / 2,

        top:
            58 +
            cableLength +
            95
    };
}


/* =========================================================
   ИГРУШКА СЛЕДУЕТ ЗА КЛЕШНЁЙ

   Не абсолютно жёстко.

   Это даёт ощущение веса.
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }


    const target =
        getHeldTarget();


    if (!target) {
        return;
    }


    const currentLeft =
        parseFloat(
            grabbedToy.style.left
        );


    const currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .20;


    const nextTop =
        currentTop +
        (target.top - currentTop) * .38;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}


/* =========================================================
   ОПУСКАНИЕ

   Сначала быстрее.

   Последние 30 px медленно.
========================================================= */

async function lowerClawNaturally() {


    setCable(
        CABLE_APPROACH
    );


    await wait(760);


    cable.style.transition =
        "height .48s cubic-bezier(.2,.72,.35,1)";


    clawAssembly.style.transition =
        "top .48s cubic-bezier(.2,.72,.35,1)";


    setCable(
        CABLE_GRAB
    );


    await wait(500);


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   НАТЯЖЕНИЕ

   Самый важный момент.

   Лапки уже закрыты.

   Игрушка всё ещё стоит.

   Сначала двигается ТОЛЬКО клешня.
========================================================= */

async function createTension(toy) {


    /*
       Фиксируем PNG на текущем месте.

       Визуально она вообще не двигается.
    */

    freezeToy(toy);


    /*
       Клешня чуть поднимается.
    */

    setCable(
        CABLE_TENSION
    );


    /*
       Игрушка ещё стоит.
    */

    await wait(120);


    /*
       Теперь появляется натяжение:
       всего 3 px вверх.
    */

    const top =
        parseFloat(
            toy.style.top
        );


    toy.style.transition =
        "top .18s ease-out";


    toy.style.top =
        `${top - 3}px`;


    await wait(180);


    /*
       Короткая пауза.

       Лапки держат вес игрушки.
    */

    await wait(100);


    toy.style.transition =
        "none";
}


/* =========================================================
   ПОДЪЁМ
========================================================= */

async function liftToy() {


    startFollowingToy();


    /*
       Плавный основной подъём.
    */

    setCable(
        CABLE_LIFT
    );


    await wait(1050);
}


/* =========================================================
   ЗАТУХАЮЩЕЕ ПОКАЧИВАНИЕ

   НЕ бесконечная анимация.
========================================================= */

async function settleSwing(toy) {


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(170);


    toy.style.transition =
        "transform .22s ease-in-out";


    toy.style.transform =
        "rotate(2.8deg)";


    await wait(220);


    toy.style.transition =
        "transform .20s ease-in-out";


    toy.style.transform =
        "rotate(-1.3deg)";


    await wait(200);


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(180);


    toy.style.transform =
        "rotate(0deg)";


    await wait(120);
}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function correctSequence(toy) {


    /* =====================================================
       1. НАТЯЖЕНИЕ
    ===================================================== */

    await createTension(toy);


    /* =====================================================
       2. ОТРЫВ ОТ ПОЛА
    ===================================================== */

    await liftToy();


    /*
       После подъёма небольшое движение.
    */

    await settleSwing(toy);


    /* =====================================================
       3. НАЧИНАЕМ ДВИЖЕНИЕ К ШАХТЕ

       Игрушка отклоняется назад.
    ===================================================== */

    toy.style.transition =
        "transform .20s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(470);


    /*
       Проходим через центр.
    */

    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(450);


    /*
       Остановка.
    */

    await settleSwing(toy);


    /* =====================================================
       4. ОПУСКАЕМСЯ К ШАХТЕ
    ===================================================== */

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(760);


    /*
       Последние сантиметры медленно.
    */

    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(470);


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transform =
        "rotate(0deg)";


    await wait(150);


    /* =====================================================
       5. ЛАПКИ ОТКРЫВАЮТСЯ

       Игрушка ещё мгновение удерживается.
    ===================================================== */

    setClaw(
        "open"
    );


    await wait(230);


    /* =====================================================
       6. ИГРУШКА ОТПУЩЕНА
    ===================================================== */

    stopFollowingToy();


    const currentTop =
        parseFloat(
            toy.style.top
        );


    const currentLeft =
        parseFloat(
            toy.style.left
        );


    /*
       Первые 8 px:
       начало свободного падения.
    */

    toy.style.transition =
        "top .13s ease-in";


    toy.style.top =
        `${currentTop + 8}px`;


    await wait(130);


    /*
       Теперь ускорение.
    */

    toy.style.transition =
        "top .38s cubic-bezier(.42,.02,.88,.35), transform .38s ease-in";


    toy.style.top =
        `${currentTop + 165}px`;


    toy.style.transform =
        "rotate(5deg)";


    await wait(390);


    /*
       Продолжаем вниз.

       machine-front-wide находится
       ПЕРЕД игрушкой.

       Поэтому розовый край шахты
       должен естественно её перекрыть.
    */

    toy.style.transition =
        "top .27s cubic-bezier(.5,.02,.92,.32), transform .27s ease-in";


    toy.style.top =
        `${currentTop + 275}px`;


    toy.style.transform =
        "rotate(9deg) scale(.94)";


    await wait(280);


    /*
       Только теперь opacity.

       Здесь игрушка уже должна быть
       полностью скрыта шахтой.
    */

    toy.style.opacity =
        "0";


    await wait(320);


    /* =====================================================
       7. ПОЯВЛЕНИЕ В ПРИЗЕ
    ===================================================== */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    await wait(650);


    /* =====================================================
       8. ПУСТАЯ КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    /* =====================================================
       9. ВОЗВРАЩАЕМ КЛЕШНЮ В ЦЕНТР
    ===================================================== */

    currentSlot = 1;


    updatePosition();


    await wait(930);


    await neutralClaw();


    grabbedToy = null;
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    /* =====================================================
       1. ТОТ ЖЕ НАТУРАЛЬНЫЙ ЗАХВАТ
    ===================================================== */

    await createTension(
        toy
    );


    startFollowingToy();


    /* =====================================================
       2. НЕМНОГО ПОДНИМАЕМ
    ===================================================== */

    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(700);


    /*
       Небольшое отклонение.
    */

    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(150);


    /* =====================================================
       3. КЛЕШНЯ ТЕРЯЕТ ИГРУШКУ
    ===================================================== */

    setClaw(
        "open"
    );


    await wait(220);


    stopFollowingToy();


    /* =====================================================
       4. ПАДЕНИЕ ОБРАТНО
    ===================================================== */

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(440);


    /* =====================================================
       5. МЯГКОЕ КАСАНИЕ ПОЛА
    ===================================================== */

    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(90);


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(180);


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(150);


    /* =====================================================
       6. ВОЗВРАЩАЕМ CSS-ПОЗИЦИЮ

       Визуально игрушка не прыгает.
    ===================================================== */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught"
    );


    /* =====================================================
       7. КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    await neutralClaw();


    grabbedToy = null;
}


/* =========================================================
   КРАСНАЯ КНОПКА
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }


        busy = true;


        try {


            /* =============================================
               1. РАСКРЫВАЕМ ЛАПКИ
            ============================================== */

            await openClaw();


            await wait(100);


            /* =============================================
               2. ОПУСКАЕМ

               Последняя часть пути медленная.
            ============================================== */

            await lowerClawNaturally();


            /*
               Клешня остановилась.
            */

            await wait(120);


            /* =============================================
               3. ЗАКРЫВАЕМ ЛАПКИ

               ИГРУШКА ПОКА НЕ ДВИГАЕТСЯ.
            ============================================== */

            setClaw(
                "closed"
            );


            /*
               Ждём фактического закрытия лапок.
            */

            await wait(520);


            /* =============================================
               4. КОРОТКАЯ ПАУЗА

               Теперь должно быть видно:
               лапки действительно держат игрушку.
            ============================================== */

            await wait(150);


            /* =============================================
               5. ТОЛЬКО ТЕПЕРЬ ПОДНИМАЕМ
            ============================================== */

            const correct =
                toy.dataset.correct === "true";


            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }


        } finally {

            busy = false;
        }
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key === "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

prizeToy.src =
    "";


prizeToy.classList.remove(
    "show"
);


toys.forEach(
    toy => {

        toy.style.opacity =
            "1";
    }
);


setCable(
    CABLE_HOME
);


setClaw(
    "neutral"
);


currentSlot =
    1;


updatePosition();

</script>
