<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;">

  <!-- 🔹 Игра 1 -->
  <div onclick="openGame('games/DifSSH/genially6aa6b4/index.html')" style="flex: 1 1 22%; max-width: 260px; min-width: 200px; cursor: pointer; background: #fff; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s;" onmouseover="this.style.transform='scale(1.03)'; this.style.boxShadow='0 8px 16px rgba(0,0,0,0.15)'" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 8px rgba(0,0,0,0.1)'">

    <img src="https://logolend.online/games/DifSSH/genially6aa6b4/01.png" alt="Игра 1" style="width: 100%; height: auto;">

      <h3 style="margin: 0 0 10px; font-size: 18px; text-align: center;">Рыбалка</h3>
      <p style="font-size: 13px; color: #555;">.</p>
      <div style="margin-top: 12px; text-align: center;">
        <div style="display: inline-block; background: #FFD600; color: black; padding: 8px 16px; border-radius: 8px; font-size: 16px;">Играть</div>

    </div>

</div>

<!-- 🪟 Модальное окно -->
<div id="gameModal" onclick="backgroundClick(event)" style="display:none; position: fixed; top: 0; left: 26%; width: 70vw; height: 90vh; background: white; z-index: 9999; box-shadow: 0 0 20px rgba(0,0,0,0.4); border-radius: 10px; overflow: hidden;">

  <!-- 🎮 Игра в iframe -->
  <iframe id="gameFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>

  <!-- ❌ Кнопка-крестик -->
  <div onclick="closeGame()" style="position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; background: #333; color: white; border-radius: 50%; font-size: 22px; line-height: 36px; text-align: center; cursor: pointer; box-shadow: 0 0 6px rgba(0,0,0,0.3); transition: background 0.2s;">
    ✕
  </div>
</div>

<!-- 🔧 Скрипт -->
<script>
  function openGame(gamePath) {
    document.getElementById('gameFrame').src = '/' + gamePath;
    document.getElementById('gameModal').style.display = 'block';
  }

  function closeGame() {
    document.getElementById('gameModal').style.display = 'none';
    document.getElementById('gameFrame').src = '';
  }

  function backgroundClick(event) {
    const iframe = document.getElementById('gameFrame');
    if (!iframe.contains(event.target)) {
      closeGame();
    }
  }
</script>
