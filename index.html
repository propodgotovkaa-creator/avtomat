<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

/* =====================================================
   БАЗА
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;

  background: #e9ddd5;

  font-family: "Trebuchet MS", Arial, sans-serif;

  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  background-image: url("fon.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* =====================================================
   ЗАДАНИЕ СЛЕВА
===================================================== */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding: 31px 38px;

  border-radius: 34px;

  background: rgba(255,255,255,.91);

  border: 3px solid rgba(255,255,255,.8);

  box-shadow:
    0 14px 35px rgba(87,68,71,.13);

  text-align: center;

  color: #40506a;

  backdrop-filter: blur(7px);
}

.task-small {
  font-size: 24px;
  font-weight: 800;

  opacity: .75;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #ed5573;
}

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px 30px;

  border-radius: 28px;

  background: rgba(255,255,255,.90);

  box-shadow:
    0 12px 30px rgba(87,68,71,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;
}

/* =====================================================
   ВЕСЬ АВТОМАТ

   ВАЖНО:
   machine.png является нашей системой координат.
===================================================== */

#machine {
  position: absolute;

  left: 790px;
  top: 30px;

  width: 730px;
  height: 1020px;

  z-index: 10;
}

/* =====================================================
   КОРПУС PNG
===================================================== */

.machine-image {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  z-index: 30;

  pointer-events: none;
}

/* =====================================================
   ВНУТРЕННЯЯ ИГРОВАЯ ЗОНА

   Она находится ПОД PNG-корпусом.
===================================================== */

#inside {
  position: absolute;

  left: 82px;
  top: 174px;

  width: 566px;
  height: 590px;

  overflow: hidden;

  z-index: 10;
}

/* лёгкий эффект стекла */

#inside::after {
  content: "";

  position: absolute;

  inset: 0;

  z-index: 100;

  pointer-events: none;

  background:
    linear-gradient(
      112deg,
      transparent 0%,
      transparent 14%,
      rgba(255,255,255,.16) 20%,
      transparent 27%,
      transparent 64%,
      rgba(255,255,255,.08) 69%,
      transparent 74%
    );
}

/* =====================================================
   РЕЛЬС
===================================================== */

#rail {
  position: absolute;

  left: 35px;
  top: 32px;

  width: 496px;
  height: 15px;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #dce2e4 20%,
      #929da2 55%,
      #626d72 78%,
      #d8dfe1 100%
    );

  border: 2px solid rgba(87,99,105,.55);

  box-shadow:
    0 4px 7px rgba(49,55,59,.17),
    inset 0 2px 2px rgba(255,255,255,.9);

  z-index: 5;
}

/* =====================================================
   ВЕСЬ ПОДВИЖНЫЙ МЕХАНИЗМ
===================================================== */

#clawSystem {
  position: absolute;

  left: 198px;
  top: 6px;

  width: 170px;
  height: 530px;

  z-index: 50;

  transition:
    left .28s cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   КАРЕТКА
===================================================== */

#clawCart {
  position: absolute;

  left: 35px;
  top: 0;

  width: 100px;
  height: 68px;

  object-fit: contain;

  z-index: 20;

  pointer-events: none;
}

/* =====================================================
   ТРОС
===================================================== */

#cable {
  position: absolute;

  left: 82px;
  top: 50px;

  width: 6px;
  height: 82px;

  border-radius: 6px;

  background:
    repeating-linear-gradient(
      135deg,
      #eeeeee 0px,
      #eeeeee 3px,
      #8b9599 3px,
      #8b9599 6px
    );

  box-shadow:
    1px 0 2px rgba(0,0,0,.20);

  z-index: 10;

  transition:
    height .72s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   САМА КЛЕШНЯ
===================================================== */

#claw {
  position: absolute;

  left: 25px;
  top: 125px;

  width: 120px;
  height: 170px;

  z-index: 30;

  transition:
    top .72s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   ЦЕНТРАЛЬНЫЙ КОРПУС КЛЕШНИ
===================================================== */

#clawBody {
  position: absolute;

  left: 38px;
  top: 0;

  width: 44px;
  height: 62px;

  object-fit: contain;

  z-index: 10;

  pointer-events: none;
}

/* =====================================================
   ЛЕВАЯ ЛАПКА
===================================================== */

#clawLeft {
  position: absolute;

  left: -1px;
  top: 35px;

  width: 72px;
  height: 132px;

  object-fit: contain;

  z-index: 8;

  pointer-events: none;

  transform-origin:
    59px 18px;

  transform:
    rotate(-7deg);

  transition:
    transform .32s
    cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   ПРАВАЯ ЛАПКА
===================================================== */

#clawRight {
  position: absolute;

  right: -1px;
  top: 35px;

  width: 72px;
  height: 132px;

  object-fit: contain;

  z-index: 8;

  pointer-events: none;

  transform-origin:
    13px 18px;

  transform:
    rotate(7deg);

  transition:
    transform .32s
    cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   ЗАКРЫТАЯ КЛЕШНЯ
===================================================== */

#claw.closed #clawLeft {
  transform:
    rotate(22deg);
}

#claw.closed #clawRight {
  transform:
    rotate(-22deg);
}

/* =====================================================
   ТЕСТОВЫЕ ИГРУШКИ

   Потом заменим их на PNG.
===================================================== */

.toy {
  position: absolute;

  bottom: 42px;

  width: 130px;
  height: 145px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 91px;

  z-index: 15;

  transform-origin:
    center bottom;

  transition:
    left .45s ease,
    top .65s ease,
    bottom .65s ease,
    transform .35s ease,
    opacity .3s ease;
}

.toy::before {
  content: "";

  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  width: 105px;
  height: 25px;

  border-radius: 50%;

  background:
    rgba(91,71,75,.12);

  filter:
    blur(5px);

  z-index: -1;
}

.toy[data-slot="0"] {
  left: 32px;
}

.toy[data-slot="1"] {
  left: 218px;
}

.toy[data-slot="2"] {
  left: 404px;
}

/* =====================================================
   НЕВИДИМЫЕ КЛИКАБЕЛЬНЫЕ КНОПКИ

   Они лежат поверх кнопок,
   нарисованных на machine.png.
===================================================== */

.hotspot {
  position: absolute;

  z-index: 80;

  padding: 0;
  margin: 0;

  border: 0;

  background:
    transparent;

  cursor: pointer;
}

/* ЛЕВАЯ */

#leftButton {
  left: 105px;
  top: 825px;

  width: 105px;
  height: 90px;

  border-radius: 50%;
}

/* ПРАВАЯ */

#rightButton {
  left: 225px;
  top: 825px;

  width: 105px;
  height: 90px;

  border-radius: 50%;
}

/* КРАСНАЯ */

#grabButton {
  left: 403px;
  top: 810px;

  width: 120px;
  height: 120px;

  border-radius: 50%;
}

/* эффект нажатия */

.hotspot::after {
  content: "";

  position: absolute;

  inset: 5px;

  border-radius: inherit;

  background:
    rgba(255,255,255,0);

  transition:
    background .1s,
    transform .1s;
}

.hotspot:active::after {
  background:
    rgba(0,0,0,.09);

  transform:
    scale(.90);
}

/* =====================================================
   ТЕСТОВАЯ ПОДСВЕТКА HOTSPOT

   Если понадобится проверить позиции кнопок,
   поменяй 0 на .25
===================================================== */

.hotspot {
  background:
    rgba(255,0,0,0);
}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

#message {
  position: absolute;

  left: 375px;
  top: 515px;

  transform:
    translateX(-50%)
    translateY(15px);

  z-index: 200;

  padding:
    18px 35px;

  border-radius:
    25px;

  background:
    rgba(255,255,255,.95);

  color:
    #536078;

  font-size:
    27px;

  font-weight:
    900;

  box-shadow:
    0 12px 30px
    rgba(75,56,64,.16);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .25s,
    transform .25s;
}

#message.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =====================================================
   ПОДСКАЗКА ДЛЯ ТЕСТА
===================================================== */

.test-label {
  position: absolute;

  right: 75px;
  bottom: 45px;

  padding:
    12px 20px;

  border-radius:
    20px;

  background:
    rgba(255,255,255,.65);

  color:
    rgba(70,70,80,.62);

  font-size:
    17px;

  font-weight:
    800;

  backdrop-filter:
    blur(5px);
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

  <!-- =================================================
       ЗАДАНИЕ
  ================================================== -->

  <div class="task">

    <div class="task-small">
      Поймай нужную игрушку
    </div>

    <div class="task-main">
      Найди звук <b>С</b><br>
      В СЕРЕДИНЕ слова
    </div>

  </div>

  <div class="progress">
    🧸 Раунд 1 из 10
  </div>

  <!-- =================================================
       АВТОМАТ
  ================================================== -->

  <div id="machine">

    <!-- ===============================================
         ВСЁ, ЧТО НАХОДИТСЯ ВНУТРИ ВИТРИНЫ
    ================================================ -->

    <div id="inside">

      <!-- РЕЛЬС -->

      <div id="rail"></div>

      <!-- =============================================
           ПОДВИЖНАЯ КЛЕШНЯ
      ============================================== -->

      <div id="clawSystem">

        <!-- КАРЕТКА -->

        <img
          id="clawCart"
          src="claw-cart.png"
          alt=""
          draggable="false"
        >

        <!-- ТРОС -->

        <div id="cable"></div>

        <!-- САМА КЛЕШНЯ -->

        <div id="claw">

          <img
            id="clawBody"
            src="claw-body.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawLeft"
            src="claw-left.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawRight"
            src="claw-right.png"
            alt=""
            draggable="false"
          >

        </div>

      </div>

      <!-- =============================================
           ТЕСТОВЫЕ ИГРУШКИ
      ============================================== -->

      <div
        class="toy"
        data-slot="0"
      >
        🦉
      </div>

      <div
        class="toy"
        data-slot="1"
      >
        🦊
      </div>

      <div
        class="toy"
        data-slot="2"
      >
        🍍
      </div>

    </div>

    <!-- ===============================================
         КРАСИВЫЙ PNG КОРПУС
    ================================================ -->

    <img
      class="machine-image"
      src="machine.png"
      alt=""
      draggable="false"
    >

    <!-- ===============================================
         НЕВИДИМЫЕ КНОПКИ
    ================================================ -->

    <button
      id="leftButton"
      class="hotspot"
      aria-label="Влево"
    ></button>

    <button
      id="rightButton"
      class="hotspot"
      aria-label="Вправо"
    ></button>

    <button
      id="grabButton"
      class="hotspot"
      aria-label="Поймать"
    ></button>

    <!-- СООБЩЕНИЕ -->

    <div id="message"></div>

  </div>

  <div class="test-label">
    Тест механизма клешни
  </div>

</div>

</div>

<script>

/* =====================================================
   МАСШТАБИРОВАНИЕ 1920 × 1080
===================================================== */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );

  viewport.style.width =
    GAME_WIDTH * scale + "px";

  viewport.style.height =
    GAME_HEIGHT * scale + "px";

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawSystem =
  document.getElementById(
    "clawSystem"
  );

const claw =
  document.getElementById(
    "claw"
  );

const cable =
  document.getElementById(
    "cable"
  );

const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );

const grabButton =
  document.getElementById(
    "grabButton"
  );

const message =
  document.getElementById(
    "message"
  );

/* =====================================================
   ТРИ ПОЗИЦИИ

   Эти значения потом точно подгоним
   под три настоящие игрушки.
===================================================== */

const SLOT_X = [
  13,
  199,
  385
];

let currentSlot = 1;

let busy = false;

/* =====================================================
   ОБНОВЛЕНИЕ ПОЗИЦИИ
===================================================== */

function updateClawPosition() {

  clawSystem.style.left =
    SLOT_X[currentSlot] +
    "px";

}

updateClawPosition();

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

async function showMessage(
  text
) {

  message.textContent =
    text;

  message.classList.add(
    "show"
  );

  await wait(900);

  message.classList.remove(
    "show"
  );

}

/* =====================================================
   СТРЕЛКА ВЛЕВО
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();

    }

  }
);

/* =====================================================
   СТРЕЛКА ВПРАВО
===================================================== */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();

    }

  }
);

/* =====================================================
   КРАСНАЯ КНОПКА

   ПОКА ЭТО ТЕСТ МЕХАНИЗМА:
   вниз → закрылась → вверх → раскрылась.
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy) return;

    busy = true;

    /* ---------------------------------------------
       УБЕЖДАЕМСЯ, ЧТО КЛЕШНЯ ОТКРЫТА
    --------------------------------------------- */

    claw.classList.remove(
      "closed"
    );

    await wait(150);

    /* ---------------------------------------------
       ОПУСКАЕМ ТРОС
    --------------------------------------------- */

    cable.style.height =
      "330px";

    claw.style.top =
      "373px";

    await wait(780);

    /* ---------------------------------------------
       ЗАКРЫВАЕМ ЛАПКИ
    --------------------------------------------- */

    claw.classList.add(
      "closed"
    );

    await wait(550);

    /* ---------------------------------------------
       ПОДНИМАЕМ
    --------------------------------------------- */

    cable.style.height =
      "82px";

    claw.style.top =
      "125px";

    await wait(780);

    /* ---------------------------------------------
       РАСКРЫВАЕМ
    --------------------------------------------- */

    claw.classList.remove(
      "closed"
    );

    await wait(350);

    busy = false;

  }
);

/* =====================================================
   КЛАВИАТУРА

   Можно тестировать:
   ←
   →
   ПРОБЕЛ
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "ArrowLeft"
    ) {

      leftButton.click();

    }

    if (
      event.key ===
      "ArrowRight"
    ) {

      rightButton.click();

    }

    if (
      event.code ===
      "Space"
    ) {

      event.preventDefault();

      grabButton.click();

    }

  }
);

</script>

</body>
</html>
