<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;

    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}


/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 28px 30px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 22px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 38px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   WIDE MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 960px;

    z-index: 10;
}


/* =========================================================
   BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 100px;
    top: 150px;

    width: 1085px;
    height: 490px;

    overflow: hidden;

    z-index: 10;
}


/* =========================================================
   CLAW RIG

   Сам rig только отвечает за движение.
   Не используем его как единый слой поверх игрушки.
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 408px;
    top: 20px;

    width: 170px;
    height: 465px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}


/* =========================================================
   CART
========================================================= */

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   CABLE
========================================================= */

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 34;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW ASSEMBLY

   Уменьшили примерно на 12%.
========================================================= */

#clawAssembly {
    position: absolute;

    left: -77px;

    top: calc(var(--cable) - 10px);

    width: 160px;
    height: 180px;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   BODY

   Корпус находится сзади игрушки.
========================================================= */

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 32;

    pointer-events: none;
}


/* =========================================================
   LEFT CLAW = ДАЛЬНЯЯ ЛАПКА

   Она будет ЗА игрушкой.
========================================================= */

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 58px 15px;

    z-index: 31;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   RIGHT CLAW = БЛИЖНЯЯ ЛАПКА

   Она находится ПЕРЕД игрушкой.
========================================================= */

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 14px 15px;

    z-index: 55;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}


#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}


/* =========================================================
   TOYS

   Игрушка находится:

   - ПЕРЕД body + left claw
   - ЗА right claw

========================================================= */

.toy {
    position: absolute;

    bottom: 22px;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 40;

    pointer-events: none;

    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}


/* СОБАКА */

#toy0 {
    left: 120px;
}


/* ЛИСА */

#toy1 {
    left: 435px;
}


/* АНАНАС

   Был 700.
   Уводим заметно левее от шахты.
*/

#toy2 {
    left: 650px;
}


/* =========================================================
   CAUGHT TOY
========================================================= */

.toy.caught {
    z-index: 40;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


/* =========================================================
   ВАЖНО

   Когда идёт захват, передняя лапка должна
   оставаться поверх игрушки.

   Сам body и левая лапка остаются позади.
========================================================= */

#clawRig.grabbing #clawBody {
    z-index: 32;
}

#clawRig.grabbing #clawLeft {
    z-index: 31;
}

#clawRig.grabbing #clawRight {
    z-index: 55;
}


/* =========================================================
   FRONT MACHINE
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   BUTTONS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 230px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#rightButton {
    left: 410px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#grabButton {
    left: 690px;
    top: 700px;

    width: 160px;
    height: 150px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}


/* =========================================================
   PRIZE
========================================================= */

#prizeToy {
    position: absolute;

    left: 910px;
    top: 720px;

    width: 170px;
    height: 125px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <div id="machine">


        <!-- BACK -->

        <img
            id="machineBack"
            src="machine-back-wide.png"
            alt=""
            draggable="false"
        >


        <!-- =================================================
             INNER MACHINE
        ================================================== -->

        <div id="machineInside">


            <!-- =================================================
                 CLAW
            ================================================== -->

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <!--
                            BODY + LEFT находятся сзади.
                        -->

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <!--
                            RIGHT находится впереди.
                        -->

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <!-- =================================================
                 TOYS
            ================================================== -->

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                data-grab="244"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                data-grab="238"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                data-grab="230"
                alt="Ананас"
                draggable="false"
            >


        </div>


        <!-- FRONT -->

        <img
            id="machineFront"
            src="machine-front-wide.png"
            alt=""
            draggable="false"
        >


        <!-- PRIZE -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <!-- CONTROLS -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>


<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 1085;
const INSIDE_HEIGHT = 490;


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );


    viewport.style.width =
        GAME_WIDTH * scale + "px";


    viewport.style.height =
        GAME_HEIGHT * scale + "px";


    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   CLAW POSITIONS

   Клешня стала немного меньше.

   Её центр теперь:
   rigX + 85px.
========================================================= */

const SLOT_X = [

    102,

    417,

    632

];


/* =========================================================
   DROP CHUTE
========================================================= */

const DROP_RIG_X = 845;


/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME = 42;

const CABLE_LIFT = 52;

const CABLE_DROP_APPROACH = 190;

const CABLE_DROP = 220;

const CABLE_WRONG_LIFT = 145;


/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );


    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(380);
}


async function openClaw() {

    setClaw("open");

    await wait(460);
}


async function closeClaw() {

    setClaw("closed");

    await wait(470);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE CLAW
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   LEFT / RIGHT
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot <= 0
        ) {
            return;
        }


        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot >= 2
        ) {
            return;
        }


        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   HOME POSITIONS
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);


        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)

        };
    });


/* =========================================================
   LOCAL TOY POSITION
========================================================= */

function getToyLocalPosition(toy) {

    const insideRect =
        machineInside.getBoundingClientRect();


    const toyRect =
        toy.getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (toyRect.left - insideRect.left) /
            scale,

        top:
            (toyRect.top - insideRect.top) /
            scale

    };
}


/* =========================================================
   FREEZE TOY EXACTLY WHERE IT IS

   Никакого визуального перемещения.
========================================================= */

function freezeToy(toy) {

    const pos =
        getToyLocalPosition(toy);


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy = toy;
}


/* =========================================================
   HELD TARGET

   Теперь игрушка не затягивается высоко
   внутрь клешни.

   Она висит ниже.
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );


    const toyWidth =
        grabbedToy.offsetWidth;


    return {

        left:
            rigX +
            85 -
            toyWidth / 2,

        top:
            52 +
            cableLength +
            92

    };
}


/* =========================================================
   FOLLOW

   ВЕРТИКАЛЬНО:
   почти жёстко.

   ГОРИЗОНТАЛЬНО:
   немного отстаёт -> появляется масса.
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }


    const target =
        getHeldTarget();


    if (!target) {
        return;
    }


    const currentLeft =
        parseFloat(
            grabbedToy.style.left
        );


    const currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    /*
       Горизонтальная инерция.
    */

    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .22;


    /*
       По вертикали держим гораздо жёстче.
    */

    const nextTop =
        currentTop +
        (target.top - currentTop) * .72;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}


/* =========================================================
   НАТУРАЛЬНОЕ ОПУСКАНИЕ

   Глубина берётся ИНДИВИДУАЛЬНО
   для каждой игрушки.
========================================================= */

async function lowerClawToToy(toy) {


    const grabDepth =
        Number(
            toy.dataset.grab
        );


    /*
       Большая часть пути.
    */

    setCable(
        grabDepth - 32
    );


    await wait(760);


    /*
       Последние 32 px медленно.

       Теперь хорошо видно,
       как клешня подходит непосредственно
       к игрушке.
    */

    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";


    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";


    setCable(
        grabDepth
    );


    await wait(540);


    /*
       Возвращаем обычную скорость.
    */

    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   НАСТОЯЩИЙ МОМЕНТ ЗАХВАТА

   НОВАЯ СХЕМА:

   1. клешня уже стоит вокруг игрушки
   2. игрушка неподвижна
   3. лапки закрываются
   4. никаких -3px
   5. никаких tension
   6. никаких коррекций
========================================================= */

async function grabToyNaturally(toy) {


    /*
       С этого момента PNG переводим
       в top-координаты.

       ВИЗУАЛЬНО она остаётся точно там же.
    */

    freezeToy(
        toy
    );


    /*
       Включаем глубину:

       левая лапка -> за игрушкой
       правая -> перед игрушкой.
    */

    clawRig.classList.add(
        "grabbing"
    );


    /*
       Лапки начинают закрываться.

       Игрушка НЕ ДВИГАЕТСЯ.
    */

    setClaw(
        "closed"
    );


    await wait(470);


    /*
       Короткая пауза.

       Теперь визуально видно,
       что лапки действительно обхватили PNG.
    */

    await wait(120);
}


/* =========================================================
   ПОДЪЁМ

   Теперь никакого отдельного натяжения.

   Клешня и игрушка начинают движение
   как одна система.
========================================================= */

async function liftGrabbedToy() {


    /*
       Сразу запускаем слежение.
    */

    startFollowingToy();


    /*
       И одновременно поднимаем клешню.
    */

    setCable(
        CABLE_LIFT
    );


    await wait(1050);
}


/* =========================================================
   КАЧАНИЕ

   ОСТАВЛЯЕМ — ОНО ТЕБЕ ПОНРАВИЛОСЬ.
========================================================= */

async function settleSwing(toy) {


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(170);


    toy.style.transition =
        "transform .22s ease-in-out";


    toy.style.transform =
        "rotate(2.8deg)";


    await wait(220);


    toy.style.transition =
        "transform .20s ease-in-out";


    toy.style.transform =
        "rotate(-1.3deg)";


    await wait(200);


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(180);


    toy.style.transform =
        "rotate(0deg)";


    await wait(120);
}


/* =========================================================
   CORRECT SEQUENCE
========================================================= */

async function correctSequence(toy) {


    /* =====================================================
       1. ПОДНИМАЕМ

       Захват уже произошёл.
    ===================================================== */

    await liftGrabbedToy();


    /* =====================================================
       2. НЕБОЛЬШОЕ КАЧАНИЕ ПОСЛЕ ПОДЪЁМА
    ===================================================== */

    await settleSwing(
        toy
    );


    /* =====================================================
       3. ДВИЖЕНИЕ К ШАХТЕ
    ===================================================== */

    toy.style.transition =
        "transform .20s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(470);


    /*
       Инерция проходит через центр.
    */

    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(450);


    /*
       Успокаиваемся.
    */

    await settleSwing(
        toy
    );


    /* =====================================================
       4. ОПУСКАНИЕ К ШАХТЕ
    ===================================================== */

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(760);


    /*
       Последние 30 px медленно.
    */

    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(470);


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transform =
        "rotate(0deg)";


    await wait(130);


    /* =====================================================
       5. ОТПУСКАЕМ
    ===================================================== */

    setClaw(
        "open"
    );


    /*
       Лапки начинают отходить.
    */

    await wait(210);


    /*
       Теперь игрушка действительно свободна.
    */

    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    const currentTop =
        parseFloat(
            toy.style.top
        );


    /* =====================================================
       6. ПАДЕНИЕ

       Первый момент очень короткий.
    ===================================================== */

    toy.style.transition =
        "top .13s ease-in";


    toy.style.top =
        `${currentTop + 8}px`;


    await wait(130);


    /*
       Основное ускорение.
    */

    toy.style.transition =
        "top .38s cubic-bezier(.42,.02,.88,.35), transform .38s ease-in";


    toy.style.top =
        `${currentTop + 165}px`;


    toy.style.transform =
        "rotate(5deg)";


    await wait(390);


    /*
       Уходит глубже в шахту.
    */

    toy.style.transition =
        "top .27s cubic-bezier(.5,.02,.92,.32), transform .27s ease-in";


    toy.style.top =
        `${currentTop + 275}px`;


    toy.style.transform =
        "rotate(9deg) scale(.94)";


    await wait(280);


    /*
       Теперь уже скрыта front-слоем.
    */

    toy.style.opacity =
        "0";


    await wait(320);


    /* =====================================================
       7. PRIZE
    ===================================================== */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    await wait(650);


    /* =====================================================
       8. CLAW UP
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    /* =====================================================
       9. RETURN TO CENTER
    ===================================================== */

    currentSlot =
        1;


    updatePosition();


    await wait(930);


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG SEQUENCE
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    /* =====================================================
       1. ПОДНИМАЕМ НЕМНОГО
    ===================================================== */

    startFollowingToy();


    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(720);


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(150);


    /* =====================================================
       2. КЛЕШНЯ ТЕРЯЕТ ИГРУШКУ
    ===================================================== */

    setClaw(
        "open"
    );


    await wait(210);


    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    /* =====================================================
       3. ПАДЕНИЕ НА ПОЛ
    ===================================================== */

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(440);


    /* =====================================================
       4. МЯГКОЕ КАСАНИЕ
    ===================================================== */

    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(90);


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(180);


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(150);


    /* =====================================================
       5. HOME
    ===================================================== */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught"
    );


    /* =====================================================
       6. CLAW UP
    ===================================================== */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }


        busy =
            true;


        try {


            /* =============================================
               1. ОТКРЫВАЕМ ЛАПКИ
            ============================================== */

            await openClaw();


            await wait(90);


            /* =============================================
               2. ОПУСКАЕМ ТОЧНО К ЭТОЙ ИГРУШКЕ

               У каждой своя глубина.
            ============================================== */

            await lowerClawToToy(
                toy
            );


            /*
               Очень короткая остановка
               непосредственно у игрушки.
            */

            await wait(140);


            /* =============================================
               3. ЗАХВАТ

               Игрушка неподвижна.

               Одна лапка сзади.
               Другая спереди.
            ============================================== */

            await grabToyNaturally(
                toy
            );


            /* =============================================
               4. ВЫБИРАЕМ РЕЗУЛЬТАТ
            ============================================== */

            const correct =
                toy.dataset.correct === "true";


            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }


        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key === "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

prizeToy.src =
    "";


prizeToy.classList.remove(
    "show"
);


toys.forEach(
    toy => {

        toy.style.opacity =
            "1";
    }
);


setCable(
    CABLE_HOME
);


setClaw(
    "neutral"
);


currentSlot =
    1;


updatePosition();

</script>
