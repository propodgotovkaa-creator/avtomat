<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: top left;
    background: url("fon.png") center / cover no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;
    left: 70px;
    top: 155px;
    width: 440px;
    padding: 24px 28px 26px;
    border-radius: 32px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 15px 40px rgba(77,67,72,.13);
    text-align: center;
    color: #40506a;
    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;
    width: 330px;
    height: 125px;
    margin: 15px auto 0;
    object-fit: contain;
    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;
    left: 95px;
    top: 400px;
    width: 390px;
    padding: 18px;
    border-radius: 26px;
    background: rgba(255,255,255,.92);
    box-shadow: 0 12px 30px rgba(77,67,72,.10);
    text-align: center;
    color: #4c5870;
    font-size: 25px;
    font-weight: 900;
    z-index: 20;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;
    left: 55px;
    bottom: 52px;
    width: 465px;
    height: 352px;
    z-index: 25;
    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;
    left: 72px;
    top: 95px;
    width: 320px;
    height: 215px;
    overflow: visible;
    z-index: 2;
    pointer-events: none;
}

.pouch-toy {
    position: absolute;
    object-fit: contain;
    object-position: center bottom;
    transform-origin: center bottom;
    filter: drop-shadow(0 5px 4px rgba(45,35,40,.15));
    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;
    left: 570px;
    top: 60px;
    width: 1280px;
    height: 906px;
    z-index: 10;
}

#machineBack {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 1;
    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;
    left: 170px;
    top: 170px;
    width: 940px;
    height: 455px;
    overflow: hidden;
    z-index: 20;
}

/* =========================================================
   BALL PIT
========================================================= */

/*
   Шарики существуют только в этой области.

   ВАЖНО:
   ширина заканчивается ДО шахты.
   Поэтому шарики физически не могут
   заехать на розовый бортик и отверстие.
*/

#ballPit {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 735px;
    height: 160px;
    overflow: hidden;
    z-index: 42;
    pointer-events: none;
}

.ball {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;

    box-shadow:
        inset -5px -7px 9px rgba(80,70,100,.10),
        inset 5px 5px 7px rgba(255,255,255,.52),
        0 3px 5px rgba(70,60,80,.08);

    will-change: transform;

    transition:
        transform .48s cubic-bezier(.22,.75,.32,1);
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;
    left: 20px;
    top: 2px;
    width: 900px;
    height: 105px;
    object-fit: fill;
    z-index: 12;
    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;
    left: 295px;
    top: 5px;
    width: 170px;
    height: 445px;
    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;
    left: 31px;
    top: 0;
    width: 108px;
    height: 74px;
    object-fit: contain;
    z-index: 34;
    pointer-events: none;
}

#cableAnchor {
    position: absolute;
    left: 82px;
    top: 52px;
    width: 6px;
    z-index: 31;
}

#cable {
    position: absolute;
    left: 0;
    top: 0;
    width: 6px;
    height: var(--cable);
    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow: 1px 0 2px rgba(0,0,0,.2);
    z-index: 31;

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;
    left: -77px;
    top: calc(var(--cable) - 10px);
    width: 160px;
    height: 180px;
    z-index: 32;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;
    left: 42px;
    top: 0;
    width: 77px;
    object-fit: contain;
    z-index: 33;
    pointer-events: none;
}

#clawLeft {
    position: absolute;
    left: 20px;
    top: 53px;
    width: 72px;
    object-fit: contain;
    transform-origin: 58px 15px;
    z-index: 32;

    transition:
        transform .46s cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;
    left: 68px;
    top: 53px;
    width: 72px;
    object-fit: contain;
    transform-origin: 14px 15px;
    z-index: 32;

    transition:
        transform .46s cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;
    bottom: 18px;
    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    /*
       Игрушки выше шариков.
    */
    z-index: 58;

    pointer-events: none;
    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(0 8px 5px rgba(62,46,54,.16));
}

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

.toy.caught {
    z-index: 58;
    filter:
        drop-shadow(0 6px 5px rgba(45,35,40,.14));
}

.toy.dropping {
    z-index: 70;
}

/* =========================================================
   SHAFT
========================================================= */

#machineShaftEdge {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 75;
    pointer-events: none;
}

/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 100;
    pointer-events: none;
}

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    z-index: 150;
    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 275px;
    top: 690px;
    width: 125px;
    height: 110px;
    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;
    width: 125px;
    height: 110px;
    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;
    width: 150px;
    height: 140px;
    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   SMALL PRIZE
========================================================= */

/*
   Это контейнер ТОЧНО над окошком приза.
   Картинка внутри всегда центрируется.
*/

#prizeWindow {
    position: absolute;
    left: 948px;
    top: 690px;
    width: 170px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 160;

    pointer-events: none;
}

#prizeToy {
    position: relative;

    display: block;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position: center center;

    opacity: 0;

    transform:
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;
    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;
    inset: 0;
    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(55,48,55,.30);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;
    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;
    transform: translateY(0) scale(1);
}

#bigPrizeToy {
    display: block;
    width: 390px;
    height: 390px;
    object-fit: contain;

    filter:
        drop-shadow(0 22px 18px rgba(55,45,50,.22));

    animation:
        prizeFloat 2.2s ease-in-out infinite;
}

@keyframes prizeFloat {
    0%,
    100% {
        transform: translateY(0) rotate(-1deg);
    }

    50% {
        transform: translateY(-13px) rotate(1deg);
    }
}

#nextButton {
    margin-top: 16px;
    min-width: 330px;
    padding: 21px 40px;
    border: 0;
    border-radius: 28px;

    background: #ed5573;
    color: #fff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform: translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;
    margin-top: 20px;
    padding: 20px 38px;
    border-radius: 28px;
    background: rgba(255,255,255,.96);
    color: #40506a;
    font-size: 32px;
    font-weight: 900;
    text-align: center;
}
</style>
</head>

<body>

<div id="viewport">
<div id="game">

    <div class="task">
        <div class="task-small">Найди:</div>

        <img
            id="taskScheme"
            class="task-scheme"
            src="scheme-s-middle.png"
            alt=""
            draggable="false"
        >
    </div>

    <div class="progress" id="progress">
        🧸 Раунд 1 из 8
    </div>

    <div id="pouch">

        <img
            id="pouchBack"
            src="pouch-back-final-v4.png"
            alt=""
            draggable="false"
        >

        <div id="pouchToys"></div>

        <img
            id="pouchFront"
            src="pouch-front-transparent-v4.png"
            alt=""
            draggable="false"
        >

    </div>

    <div id="machine">

        <img
            id="machineBack"
            src="machine-back-pastel-v2.png"
            alt=""
            draggable="false"
        >

        <div id="machineInside">

            <img
                id="clawRail"
                src="claw-rail.png"
                alt=""
                draggable="false"
            >

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >

                <div id="cableAnchor">

                    <div id="cable"></div>

                    <div
                        id="clawAssembly"
                        class="neutral"
                    >
                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >
                    </div>

                </div>

            </div>

            <!-- ШАРИКИ -->

            <div id="ballPit"></div>

            <!-- ИГРУШКИ -->

            <img class="toy" id="toy0" src="" alt="" draggable="false">
            <img class="toy" id="toy1" src="" alt="" draggable="false">
            <img class="toy" id="toy2" src="" alt="" draggable="false">

        </div>

        <img
            id="machineShaftEdge"
            src="machine-shaft-lip-pastel-v2.png"
            alt=""
            draggable="false"
        >

        <img
            id="machineFront"
            src="machine-front-pastel-v2.png"
            alt=""
            draggable="false"
        >

        <!-- ПРИЗОВОЕ ОКНО -->

        <div id="prizeWindow">
            <img
                id="prizeToy"
                src=""
                alt=""
                draggable="false"
            >
        </div>

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>

        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>

        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>

    </div>

    <div id="prizeOverlay">

        <div id="bigPrizeWrap">

            <img
                id="bigPrizeToy"
                src=""
                alt=""
                draggable="false"
            >

            <button id="nextButton">
                ИГРАТЬ ДАЛЬШЕ
            </button>

            <div id="finalText">
                Отличная работа! 🧸
            </div>

        </div>

    </div>

</div>
</div>

<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 940;
const INSIDE_HEIGHT = 455;

/* =========================================================
   ROUNDS
========================================================= */

const ROUNDS = [

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/sobaka.png",
            "toy/lisa.png",
            "toy/ananas.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-start.png",
        toys: [
            "toy/kaktus.png",
            "toy/koleso.png",
            "toy/sova.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/kapusta.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-start.png",
        toys: [
            "toy/nosok.png",
            "toy/lisa.png",
            "toy/som.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/avtobus.png",
            "toy/chesnok.png",
            "toy/sobaka.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/som.png",
            "toy/kapusta.png",
            "toy/kaktus.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/samolet.png",
            "toy/sunduk.png",
            "toy/koleso.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/samolet.png"
        ],
        correct: 1
    }

];

/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");

function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}

window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();

/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const ballPit =
    document.getElementById("ballPit");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");

const taskScheme =
    document.getElementById("taskScheme");

const progress =
    document.getElementById("progress");

const prizeOverlay =
    document.getElementById("prizeOverlay");

const bigPrizeToy =
    document.getElementById("bigPrizeToy");

const nextButton =
    document.getElementById("nextButton");

const finalText =
    document.getElementById("finalText");

const pouchToys =
    document.getElementById("pouchToys");

const toys = [
    document.getElementById("toy0"),
    document.getElementById("toy1"),
    document.getElementById("toy2")
];

/* =========================================================
   POSITIONS
========================================================= */

const SLOT_X = [
    45,
    295,
    545
];

const DROP_RIG_X = 735;

const SHAFT_DROP_CENTER_X = 810;

/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME = 42;
const CABLE_LIFT = 52;
const CABLE_DROP_APPROACH = 165;
const CABLE_DROP = 205;
const CABLE_WRONG_LIFT = 140;

/* =========================================================
   STATE
========================================================= */

let roundIndex = 0;
let currentSlot = 1;
let busy = false;
let grabbedToy = null;

let followFrame = null;

let heldOffsetX = 0;
let heldOffsetY = 0;

let waitingForPrize = false;

const collectedToys = [];

/* =========================================================
   WAIT
========================================================= */

function wait(ms) {
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

/* =========================================================
   BALLS
========================================================= */

const BALL_COLORS = [
    "#f5b9c8",
    "#f8dc83",
    "#b8dcb8",
    "#c8bce8",
    "#b9d8ec",
    "#f4c6d8",
    "#d4e5ad"
];

const BALL_DATA = [];

function createBalls() {

    ballPit.innerHTML = "";
    BALL_DATA.length = 0;

    /*
       Раскладка сделана вручную,
       чтобы шарики выглядели как куча,
       а не как ровная сетка.

       Последний X специально далеко
       от шахты.
    */

    const rows = [

        {
            y: 99,
            balls: [
                [5,58],
                [61,56],
                [119,60],
                [181,55],
                [239,59],
                [300,57],
                [360,60],
                [421,56],
                [481,59],
                [542,57],
                [603,59],
                [665,55]
            ]
        },

        {
            y: 51,
            balls: [
                [25,57],
                [86,61],
                [150,56],
                [209,59],
                [270,55],
                [329,61],
                [394,56],
                [452,60],
                [515,56],
                [575,60],
                [638,56]
            ]
        },

        {
            y: 8,
            balls: [
                [0,55],
                [63,57],
                [127,58],
                [193,54],
                [254,59],
                [319,55],
                [383,58],
                [449,55],
                [512,59],
                [578,55],
                [641,57]
            ]
        }

    ];

    let colorIndex = 0;

    rows.forEach(
        (row, rowIndex) => {

            row.balls.forEach(
                ([x, size], index) => {

                    const ball =
                        document.createElement("div");

                    ball.className =
                        "ball";

                    ball.style.left =
                        `${x}px`;

                    ball.style.top =
                        `${row.y}px`;

                    ball.style.width =
                        `${size}px`;

                    ball.style.height =
                        `${size}px`;

                    ball.style.background =
                        BALL_COLORS[
                            colorIndex %
                            BALL_COLORS.length
                        ];

                    ballPit.appendChild(ball);

                    BALL_DATA.push({
                        element: ball,
                        x,
                        y: row.y,
                        size,
                        row: rowIndex,
                        index,
                        dx: 0,
                        dy: 0,
                        rotation: 0
                    });

                    colorIndex++;
                }
            );
        }
    );
}

/* =========================================================
   BALL MOVEMENT

   Каждый шарик получает собственное
   смещение в зависимости от расстояния
   до выбранной игрушки.
========================================================= */

function moveBallsAroundToy(slot) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width / 2;

    BALL_DATA.forEach(
        ball => {

            const center =
                ball.x +
                ball.size / 2;

            const distance =
                center - toyCenterX;

            const absDistance =
                Math.abs(distance);

            /*
               Дальние шарики почти
               не двигаются.
            */

            if (absDistance > 185) {

                ball.dx = 0;
                ball.dy = 0;
                ball.rotation = 0;

            } else {

                /*
                   Чем ближе шарик
                   к игрушке, тем сильнее
                   его отталкивает.
                */

                const power =
                    1 -
                    absDistance / 185;

                let direction;

                if (Math.abs(distance) < 5) {

                    /*
                       Центральные шарики
                       чередуем в разные стороны.
                    */

                    direction =
                        ball.index % 2 === 0
                            ? -1
                            : 1;

                } else {

                    direction =
                        distance < 0
                            ? -1
                            : 1;
                }

                const individual =
                    0.78 +
                    ((ball.index * 17 + ball.row * 11) % 28) / 100;

                ball.dx =
                    direction *
                    (18 + 46 * power) *
                    individual;

                /*
                   Некоторые шарики чуть
                   подпрыгивают.
                */

                ball.dy =
                    -(4 + 15 * power) *
                    (
                        .72 +
                        ((ball.index * 13) % 24) / 100
                    );

                ball.rotation =
                    direction *
                    (
                        5 +
                        14 * power
                    );
            }

            /*
               Не разрешаем шарикам
               выйти за бассейн.
            */

            const futureLeft =
                ball.x + ball.dx;

            const minLeft = 0;

            const maxLeft =
                735 -
                ball.size -
                5;

            if (futureLeft < minLeft) {

                ball.dx =
                    minLeft -
                    ball.x;
            }

            if (futureLeft > maxLeft) {

                ball.dx =
                    maxLeft -
                    ball.x;
            }

            ball.element.style.transition =
                `transform ${
                    .34 +
                    ((ball.index * 7) % 16) / 100
                }s cubic-bezier(.22,.75,.32,1)`;

            ball.element.style.transform =
                `translate(
                    ${ball.dx}px,
                    ${ball.dy}px
                 )
                 rotate(
                    ${ball.rotation}deg
                 )`;
        }
    );
}

/* =========================================================
   BALLS SETTLE

   Шарики возвращаются не одновременно.
========================================================= */

function settleBalls() {

    BALL_DATA.forEach(
        ball => {

            const delay =
                ((ball.index * 19) % 120);

            setTimeout(
                () => {

                    ball.element.style.transition =
                        `${
                            .52 +
                            ((ball.index * 11) % 18) / 100
                        }s cubic-bezier(.18,.72,.3,1)`;

                    ball.element.style.transform =
                        "translate(0px,0px) rotate(0deg)";

                    ball.dx = 0;
                    ball.dy = 0;
                    ball.rotation = 0;

                },
                delay
            );
        }
    );
}

/* =========================================================
   RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside.getBoundingClientRect();

    const rect =
        element.getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (rect.left - insideRect.left) /
            scale,

        top:
            (rect.top - insideRect.top) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}

/* =========================================================
   FREEZE
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add("caught");

    grabbedToy = toy;
}

/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (!grabbedToy) {
        return;
    }

    const toyRect =
        getLocalRect(grabbedToy);

    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    heldOffsetX =
        toyRect.left -
        anchorX;

    heldOffsetY =
        toyRect.top -
        anchorY;
}

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    return {
        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}

/* =========================================================
   FOLLOW
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }

    const target =
        getHeldTarget();

    if (!target) {
        return;
    }

    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );

    if (!Number.isFinite(currentLeft)) {
        currentLeft = target.left;
    }

    if (!Number.isFinite(currentTop)) {
        currentTop = target.top;
    }

    const nextLeft =
        currentLeft +
        (target.left - currentLeft) *
        .42;

    const nextTop =
        currentTop +
        (target.top - currentTop) *
        .92;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(
            followToy
        );
}

function startFollowingToy() {

    stopFollowingToy();

    followToy();
}

function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}

/* =========================================================
   SMOOTH DROP
========================================================= */

function animateSmoothDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();

            function frame(now) {

                const progress =
                    Math.min(
                        (now - start) /
                        duration,
                        1
                    );

                /*
                   Ускорение вниз.
                */

                const eased =
                    progress * progress;

                const y =
                    startTop +
                    (endTop - startTop) *
                    eased;

                toy.style.top =
                    `${y}px`;

                /*
                   Небольшой естественный
                   наклон, но БЕЗ изменения X.
                */

                toy.style.transform =
                    `rotate(${progress * 2}deg)
                     scale(${1 - progress * .025})`;

                if (progress < 1) {

                    requestAnimationFrame(frame);

                } else {

                    resolve();
                }
            }

            requestAnimationFrame(frame);
        }
    );
}

/* =========================================================
   DROP
========================================================= */

async function dropIntoShaft(toy) {

    stopFollowingToy();

    const before =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${before.left}px`;

    toy.style.top =
        `${before.top}px`;

    toy.style.bottom =
        "auto";

    toy.style.transform =
        "rotate(0deg)";

    /*
       Центр шахты.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width / 2;

    toy.style.transition =
        "left .26s cubic-bezier(.22,.65,.35,1)";

    toy.style.left =
        `${fixedLeft}px`;

    await wait(280);

    const releaseTop =
        parseFloat(
            toy.style.top
        );

    toy.style.transition =
        "none";

    /*
       X фиксируется один раз.
    */

    toy.style.left =
        `${fixedLeft}px`;

    toy.style.top =
        `${releaseTop}px`;

    toy.classList.add(
        "dropping"
    );

    await wait(70);

    setClaw("open");

    await wait(180);

    /*
       ОДНО непрерывное падение.

       Никаких фаз и пауз.
       LEFT больше вообще
       не изменяется.
    */

    await animateSmoothDrop(
        toy,
        releaseTop,
        releaseTop + 315,
        520
    );

    toy.style.opacity =
        "0";

    await wait(70);

    toy.classList.remove(
        "dropping"
    );
}

    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }

        const toy =
            toys[currentSlot];

        if (!toy) {
            return;
        }

        if (
            getComputedStyle(toy).opacity ===
            "0"
        ) {
            return;
        }

        busy = true;

        try {

            await openClaw();

            await wait(90);

            await lowerClawToToy(toy);

            await wait(140);

            await grabToyNaturally(toy);

            const correct =
                toy.dataset.correct ===
                "true";

            if (correct) {

                await correctSequence(toy);

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy = false;
        }
    }
);

            rightButton.click();
        }

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);

/* =========================================================
   START
========================================================= */

loadRound(
    roundIndex
);

</script>
