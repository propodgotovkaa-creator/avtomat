<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 28px 30px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 22px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 38px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 960px;

    z-index: 10;
}

/* =========================================================
   BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 100px;
    top: 150px;

    width: 1085px;
    height: 490px;

    overflow: hidden;

    z-index: 10;
}

/* =========================================================
   SHAFT MASK

   Это НЕ картинка.

   Это невидимое окно прямо поверх
   чёрного отверстия.

   Всё, что находится внутри него,
   видно ТОЛЬКО в пределах дырки.
========================================================= */

#shaftMask {
    position: absolute;

    /*
       Координаты самой чёрной области
       внутри machineInside.
    */

    left: 805px;
    top: 365px;

    width: 190px;
    height: 105px;

    overflow: hidden;

    z-index: 46;

    pointer-events: none;
}

/*
   Копия падающей игрушки.
*/

#shaftToy {
    position: absolute;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    left: 27px;
    top: -145px;

    opacity: 0;

    transform-origin: 50% 16%;

    pointer-events: none;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(20,15,20,.15)
        );
}

/* =========================================================
   CLAW RIG
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 408px;
    top: 20px;

    width: 170px;
    height: 465px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}

/* =========================================================
   CART
========================================================= */

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}

/* =========================================================
   CABLE
========================================================= */

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 34;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}

/* =========================================================
   CLAW ASSEMBLY
========================================================= */

#clawAssembly {
    position: absolute;

    left: -77px;

    top: calc(var(--cable) - 10px);

    width: 160px;
    height: 180px;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}

/* =========================================================
   CLAW BODY
========================================================= */

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 32;

    pointer-events: none;
}

/* =========================================================
   LEFT CLAW
========================================================= */

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 58px 15px;

    z-index: 31;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

/* =========================================================
   RIGHT CLAW
========================================================= */

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 14px 15px;

    z-index: 55;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;

    bottom: 22px;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 40;

    pointer-events: none;

    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

#toy0 {
    left: 120px;
}

#toy1 {
    left: 435px;
}

#toy2 {
    left: 650px;
}

.toy.caught {
    z-index: 40;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}

/* =========================================================
   FRONT MACHINE
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}

/* =========================================================
   BUTTONS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 230px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#rightButton {
    left: 410px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#grabButton {
    left: 690px;
    top: 700px;

    width: 160px;
    height: 150px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   PRIZE
========================================================= */

#prizeToy {
    position: absolute;

    left: 910px;
    top: 720px;

    width: 170px;
    height: 125px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>

</head>

<body>

<div id="viewport">

<div id="game">

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>

    <div class="progress">
        🧸 Раунд 1 из 10
    </div>

    <div id="machine">

        <img
            id="machineBack"
            src="machine-back-wide.png"
            alt=""
            draggable="false"
        >

        <div id="machineInside">

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >

                <div id="cableAnchor">

                    <div id="cable"></div>

                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                data-grab="244"
                alt="Собака"
                draggable="false"
            >

            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                data-grab="238"
                alt="Лиса"
                draggable="false"
            >

            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                data-grab="230"
                alt="Ананас"
                draggable="false"
            >

            <!--
                НЕВИДИМОЕ ОКНО ЧЁРНОЙ ШАХТЫ
            -->

            <div id="shaftMask">

                <img
                    id="shaftToy"
                    src=""
                    alt=""
                    draggable="false"
                >

            </div>

        </div>

        <img
            id="machineFront"
            src="machine-front-wide.png"
            alt=""
            draggable="false"
        >

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>

        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>

        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>

    </div>

</div>

</div>

<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 1085;
const INSIDE_HEIGHT = 490;

/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");

function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}

window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();

/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");

const shaftMask =
    document.getElementById("shaftMask");

const shaftToy =
    document.getElementById("shaftToy");

const toys = [
    document.getElementById("toy0"),
    document.getElementById("toy1"),
    document.getElementById("toy2")
];

/* =========================================================
   POSITIONS
========================================================= */

const SLOT_X = [
    102,
    417,
    632
];

/*
   Центр отверстия:
   shaftMask left 805
   width 190

   центр = 900
*/

const SHAFT_CENTER_X = 900;

/*
   rig имеет точку захвата примерно
   на x + 85.

   Поэтому:
   900 - 85 = 815
*/

const DROP_RIG_X = 815;

/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME = 42;

const CABLE_LIFT = 52;

/*
   Над шахтой специально НЕ опускаем
   игрушку слишком глубоко.

   Сначала она должна висеть НАД отверстием.
*/

const CABLE_DROP_APPROACH = 125;

const CABLE_DROP = 155;

const CABLE_WRONG_LIFT = 145;

/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;

let heldOffsetX = 0;
let heldOffsetY = 0;

/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}

/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}

async function neutralClaw() {

    setClaw("neutral");

    await wait(380);
}

async function openClaw() {

    setClaw("open");

    await wait(460);
}

/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}

/* =========================================================
   MOVE
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}

function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}

/* =========================================================
   CONTROLS
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot <= 0
        ) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);

rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot >= 2
        ) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);

/* =========================================================
   HOME POSITIONS
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);

        return {
            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)
        };
    });

/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside.getBoundingClientRect();

    const rect =
        element.getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (rect.left - insideRect.left) /
            scale,

        top:
            (rect.top - insideRect.top) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}

/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "caught"
    );

    grabbedToy =
        toy;
}

/* =========================================================
   CAPTURE OFFSET
========================================================= */

function captureHeldOffset() {

    if (!grabbedToy) {
        return;
    }

    const toyRect =
        getLocalRect(grabbedToy);

    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    heldOffsetX =
        toyRect.left - anchorX;

    heldOffsetY =
        toyRect.top - anchorY;
}

/* =========================================================
   HELD TARGET
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    return {
        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}

/* =========================================================
   FOLLOW
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }

    const target =
        getHeldTarget();

    if (!target) {
        return;
    }

    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );

    if (!Number.isFinite(currentLeft)) {
        currentLeft = target.left;
    }

    if (!Number.isFinite(currentTop)) {
        currentTop = target.top;
    }

    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .32;

    const nextTop =
        currentTop +
        (target.top - currentTop) * .92;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(
            followToy
        );
}

function startFollowingToy() {

    stopFollowingToy();

    followToy();
}

function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}

/* =========================================================
   LOWER TO TOY
========================================================= */

async function lowerClawToToy(toy) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );

    setCable(
        grabDepth - 32
    );

    await wait(760);

    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";

    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";

    setCable(
        grabDepth
    );

    await wait(540);

    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}

/* =========================================================
   GRAB
========================================================= */

async function grabToyNaturally(toy) {

    freezeToy(
        toy
    );

    clawRig.classList.add(
        "grabbing"
    );

    setClaw(
        "closed"
    );

    await wait(470);

    await wait(90);

    captureHeldOffset();
}

/* =========================================================
   LIFT
========================================================= */

async function liftGrabbedToy() {

    startFollowingToy();

    await wait(32);

    setCable(
        CABLE_LIFT
    );

    await wait(1050);
}

/* =========================================================
   SWING
========================================================= */

async function settleSwing(toy) {

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-4deg)";

    await wait(170);

    toy.style.transition =
        "transform .22s ease-in-out";

    toy.style.transform =
        "rotate(2.8deg)";

    await wait(220);

    toy.style.transition =
        "transform .20s ease-in-out";

    toy.style.transform =
        "rotate(-1.3deg)";

    await wait(200);

    toy.style.transition =
        "transform .18s ease-out";

    toy.style.transform =
        "rotate(.4deg)";

    await wait(180);

    toy.style.transform =
        "rotate(0deg)";

    await wait(120);
}

/* =========================================================
   MOVE TO SHAFT
========================================================= */

async function moveToShaft(toy) {

    toy.style.transition =
        "transform .20s ease-out";

    toy.style.transform =
        "rotate(-4deg)";

    moveRigTo(
        DROP_RIG_X
    );

    await wait(470);

    toy.style.transition =
        "transform .28s ease-in-out";

    toy.style.transform =
        "rotate(2deg)";

    await wait(450);

    await wait(120);

    await settleSwing(
        toy
    );
}

/* =========================================================
   LOWER ABOVE SHAFT
========================================================= */

async function lowerOverShaft(toy) {

    setCable(
        CABLE_DROP_APPROACH
    );

    await wait(700);

    cable.style.transition =
        "height .42s ease-out";

    clawAssembly.style.transition =
        "top .42s ease-out";

    setCable(
        CABLE_DROP
    );

    await wait(430);

    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";

    toy.style.transition =
        "transform .15s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(220);
}

/* =========================================================
   REAL SHAFT DROP
========================================================= */

async function dropIntoShaft(toy) {

    /*
       1. Открываем клешню.
    */

    setClaw(
        "open"
    );

    await wait(190);

    /*
       2. Отцепляем.
    */

    stopFollowingToy();

    clawRig.classList.remove(
        "grabbing"
    );

    /*
       3. Фиксируем реальное положение.
    */

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.style.transform =
        "rotate(0deg)";

    /*
       Центрируем игрушку непосредственно
       над центром шахты.
    */

    const targetLeft =
        SHAFT_CENTER_X -
        pos.width / 2;

    await wait(40);

    /*
       4. Сначала игрушка падает
       ОБЫЧНО и полностью видна.

       Она движется к верхнему краю дырки.
    */

    const shaftTop = 365;

    const contactTop =
        shaftTop -
        pos.height +
        24;

    toy.style.transition =
        "left .16s ease-out, top .30s cubic-bezier(.25,.05,.65,.4)";

    toy.style.left =
        `${targetLeft}px`;

    toy.style.top =
        `${contactTop}px`;

    await wait(300);

    /*
       Сейчас нижняя часть игрушки
       только начала входить в дырку.

       Именно ЗДЕСЬ переключаемся
       на маску.
    */

    const visibleInside =
        (contactTop + pos.height) -
        shaftTop;

    /*
       Копия получает ТО ЖЕ изображение.
    */

    shaftToy.src =
        toy.src;

    shaftToy.style.transition =
        "none";

    shaftToy.style.opacity =
        "1";

    /*
       Координаты внутри маски.

       Центрируем по X.
    */

    shaftToy.style.left =
        `${(190 - pos.width) / 2}px`;

    /*
       Верх картинки находится выше окна.
       Поэтому виден только кусочек,
       который уже вошёл в шахту.
    */

    shaftToy.style.top =
        `${visibleInside - pos.height}px`;

    shaftToy.style.transform =
        "rotate(0deg)";

    /*
       Оригинал убираем.

       ВАЖНО:
       зрительно ничего не исчезает,
       потому что тот кусок, который
       уже находится в дырке,
       одновременно отображается
       внутри shaftMask.
    */

    toy.style.opacity =
        "0";

    await wait(20);

    /*
       5. Теперь копия продолжает
       ТО ЖЕ падение.

       Но она физически видна
       исключительно внутри дырки.
    */

    shaftToy.style.transition =
        "top .42s cubic-bezier(.35,.02,.82,.35), transform .42s ease-in";

    shaftToy.style.top =
        `${25}px`;

    shaftToy.style.transform =
        "rotate(3deg)";

    await wait(420);

    /*
       6. Уходит ещё глубже.
    */

    shaftToy.style.transition =
        "top .24s ease-in, opacity .15s ease-in";

    shaftToy.style.top =
        `${115}px`;

    shaftToy.style.opacity =
        "0";

    await wait(250);

    /*
       Полностью очищаем.
    */

    shaftToy.src = "";

    shaftToy.style.transition =
        "none";

    shaftToy.style.top =
        "-145px";

    shaftToy.style.transform =
        "none";
}

/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(toy) {

    await liftGrabbedToy();

    await settleSwing(
        toy
    );

    await moveToShaft(
        toy
    );

    await lowerOverShaft(
        toy
    );

    await dropIntoShaft(
        toy
    );

    /*
       Только после полного падения
       появляется приз.
    */

    prizeToy.src =
        toy.src;

    prizeToy.classList.add(
        "show"
    );

    await wait(650);

    setCable(
        CABLE_HOME
    );

    await wait(980);

    currentSlot = 1;

    updatePosition();

    await wait(930);

    await neutralClaw();

    grabbedToy = null;
}

/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();

    await wait(32);

    setCable(
        CABLE_WRONG_LIFT
    );

    await wait(720);

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-2deg)";

    await wait(150);

    setClaw(
        "open"
    );

    await wait(190);

    stopFollowingToy();

    clawRig.classList.remove(
        "grabbing"
    );

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    await wait(60);

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;

    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";

    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(3deg)";

    await wait(440);

    toy.style.transition =
        "transform .09s ease-out";

    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";

    await wait(90);

    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";

    toy.style.transform =
        "rotate(.6deg) scaleY(1)";

    await wait(180);

    toy.style.transition =
        "transform .14s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(150);

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";

    toy.classList.remove(
        "caught"
    );

    setCable(
        CABLE_HOME
    );

    await wait(980);

    await neutralClaw();

    grabbedToy = null;
}

/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (busy) {
            return;
        }

        const toy =
            toys[currentSlot];

        if (!toy) {
            return;
        }

        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }

        busy = true;

        try {

            await openClaw();

            await wait(90);

            await lowerClawToToy(
                toy
            );

            await wait(140);

            await grabToyNaturally(
                toy
            );

            const correct =
                toy.dataset.correct === "true";

            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy = false;
        }
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft"
        ) {
            leftButton.click();
        }

        if (
            event.key === "ArrowRight"
        ) {
            rightButton.click();
        }

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);

/* =========================================================
   START
========================================================= */

prizeToy.src = "";

prizeToy.classList.remove(
    "show"
);

shaftToy.src = "";

shaftToy.style.opacity = "0";

toys.forEach(
    toy => {
        toy.style.opacity = "1";
    }
);

setCable(
    CABLE_HOME
);

setClaw(
    "neutral"
);

currentSlot = 1;

updatePosition();

</script>
