<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}


/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 24px 28px 26px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;

    width: 330px;
    height: 125px;

    margin: 15px auto 0;

    object-fit: contain;

    pointer-events: none;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;

    left: 55px;
    bottom: 52px;

    width: 465px;
    height: 352px;

    z-index: 25;

    pointer-events: none;
}

#pouchBack {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;
}

#pouchToys {
    position: absolute;

    left: 72px;
    top: 95px;

    width: 320px;
    height: 215px;

    overflow: visible;

    z-index: 2;
}

.pouch-toy {
    position: absolute;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(45,35,40,.15)
        );
}

#pouchFront {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 3;
}


/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 906px;

    z-index: 10;
}


/* =========================================================
   MACHINE BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 170px;
    top: 170px;

    width: 940px;
    height: 455px;

    overflow: hidden;

    z-index: 20;
}


/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;

    left: 40px;
    top: 0;

    width: 860px;
    height: 76px;

    object-fit: fill;

    z-index: 22;

    pointer-events: none;
}


/* =========================================================
   CLAW RIG
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 328px;
    top: 5px;

    width: 170px;
    height: 445px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}


/* =========================================================
   CART
========================================================= */

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 34;

    pointer-events: none;
}


/* =========================================================
   CABLE
========================================================= */

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 30;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    z-index: 34;

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW ASSEMBLY
========================================================= */

#clawAssembly {
    position: absolute;

    left: -77px;

    top: calc(var(--cable) - 10px);

    width: 160px;
    height: 180px;

    z-index: 30;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW

   ЛАПКИ СЗАДИ ИГРУШКИ
========================================================= */

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 33;

    pointer-events: none;
}

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 58px 15px;

    z-index: 31;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 14px 15px;

    z-index: 31;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}


/* =========================================================
   TOYS

   Игрушки находятся ПЕРЕД лапками.
========================================================= */

.toy {
    position: absolute;

    bottom: 18px;

    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 40;

    pointer-events: none;

    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}


/*
   Немного сдвинули все игрушки влево.
*/

#toy0 {
    left: 65px;
}

#toy1 {
    left: 325px;
}

#toy2 {
    left: 555px;
}

.toy.caught {
    z-index: 40;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


/* =========================================================
   SHAFT FRONT EDGE

   КРИТИЧЕСКИЙ СЛОЙ.

   Он находится ПЕРЕД падающей игрушкой.
   Поэтому игрушка визуально уходит В шахту.
========================================================= */

#shaftFrontEdge {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 70;

    pointer-events: none;
}


/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 275px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;

    width: 150px;
    height: 140px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}


/* =========================================================
   SMALL PRIZE
========================================================= */

#prizeToy {
    position: absolute;

    left: 965px;
    top: 700px;

    width: 135px;
    height: 115px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    z-index: 160;

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   PRIZE OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   BIG PRIZE
========================================================= */

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}


/* =========================================================
   NEXT
========================================================= */

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding: 21px 40px;

    border: 0;

    border-radius: 28px;

    background: #ed5573;

    color: #ffffff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform: translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;

    margin-top: 20px;

    padding: 20px 38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color: #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;
}

</style>

</head>


<body>

<div id="game">

            </div>

            <img

            >

            <img
                class="toy"

                src=""

            >

            <img
                class="toy"
                id="toy2"

                alt=""
                draggable="false"
            >


        </div>


        <!-- ПЕРЕДНИЙ БОРТ ШАХТЫ -->

        <img
            id="shaftFrontEdge"
            src="shaft-front-edge-v2.png"
            alt=""
            draggable="false"
        >


        <!-- АКТУАЛЬНЫЙ ПЕРЕДНИЙ СЛОЙ -->

        <img
            id="machineFront"
            src="machine-front-pastel-v2.png"
            alt=""
            draggable="false"
        >


        <!-- PRIZE -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <!-- CONTROLS -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>

        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>

        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>


    <!-- BIG PRIZE -->

    <div id="prizeOverlay">

        <div id="bigPrizeWrap">

            <img
                id="bigPrizeToy"
                src=""
                alt=""
                draggable="false"
            >

            <button id="nextButton">
                ИГРАТЬ ДАЛЬШЕ
            </button>

            <div id="finalText">
                Отличная работа! 🧸
            </div>

        </div>

    </div>


</div>

</div>


<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 940;
const INSIDE_HEIGHT = 455;


/* =========================================================
   ROUNDS
========================================================= */

const ROUNDS = [

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/sobaka.png",
            "toy/lisa.png",
            "toy/ananas.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-start.png",
        toys: [
            "toy/kaktus.png",
            "toy/koleso.png",
            "toy/sova.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/kapusta.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-start.png",
        toys: [
            "toy/nosok.png",
            "toy/lisa.png",
            "toy/som.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/avtobus.png",
            "toy/chesnok.png",
            "toy/sobaka.png"
        ],
        correct: 1
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/som.png",
            "toy/kapusta.png",
            "toy/kaktus.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",
        toys: [
            "toy/samolet.png",
            "toy/sunduk.png",
            "toy/koleso.png"
        ],
        correct: 2
    },

    {
        scheme: "scheme-s-end.png",
        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/samolet.png"
        ],
        correct: 1
    }

];


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");

const taskScheme =
    document.getElementById("taskScheme");

const progress =
    document.getElementById("progress");

const prizeOverlay =
    document.getElementById("prizeOverlay");

const bigPrizeToy =
    document.getElementById("bigPrizeToy");

const nextButton =
    document.getElementById("nextButton");

const finalText =
    document.getElementById("finalText");

const pouchToys =
    document.getElementById("pouchToys");


const toys = [
    document.getElementById("toy0"),
    document.getElementById("toy1"),
    document.getElementById("toy2")
];


/* =========================================================
   POSITIONS
========================================================= */

/*
   Все позиции немного левее.
*/

const SLOT_X = [
    48,
    308,
    538
];


/*
   Клешня над шахтой.
*/

const DROP_RIG_X = 725;


/*
   Центр шахты.

   ВАЖНО:
   после установки игрушки сюда
   X больше не меняется.
*/

const SHAFT_DROP_CENTER_X = 808;


/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME = 42;

const CABLE_LIFT = 52;

const CABLE_DROP_APPROACH = 155;

const CABLE_DROP = 190;

const CABLE_WRONG_LIFT = 140;


/* =========================================================
   STATE
========================================================= */

let roundIndex = 0;

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;

let heldOffsetX = 0;

let heldOffsetY = 0;

let waitingForPrize = false;

const collectedToys = [];


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(state);
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(380);
}


async function openClaw() {

    setClaw("open");

    await wait(460);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE RIG
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   LEFT / RIGHT
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            waitingForPrize ||
            currentSlot <= 0
        ) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            waitingForPrize ||
            currentSlot >= 2
        ) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   TOY HOME
========================================================= */

const toyHome = [

    {
        left: 65,
        bottom: 18,
        width: 128,
        height: 138
    },

    {
        left: 325,
        bottom: 18,
        width: 128,
        height: 138
    },

    {
        left: 555,
        bottom: 18,
        width: 128,
        height: 138
    }

];


/* =========================================================
   POUCH
========================================================= */

const POUCH_LAYOUT = [

    {
        left: 34,
        top: 108,
        width: 108,
        height: 108,
        rotate: -10,
        z: 1
    },

    {
        left: 106,
        top: 105,
        width: 110,
        height: 110,
        rotate: 7,
        z: 2
    },

    {

function addToyToPouch(src) {

    const index =
        collectedToys.length;

    if (
        index >=
        POUCH_LAYOUT.length
    ) {
        return;
    }

    collectedToys.push(src);

    const layout =
        POUCH_LAYOUT[index];

    const img =
        document.createElement("img");

    img.src = src;

    img.className =
        "pouch-toy";

    img.draggable =
        false;

    img.style.left =
        `${layout.left}px`;

    img.style.top =
        `${layout.top}px`;

    img.style.width =
        `${layout.width}px`;

    img.style.height =
        `${layout.height}px`;

    img.style.zIndex =
        String(layout.z);

    img.style.opacity =
        "0";

    img.style.transform =
        `translateY(-30px)
         rotate(${layout.rotate}deg)
         scale(.88)`;

    img.style.transition =
        "transform .48s cubic-bezier(.22,.8,.3,1.15), opacity .22s ease";

    pouchToys.appendChild(img);

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    img.style.opacity =
                        "1";

                    img.style.transform =
                        `translateY(0)
                         rotate(${layout.rotate}deg)
                         scale(1)`;
                }
            );
        }
    );
}

    progress.textContent =
        `🧸 Раунд ${index + 1} из ${ROUNDS.length}`;

    prizeToy.classList.remove(

    );

    prizeToy.src =
        "";

    prizeToy.style.pointerEvents =

    prizeOverlay.classList.remove(
        "show"
    );

    bigPrizeToy.src =
        "";

    nextButton.style.display =
        "block";

    finalText.style.display =
        "none";


    toys.forEach(
        (toy, toyIndex) => {

            toy.src =
                round.toys[toyIndex];

            toy.dataset.correct =
                toyIndex === round.correct
                    ? "true"
                    : "false";

            toy.dataset.grab =
                toyIndex === 0

                        ? "225"

            toy.style.transition =
                "none";

            toy.style.opacity =
                "1";

            toy.style.top =
                "auto";

            toy.style.left =
                `${toyHome[toyIndex].left}px`;

            toy.style.bottom =
                `${toyHome[toyIndex].bottom}px`;

            toy.style.transform =
                "";

            toy.style.zIndex =
                "40";

            toy.classList.remove(
                "caught"
            );
        }
    );


    grabbedToy =
        null;

    currentSlot =
        1;

    setCable(
        CABLE_HOME
    );

    setClaw(
        "neutral"
    );

    updatePosition();
}


/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside
        .getBoundingClientRect();

    const rect =
        element
        .getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}


/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "caught"
    );

    grabbedToy =
        toy;
}


/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (!grabbedToy) {
        return;
    }

    const toyRect =
        getLocalRect(
            grabbedToy
        );

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    heldOffsetX =
        toyRect.left -
        anchorX;

    heldOffsetY =
        toyRect.top -
        anchorY;
}


/* =========================================================
   HELD TARGET
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX + 85;

    const anchorY =
        52 + cableLength;

    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }

    const target =
        getHeldTarget();

    if (!target) {
        return;
    }

    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );

    if (
        !Number.isFinite(currentLeft)
    ) {
        currentLeft =
            target.left;
    }

    if (
        !Number.isFinite(currentTop)
    ) {
        currentTop =
            target.top;
    }

    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .32;

    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (
        followFrame !== null
    ) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame =
            null;
    }
}


/* =========================================================
   LOWER CLAW
========================================================= */

    clawAssembly.style.transition =

}

/* =========================================================
   DROP INTO SHAFT

   ВАЖНО:

   1. Останавливаем follow.
   2. Ставим игрушку точно над шахтой.
   3. Ждём полной остановки.
   4. Открываем клешню.
   5. LEFT больше НЕ меняем.
   6. Меняется только TOP.
========================================================= */

async function dropIntoShaft(toy) {

    /*
       Сначала останавливаем следование.
    */

    stopFollowingToy();


    /*
       Получаем реальное положение игрушки
       в этот момент.
    */

    const before =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";

    toy.style.left =
        `${before.left}px`;

    toy.style.top =
        `${before.top}px`;

    toy.style.bottom =
        "auto";

    toy.style.transform =
        "rotate(0deg)";


    /*
       Точный LEFT над шахтой.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width / 2;


    /*
       Игрушка спокойно доезжает
       до центра отверстия.
    */

    await wait(
        40
    );


    toy.style.transition =
        "left .30s cubic-bezier(.22,.65,.35,1)";


    toy.style.left =
        `${fixedLeft}px`;


    await wait(
        330
    );


    /*
       Теперь жёстко фиксируем X.
    */

    toy.style.transition =
        "none";

    toy.style.left =
        `${fixedLeft}px`;


    /*
       Даём браузеру два кадра,
       чтобы координата гарантированно
       зафиксировалась.
    */

    await new Promise(
        resolve =>
            requestAnimationFrame(
                () =>
                    requestAnimationFrame(
                        resolve
                    )
            )
    );


    /*
       Открываем клешню.

       Игрушка пока вообще
       НЕ двигается.
    */

    setClaw(
        "open"
    );


    await wait(
        260
    );


    /*
       Ещё раз фиксируем LEFT
       непосредственно перед падением.
    */

    toy.style.transition =
        "none";

    toy.style.left =
        `${fixedLeft}px`;


    /*
       ПАДЕНИЕ 1.

       Только TOP.
       LEFT отсутствует в transition.
    */

    toy.style.transition =
        "top .16s cubic-bezier(.32,.02,.72,.28), transform .16s ease-in";


    toy.style.top =
        `${before.top + 48}px`;


    toy.style.transform =
        "rotate(.4deg)";


    await wait(
        165
    );


    /*
       ПАДЕНИЕ 2.
    */

    toy.style.transition =
        "top .16s cubic-bezier(.40,.01,.82,.24), transform .16s ease-in";


    toy.style.top =
        `${before.top + 112}px`;


    toy.style.transform =
        "rotate(.8deg) scale(.99)";


    await wait(
        165
    );


    /*
       ПАДЕНИЕ 3.

       Теперь игрушка визуально
       уходит за передний край шахты.
    */

    toy.style.transition =
        "top .18s cubic-bezier(.48,.01,.92,.22), transform .18s ease-in";


    toy.style.top =
        `${before.top + 205}px`;


    toy.style.transform =
        "rotate(1deg) scale(.975)";


    await wait(
        185
    );


    /*
       Игрушка уже внутри шахты.

       Исчезает только после того,
       как её закрыл передний край.
    */

    toy.style.transition =
        "top .14s ease-in";


    toy.style.top =
        `${before.top + 275}px`;


    await wait(
        145
    );


    toy.style.opacity =
        "0";


    await wait(
        100
    );
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(toy) {

    await liftGrabbedToy();

    await settleSwing(
        toy
    );

    await moveToShaft(
        toy
    );

    await lowerOverShaft(
        toy
    );

    await dropIntoShaft(
        toy
    );


    prizeToy.src =
        toy.src;

    prizeToy.classList.add(
        "show"
    );

    prizeToy.style.pointerEvents =
        "auto";

    waitingForPrize =
        true;


    setCable(
        CABLE_HOME
    );

    await wait(
        980
    );


    currentSlot =
        1;

    updatePosition();

    await wait(
        930
    );

    await neutralClaw();

    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();

    await wait(
        32
    );

    setCable(
        CABLE_WRONG_LIFT
    );

    await wait(
        720
    );

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-2deg)";

    await wait(
        150
    );

    setClaw(
        "open"
    );

    await wait(
        190
    );

    stopFollowingToy();


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    await wait(
        60
    );


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";

    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(3deg)";

    await wait(
        440
    );


    toy.style.transition =
        "transform .09s ease-out";

    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";

    await wait(
        90
    );


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";

    toy.style.transform =
        "rotate(.6deg) scaleY(1)";

    await wait(
        180
    );


    toy.style.transition =
        "transform .14s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(
        150
    );


    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";

    toy.classList.remove(
        "caught"
    );


    setCable(
        CABLE_HOME
    );

    await wait(
        980
    );

    await neutralClaw();

    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (
            getComputedStyle(toy).opacity ===
            "0"
        ) {
            return;
        }


        busy =
            true;


        try {

            /*
               1. Клешня открывается.
            */

            await openClaw();


            await wait(
                90
            );


            /*
               2. Опускается открытой.
            */

            await lowerClawToToy(
                toy
            );


            await wait(
                140
            );


            /*
               3. Закрывается вокруг игрушки.
            */

            await grabToyNaturally(
                toy
            );


            /*
               4. Проверка ответа.
            */

            const correct =
                toy.dataset.correct ===
                "true";


            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   SMALL PRIZE CLICK
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }


        if (
            !prizeToy
            .classList
            .contains("show")
        ) {
            return;
        }


        const wonToySrc =
            prizeToy.src;


        prizeToy.style.pointerEvents =
            "none";


        bigPrizeToy.src =
            wonToySrc;


        prizeToy.classList.remove(
            "show"
        );


        /*
           Добавляем выигранную игрушку
           в пакет.
        */

        addToyToPouch(
            wonToySrc
        );


        prizeOverlay.classList.add(
            "show"
        );


        if (
            roundIndex ===
            ROUNDS.length - 1
        ) {

            nextButton.style.display =
                "none";

            finalText.style.display =
                "block";
        }
    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length - 1
        ) {
            return;
        }


        nextButton.disabled =
            true;


        prizeOverlay.classList.remove(
            "show"
        );


        await wait(
            380
        );


        bigPrizeToy.src =
            "";


        roundIndex++;


        loadRound(
            roundIndex
        );


        nextButton.disabled =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

loadRound(
    roundIndex
);

</script>
