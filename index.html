<script>

/* =====================================================
   МАСШТАБ
===================================================== */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );

  viewport.style.width =
    GAME_WIDTH * scale + "px";

  viewport.style.height =
    GAME_HEIGHT * scale + "px";

  game.style.transform =
    `scale(${scale})`;
}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawSystem =
  document.getElementById("clawSystem");

const claw =
  document.getElementById("claw");

const cable =
  document.getElementById("cable");

const leftButton =
  document.getElementById("leftButton");

const rightButton =
  document.getElementById("rightButton");

const grabButton =
  document.getElementById("grabButton");

const prizeToy =
  document.getElementById("prizeToy");

const toys = [
  document.getElementById("toy0"),
  document.getElementById("toy1"),
  document.getElementById("toy2")
];


/* =====================================================
   ТРИ ПОЗИЦИИ ИГРУШЕК
===================================================== */

const SLOT_X = [
  53,
  195,
  337
];

const TOY_X = [
  86,
  228,
  370
];

let currentSlot = 1;
let busy = false;


/* =====================================================
   ПОЛОЖЕНИЯ КЛЕШНИ
===================================================== */

/* наверху */

const CLAW_HOME_TOP = 132;
const CABLE_HOME = 78;


/* у игрушки */

const CLAW_GRAB_TOP = 350;
const CABLE_GRAB = 296;


/*
   Позиция сброса справа.

   Важно:
   клешня всё равно остаётся
   ВНУТРИ витрины.
*/

const DROP_X = 337;


/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}


/* =====================================================
   ПЕРЕДВИЖЕНИЕ ПО РЕЛЬСУ
===================================================== */

function updateClawPosition() {

  clawSystem.style.left =
    SLOT_X[currentSlot] + "px";
}

updateClawPosition();


/* =====================================================
   ВЛЕВО
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();
    }
  }
);


/* =====================================================
   ВПРАВО
===================================================== */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();
    }
  }
);


/* =====================================================
   ОТКРЫТЬ КЛЕШНЮ
===================================================== */

async function openClaw() {

  claw.classList.remove("closed");

  claw.classList.add("open");

  await wait(450);
}


/* =====================================================
   ЗАКРЫТЬ КЛЕШНЮ
===================================================== */

async function closeClaw() {

  claw.classList.remove("open");

  claw.classList.add("closed");

  await wait(450);
}


/* =====================================================
   ОПУСТИТЬ
===================================================== */

async function lowerClaw() {

  cable.style.height =
    CABLE_GRAB + "px";

  claw.style.top =
    CLAW_GRAB_TOP + "px";

  await wait(900);
}


/* =====================================================
   ПОДНЯТЬ
===================================================== */

async function raiseClaw() {

  cable.style.height =
    CABLE_HOME + "px";

  claw.style.top =
    CLAW_HOME_TOP + "px";

  await wait(900);
}


/* =====================================================
   ПРИКРЕПЛЯЕМ ИГРУШКУ К ЗАХВАТУ
===================================================== */

function attachToy(toy) {

  toy.classList.add("caught");

  toy.style.bottom = "auto";

  /*
    Центрируем игрушку непосредственно
    под клешнёй.
  */

  toy.style.left =
    (SLOT_X[currentSlot] + 40) + "px";

  toy.style.top =
    (CLAW_GRAB_TOP + 80) + "px";
}


/* =====================================================
   ИГРУШКА ПОДНИМАЕТСЯ
===================================================== */

function liftToy(toy) {

  toy.style.top =
    (CLAW_HOME_TOP + 80) + "px";
}


/* =====================================================
   КЛЕШНЯ + ИГРУШКА ЕДУТ ВПРАВО
===================================================== */

async function moveCaughtToyRight(toy) {

  clawSystem.style.left =
    DROP_X + "px";

  toy.style.left =
    (DROP_X + 40) + "px";

  await wait(850);
}


/* =====================================================
   ОПУСКАЕМСЯ В ПРАВОЙ ЧАСТИ
===================================================== */

async function lowerAtPrize(toy) {

  cable.style.height =
    "245px";

  claw.style.top =
    "299px";

  toy.style.top =
    "379px";

  await wait(750);
}


/* =====================================================
   ПАДЕНИЕ ИГРУШКИ В ПРИЗ
===================================================== */

async function dropToyIntoPrize(toy) {

  /*
    ВАЖНО:

    Сначала раскрываются лапки.
  */

  await openClaw();


  /*
    Только ПОСЛЕ раскрытия
    игрушка начинает падать.
  */

  toy.style.top = "535px";

  await wait(450);

  toy.style.opacity = "0";

  await wait(250);


  /*
    Убираем из витрины.
  */

  toy.style.display = "none";


  /*
    Показываем ту же игрушку
    в окне ПРИЗ.
  */

  prizeToy.textContent =
    toy.textContent.trim();

  prizeToy.classList.add("show");

  await wait(700);
}


/* =====================================================
   ПРАВИЛЬНЫЙ ЦИКЛ
===================================================== */

async function correctCycle(toy) {

  /*
    В ЭТОТ МОМЕНТ КЛЕШНЯ УЖЕ:

    - раскрылась
    - спустилась
    - закрылась

    Теперь игрушка считается захваченной.
  */

  attachToy(toy);

  await wait(150);


  /* =============================================
     ПОДНИМАЕМ ИГРУШКУ
  ============================================== */

  cable.style.height =
    CABLE_HOME + "px";

  claw.style.top =
    CLAW_HOME_TOP + "px";

  liftToy(toy);

  await wait(900);


  /* =============================================
     НЕСЁМ ВПРАВО
  ============================================== */

  await moveCaughtToyRight(toy);


  /* =============================================
     ОПУСКАЕМСЯ У СБРОСА
  ============================================== */

  await lowerAtPrize(toy);


  /* =============================================
     РАСКРЫВАЕМ И ОТПУСКАЕМ
  ============================================== */

  await dropToyIntoPrize(toy);


  /* =============================================
     ПУСТАЯ КЛЕШНЯ ПОДНИМАЕТСЯ
  ============================================== */

  await raiseClaw();


  /* =============================================
     ЛАПКИ В НЕЙТРАЛЬ
  ============================================== */

  claw.classList.remove(
    "open",
    "closed"
  );

  await wait(250);


  /* =============================================
     ВОЗВРАЩАЕМСЯ В ЦЕНТР
  ============================================== */

  currentSlot = 1;

  updateClawPosition();

  await wait(750);
}


/* =====================================================
   НЕПРАВИЛЬНЫЙ ОТВЕТ
===================================================== */

async function wrongCycle(toy) {

  const originalSlot =
    currentSlot;


  /*
    Даже неправильную игрушку
    клешня действительно хватает.
  */

  attachToy(toy);

  await wait(150);


  /* =============================================
     НАЧИНАЕМ ПОДНИМАТЬ
  ============================================== */

  cable.style.height =
    "205px";

  claw.style.top =
    "260px";

  toy.style.top =
    "340px";

  await wait(600);


  /* =============================================
     КЛЕШНЯ РАСКРЫВАЕТСЯ

     Игрушка выскальзывает.
  ============================================== */

  await openClaw();


  /* =============================================
     ИГРУШКА ПАДАЕТ
  ============================================== */

  toy.style.top =
    "425px";

  await wait(300);


  /*
    Возвращаем игрушку
    на исходное место.
  */

  toy.classList.remove("caught");

  toy.style.top = "";

  toy.style.bottom =
    "54px";

  toy.style.left =
    TOY_X[originalSlot] + "px";


  toy.classList.add(
    "drop-wobble"
  );

  await wait(600);

  toy.classList.remove(
    "drop-wobble"
  );


  /* =============================================
     ПУСТАЯ КЛЕШНЯ ПОДНИМАЕТСЯ
  ============================================== */

  await raiseClaw();


  /* =============================================
     В НЕЙТРАЛЬ
  ============================================== */

  claw.classList.remove(
    "open",
    "closed"
  );

  await wait(250);
}


/* =====================================================
   КРАСНАЯ КНОПКА

   ВОТ ЗДЕСЬ ГЛАВНАЯ МЕХАНИКА.
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy) return;


    const toy =
      toys[currentSlot];


    if (
      !toy ||
      toy.style.display === "none"
    ) {
      return;
    }


    busy = true;


    /* =============================================
       ШАГ 1

       НАЖАЛИ КРАСНУЮ КНОПКУ.

       КЛЕШНЯ СНАЧАЛА ОТКРЫВАЕТСЯ.
    ============================================== */

    await openClaw();


    /* =============================================
       ШАГ 2

       ОТКРЫТАЯ КЛЕШНЯ
       СПУСКАЕТСЯ К ИГРУШКЕ.
    ============================================== */

    await lowerClaw();


    /* =============================================
       ШАГ 3

       ТОЛЬКО У ИГРУШКИ
       КЛЕШНЯ ЗАКРЫВАЕТСЯ.
    ============================================== */

    await closeClaw();


    /* =============================================
       ШАГ 4

       ТЕПЕРЬ ОНА ЕЁ СХВАТИЛА.
    ============================================== */

    const correct =
      toy.dataset.correct === "true";


    if (correct) {

      await correctCycle(toy);

    } else {

      await wrongCycle(toy);
    }


    busy = false;
  }
);


/* =====================================================
   КЛАВИАТУРА
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowLeft") {

      leftButton.click();
    }

    if (event.key === "ArrowRight") {

      rightButton.click();
    }

    if (event.code === "Space") {

      event.preventDefault();

      grabButton.click();
    }
  }
);

</script>
