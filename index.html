<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #eee5df;
  font-family: "Trebuchet MS", Arial, sans-serif;
  user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  background:
    url("fon.png")
    center / cover
    no-repeat;
}

/* =====================================================
   ЗАДАНИЕ
===================================================== */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding: 30px 35px;

  border-radius: 34px;

  background: rgba(255,255,255,.93);

  box-shadow:
    0 15px 40px rgba(77,67,72,.13);

  text-align: center;

  color: #40506a;

  z-index: 20;
}

.task-small {
  font-size: 24px;
  font-weight: 800;
  opacity: .72;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #ed5573;
}

/* =====================================================
   РАУНД
===================================================== */

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px;

  border-radius: 28px;

  background: rgba(255,255,255,.91);

  box-shadow:
    0 12px 30px rgba(77,67,72,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;

  z-index: 20;
}

/* =====================================================
   АВТОМАТ

   ВСЁ НИЖЕ ЖИВЁТ ВНУТРИ ЭТОГО БЛОКА.
===================================================== */

#machine {
  position: absolute;

  left: 780px;
  top: 25px;

  width: 735px;
  height: 1030px;

  z-index: 10;
}

/* =====================================================
   ВНУТРЕННЯЯ КАМЕРА

   ЭТО НЕ КАРТИНКА.
   Это настоящий фон внутренности автомата.
===================================================== */

#machineInside {
  position: absolute;

  /*
     Эти координаты под прозрачную витрину.
     После скрина можем подогнать на несколько px.
  */

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  border-radius: 10px;

  background:
    radial-gradient(
      ellipse at 50% 12%,
      rgba(255,249,211,.95) 0%,
      rgba(255,255,255,0) 37%
    ),
    linear-gradient(
      180deg,
      #e9fbf8 0%,
      #f7fffd 42%,
      #fffdf7 78%,
      #fff4ea 100%
    );

  box-shadow:
    inset 0 18px 35px rgba(93,194,188,.10),
    inset 0 -20px 35px rgba(245,170,181,.08);

  z-index: 1;
}

/* =====================================================
   ВЕРХНЯЯ ПОДСВЕТКА ВНУТРИ
===================================================== */

.inside-light {
  position: absolute;

  left: 55px;
  top: 18px;

  width: 457px;
  height: 12px;

  border-radius: 20px;

  background: #fff7ca;

  box-shadow:
    0 0 10px rgba(255,239,150,.75),
    0 0 25px rgba(255,239,150,.45);

  z-index: 2;
}

/* =====================================================
   ПОЛ ВНУТРИ АВТОМАТА
===================================================== */

.inside-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 96px;

  background:
    linear-gradient(
      180deg,
      #fffdf5 0%,
      #fff3e9 100%
    );

  border-top:
    4px solid rgba(239,170,183,.55);

  box-shadow:
    inset 0 14px 18px rgba(255,255,255,.85);

  z-index: 3;
}

/* =====================================================
   РЕЛЬС
===================================================== */

#rail {
  position: absolute;

  left: 42px;
  top: 45px;

  width: 483px;
  height: 14px;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #dce4e6 24%,
      #8d989d 55%,
      #687277 76%,
      #dce3e5 100%
    );

  border:
    2px solid rgba(88,98,103,.45);

  box-shadow:
    0 4px 6px rgba(0,0,0,.14),
    inset 0 2px 2px rgba(255,255,255,.9);

  z-index: 10;
}

/* =====================================================
   ПОДВИЖНАЯ СИСТЕМА
===================================================== */

#clawSystem {
  position: absolute;

  left: 189px;
  top: 17px;

  width: 190px;
  height: 520px;

  z-index: 20;

  transition:
    left .35s cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   КАРЕТКА
===================================================== */

#clawCart {
  position: absolute;

  left: 34px;
  top: 0;

  width: 122px;
  height: 83px;

  object-fit: contain;

  z-index: 25;

  pointer-events: none;
}

/* =====================================================
   ТРОС
===================================================== */

#cable {
  position: absolute;

  left: 92px;
  top: 62px;

  width: 6px;
  height: 78px;

  border-radius: 5px;

  background:
    repeating-linear-gradient(
      135deg,
      #f7f7f7 0px,
      #f7f7f7 3px,
      #879196 3px,
      #879196 6px
    );

  box-shadow:
    1px 0 2px rgba(0,0,0,.18);

  z-index: 15;

  transition:
    height .78s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   САМА КЛЕШНЯ
===================================================== */

#claw {
  position: absolute;

  left: 18px;
  top: 132px;

  width: 154px;
  height: 185px;

  z-index: 30;

  transition:
    top .78s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   ЦЕНТР КЛЕШНИ
===================================================== */

#clawBody {
  position: absolute;

  left: 50px;
  top: 0;

  width: 54px;
  height: 75px;

  object-fit: contain;

  z-index: 35;

  pointer-events: none;
}

/* =====================================================
   ЛЕВАЯ ЛАПКА
===================================================== */

#clawLeft {
  position: absolute;

  left: 0;
  top: 42px;

  width: 90px;
  height: 145px;

  object-fit: contain;

  transform-origin: 73px 18px;

  transform: rotate(0deg);

  transition:
    transform .4s cubic-bezier(.4,0,.2,1);

  z-index: 32;

  pointer-events: none;
}

/* =====================================================
   ПРАВАЯ ЛАПКА
===================================================== */

#clawRight {
  position: absolute;

  right: 0;
  top: 42px;

  width: 90px;
  height: 145px;

  object-fit: contain;

  transform-origin: 17px 18px;

  transform: rotate(0deg);

  transition:
    transform .4s cubic-bezier(.4,0,.2,1);

  z-index: 32;

  pointer-events: none;
}

/* =====================================================
   ОТКРЫТИЕ
===================================================== */

#claw.open #clawLeft {
  transform: rotate(-23deg);
}

#claw.open #clawRight {
  transform: rotate(23deg);
}

/* =====================================================
   ЗАКРЫТИЕ
===================================================== */

#claw.closed #clawLeft {
  transform: rotate(31deg);
}

#claw.closed #clawRight {
  transform: rotate(-31deg);
}

/* =====================================================
   ТЕСТОВЫЕ ИГРУШКИ
===================================================== */

.toy {
  position: absolute;

  bottom: 58px;

  width: 135px;
  height: 150px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  font-size: 94px;

  z-index: 12;

  transform-origin: center bottom;
}

.toy-1 {
  left: 28px;
}

.toy-2 {
  left: 216px;
}

.toy-3 {
  left: 404px;
}

/* тень */

.toy::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -5px;

  width: 90px;
  height: 18px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: rgba(62,58,70,.12);

  filter: blur(5px);

  z-index: -1;
}

/* =====================================================
   СТЕКЛО

   ЭТО ОТДЕЛЬНЫЙ СЛОЙ.
===================================================== */

#glass {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  pointer-events: none;

  z-index: 80;
}

#glass::before {
  content: "";

  position: absolute;

  left: 45px;
  top: -100px;

  width: 70px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.24),
      transparent
    );
}

#glass::after {
  content: "";

  position: absolute;

  right: 75px;
  top: -100px;

  width: 35px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.13),
      transparent
    );
}

/* =====================================================
   ПЕРЕДНЯЯ РАМА

   САМЫЙ ВАЖНЫЙ СЛОЙ.
===================================================== */

#machineFront {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  pointer-events: none;

  z-index: 100;
}

/* =====================================================
   НЕВИДИМЫЕ КНОПКИ
===================================================== */

.control {
  position: absolute;

  z-index: 150;

  border: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;
}

/* ВЛЕВО */

#leftButton {
  left: 105px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}

/* ВПРАВО */

#rightButton {
  left: 225px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}

/* КРАСНАЯ */

#grabButton {
  left: 400px;
  top: 810px;

  width: 128px;
  height: 128px;

  border-radius: 50%;
}

/* =====================================================
   НАЖАТИЕ
===================================================== */

.control::after {
  content: "";

  position: absolute;
  inset: 5px;

  border-radius: inherit;

  transition:
    background .1s,
    transform .1s;
}

.control:active::after {
  background: rgba(0,0,0,.09);
  transform: scale(.88);
}

</style>
</head>

<body>

<div id="viewport">

  <div id="game">

    <!-- ===============================================
         ЗАДАНИЕ
    ================================================ -->

    <div class="task">

      <div class="task-small">
        Поймай нужную игрушку
      </div>

      <div class="task-main">
        Найди звук <b>С</b><br>
        В СЕРЕДИНЕ слова
      </div>

    </div>

    <div class="progress">
      🧸 Раунд 1 из 10
    </div>

    <!-- ===============================================
         АВТОМАТ
    ================================================ -->

    <div id="machine">

      <!-- =============================================
           ВНУТРЕННЯЯ КАМЕРА
      ============================================== -->

      <div id="machineInside">

        <div class="inside-light"></div>

        <div class="inside-floor"></div>

        <!-- РЕЛЬС -->

        <div id="rail"></div>

        <!-- ===========================================
             КЛЕШНЯ
        ============================================ -->

        <div id="clawSystem">

          <img
            id="clawCart"
            src="claw-cart.png"
            alt=""
            draggable="false"
          >

          <div id="cable"></div>

          <div id="claw">

            <img
              id="clawBody"
              src="claw-body.png"
              alt=""
              draggable="false"
            >

            <img
              id="clawLeft"
              src="claw-left.png"
              alt=""
              draggable="false"
            >

            <img
              id="clawRight"
              src="claw-right.png"
              alt=""
              draggable="false"
            >

          </div>

        </div>

        <!-- ===========================================
             ИГРУШКИ
        ============================================ -->

        <div class="toy toy-1">
          🦉
        </div>

        <div class="toy toy-2">
          🦊
        </div>

        <div class="toy toy-3">
          🍍
        </div>

      </div>

      <!-- =============================================
           БЛИКИ СТЕКЛА
      ============================================== -->

      <div id="glass"></div>

      <!-- =============================================
           КОРПУС
      ============================================== -->

      <img
        id="machineFront"
        src="machine-front.png"
        alt=""
        draggable="false"
      >

      <!-- =============================================
           КНОПКИ
      ============================================== -->

      <button
        id="leftButton"
        class="control"
        aria-label="Влево"
      ></button>

      <button
        id="rightButton"
        class="control"
        aria-label="Вправо"
      ></button>

      <button
        id="grabButton"
        class="control"
        aria-label="Поймать"
      ></button>

    </div>

  </div>

</div>

<script>

/* =====================================================
   МАСШТАБ
===================================================== */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );

  viewport.style.width =
    GAME_WIDTH * scale + "px";

  viewport.style.height =
    GAME_HEIGHT * scale + "px";

  game.style.transform =
    `scale(${scale})`;
}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawSystem =
  document.getElementById("clawSystem");

const claw =
  document.getElementById("claw");

const cable =
  document.getElementById("cable");

const leftButton =
  document.getElementById("leftButton");

const rightButton =
  document.getElementById("rightButton");

const grabButton =
  document.getElementById("grabButton");

/* =====================================================
   ПОЗИЦИИ ТРЁХ ИГРУШЕК
===================================================== */

const SLOT_X = [
  3,
  191,
  379
];

let currentSlot = 1;

let busy = false;

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}

/* =====================================================
   ПЕРЕДВИЖЕНИЕ
===================================================== */

function updateClawPosition() {

  clawSystem.style.left =
    SLOT_X[currentSlot] + "px";
}

updateClawPosition();

/* =====================================================
   ВЛЕВО
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();
    }
  }
);

/* =====================================================
   ВПРАВО
===================================================== */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();
    }
  }
);

/* =====================================================
   КРАСНАЯ КНОПКА

   ОДНО НАЖАТИЕ:
   ОТКРЫЛАСЬ
   ↓
   СПУСТИЛАСЬ
   ↓
   ЗАКРЫЛАСЬ
   ↓
   ПОДНЯЛАСЬ
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy) return;

    busy = true;

    /* 1. ОТКРЫВАЕМ */

    claw.classList.remove("closed");
    claw.classList.add("open");

    await wait(450);

    /* 2. ОПУСКАЕМ */

    cable.style.height = "300px";

    claw.style.top = "354px";

    await wait(850);

    /* 3. ЗАКРЫВАЕМ */

    claw.classList.remove("open");
    claw.classList.add("closed");

    await wait(550);

    /* 4. ПОДНИМАЕМ */

    cable.style.height = "78px";

    claw.style.top = "132px";

    await wait(850);

    /* ПОКА ОСТАВЛЯЕМ ЗАКРЫТОЙ */

    await wait(450);

    /* ВОЗВРАЩАЕМ */

    claw.classList.remove("closed");

    await wait(300);

    busy = false;
  }
);

/* =====================================================
   КЛАВИАТУРА
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowLeft") {
      leftButton.click();
    }

    if (event.key === "ArrowRight") {
      rightButton.click();
    }

    if (event.code === "Space") {

      event.preventDefault();

      grabButton.click();
    }
  }
);

</script>

</body>
</html>
