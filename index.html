<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 24px 28px 26px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;

    width: 330px;
    height: 125px;

    margin: 15px auto 0;

    object-fit: contain;

    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;

    left: 55px;
    bottom: 52px;

    width: 465px;
    height: 352px;

    z-index: 25;

    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;

    left: 72px;
    top: 95px;

    width: 320px;
    height: 215px;

    overflow: visible;

    z-index: 2;

    pointer-events: none;
}

.pouch-toy {
    position: absolute;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(45,35,40,.15)
        );

    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 906px;

    z-index: 10;
}

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   INSIDE
========================================================= */

#machineInside {
    position: absolute;

    left: 170px;
    top: 170px;

    width: 940px;
    height: 455px;

    overflow: hidden;

    z-index: 20;
}

/* =========================================================
   BALL PIT

   Правая граница 730.
   Шахта начинается дальше справа.
   Шарики туда попасть не могут.
========================================================= */

#ballPit {
    position: absolute;

    left: 0;
    top: 0;

    width: 730px;
    height: 455px;

    overflow: hidden;

    pointer-events: none;

    z-index: 42;
}

.ball {
    position: absolute;

    width: 64px;
    height: 64px;

    object-fit: contain;

    pointer-events: none;

    transform-origin: center center;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 4px 4px
            rgba(60,45,70,.13)
        );
}

/*
   Задние шарики находятся
   ЗА игрушками.
*/

.ball.back-ball {
    z-index: 1;
}

/*
   Передние шарики закрывают
   нижнюю часть игрушек.
*/

.ball.front-ball {
    z-index: 4;
}

/* =========================================================
   TOY LAYER
========================================================= */

#toyLayer {
    position: absolute;

    inset: 0;

    z-index: 44;

    pointer-events: none;
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;

    left: 20px;
    top: 2px;

    width: 900px;
    height: 105px;

    object-fit: fill;

    z-index: 12;

    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 295px;
    top: 5px;

    width: 170px;
    height: 445px;

    z-index: 60;

    transition:
        left .92s
        cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 64;

    pointer-events: none;
}

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 61;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px
        rgba(0,0,0,.2);

    z-index: 61;

    transition:
        height .92s
        cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;

    left: -77px;

    top:
        calc(
            var(--cable) - 10px
        );

    width: 160px;
    height: 180px;

    z-index: 62;

    transition:
        top .92s
        cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 63;

    pointer-events: none;
}

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        58px 15px;

    z-index: 62;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        14px 15px;

    z-index: 62;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;

    bottom: 9px;

    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 3;

    pointer-events: none;

    transform-origin:
        50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

/*
   Игрушки стоят чуть глубже
   в шариках.
*/

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

.toy.caught {
    z-index: 8;
}

.toy.dropping {
    z-index: 70;
}

/* =========================================================
   SHAFT
========================================================= */

#machineShaftEdge {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 75;

    pointer-events: none;
}

/* =========================================================
   FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color:
        transparent;
}

#leftButton {
    left: 275px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;

    width: 150px;
    height: 140px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   PRIZE WINDOW
========================================================= */

#prizeWindow {
    position: absolute;

    left: 948px;
    top: 690px;

    width: 170px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 160;

    pointer-events: none;
}

#prizeToy {
    display: block;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position: center;

    opacity: 0;

    transform:
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding:
        21px 40px;

    border: 0;

    border-radius: 28px;

    background:
        #ed5573;

    color:
        #fff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px
        rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform:
        translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;

    margin-top: 20px;

    padding:
        20px 38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color:
        #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;
}

</style>
</head>

/*
   Границы физики.

   Справа шарики никогда
   не заходят к шахте.
*/

const BALL_MIN_X = 0;

const BALL_MAX_X = 725;

const BALL_FLOOR_Y = 455;


/*
   Настройки физики.
*/

const BALL_FRICTION = .972;

const BALL_GRAVITY = .18;

const BALL_BOUNCE = .22;

const BALL_COLLISION_DAMPING = .86;

let ballPhysicsRunning = false;

let ballPhysicsFrame = null;


/* =========================================================
   CREATE BALLS
========================================================= */

function createBalls() {

    ballPit.innerHTML = "";

    BALLS.length = 0;

}


function renderBall(ball) {

        `${ball.x}px`;

    ball.element.style.transform =
        `rotate(
            ${ball.rotation}deg
        )`;
}


/* =========================================================
   BALL COLLISIONS
========================================================= */

function solveBallCollision(
    a,
    b
) {

    const ax =
        a.x + a.radius;

    const ay =
        a.y + a.radius;

    const bx =
        b.x + b.radius;

    const by =
        b.y + b.radius;


    let dx =
        bx - ax;

    let dy =
        by - ay;


    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const minimum =
        a.radius +
        b.radius -
        5;


    if (
        distance <= 0
    ) {

        dx = 1;
        dy = 0;

        distance = 1;
    }


    if (
        distance >= minimum
    ) {
        return;
    }


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const overlap =
        minimum -
        distance;


    /*
       Раздвигаем оба шарика.
    */

    a.x -=
        nx *
        overlap *
        .5;

    a.y -=
        ny *
        overlap *
        .5;


    b.x +=
        nx *
        overlap *
        .5;

    b.y +=
        ny *
        overlap *
        .5;


    /*
       Скорость вдоль линии
       столкновения.
    */

    const relativeVelocityX =
        b.vx -
        a.vx;

    const relativeVelocityY =
        b.vy -
        a.vy;


    const separatingVelocity =
        relativeVelocityX * nx +
        relativeVelocityY * ny;


    if (
        separatingVelocity > 0
    ) {
        return;
    }


    const impulse =
        -separatingVelocity *
        BALL_COLLISION_DAMPING;


    a.vx -=
        impulse *
        nx *
        .5;

    a.vy -=
        impulse *
        ny *
        .5;


    b.vx +=
        impulse *
        nx *
        .5;

    b.vy +=
        impulse *
        ny *
        .5;


    /*
       После удара шарики
       получают небольшое вращение.
    */

    a.angularVelocity -=
        impulse *
        .11;

    b.angularVelocity +=
        impulse *
        .11;
}


/* =========================================================
   BALL PHYSICS LOOP
========================================================= */

function updateBallPhysics() {

    let moving = false;


    BALLS.forEach(
        ball => {

            /*
               Гравитация.
            */

            ball.vy +=
                BALL_GRAVITY;


            /*
               Положение.
            */

            ball.x +=
                ball.vx;

            ball.y +=
                ball.vy;


            /*
               Левая стенка.
            */

            if (
                ball.x <
                BALL_MIN_X
            ) {

                ball.x =
                    BALL_MIN_X;

                ball.vx =
                    Math.abs(
                        ball.vx
                    ) *
                    BALL_BOUNCE;
            }


            /*
               Правая стенка.

               До шахты.
            */

            const maxX =
                BALL_MAX_X -
                ball.size;


            if (
                ball.x >
                maxX
            ) {

                ball.x =
                    maxX;

                ball.vx =
                    -Math.abs(
                        ball.vx
                    ) *
                    BALL_BOUNCE;
            }


            /*
               Пол.
            */

            const floorY =
                BALL_FLOOR_Y -
                ball.size;


            if (
                ball.y >
                floorY
            ) {

                ball.y =
                    floorY;


                if (
                    ball.vy > 0
                ) {

                    ball.vy =
                        -ball.vy *
                        BALL_BOUNCE;
                }


                /*
                   Трение пола.
                */

                ball.vx *=
                    .955;
            }


            /*
               Верх.
            */

            if (
                ball.y < 310
            ) {

                ball.y =
                    310;

                ball.vy =
                    Math.abs(
                        ball.vy
                    ) *
                    .15;
            }


            /*
               Общее сопротивление.
            */

            ball.vx *=
                BALL_FRICTION;

            ball.vy *=
                .988;


            /*
               Вращение связано
               с горизонтальным движением.
            */

            ball.angularVelocity +=
                ball.vx *
                .08;


            ball.angularVelocity *=
                .94;


            ball.rotation +=
                ball.angularVelocity;


            if (
                Math.abs(
                    ball.vx
                ) > .04 ||
                Math.abs(
                    ball.vy
                ) > .05 ||
                Math.abs(
                    ball.angularVelocity
                ) > .05
            ) {

                moving = true;
            }
        }
    );


    /*
       Несколько проходов столкновений.

       Так куча ведёт себя
       стабильнее.
    */

    for (
        let pass = 0;
        pass < 3;
        pass++
    ) {

        for (
            let i = 0;
            i < BALLS.length;
            i++
        ) {

            for (
                let j = i + 1;
                j < BALLS.length;
                j++
            ) {

                solveBallCollision(
                    BALLS[i],
                    BALLS[j]
                );
            }
        }
    }


    BALLS.forEach(
        renderBall
    );


    if (
        moving
    ) {

        ballPhysicsFrame =
            requestAnimationFrame(
                updateBallPhysics
            );

    } else {

        ballPhysicsRunning =
            false;

        ballPhysicsFrame =
            null;
    }
}


function startBallPhysics() {

    if (
        ballPhysicsRunning
    ) {
        return;
    }


    ballPhysicsRunning =
        true;


    ballPhysicsFrame =
        requestAnimationFrame(
            updateBallPhysics
        );
}


/* =========================================================
   PUSH BALLS

   Клешня реально раздвигает
   шарики вокруг выбранной игрушки.
========================================================= */

function pushBallsFromClaw(
    slot,
    strength = 1
) {

    const toy =
        toyHome[slot];


    const centerX =
        toy.left +
        toy.width / 2;


    /*
       Нижняя часть клешни
       входит примерно сюда.
    */

    const centerY =
        400;


    BALLS.forEach(
        (
            ball,
            index
        ) => {

            const bx =
                ball.x +
                ball.radius;

            const by =
                ball.y +
                ball.radius;


            const dx =
                bx -
                centerX;

            const dy =
                by -
                centerY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            const radius =
                150;


            if (
                distance >= radius
            ) {
                return;
            }


            const power =
                1 -
                distance /
                radius;


            /*
               Основное направление
               наружу.
            */

            let directionX;


            if (
                Math.abs(dx) <
                8
            ) {

                directionX =
                    index % 2 === 0
                        ? -1
                        : 1;

            } else {

                directionX =
                    dx < 0
                        ? -1
                        : 1;
            }


            /*
               Каждый шарик получает
               немного отличающийся
               импульс.
            */

            const variation =
                .82 +
                (
                    (
                        index * 37
                    ) %
                    31
                ) /
                100;


            ball.vx +=
                directionX *
                (
                    2.4 +
                    power * 5.8
                ) *
                strength *
                variation;


            /*
               Небольшой толчок вверх.

               Он нужен, чтобы шарики
               не просто скользили,
               а действительно перекатывались
               друг через друга.
            */

            ball.vy -=
                (
                    .4 +
                    power * 2.1
                ) *
                strength *
                variation;


            ball.angularVelocity +=
                directionX *
                (
                    1.5 +
                    power * 4
                );
        }
    );


    startBallPhysics();
}


/* =========================================================
   FILL GAP AFTER TOY

   После вытаскивания игрушки
   соседние шарики слегка скатываются
   в освободившееся место.
========================================================= */

function collapseBallsIntoGap(
    slot
) {

    const toy =
        toyHome[slot];


    const gapX =
        toy.left +
        toy.width / 2;


    BALLS.forEach(
        (
            ball,
            index
        ) => {

            const bx =
                ball.x +
                ball.radius;


            const dx =
                gapX -
                bx;


            const distance =
                Math.abs(
                    dx
                );


            if (
                distance >
                175
            ) {
                return;
            }


            const power =
                1 -
                distance /
                175;


            const direction =
                dx < 0
                    ? -1
                    : 1;


            const variation =
                .75 +
                (
                    (
                        index * 23
                    ) %
                    26
                ) /
                100;


            ball.vx +=
                direction *
                power *
                1.9 *
                variation;


            ball.vy -=
                power *
                .45 *
                variation;
        }
    );


    startBallPhysics();
}

/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside
        .getBoundingClientRect();


    const rect =
        element
        .getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}


/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy =
        toy;
}


/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const toyRect =
        getLocalRect(
            grabbedToy
        );


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX + 85;


    const anchorY =
        52 +
        cableLength;


    heldOffsetX =
        toyRect.left -
        anchorX;


    heldOffsetY =
        toyRect.top -
        anchorY;
}


function getHeldTarget() {

    if (
        !grabbedToy
    ) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX + 85;


    const anchorY =
        52 +
        cableLength;


    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW
========================================================= */

function followToy() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const target =
        getHeldTarget();


    if (
        !target
    ) {
        return;
    }


    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );


    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }


    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }


    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .42;


    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (
        followFrame !== null
    ) {

        cancelAnimationFrame(
            followFrame
        );


        followFrame =
            null;
    }
}

    );


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(
        180
    );


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        120
    );
}


/* =========================================================
   MOVE TO SHAFT
========================================================= */

async function moveToShaft(
    toy
) {

    toy.style.transition =
        "transform .20s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(
        470
    );


    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(
        450
    );


    await wait(
        260
    );


    await settleSwing(
        toy
    );
}


/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(
    toy
) {

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(
        760
    );


    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(
        470
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transition =
        "transform .15s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        220
    );
}


/* =========================================================
   SMOOTH DROP
========================================================= */

function animateSmoothDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(now) {

                const progress =
                    Math.min(
                        (
                            now -
                            start
                        ) /
                        duration,
                        1
                    );


                /*
                   Ускорение падения.
                */

                const eased =
                    progress *
                    progress;


                const y =
                    startTop +
                    (
                        endTop -
                        startTop
                    ) *
                    eased;


                toy.style.top =
                    `${y}px`;


                toy.style.transform =
                    `rotate(
                        ${progress * 2}deg
                     )
                     scale(
                        ${1 - progress * .025}
                     )`;


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );
        }
    );
}


/* =========================================================
   DROP
========================================================= */

async function dropIntoShaft(
    toy
) {

    stopFollowingToy();


    const before =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${before.left}px`;


    toy.style.top =
        `${before.top}px`;


    toy.style.bottom =
        "auto";


    toy.style.transform =
        "rotate(0deg)";


    /*
       Центрируем над шахтой.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width / 2;


    toy.style.transition =
        "left .26s cubic-bezier(.22,.65,.35,1)";


    toy.style.left =
        `${fixedLeft}px`;


    await wait(
        280
    );


    const releaseTop =
        parseFloat(
            toy.style.top
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${fixedLeft}px`;


    toy.style.top =
        `${releaseTop}px`;


    toy.classList.add(
        "dropping"
    );


    await wait(
        70
    );


    setClaw(
        "open"
    );


    await wait(
        180
    );


    /*
       Одно непрерывное
       плавное падение.
    */

    await animateSmoothDrop(
        toy,
        releaseTop,
        releaseTop + 315,
        520
    );


    toy.style.opacity =
        "0";


    await wait(
        70
    );


    toy.classList.remove(
        "dropping"
    );
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(
    toy
) {

    await liftGrabbedToy();


    await settleSwing(
        toy
    );


    await moveToShaft(
        toy
    );


    await lowerOverShaft(
        toy
    );


    await dropIntoShaft(
        toy
    );


    /*
       Приз строго по центру
       окна.
    */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    prizeToy.style.pointerEvents =
        "auto";


    waitingForPrize =
        true;


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    currentSlot =
        1;


    updatePosition();


    await wait(
        930
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_WRONG_LIFT
    );


    /*
       Шарики занимают место,
       пока игрушка поднимается.
    */

    await wait(
        220
    );


    collapseBallsIntoGap(
        index
    );


    await wait(
        500
    );


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(
        150
    );


    setClaw(
        "open"
    );


    await wait(
        190
    );


    stopFollowingToy();


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    await wait(
        60
    );


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    const lockedLeft =
        pos.left;


    toy.style.left =
        `${lockedLeft}px`;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    /*
       Когда игрушка падает обратно,
       она снова расталкивает
       ближайшие шарики.
    */

    await wait(
        270
    );


    pushBallsFromClaw(
        index,
        .48
    );


    await wait(
        170
    );


    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(
        90
    );


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(
        180
    );


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        150
    );


    /*
       Возвращаем точную
       домашнюю позицию.
    */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught",
        "dropping"
    );


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }


        const toy =
            toys[
                currentSlot
            ];


        if (
            !toy
        ) {
            return;
        }


        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }


        busy =
            true;


        try {

            /*
               Открываем.
            */

            await openClaw();


            await wait(
                90
            );


            /*
               Входим в шарики.
            */

            await lowerClawToToy(
                toy
            );


            await wait(
                140
            );


            /*
               Захватываем.
            */

            await grabToyNaturally(
                toy
            );


            const correct =
                toy.dataset.correct ===
                "true";


            if (
                correct
            ) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   PRIZE
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }


        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }


        const wonToySrc =
            prizeToy.src;


        prizeToy.style.pointerEvents =
            "none";


        bigPrizeToy.src =
            wonToySrc;


        prizeToy.classList.remove(
            "show"
        );


        addToyToPouch(
            wonToySrc
        );


        prizeOverlay.classList.add(
            "show"
        );


        if (
            roundIndex ===
            ROUNDS.length - 1
        ) {

            nextButton.style.display =
                "none";


            finalText.style.display =
                "block";
        }
    }
);


/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length - 1
        ) {
            return;
        }


        nextButton.disabled =
            true;


        prizeOverlay.classList.remove(
            "show"
        );


        await wait(
            380
        );


        bigPrizeToy.src =
            "";


        roundIndex++;


        loadRound(
            roundIndex
        );


        nextButton.disabled =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

createBalls();

loadRound(
    roundIndex
);

</script>
