<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    display:grid;
    place-items:center;
    background:#eee8e3;
    font-family:"Trebuchet MS",Arial,sans-serif;
    user-select:none;
}

button{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport{
    position:relative;
    overflow:hidden;
}

#game{
    position:absolute;
    left:0;
    top:0;

    width:1920px;
    height:1080px;

    overflow:hidden;
    transform-origin:top left;

    background:
        url("fon.png")
        center/cover
        no-repeat;
}

/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task{
    position:absolute;

    left:115px;
    top:145px;

    width:520px;

    padding:30px 35px;

    border-radius:34px;

    background:rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align:center;
    color:#40506a;

    z-index:20;
}

.task-small{
    font-size:24px;
    font-weight:800;
    opacity:.72;
}

.task-main{
    margin-top:8px;

    font-size:42px;
    line-height:1.08;

    font-weight:900;
}

.task-main b{
    color:#ed5573;
}

.progress{
    position:absolute;

    left:165px;
    top:390px;

    width:420px;

    padding:20px;

    border-radius:28px;

    background:rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align:center;

    color:#4c5870;

    font-size:27px;
    font-weight:900;

    z-index:20;
}

/* =========================================================
   АВТОМАТ

   Новая картинка 1024×1536.
   Показываем её высотой 1030 px.

   Масштаб:
   1030 / 1536 = 0.67057

   Итоговая ширина ≈ 687 px.
========================================================= */

#machine{
    position:absolute;

    left:805px;
    top:20px;

    width:687px;
    height:1030px;

    z-index:10;
}

/* =========================================================
   BACK

   Самый нижний слой автомата.
========================================================= */

#machineBack{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:fill;

    z-index:1;

    pointer-events:none;
}

/* =========================================================
   ВНУТРЕННЯЯ ИГРОВАЯ ЗОНА

   Координаты рассчитаны по новой картинке.
========================================================= */

#machineInside{
    position:absolute;

    left:80px;
    top:164px;

    width:527px;
    height:507px;

    overflow:hidden;

    z-index:10;
}

/* =========================================================
   РЕЛЬС

   Он нужен только для механики клешни.
========================================================= */

#rail{
    position:absolute;

    left:22px;
    top:20px;

    width:480px;
    height:12px;

    border-radius:10px;

    background:
        linear-gradient(
            #f6f8f8,
            #7b878b 45%,
            #4f595e 65%,
            #d8dfe1
        );

    box-shadow:
        0 3px 4px rgba(0,0,0,.15);

    z-index:12;
}

/* =========================================================
   КЛЕШНЯ
========================================================= */

#clawRig{
    --cable:55px;

    position:absolute;

    left:168px;
    top:5px;

    width:190px;
    height:490px;

    z-index:40;

    transition:
        left .82s cubic-bezier(.22,.61,.36,1);
}

/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart{
    position:absolute;

    left:34px;
    top:0;

    width:122px;
    height:83px;

    object-fit:contain;

    z-index:42;

    pointer-events:none;
}

/* =========================================================
   ТРОС
========================================================= */

#cableAnchor{
    position:absolute;

    left:92px;
    top:58px;

    width:6px;

    z-index:41;
}

#cable{
    position:absolute;

    left:0;
    top:0;

    width:6px;

    height:var(--cable);

    border-radius:4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}

/* =========================================================
   КОРПУС КЛЕШНИ
========================================================= */

#clawAssembly{
    position:absolute;

    left:-88px;

    top:calc(var(--cable) - 12px);

    width:182px;
    height:205px;

    z-index:45;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}

#clawBody{
    position:absolute;

    left:47px;
    top:0;

    width:88px;

    object-fit:contain;

    z-index:48;

    pointer-events:none;
}

/* =========================================================
   ЛАПКИ
========================================================= */

#clawLeft{
    position:absolute;

    left:23px;
    top:60px;

    width:82px;

    object-fit:contain;

    transform-origin:66px 17px;

    z-index:50;

    transition:
        transform .46s cubic-bezier(.34,1.25,.64,1);
}

#clawRight{
    position:absolute;

    left:77px;
    top:60px;

    width:82px;

    object-fit:contain;

    transform-origin:16px 17px;

    z-index:50;

    transition:
        transform .46s cubic-bezier(.34,1.25,.64,1);
}

/* обычная */

#clawAssembly.neutral #clawLeft{
    transform:rotate(5deg);
}

#clawAssembly.neutral #clawRight{
    transform:rotate(-5deg);
}

/* открытая */

#clawAssembly.open #clawLeft{
    transform:rotate(27deg);
}

#clawAssembly.open #clawRight{
    transform:rotate(-27deg);
}

/* закрытая */

#clawAssembly.closed #clawLeft{
    transform:rotate(-23deg);
}

#clawAssembly.closed #clawRight{
    transform:rotate(23deg);
}

/* =========================================================
   ИГРУШКИ

   Они теперь стоят на реальном полу,
   который уже нарисован в machine-back.
========================================================= */

.toy{
    position:absolute;

    bottom:39px;

    width:104px;
    height:116px;

    object-fit:contain;
    object-position:center bottom;

    z-index:22;

    pointer-events:none;

    transform-origin:50% 25%;

    will-change:left,top,transform;
}

#toy0{
    left:49px;
}

#toy1{
    left:188px;
}

#toy2{
    left:327px;
}

/* небольшая глубина */

.toy:not(.caught){
    filter:
        drop-shadow(
            0 7px 4px
            rgba(62,46,54,.16)
        );
}

/* =========================================================
   ЗАХВАЧЕННАЯ ИГРУШКА
========================================================= */

.toy.caught{
    z-index:38;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(45,35,40,.13)
        );
}

/* =========================================================
   ПОКАЧИВАНИЕ

   rotate через отдельное свойство,
   поэтому оно не ломает координаты.
========================================================= */

.toy.swing{
    animation:
        hangingToy .72s ease-in-out
        infinite alternate;
}

@keyframes hangingToy{
    from{
        rotate:-2.4deg;
    }

    to{
        rotate:2.4deg;
    }
}

/* =========================================================
   FRONT

   Это НАШ НОВЫЙ ПРОЗРАЧНЫЙ СЛОЙ.

   Именно он закрывает игрушку,
   когда она падает в шахту.
========================================================= */

#machineFront{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:fill;

    z-index:100;

    pointer-events:none;
}

/* =========================================================
   БЛИК СТЕКЛА

   Очень слабый.
========================================================= */

#glass{
    position:absolute;

    left:80px;
    top:164px;

    width:527px;
    height:507px;

    overflow:hidden;

    pointer-events:none;

    z-index:90;
}

#glass::before{
    content:"";

    position:absolute;

    left:45px;
    top:-120px;

    width:54px;
    height:760px;

    transform:rotate(17deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.13),
            transparent
        );
}

/* =========================================================
   КНОПКИ

   Координаты уже под НОВЫЙ автомат.
========================================================= */

.control{
    position:absolute;

    border:0;
    padding:0;

    background:transparent;

    cursor:pointer;

    z-index:150;

    -webkit-tap-highlight-color:transparent;
}

#leftButton{
    left:154px;
    top:735px;

    width:82px;
    height:72px;

    border-radius:50%;
}

#rightButton{
    left:240px;
    top:735px;

    width:82px;
    height:72px;

    border-radius:50%;
}

#grabButton{
    left:367px;
    top:720px;

    width:96px;
    height:96px;

    border-radius:50%;
}

.control:active{
    transform:scale(.92);
}

/* =========================================================
   ПРИЗ

   Появляется внутри нарисованного окна.
========================================================= */

#prizeToy{
    position:absolute;

    left:484px;
    top:760px;

    width:105px;
    height:96px;

    object-fit:contain;

    opacity:0;

    transform:
        translateY(-20px)
        scale(.75);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    z-index:125;

    pointer-events:none;
}

#prizeToy.show{
    opacity:1;

    transform:
        translateY(0)
        scale(1);
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>

    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <div id="machine">

        <!-- НИЖНИЙ СЛОЙ -->

        <img
            id="machineBack"
            src="machine-back.png"
            alt=""
            draggable="false"
        >


        <!-- ВСЯ АНИМАЦИЯ МЕЖДУ ДВУМЯ СЛОЯМИ -->

        <div id="machineInside">

            <div id="rail"></div>


            <!-- КЛЕШНЯ -->

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >

                <div id="cableAnchor">

                    <div id="cable"></div>

                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <!-- ИГРУШКИ -->

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                alt="Собака"
                draggable="false"
            >

            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                alt="Лиса"
                draggable="false"
            >

            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                alt="Ананас"
                draggable="false"
            >

        </div>


        <div id="glass"></div>


        <!-- ВЕРХНИЙ ПРОЗРАЧНЫЙ СЛОЙ -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >


        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>

        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>

        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>

    </div>

</div>
</div>


<script>

/* =========================================================
   РАЗМЕРЫ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 527;
const INSIDE_HEIGHT = 507;


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame(){

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}

window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [
    document.getElementById("toy0"),
    document.getElementById("toy1"),
    document.getElementById("toy2")
];


/* =========================================================
   ПОЗИЦИИ

   rigX + 95 = центр клешни.
========================================================= */

const SLOT_X = [
    6,
    145,
    284
];


/*
   Центр настоящей шахты справа.

   Важно:
   никакого CSS-отверстия больше нет.
*/

const DROP_RIG_X = 330;


/* =========================================================
   ТРОС
========================================================= */

const CABLE_HOME = 48;

/*
   До игрушки.
*/

const CABLE_GRAB = 250;

/*
   Игрушка полностью поднята.
*/

const CABLE_LIFT = 60;

/*
   Над шахтой.
*/

const CABLE_DROP = 248;

/*
   Ошибка — чуть подняли.
*/

const CABLE_WRONG_LIFT = 170;


/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;

let followLag = {
    x:0,
    y:0
};


/* =========================================================
   HELPERS
========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


/* =========================================================
   CLAW
========================================================= */

function setClaw(state){

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(state);
}


async function neutralClaw(){

    setClaw("neutral");

    await wait(400);
}


async function openClaw(){

    setClaw("open");

    await wait(460);
}


async function closeClaw(){

    setClaw("closed");

    await wait(460);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length){

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE RIG
========================================================= */

function moveRigTo(x){

    clawRig.style.left =
        `${x}px`;
}


function updatePosition(){

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   BUTTONS
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if(busy || currentSlot <= 0){
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if(busy || currentSlot >= 2){
            return;
        }

        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   ИСХОДНЫЕ ПОЗИЦИИ
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);

        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)
        };
    });


/* =========================================================
   ФАКТИЧЕСКИЕ КООРДИНАТЫ ИГРУШКИ

   Нужны для перехода bottom -> top БЕЗ СКАЧКА.
========================================================= */

function getToyLocalPosition(toy){

    const insideRect =
        machineInside.getBoundingClientRect();

    const toyRect =
        toy.getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (toyRect.left - insideRect.left) /
            scale,

        top:
            (toyRect.top - insideRect.top) /
            scale
    };
}


/* =========================================================
   ЗАХВАТ

   ВАЖНО:
   это всё время ОДНА И ТА ЖЕ PNG.

   Никакой копии.
   Никакого opacity.
   Никакого пересоздания.
========================================================= */

function attachRealToy(toy){

    const position =
        getToyLocalPosition(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${position.left}px`;

    toy.style.top =
        `${position.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add("caught");

    grabbedToy = toy;
}


/* =========================================================
   ТОЧКА УДЕРЖАНИЯ

   Игрушка не приклеена прямо к центру корпуса.
   Она висит немного ниже между лапками.
========================================================= */

function getHeldToyPosition(){

    if(!grabbedToy){
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(clawRig).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const toyWidth =
        grabbedToy.offsetWidth;

    return {

        left:
            rigX +
            95 -
            toyWidth / 2,

        top:
            58 +
            cableLength +
            78
    };
}


/* =========================================================
   FOLLOW

   Используем небольшое сглаживание.

   Игрушка не "прикручена" к клешне:
   она слегка догоняет её.

   Это создаёт ощущение веса.
========================================================= */

function followToy(){

    if(!grabbedToy){
        return;
    }

    const target =
        getHeldToyPosition();

    if(!target){
        return;
    }

    const currentLeft =
        parseFloat(grabbedToy.style.left);

    const currentTop =
        parseFloat(grabbedToy.style.top);

    /*
       Вертикально держим достаточно крепко,
       горизонтально оставляем небольшую инерцию.
    */

    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .28;

    const nextTop =
        currentTop +
        (target.top - currentTop) * .42;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(followToy);
}


function startFollowingToy(){

    stopFollowingToy();

    followToy();
}


function stopFollowingToy(){

    if(followFrame !== null){

        cancelAnimationFrame(followFrame);

        followFrame = null;
    }
}


/* =========================================================
   МОМЕНТ КОНТАКТА

   Здесь мы специально НЕ тянем игрушку
   резко в центр.

   Сначала лапки закрылись.
   Потом игрушка едва заметно отрывается от пола.
========================================================= */

async function settleToyIntoClaw(){

    if(!grabbedToy){
        return;
    }

    const target =
        getHeldToyPosition();

    const currentTop =
        parseFloat(grabbedToy.style.top);

    const currentLeft =
        parseFloat(grabbedToy.style.left);

    /*
       Максимум несколько px коррекции.
       Это предотвращает "телепорт".
    */

    const dx =
        Math.max(
            -7,
            Math.min(
                7,
                target.left - currentLeft
            )
        );

    grabbedToy.style.transition =
        "left .24s ease-out, top .24s ease-out";

    grabbedToy.style.left =
        `${currentLeft + dx}px`;

    /*
       Первый отрыв от пола:
       всего 7 пикселей.
    */

    grabbedToy.style.top =
        `${currentTop - 7}px`;

    await wait(250);

    grabbedToy.style.transition =
        "none";
}


/* =========================================================
   ОПУСКАНИЕ ОТКРЫТОЙ КЛЕШНИ
========================================================= */

async function lowerOpenClaw(){

    setCable(CABLE_GRAB);

    await wait(960);
}


/* =========================================================
   ПРАВИЛЬНЫЙ ЗАХВАТ
========================================================= */

async function correctSequence(toy){

    /*
       Лапки уже закрылись вокруг игрушки.
    */

    attachRealToy(toy);

    /*
       Очень маленький первый отрыв.
    */

    await settleToyIntoClaw();

    /*
       Теперь начинаем физическое следование.
    */

    startFollowingToy();


    /* =====================================================
       ПОДЪЁМ

       В начале движения игрушка чуть отстаёт,
       потом догоняет клешню.
    ===================================================== */

    toy.classList.add("swing");

    setCable(CABLE_LIFT);

    await wait(1050);


    /*
       Короткая стабилизация наверху.
    */

    await wait(130);


    /* =====================================================
       ДВИЖЕНИЕ К ШАХТЕ
    ===================================================== */

    moveRigTo(DROP_RIG_X);

    await wait(920);


    /*
       После остановки даём игрушке закончить
       одно небольшое покачивание.
    */

    await wait(180);


    /* =====================================================
       ОПУСКАНИЕ

       Замедляемся перед шахтой.
    ===================================================== */

    setCable(CABLE_DROP);

    await wait(980);


    toy.classList.remove("swing");

    await wait(140);


    /* =====================================================
       ОТПУСКАЕМ

       Сначала лапки начинают раскрываться.
    ===================================================== */

    await openClaw();


    /*
       Теперь игрушка больше не следует
       за клешнёй.
    */

    stopFollowingToy();


    /*
       Получаем ЕЁ ФАКТИЧЕСКУЮ позицию
       именно после отпускания.
    */

    const currentTop =
        parseFloat(
            getComputedStyle(toy).top
        );

    const currentLeft =
        parseFloat(
            getComputedStyle(toy).left
        );


    /* =====================================================
       ПАДЕНИЕ В НАСТОЯЩУЮ ШАХТУ

       Никакого opacity во время видимого падения.

       machine-front находится ПЕРЕД игрушкой,
       поэтому край отверстия сам её перекроет.
    ===================================================== */

    toy.style.transition =
        "top .48s cubic-bezier(.38,.02,.78,.32), left .48s ease-in, transform .48s ease-in";


    /*
       Небольшое смещение в центр шахты.
    */

    toy.style.left =
        `${currentLeft + 4}px`;

    /*
       Ускорение вниз.
    */

    toy.style.top =
        `${currentTop + 155}px`;

    toy.style.transform =
        "rotate(7deg)";

    await wait(490);


    /*
       Теперь игрушка уже должна находиться
       ЗА передней кромкой machine-front.

       Продолжаем падение глубже.
    */

    toy.style.transition =
        "top .30s cubic-bezier(.55,.05,.9,.4), transform .30s ease-in";

    toy.style.top =
        `${currentTop + 245}px`;

    toy.style.transform =
        "rotate(11deg) scale(.92)";

    await wait(310);


    /*
       Она физически скрылась за слоем.
       Только теперь opacity = 0,
       пользователь этого момента уже не видит.
    */

    toy.style.opacity = "0";


    /*
       Имитация прохождения по внутреннему каналу.
    */

    await wait(330);


    /* =====================================================
       ПРИЗ ПОЯВЛЯЕТСЯ В НИЖНЕМ ОКНЕ
    ===================================================== */

    prizeToy.src =
        toy.src;

    prizeToy.classList.add("show");

    await wait(650);


    /* =====================================================
       ПУСТАЯ КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(CABLE_HOME);

    await wait(980);


    /* =====================================================
       ВОЗВРАЩЕНИЕ В ЦЕНТР
    ===================================================== */

    currentSlot = 1;

    updatePosition();

    await wait(850);


    await neutralClaw();

    grabbedToy = null;
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА

   Здесь тоже та же PNG.

   Подняли немного -> лапки раскрылись ->
   игрушка падает на своё место.
========================================================= */

async function wrongSequence(toy,index){

    attachRealToy(toy);

    await settleToyIntoClaw();

    startFollowingToy();

    toy.classList.add("swing");


    /*
       Поднимаем совсем немного.
    */

    setCable(CABLE_WRONG_LIFT);

    await wait(720);


    toy.classList.remove("swing");

    await wait(80);


    /*
       Разжимаем лапки.
    */

    await openClaw();

    stopFollowingToy();


    /*
       Точное исходное место.
    */

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    /*
       Настоящее падение:
       сначала ускоряется.
    */

    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.78,.34), transform .43s ease-in";

    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(-3deg)";

    await wait(430);


    /*
       Очень маленькое сжатие мягкой игрушки
       при касании пола.
    */

    toy.style.transition =
        "transform .10s ease-out";

    toy.style.transform =
        "rotate(1deg) scaleY(.96)";

    await wait(100);


    /*
       Возвращается в форму.
    */

    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";

    toy.style.transform =
        "rotate(0deg) scaleY(1)";

    await wait(190);


    /*
       Возвращаем исходную CSS-систему координат.
       Визуально ничего не прыгает.
    */

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform = "";

    toy.classList.remove("caught");


    /*
       Клешня вверх.
    */

    setCable(CABLE_HOME);

    await wait(980);

    await neutralClaw();

    grabbedToy = null;
}


/* =========================================================
   КРАСНАЯ КНОПКА
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if(busy){
            return;
        }

        const toy =
            toys[currentSlot];

        if(!toy){
            return;
        }

        if(
            getComputedStyle(toy).opacity === "0"
        ){
            return;
        }

        busy = true;

        try{

            /*
               1.
               Лапки плавно раскрываются.
            */

            await openClaw();


            /*
               Небольшая механическая пауза.
            */

            await wait(90);


            /*
               2.
               Открытая клешня опускается.
            */

            await lowerOpenClaw();


            /*
               Очень короткая пауза непосредственно
               над игрушкой создаёт ощущение веса
               механизма.
            */

            await wait(90);


            /*
               3.
               Лапки закрываются ВОКРУГ
               пока ещё неподвижной игрушки.
            */

            await closeClaw();


            /*
               Маленькая пауза:
               клешня уже сжала игрушку,
               но ещё не начала подъём.
            */

            await wait(100);


            const correct =
                toy.dataset.correct === "true";


            if(correct){

                await correctSequence(toy);

            }else{

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        }finally{

            busy = false;
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "ArrowLeft"){
            leftButton.click();
        }

        if(event.key === "ArrowRight"){
            rightButton.click();
        }

        if(event.code === "Space"){

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

prizeToy.src = "";

prizeToy.classList.remove("show");


toys.forEach(
    toy => {

        toy.style.opacity = "1";
    }
);


setCable(CABLE_HOME);

setClaw("neutral");

currentSlot = 1;

updatePosition();

</script>
