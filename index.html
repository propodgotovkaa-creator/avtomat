<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

/* =====================================================
   ОСНОВА
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;

  background: #f6e5dc;

  font-family: "Trebuchet MS", Arial, sans-serif;

  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   МАСШТАБИРУЕМОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;

  transform-origin: top left;

  /* НАШ НОВЫЙ ФОН */
  background-image: url("fon.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* =====================================================
   ЗАДАНИЕ
===================================================== */

.task {
  position: absolute;

  left: 80px;
  top: 80px;

  width: 520px;

  padding: 30px 35px;

  border-radius: 35px;

  background: rgba(255,255,255,.92);

  box-shadow:
    0 12px 0 rgba(157,83,66,.12),
    0 20px 35px rgba(79,46,51,.12);

  text-align: center;

  color: #5b3e67;

  backdrop-filter: blur(4px);
}

.task-small {
  font-size: 25px;
  font-weight: 800;

  opacity: .72;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #ef4c5c;
}

/* =====================================================
   ПРОГРЕСС
===================================================== */

.progress {
  position: absolute;

  left: 120px;
  top: 315px;

  width: 440px;

  padding: 22px 30px;

  border-radius: 28px;

  background: rgba(255,255,255,.82);

  text-align: center;

  font-size: 27px;
  font-weight: 900;

  color: #6d4b6f;

  box-shadow:
    0 10px 25px rgba(80,50,60,.08);

  backdrop-filter: blur(4px);
}

/* =====================================================
   АВТОМАТ
===================================================== */

.machine {
  position: absolute;

  left: 670px;
  top: 20px;

  width: 790px;
  height: 1040px;

  border-radius: 28px 28px 18px 18px;

  background: #f55262;

  border: 12px solid #c93750;

  box-shadow:
    0 18px 0 #9f3046,
    0 35px 55px rgba(78,35,50,.28);
}

/* =====================================================
   ВЕРХНЯЯ ВЫВЕСКА
===================================================== */

.machine-sign {
  position: absolute;

  left: 25px;
  right: 25px;
  top: 20px;

  height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 20px;

  background: #fff2a8;

  border: 7px solid #ffcc55;

  box-shadow:
    inset 0 -8px 0 rgba(222,158,55,.14);

  color: #df4259;

  font-size: 41px;
  font-weight: 900;

  letter-spacing: 2px;
}

/* =====================================================
   СТЕКЛО
===================================================== */

.glass {
  position: absolute;

  left: 42px;
  top: 140px;

  width: 682px;
  height: 625px;

  overflow: hidden;

  border: 11px solid #b52e49;
  border-radius: 14px;

  /*
    Пока сохраняем нынешнее стекло.
    На следующем этапе сделаем его
    действительно прозрачным.
  */

  background:
    linear-gradient(
      118deg,
      rgba(255,255,255,.55) 0%,
      rgba(255,255,255,.12) 18%,
      rgba(255,255,255,.06) 19%,
      rgba(255,255,255,.22) 35%,
      rgba(255,255,255,.03) 36%
    ),
    rgba(218,247,255,.88);

  box-shadow:
    inset 0 0 28px rgba(38,103,130,.18);
}

/* БЛИК */

.glass::after {
  content: "";

  position: absolute;

  left: 45px;
  top: -100px;

  width: 70px;
  height: 850px;

  transform: rotate(19deg);

  background: rgba(255,255,255,.17);

  pointer-events: none;

  z-index: 50;
}

/* =====================================================
   ПОЛ ВНУТРИ АВТОМАТА
===================================================== */

.toy-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 112px;

  background:
    linear-gradient(
      #f8cad2,
      #e8a9b8
    );

  border-top: 7px solid #cf7f92;

  z-index: 1;
}

/* =====================================================
   РЕЛЬС
===================================================== */

.rail {
  position: absolute;

  left: 38px;
  right: 38px;
  top: 32px;

  height: 18px;

  border-radius: 20px;

  background:
    linear-gradient(
      #86939e,
      #46515b
    );

  border: 3px solid #39434c;

  box-shadow:
    0 5px 8px rgba(0,0,0,.16);

  z-index: 20;
}

/* =====================================================
   КЛЕШНЯ
===================================================== */

#clawAssembly {
  position: absolute;

  left: 276px;
  top: 26px;

  width: 110px;
  height: 480px;

  z-index: 30;

  transition: left .18s linear;
}

.claw-cart {
  position: absolute;

  left: 24px;
  top: -5px;

  width: 62px;
  height: 43px;

  border-radius: 8px;

  background:
    linear-gradient(
      #929da5,
      #56616a
    );

  border: 4px solid #414b54;

  z-index: 4;
}

#cable {
  position: absolute;

  left: 52px;
  top: 35px;

  width: 6px;
  height: 75px;

  border-radius: 10px;

  background: #343b42;

  transition: height .62s ease-in-out;
}

#clawHead {
  position: absolute;

  left: 5px;
  top: 105px;

  width: 100px;
  height: 100px;

  transition: top .62s ease-in-out;
}

.claw-center {
  position: absolute;

  left: 33px;
  top: 0;

  width: 34px;
  height: 33px;

  border-radius: 8px 8px 15px 15px;

  background:
    linear-gradient(
      #aeb6bc,
      #65717a
    );

  border: 4px solid #4a555e;
}

.claw-arm {
  position: absolute;

  top: 25px;

  width: 10px;
  height: 72px;

  border-radius: 10px;

  background: #66737c;

  transform-origin: top center;

  transition: transform .22s ease;
}

.claw-arm.left {
  left: 32px;
  transform: rotate(32deg);
}

.claw-arm.right {
  right: 32px;
  transform: rotate(-32deg);
}

#clawHead.closed .claw-arm.left {
  transform: rotate(11deg);
}

#clawHead.closed .claw-arm.right {
  transform: rotate(-11deg);
}

.claw-tip {
  position: absolute;

  bottom: -2px;

  width: 27px;
  height: 10px;

  border-radius: 10px;

  background: #66737c;
}

.left .claw-tip {
  left: -16px;
  transform: rotate(24deg);
}

.right .claw-tip {
  right: -16px;
  transform: rotate(-24deg);
}

/* =====================================================
   ИГРУШКИ
===================================================== */

.toy {
  position: absolute;

  top: 390px;

  width: 155px;
  height: 180px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  z-index: 10;

  transition:
    left .55s ease,
    top .55s ease,
    transform .45s ease,
    opacity .3s ease;

  transform-origin: center bottom;
}

.toy-body {
  position: relative;

  width: 140px;
  height: 140px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 48% 48% 42% 42%;

  background: #f0a9b8;

  border: 7px solid rgba(255,255,255,.88);

  box-shadow:
    0 10px 0 rgba(115,65,82,.13),
    0 14px 18px rgba(76,59,72,.12);

  font-size: 82px;
}

.toy:nth-of-type(5) .toy-body {
  background: #a8d8ff;
}

.toy:nth-of-type(6) .toy-body {
  background: #b8e5a3;
}

.toy:nth-of-type(7) .toy-body {
  background: #e6b5ff;
}

.toy-body::before,
.toy-body::after {
  content: "";

  position: absolute;

  bottom: -19px;

  width: 38px;
  height: 42px;

  border-radius: 50%;

  background: inherit;

  border: 5px solid rgba(255,255,255,.82);

  z-index: -1;
}

.toy-body::before {
  left: 18px;
  transform: rotate(17deg);
}

.toy-body::after {
  right: 18px;
  transform: rotate(-17deg);
}

/* =====================================================
   ТРИ ПОЗИЦИИ
===================================================== */

.toy[data-slot="0"] {
  left: 48px;
}

.toy[data-slot="1"] {
  left: 255px;
}

.toy[data-slot="2"] {
  left: 462px;
}

/* =====================================================
   НИЖНЯЯ ЧАСТЬ АВТОМАТА
===================================================== */

.lower-machine {
  position: absolute;

  left: 42px;
  top: 785px;

  width: 682px;
  height: 225px;

  border-radius: 12px;

  background:
    linear-gradient(
      #ff6978,
      #e84b62
    );

  border: 8px solid #b52e49;

  box-shadow:
    inset 0 8px 0 rgba(255,255,255,.12);
}

/* =====================================================
   ПАНЕЛЬ СТРЕЛОК
===================================================== */

.control-panel {
  position: absolute;

  left: 28px;
  top: 28px;

  width: 300px;
  height: 150px;

  border-radius: 20px;

  background: #ffd86a;

  border: 6px solid #e9a83d;

  box-shadow:
    0 7px 0 #bc7432;
}

.arrows {
  position: absolute;

  left: 20px;
  top: 26px;

  display: flex;
  gap: 18px;
}

.arrow-button {
  width: 105px;
  height: 88px;

  border: 0;
  border-radius: 18px;

  background:
    linear-gradient(
      #66c5f1,
      #398fc7
    );

  color: white;

  font-size: 57px;
  line-height: 1;

  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 0 #23689a,
    0 11px 15px rgba(0,0,0,.18);
}

.arrow-button:active {
  transform: translateY(6px);

  box-shadow:
    0 2px 0 #23689a;
}

/* =====================================================
   КРАСНАЯ КНОПКА
===================================================== */

.red-base {
  position: absolute;

  left: 355px;
  top: 47px;

  width: 125px;
  height: 112px;

  border-radius: 50%;

  background: #852b37;

  box-shadow:
    0 8px 0 #64222c;
}

#grabButton {
  position: absolute;

  left: 8px;
  top: -7px;

  width: 109px;
  height: 94px;

  border: 0;
  border-radius: 50%;

  cursor: pointer;

  background:
    radial-gradient(
      circle at 35% 25%,
      #ff9999 0%,
      #ff414d 28%,
      #df142c 65%,
      #a50920 100%
    );

  box-shadow:
    inset 0 7px 8px rgba(255,255,255,.42),
    inset 0 -8px 10px rgba(90,0,10,.28),
    0 9px 0 #8e0a20,
    0 13px 17px rgba(0,0,0,.25);
}

#grabButton:active {
  top: 1px;

  box-shadow:
    inset 0 4px 7px rgba(255,255,255,.3),
    inset 0 -5px 8px rgba(90,0,10,.25),
    0 2px 0 #8e0a20;
}

.button-hint {
  position: absolute;

  left: 355px;
  top: 155px;

  width: 125px;

  text-align: center;

  color: #8e3040;

  font-size: 14px;
  font-weight: 900;
}

/* =====================================================
   ОКНО ВЫДАЧИ
===================================================== */

.prize-section {
  position: absolute;

  right: 25px;
  top: 24px;

  width: 145px;
  height: 165px;
}

.prize-label {
  position: absolute;

  top: 0;

  width: 100%;

  text-align: center;

  color: white;

  font-size: 17px;
  font-weight: 900;
}

#prizeDoor {
  position: absolute;

  left: 4px;
  top: 30px;

  width: 137px;
  height: 116px;

  overflow: hidden;

  border-radius: 15px;

  background:
    linear-gradient(
      #312a3b,
      #17151d
    );

  border: 8px solid #982e45;

  box-shadow:
    inset 0 12px 25px rgba(0,0,0,.7);

  cursor: default;
}

#doorToy {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-42%)
    scale(.65);

  font-size: 85px;

  opacity: 0;

  transition:
    opacity .3s,
    transform .35s;
}

#prizeDoor.ready {
  cursor: pointer;
}

#prizeDoor.ready #doorToy {
  opacity: 1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

/* =====================================================
   ВЫЛЕТАЮЩИЙ ПРИЗ
===================================================== */

#prizeOverlay {
  position: absolute;

  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(71,47,79,.3);
}

.prize-card {
  position: relative;

  width: 500px;
  height: 560px;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  border-radius: 65px;

  background:
    linear-gradient(
      #fffdf7,
      #fff4da
    );

  border: 13px solid #ffd65c;

  box-shadow:
    0 28px 65px rgba(73,40,58,.32);

  animation:
    prizePop .55s
    cubic-bezier(.2,1.55,.35,1);
}

#bigPrizeEmoji {
  font-size: 245px;
}

#bigPrizeWord {
  margin-top: 5px;

  font-size: 60px;
  font-weight: 900;

  color: #67446d;
}

#nextButton {
  margin-top: 25px;

  padding: 18px 58px;

  border: 0;
  border-radius: 28px;

  background: #f24d60;

  color: white;

  font-size: 29px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 8px 0 #b52d43;
}

#nextButton:active {
  transform: translateY(6px);

  box-shadow:
    0 2px 0 #b52d43;
}

@keyframes prizePop {

  0% {
    opacity: 0;

    transform:
      scale(.15)
      rotate(-15deg);
  }

  100% {
    opacity: 1;

    transform:
      scale(1)
      rotate(0);
  }

}

/* =====================================================
   КОНФЕТТИ
===================================================== */

.spark {
  position: absolute;

  width: 18px;
  height: 18px;

  border-radius: 5px;

  background: #ffd84d;

  animation:
    sparkFly .8s ease-out forwards;
}

@keyframes sparkFly {

  from {
    opacity: 1;

    transform:
      translate(0,0)
      rotate(0);
  }

  to {
    opacity: 0;

    transform:
      translate(
        var(--x),
        var(--y)
      )
      rotate(360deg);
  }

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

#message {
  position: absolute;

  left: 270px;
  top: 440px;

  transform: translateX(-50%);

  padding: 20px 38px;

  border-radius: 28px;

  background: white;

  color: #68466d;

  font-size: 29px;
  font-weight: 900;

  box-shadow:
    0 10px 25px rgba(78,43,58,.18);

  opacity: 0;

  transition: opacity .25s;

  pointer-events: none;
}

#message.show {
  opacity: 1;
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

  <!-- =================================================
       ЗАДАНИЕ
  ================================================== -->

  <div class="task">

    <div class="task-small">
      Поймай нужную игрушку
    </div>

    <div class="task-main">
      Найди звук <b>С</b><br>
      В СЕРЕДИНЕ слова
    </div>

  </div>

  <div class="progress">
    🧸 Раунд 1 из 10
  </div>

  <!-- =================================================
       АВТОМАТ
  ================================================== -->

  <div class="machine">

    <div class="machine-sign">
      ✦ ИГРУШКИ ✦
    </div>

    <!-- СТЕКЛО -->

    <div class="glass">

      <div class="rail"></div>

      <!-- КЛЕШНЯ -->

      <div id="clawAssembly">

        <div class="claw-cart"></div>

        <div id="cable"></div>

        <div id="clawHead">

          <div class="claw-center"></div>

          <div class="claw-arm left">
            <div class="claw-tip"></div>
          </div>

          <div class="claw-arm right">
            <div class="claw-tip"></div>
          </div>

        </div>

      </div>

      <!-- ТРИ ИГРУШКИ -->

      <div
        class="toy"
        data-slot="0"
        data-word="СОВА"
        data-emoji="🦉"
        data-correct="false"
      >
        <div class="toy-body">
          🦉
        </div>
      </div>

      <div
        class="toy"
        data-slot="1"
        data-word="ЛИСА"
        data-emoji="🦊"
        data-correct="true"
      >
        <div class="toy-body">
          🦊
        </div>
      </div>

      <div
        class="toy"
        data-slot="2"
        data-word="АНАНАС"
        data-emoji="🍍"
        data-correct="false"
      >
        <div class="toy-body">
          🍍
        </div>
      </div>

      <div class="toy-floor"></div>

    </div>

    <!-- =================================================
         НИЖНЯЯ ЧАСТЬ
    ================================================== -->

    <div class="lower-machine">

      <div class="control-panel">

        <div class="arrows">

          <button
            class="arrow-button"
            id="leftButton"
          >
            ←
          </button>

          <button
            class="arrow-button"
            id="rightButton"
          >
            →
          </button>

        </div>

      </div>

      <!-- КРАСНАЯ КНОПКА -->

      <div class="red-base">
        <button id="grabButton"></button>
      </div>

      <div class="button-hint">
        ЛОВИ!
      </div>

      <!-- ВЫДАЧА -->

      <div class="prize-section">

        <div class="prize-label">
          ПРИЗ
        </div>

        <div id="prizeDoor">
          <div id="doorToy"></div>
        </div>

      </div>

    </div>

  </div>

  <div id="message"></div>

  <!-- =================================================
       БОЛЬШОЙ ПРИЗ
  ================================================== -->

  <div id="prizeOverlay">

    <div class="prize-card">

      <div id="bigPrizeEmoji">
        🦊
      </div>

      <div id="bigPrizeWord">
        ЛИСА
      </div>

      <button id="nextButton">
        ДАЛЬШЕ
      </button>

    </div>

  </div>

</div>

</div>

<script>

/* =====================================================
   МАСШТАБИРОВАНИЕ 1920 × 1080
===================================================== */

const GAME_W = 1920;
const GAME_H = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale = Math.min(
    window.innerWidth / GAME_W,
    window.innerHeight / GAME_H
  );

  viewport.style.width =
    GAME_W * scale + "px";

  viewport.style.height =
    GAME_H * scale + "px";

  game.style.transform =
    `scale(${scale})`;

}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawAssembly =
  document.getElementById(
    "clawAssembly"
  );

const clawHead =
  document.getElementById(
    "clawHead"
  );

const cable =
  document.getElementById(
    "cable"
  );

const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );

const grabButton =
  document.getElementById(
    "grabButton"
  );

const prizeDoor =
  document.getElementById(
    "prizeDoor"
  );

const doorToy =
  document.getElementById(
    "doorToy"
  );

const prizeOverlay =
  document.getElementById(
    "prizeOverlay"
  );

const bigPrizeEmoji =
  document.getElementById(
    "bigPrizeEmoji"
  );

const bigPrizeWord =
  document.getElementById(
    "bigPrizeWord"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const message =
  document.getElementById(
    "message"
  );

/* =====================================================
   ПОЗИЦИИ КЛЕШНИ
===================================================== */

const SLOT_X = [
  70,
  277,
  484
];

let currentSlot = 1;

let busy = false;
let prizeReady = false;
let currentPrize = null;

/* =====================================================
   ОБНОВЛЕНИЕ КЛЕШНИ
===================================================== */

function updateClawPosition() {

  clawAssembly.style.left =
    SLOT_X[currentSlot] + "px";

}

updateClawPosition();

/* =====================================================
   СТРЕЛКИ
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy || prizeReady) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();

    }

  }
);

rightButton.addEventListener(
  "click",
  () => {

    if (busy || prizeReady) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();

    }

  }
);

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}

/* =====================================================
   СООБЩЕНИЕ
===================================================== */

async function showMessage(text) {

  message.textContent = text;

  message.classList.add("show");

  await wait(950);

  message.classList.remove("show");

}

/* =====================================================
   ИГРУШКА ТЕКУЩЕГО СЛОТА
===================================================== */

function getCurrentToy() {

  return document.querySelector(
    `.toy[data-slot="${currentSlot}"]`
  );

}

/* =====================================================
   ОПУСКАНИЕ КЛЕШНИ
===================================================== */

async function lowerClaw() {

  clawHead.style.top =
    "380px";

  cable.style.height =
    "350px";

  await wait(680);

}

/* =====================================================
   ПОДЪЁМ
===================================================== */

async function raiseEmptyClaw() {

  clawHead.style.top =
    "105px";

  cable.style.height =
    "75px";

  await wait(680);

}

/* =====================================================
   КРАСНАЯ КНОПКА
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy || prizeReady) return;

    busy = true;

    const toy =
      getCurrentToy();

    if (!toy) {

      busy = false;
      return;

    }

    const correct =
      toy.dataset.correct === "true";

    /* ---------------------------------------------
       КЛЕШНЯ ЕДЕТ ВНИЗ
    --------------------------------------------- */

    clawHead.classList.remove(
      "closed"
    );

    await lowerClaw();

    /* ---------------------------------------------
       ЗАКРЫВАЕМ ЛАПКИ
    --------------------------------------------- */

    clawHead.classList.add(
      "closed"
    );

    await wait(300);

    /* ---------------------------------------------
       ЦЕПЛЯЕМ ИГРУШКУ
    --------------------------------------------- */

    toy.style.zIndex = "29";

    toy.style.top = "335px";

    await wait(300);

    /* ---------------------------------------------
       ПОДНИМАЕМ
    --------------------------------------------- */

    clawHead.style.top =
      "105px";

    cable.style.height =
      "75px";

    toy.style.top =
      "65px";

    await wait(720);

    /* =================================================
       НЕПРАВИЛЬНЫЙ ОТВЕТ
    ================================================= */

    if (!correct) {

      await wait(250);

      /* клешня раскрывается */

      clawHead.classList.remove(
        "closed"
      );

      await wait(130);

      /* игрушка падает обратно */

      toy.style.top =
        "390px";

      toy.style.transform =
        "rotate(11deg)";

      await wait(430);

      toy.style.transform =
        "rotate(-5deg)";

      await wait(130);

      toy.style.transform =
        "rotate(0deg)";

      await wait(180);

      toy.style.zIndex = "10";

      await showMessage(
        "Попробуй ещё!"
      );

      busy = false;

      return;
    }

    /* =================================================
       ПРАВИЛЬНАЯ ИГРУШКА
    ================================================= */

    /*
      Перемещаем клешню
      к зоне сброса справа.
    */

    const dropX = 500;

    clawAssembly.style.left =
      dropX + "px";

    toy.style.left =
      dropX + 20 + "px";

    await wait(800);

    /* ---------------------------------------------
       ОТПУСКАЕМ
    --------------------------------------------- */

    clawHead.classList.remove(
      "closed"
    );

    await wait(130);

    toy.style.top =
      "570px";

    toy.style.transform =
      "rotate(14deg) scale(.72)";

    await wait(500);

    toy.style.opacity = "0";

    await wait(250);

    /* ---------------------------------------------
       ПРИЗ ПОЯВЛЯЕТСЯ В ОКНЕ
    --------------------------------------------- */

    currentPrize = {
      word: toy.dataset.word,
      emoji: toy.dataset.emoji
    };

    doorToy.textContent =
      currentPrize.emoji;

    prizeDoor.classList.add(
      "ready"
    );

    prizeReady = true;

    /* ---------------------------------------------
       КЛЕШНЯ ВОЗВРАЩАЕТСЯ
    --------------------------------------------- */

    currentSlot = 1;

    clawAssembly.style.left =
      SLOT_X[currentSlot] + "px";

    await wait(500);

    busy = false;

  }
);

/* =====================================================
   ЗАБИРАЕМ ПРИЗ
===================================================== */

prizeDoor.addEventListener(
  "click",
  () => {

    if (!prizeReady) return;

    bigPrizeEmoji.textContent =
      currentPrize.emoji;

    bigPrizeWord.textContent =
      currentPrize.word;

    prizeOverlay.style.display =
      "flex";

    createSparks();

  }
);

/* =====================================================
   КОНФЕТТИ
===================================================== */

function createSparks() {

  const card =
    document.querySelector(
      ".prize-card"
    );

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    const spark =
      document.createElement("div");

    spark.className = "spark";

    spark.style.left =
      "240px";

    spark.style.top =
      "260px";

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      150 +
      Math.random() * 230;

    spark.style.setProperty(
      "--x",
      Math.cos(angle) *
      distance +
      "px"
    );

    spark.style.setProperty(
      "--y",
      Math.sin(angle) *
      distance +
      "px"
    );

    card.appendChild(spark);

    setTimeout(
      () => spark.remove(),
      900
    );

  }

}

/* =====================================================
   ДАЛЬШЕ
===================================================== */

nextButton.addEventListener(
  "click",
  async () => {

    prizeOverlay.style.display =
      "none";

    prizeDoor.classList.remove(
      "ready"
    );

    doorToy.textContent = "";

    prizeReady = false;

    /*
      Пока оставляем один тестовый раунд.
      10 раундов подключим позже.
    */

    await showMessage(
      "Игрушка поймана! 🧸"
    );

  }
);

</script>
