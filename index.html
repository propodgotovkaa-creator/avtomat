<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}


/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 95px;

    width: 440px;

    padding: 20px 28px 22px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;

    width: 330px;
    height: 105px;

    margin: 10px auto 0;

    object-fit: contain;

    pointer-events: none;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 95px;
    top: 330px;

    width: 390px;

    padding: 16px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   COLLECTION BOX
========================================================= */

#collectionBox {
    position: absolute;

    left: 28px;
    top: 430px;

    width: 520px;
    height: 440px;

    display: none;

    z-index: 18;

    pointer-events: none;
}

#collectionBox.show {
    display: block;
}


/*
   Оба слоя имеют одинаковый холст 1536 x 1024.

   Поэтому их НЕЛЬЗЯ позиционировать отдельно.
   Они лежат пиксель-в-пиксель друг на друге.
*/

#collectionBoxBack,
#collectionBoxFront {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;
}


/*
   Задний слой.
*/

#collectionBoxBack {
    z-index: 1;
}


/*
   Пространство для игрушек.

   Оно находится МЕЖДУ
   задним и передним PNG.
*/

#collectionToys {
    position: absolute;

    left: 67px;
    top: 126px;

    width: 386px;
    height: 225px;

    z-index: 2;

    overflow: visible;

    pointer-events: none;
}


/*
   Передний бортик.

   Он перекрывает нижние части игрушек.
*/

#collectionBoxFront {
    z-index: 3;
}


/* =========================================================
   COLLECTED TOYS
========================================================= */

.collection-toy {
    position: absolute;

    width: 105px;
    height: 120px;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(65,48,55,.15)
        );

    pointer-events: none;
}


/*
   Задний ряд.
*/

.collection-toy.pos-0 {
    left: 25px;
    top: 25px;

    transform:
        rotate(-7deg)
        scale(.90);

    z-index: 1;
}

.collection-toy.pos-1 {
    left: 105px;
    top: 10px;

    transform:
        rotate(4deg)
        scale(.92);

    z-index: 1;
}

.collection-toy.pos-2 {
    left: 190px;
    top: 18px;

    transform:
        rotate(-3deg)
        scale(.90);

    z-index: 1;
}

.collection-toy.pos-3 {
    left: 270px;
    top: 28px;

    transform:
        rotate(7deg)
        scale(.88);

    z-index: 1;
}


/*
   Передний ряд.
*/

.collection-toy.pos-4 {
    left: 55px;
    top: 85px;

    transform:
        rotate(5deg)
        scale(.96);

    z-index: 2;
}

.collection-toy.pos-5 {
    left: 135px;
    top: 78px;

    transform:
        rotate(-5deg)
        scale(1);

    z-index: 2;
}

.collection-toy.pos-6 {
    left: 215px;
    top: 82px;

    transform:
        rotate(4deg)
        scale(.96);

    z-index: 2;
}

.collection-toy.pos-7 {
    left: 285px;
    top: 90px;

    transform:
        rotate(-4deg)
        scale(.92);

    z-index: 2;
}


/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 960px;

    z-index: 10;
}


/* =========================================================
   MACHINE BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 100px;
    top: 150px;

    width: 1085px;
    height: 490px;

    overflow: hidden;

    z-index: 10;
}


/* =========================================================
   CLAW RIG
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 408px;
    top: 20px;

    width: 170px;
    height: 465px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}


/* =========================================================
   CART
========================================================= */

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   CABLE
========================================================= */

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 34;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW ASSEMBLY
========================================================= */

#clawAssembly {
    position: absolute;

    left: -77px;

    top: calc(var(--cable) - 10px);

    width: 160px;
    height: 180px;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW BODY
========================================================= */

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 32;

    pointer-events: none;
}


/* =========================================================
   LEFT CLAW
========================================================= */

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 58px 15px;

    z-index: 31;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   RIGHT CLAW
========================================================= */

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 14px 15px;

    z-index: 55;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}


/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;

    bottom: 22px;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 40;

    pointer-events: none;

    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

#toy0 {
    left: 120px;
}

#toy1 {
    left: 435px;
}

#toy2 {
    left: 650px;
}

.toy.caught {
    z-index: 40;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 230px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#rightButton {
    left: 410px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#grabButton {
    left: 690px;
    top: 700px;

    width: 160px;
    height: 150px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}


/* =========================================================
   SMALL PRIZE
========================================================= */

#prizeToy {
    position: absolute;

    left: 930px;
    top: 720px;

    width: 145px;
    height: 125px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    z-index: 160;

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   PRIZE OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   BIG PRIZE WRAP
========================================================= */

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   BIG PRIZE
========================================================= */

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}


@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}


/* =========================================================
   NEXT BUTTON
========================================================= */

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding:
        21px
        40px;

    border: 0;

    border-radius: 28px;

    background:
        #ed5573;

    color:
        #ffffff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px rgba(92,53,65,.22);

    cursor: pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

#nextButton:active {
    transform:
        translateY(6px);

    box-shadow:
        0 4px 0 #c83f5c,
        0 10px 20px rgba(92,53,65,.18);
}

#nextButton:disabled {
    pointer-events: none;
}


/* =========================================================
   FINAL TEXT
========================================================= */

#finalText {
    display: none;

    margin-top: 20px;

    padding:
        20px
        38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color:
        #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;

    box-shadow:
        0 15px 35px
        rgba(60,50,55,.15);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


    <!-- =====================================================
         TASK
    ====================================================== -->

    <div class="task">

        <div class="task-small">
            Найди:
        </div>

        <img
            id="taskScheme"
            class="task-scheme"
            src="scheme-s-middle.png"
            alt=""
            draggable="false"
        >

    </div>


    <!-- =====================================================
         PROGRESS
    ====================================================== -->

    <div
        class="progress"
        id="progress"
    >
        🧸 Раунд 1 из 8
    </div>


    <!-- =====================================================
         COLLECTION BOX
    ====================================================== -->

    <div id="collectionBox">

        <img
            id="collectionBoxBack"
            src="collection-box-back-v1.png"
            alt=""
            draggable="false"
        >

        <div id="collectionToys"></div>

        <img
            id="collectionBoxFront"
            src="collection-box-front-v1.png"
            alt=""
            draggable="false"
        >

    </div>


    <!-- =====================================================
         MACHINE
    ====================================================== -->

    <div id="machine">


        <img
            id="machineBack"
            src="machine-back-wide.png"
            alt=""
            draggable="false"
        >


        <div id="machineInside">


            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <img
                class="toy"
                id="toy0"
                src=""
                alt=""
                draggable="false"
            >

            <img
                class="toy"
                id="toy1"
                src=""
                alt=""
                draggable="false"
            >

            <img
                class="toy"
                id="toy2"
                src=""
                alt=""
                draggable="false"
            >


        </div>


        <img
            id="machineFront"
            src="machine-front-wide5.png"
            alt=""
            draggable="false"
        >


        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>

        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>

        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>


    <!-- =====================================================
         BIG PRIZE SCREEN
    ====================================================== -->

    <div id="prizeOverlay">

        <div id="bigPrizeWrap">

            <img
                id="bigPrizeToy"
                src=""
                alt=""
                draggable="false"
            >

            <button id="nextButton">
                ИГРАТЬ ДАЛЬШЕ
            </button>

            <div id="finalText">
                Отличная работа! 🧸
            </div>

        </div>

    </div>


</div>

</div>


<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 1085;
const INSIDE_HEIGHT = 490;


/* =========================================================
   ROUNDS
========================================================= */

const ROUNDS = [

    {
        scheme: "scheme-s-middle.png",

        toys: [
            "toy/sobaka.png",
            "toy/lisa.png",
            "toy/ananas.png"
        ],

        correct: 1
    },

    {
        scheme: "scheme-s-start.png",

        toys: [
            "toy/kaktus.png",
            "toy/koleso.png",
            "toy/sova.png"
        ],

        correct: 2
    },

    {
        scheme: "scheme-s-end.png",

        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/kapusta.png"
        ],

        correct: 1
    },

    {
        scheme: "scheme-s-start.png",

        toys: [
            "toy/nosok.png",
            "toy/lisa.png",
            "toy/som.png"
        ],

        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",

        toys: [
            "toy/avtobus.png",
            "toy/chesnok.png",
            "toy/sobaka.png"
        ],

        correct: 1
    },

    {
        scheme: "scheme-s-end.png",

        toys: [
            "toy/som.png",
            "toy/kapusta.png",
            "toy/kaktus.png"
        ],

        correct: 2
    },

    {
        scheme: "scheme-s-middle.png",

        toys: [
            "toy/samolet.png",
            "toy/sunduk.png",
            "toy/koleso.png"
        ],

        correct: 2
    },

    {
        scheme: "scheme-s-end.png",

        toys: [
            "toy/sunduk.png",
            "toy/kompas.png",
            "toy/samolet.png"
        ],

        correct: 1
    }

];


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );


    viewport.style.width =
        GAME_WIDTH * scale + "px";


    viewport.style.height =
        GAME_HEIGHT * scale + "px";


    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);


resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");

const taskScheme =
    document.getElementById("taskScheme");

const progress =
    document.getElementById("progress");

const prizeOverlay =
    document.getElementById("prizeOverlay");

const bigPrizeToy =
    document.getElementById("bigPrizeToy");

const nextButton =
    document.getElementById("nextButton");

const finalText =
    document.getElementById("finalText");


/*
   BOX
*/

const collectionBox =
    document.getElementById("collectionBox");

const collectionToys =
    document.getElementById("collectionToys");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   POSITIONS
========================================================= */

const SLOT_X = [
    102,
    417,
    632
];


const DROP_RIG_X =
    780;


/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME =
    42;

const CABLE_LIFT =
    52;

const CABLE_DROP_APPROACH =
    170;

const CABLE_DROP =
    205;

const CABLE_WRONG_LIFT =
    145;


/* =========================================================
   STATE
========================================================= */

let roundIndex =
    0;

let currentSlot =
    1;

let busy =
    false;

let grabbedToy =
    null;

let followFrame =
    null;

let heldOffsetX =
    0;

let heldOffsetY =
    0;

let waitingForPrize =
    false;


/*
   Здесь хранятся
   уже выигранные игрушки.
*/

let collectedToys =
    [];


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   COLLECTION
========================================================= */

function renderCollection() {

    /*
       В первом раунде коробки нет.
    */

    if (
        collectedToys.length === 0
    ) {

        collectionBox.classList.remove(
            "show"
        );


        collectionToys.innerHTML =
            "";


        return;
    }


    /*
       Есть хотя бы один приз.
    */

    collectionBox.classList.add(
        "show"
    );


    collectionToys.innerHTML =
        "";


    collectedToys.forEach(
        (src, index) => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                src;


            img.alt =
                "";


            img.draggable =
                false;


            img.className =
                `collection-toy pos-${index}`;


            collectionToys.appendChild(
                img
            );
        }
    );
}


/* =========================================================
   ADD PRIZE TO COLLECTION
========================================================= */

function addPrizeToCollection() {

    const round =
        ROUNDS[
            roundIndex
        ];


    const correctToy =
        round.toys[
            round.correct
        ];


    /*
       Защита от случайного
       двойного добавления.
    */

    if (
        collectedToys.length <=
        roundIndex
    ) {

        collectedToys.push(
            correctToy
        );
    }


    renderCollection();
}


/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );


    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw(
        "neutral"
    );


    await wait(
        380
    );
}


async function openClaw() {

    setClaw(
        "open"
    );


    await wait(
        460
    );
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE CLAW
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[
            currentSlot
        ]
    );
}


/* =========================================================
   LEFT
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            waitingForPrize ||
            currentSlot <= 0
        ) {
            return;
        }


        currentSlot--;


        updatePosition();
    }
);


/* =========================================================
   RIGHT
========================================================= */

rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            waitingForPrize ||
            currentSlot >= 2
        ) {
            return;
        }


        currentSlot++;


        updatePosition();
    }
);


/* =========================================================
   TOY HOME
========================================================= */

const toyHome = [

    {
        left: 120,
        bottom: 22,
        width: 135,
        height: 145
    },

    {
        left: 435,
        bottom: 22,
        width: 135,
        height: 145
    },

    {
        left: 650,
        bottom: 22,
        width: 135,
        height: 145
    }

];


/* =========================================================
   LOAD ROUND
========================================================= */

function loadRound(index) {

    const round =
        ROUNDS[index];


    waitingForPrize =
        false;


    taskScheme.src =
        round.scheme;


    progress.textContent =
        `🧸 Раунд ${index + 1} из ${ROUNDS.length}`;


    prizeToy.classList.remove(
        "show"
    );


    prizeToy.src =
        "";


    prizeToy.style.pointerEvents =
        "none";


    prizeOverlay.classList.remove(
        "show"
    );


    bigPrizeToy.src =
        "";


    nextButton.style.display =
        "block";


    finalText.style.display =
        "none";


    /*
       Обновляем коробку.
    */

    renderCollection();


    /*
       Игрушки автомата.
    */

    toys.forEach(
        (toy, toyIndex) => {

            toy.src =
                round.toys[
                    toyIndex
                ];


            toy.dataset.correct =
                toyIndex ===
                round.correct
                    ? "true"
                    : "false";


            toy.dataset.grab =
                toyIndex === 0
                    ? "244"
                    : toyIndex === 1
                        ? "238"
                        : "230";


            toy.style.transition =
                "none";


            toy.style.opacity =
                "1";


            toy.style.top =
                "auto";


            toy.style.left =
                `${toyHome[toyIndex].left}px`;


            toy.style.bottom =
                `${toyHome[toyIndex].bottom}px`;


            toy.style.transform =
                "";


            toy.classList.remove(
                "caught"
            );
        }
    );


    grabbedToy =
        null;


    currentSlot =
        1;


    setCable(
        CABLE_HOME
    );


    setClaw(
        "neutral"
    );


    updatePosition();
}


/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(element) {

    const insideRect =
        machineInside
        .getBoundingClientRect();


    const rect =
        element
        .getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}


/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(toy) {

    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy =
        toy;
}


/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const toyRect =
        getLocalRect(
            grabbedToy
        );


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    heldOffsetX =
        toyRect.left -
        anchorX;


    heldOffsetY =
        toyRect.top -
        anchorY;
}


/* =========================================================
   HELD TARGET
========================================================= */

function getHeldTarget() {

    if (
        !grabbedToy
    ) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW TOY
========================================================= */

function followToy() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const target =
        getHeldTarget();


    if (
        !target
    ) {
        return;
    }


    let currentLeft =
        parseFloat(
            grabbedToy
            .style
            .left
        );


    let currentTop =
        parseFloat(
            grabbedToy
            .style
            .top
        );


    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }


    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }


    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .32;


    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (
        followFrame !==
        null
    ) {

        cancelAnimationFrame(
            followFrame
        );


        followFrame =
            null;
    }
}


/* =========================================================
   LOWER CLAW
========================================================= */

async function lowerClawToToy(toy) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );


    setCable(
        grabDepth -
        32
    );


    await wait(
        760
    );


    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";


    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";


    setCable(
        grabDepth
    );


    await wait(
        540
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   GRAB
========================================================= */

async function grabToyNaturally(toy) {

    freezeToy(
        toy
    );


    clawRig.classList.add(
        "grabbing"
    );


    setClaw(
        "closed"
    );


    await wait(
        470
    );


    await wait(
        90
    );


    captureHeldOffset();
}


/* =========================================================
   LIFT
========================================================= */

async function liftGrabbedToy() {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_LIFT
    );


    await wait(
        1050
    );
}


/* =========================================================
   SWING
========================================================= */

async function settleSwing(toy) {

    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(
        170
    );


    toy.style.transition =
        "transform .22s ease-in-out";


    toy.style.transform =
        "rotate(2.8deg)";


    await wait(
        220
    );


    toy.style.transition =
        "transform .20s ease-in-out";


    toy.style.transform =
        "rotate(-1.3deg)";


    await wait(
        200
    );


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(
        180
    );


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        120
    );
}


/* =========================================================
   MOVE TO SHAFT
========================================================= */

async function moveToShaft(toy) {

    toy.style.transition =
        "transform .20s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(
        470
    );


    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(
        450
    );


    await wait(
        120
    );


    await settleSwing(
        toy
    );
}


/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(toy) {

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(
        760
    );


    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(
        470
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transition =
        "transform .15s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        220
    );
}


/* =========================================================
   DROP INTO BLACK SHAFT
========================================================= */

async function dropIntoShaft(toy) {

    setClaw(
        "open"
    );


    await wait(
        190
    );


    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.style.transform =
        "rotate(0deg)";


    const shaftCenterX =
        890;


    const shaftLeft =
        shaftCenterX -
        pos.width /
        2;


    await wait(
        50
    );


    toy.style.transition =
        "left .18s ease-out, top .18s ease-in";


    toy.style.left =
        `${shaftLeft}px`;


    toy.style.top =
        `${pos.top + 18}px`;


    await wait(
        180
    );


    toy.style.transition =
        "top .30s cubic-bezier(.42,.02,.86,.35), transform .30s ease-in";


    toy.style.top =
        `${pos.top + 115}px`;


    toy.style.transform =
        "rotate(2deg)";


    await wait(
        300
    );


    toy.style.transition =
        "top .28s cubic-bezier(.5,.02,.94,.32), transform .28s ease-in";


    toy.style.top =
        `${pos.top + 245}px`;


    toy.style.transform =
        "rotate(4deg) scale(.97)";


    await wait(
        280
    );


    toy.style.opacity =
        "0";


    await wait(
        220
    );
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(toy) {

    await liftGrabbedToy();

    await settleSwing(
        toy
    );

    await moveToShaft(
        toy
    );

    await lowerOverShaft(
        toy
    );

    await dropIntoShaft(
        toy
    );


    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    prizeToy.style.pointerEvents =
        "auto";


    waitingForPrize =
        true;


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    currentSlot =
        1;


    updatePosition();


    await wait(
        930
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(
        720
    );


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(
        150
    );


    setClaw(
        "open"
    );


    await wait(
        190
    );


    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    await wait(
        60
    );


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(
        440
    );


    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(
        90
    );


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(
        180
    );


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        150
    );


    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught"
    );


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }


        const toy =
            toys[
                currentSlot
            ];


        if (
            !toy
        ) {
            return;
        }


        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }


        busy =
            true;


        try {

            await openClaw();


            await wait(
                90
            );


            await lowerClawToToy(
                toy
            );


            await wait(
                140
            );


            await grabToyNaturally(
                toy
            );


            const correct =
                toy.dataset.correct ===
                "true";


            if (
                correct
            ) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   CLICK SMALL PRIZE
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }


        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }


        prizeToy.style.pointerEvents =
            "none";


        bigPrizeToy.src =
            prizeToy.src;


        prizeToy.classList.remove(
            "show"
        );


        prizeOverlay.classList.add(
            "show"
        );


        if (
            roundIndex ===
            ROUNDS.length - 1
        ) {

            /*
               В последнем раунде
               тоже сохраняем последний приз.
            */

            addPrizeToCollection();


            nextButton.style.display =
                "none";


            finalText.style.display =
                "block";
        }
    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length - 1
        ) {
            return;
        }


        nextButton.disabled =
            true;


        /*
           СНАЧАЛА сохраняем приз
           завершённого раунда.
        */

        addPrizeToCollection();


        /*
           Убираем большой экран.
        */

        prizeOverlay.classList.remove(
            "show"
        );


        await wait(
            380
        );


        bigPrizeToy.src =
            "";


        /*
           Следующий раунд.
        */

        roundIndex++;


        loadRound(
            roundIndex
        );


        nextButton.disabled =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

loadRound(
    roundIndex
);

</script>
