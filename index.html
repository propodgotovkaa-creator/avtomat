<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 24px 28px 26px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;

    width: 330px;
    height: 125px;

    margin: 15px auto 0;

    object-fit: contain;

    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;

    left: 55px;
    bottom: 52px;

    width: 465px;
    height: 352px;

    z-index: 25;

    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;

    left: 72px;
    top: 95px;

    width: 320px;
    height: 215px;

    overflow: visible;

    z-index: 2;

    pointer-events: none;
}

.pouch-toy {
    position: absolute;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(45,35,40,.15)
        );

    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 906px;

    z-index: 10;
}

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 170px;
    top: 170px;

    width: 940px;
    height: 455px;

    overflow: hidden;

    z-index: 20;
}

/* =========================================================
   BALL PIT

   Шарики находятся ТОЛЬКО слева от шахты.
========================================================= */

#ballPit {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 735px;
    height: 145px;

    overflow: hidden;

    z-index: 50;

    pointer-events: none;
}

/*
   Каждый шарик имеет отдельную оболочку.
   Именно оболочка перемещается физикой.
*/

.ball {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;

    will-change:
        left,
        top,
        transform;

    box-shadow:
        inset -7px -8px 10px rgba(70,70,100,.12),
        inset 6px 6px 8px rgba(255,255,255,.55),
        0 3px 5px rgba(70,60,80,.10);
}

/*
   Световой блик.
*/

.ball::before {
    content: "";

    position: absolute;

    left: 18%;
    top: 14%;

    width: 30%;
    height: 24%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.52);

    transform:
        rotate(-25deg);

    filter:
        blur(.4px);
}

/*
   Второй мягкий блик.
*/

.ball::after {
    content: "";

    position: absolute;

    right: 13%;
    bottom: 12%;

    width: 25%;
    height: 20%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.12);
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;

    left: 20px;
    top: 2px;

    width: 900px;
    height: 105px;

    object-fit: fill;

    z-index: 12;

    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 295px;
    top: 5px;

    width: 170px;
    height: 445px;

    z-index: 30;

    transition:
        left .92s
        cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 34;

    pointer-events: none;
}

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 31;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px
        rgba(0,0,0,.2);

    z-index: 31;

    transition:
        height .92s
        cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;

    left: -77px;

    top:
        calc(
            var(--cable) - 10px
        );

    width: 160px;
    height: 180px;

    z-index: 32;

    transition:
        top .92s
        cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 33;

    pointer-events: none;
}

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        58px 15px;

    z-index: 32;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        14px 15px;

    z-index: 32;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawAssembly.neutral #clawLeft {
    transform:
        rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform:
        rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform:
        rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform:
        rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform:
        rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform:
        rotate(15deg);
}

/* =========================================================
   TOYS

   z-index 48:
   часть шариков лежит ПЕРЕД игрушками.
   Поэтому игрушка визуально утоплена в куче.
========================================================= */

.toy {
    position: absolute;

    bottom: 7px;

    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 48;

    pointer-events: none;

    transform-origin:
        50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

/*
   Когда игрушку взяли,
   она должна оказаться выше шариков.
*/

.toy.caught {
    z-index: 58;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}

.toy.dropping {
    z-index: 70;
}

/* =========================================================
   SHAFT EDGE
========================================================= */

#machineShaftEdge {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 75;

    pointer-events: none;
}

/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color:
        transparent;
}

#leftButton {
    left: 275px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;

    width: 150px;
    height: 140px;

    border-radius: 50%;
}

.control:active {
    transform:
        scale(.94);
}

/* =========================================================
   PRIZE WINDOW
========================================================= */

#prizeWindow {
    position: absolute;

    left: 948px;
    top: 690px;

    width: 170px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 160;

    pointer-events: none;
}

#prizeToy {
    position: relative;

    display: block;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position:
        center center;

    opacity: 0;

    transform:
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;
    visibility: visible;

    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show
#bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding:
        21px 40px;

    border: 0;

    border-radius: 28px;

    background:
        #ed5573;

    color:
        #ffffff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px
        rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform:
        translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;

    margin-top: 20px;

    padding:
        20px 38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color:
        #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;
}

</style>
</head>

<body>

========================================================= */

    document.getElementById(

    const scale =
        Math.min(
            window.innerWidth /
            GAME_WIDTH,

            window.innerHeight /
            GAME_HEIGHT
        );


    viewport.style.width =
        GAME_WIDTH *
        scale +
        "px";


    viewport.style.height =
        GAME_HEIGHT *
        scale +
        "px";


    game.style.transform =
        `scale(${scale})`;
}

    "resize",
    resizeGame
);

        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

const BALL_COLORS = [

const BALL_PIT_WIDTH =

const BALL_PIT_HEIGHT =

const BALLS =

let ballAnimationFrame =
    null;

let ballPhysicsRunning =

/*
   Создаём шарики.

   Это не ровная сетка.
   Каждый шар имеет немного
   разный размер и положение.
*/

function createBalls() {

    ballPit.innerHTML =
        "";

    BALLS.length =
        0;


    const rows = [

        {
            y: 98,

            positions: [
                4, 58, 113, 169,
                225, 281, 337,
                393, 449, 505,
                561, 617, 673
            ]
        },

        {

                26, 83, 141,
                199, 257, 315,
                373, 431, 489,
                547, 605, 663
            ]
        },

        {
            y: 14,

            positions: [
                3, 63, 123,
                183, 243, 303,
                363, 423, 483,
                543, 603, 663
            ]
        }

    ];


    let id =
        0;


    rows.forEach(
        (row, rowIndex) => {

            row.positions.forEach(
                (x, columnIndex) => {

                    const size =
                        48 +
                        (
                            (
                                id * 17 +
                                rowIndex * 11
                            ) %

                        );


                    const element =
                        document.createElement(

                    element.style.background =
                        BALL_COLORS[
                            id %
                            BALL_COLORS.length
                        ];


                    ballPit.appendChild(
                        element
                    );


                    /*
                       Небольшой разброс,
                       чтобы куча не была
                       геометрически идеальной.
                    */

                    const jitterX =
                        (
                            (
                                id * 13
                            ) %
                            9
                        ) -
                        4;


                    const jitterY =
                        (
                            (
                                id * 19
                            ) %
                            7
                        ) -
                        3;


                    const startX =
                        x +
                        jitterX;


                    const startY =
                        row.y +
                        jitterY;


                    BALLS.push({

                        id,

                        element,

                        size,

                        radius:
                            size / 2,

                        x:
                            startX,

                        y:
                            startY,

                        homeX:
                            startX,

                        homeY:
                            startY,

                        vx:
                            0,

                        vy:

                        rotation:

/* =========================================================

function renderBalls() {

}


/* =========================================================
   BALL COLLISIONS
========================================================= */

function solveBallCollisions() {

    /*
       Несколько проходов делают
       столкновения заметно мягче.
    */

    for (
        let pass = 0;
        pass < 2;
        pass++
    ) {

        for (
            let i = 0;
            i < BALLS.length;
            i++
        ) {

            const a =
                BALLS[i];


            for (
                let j = i + 1;
                j < BALLS.length;
                j++
            ) {

                const b =
                    BALLS[j];


                const ax =
                    a.x +
                    a.radius;

                const ay =
                    a.y +
                    a.radius;

                const bx =
                    b.x +
                    b.radius;

                const by =
                    b.y +
                    b.radius;


                let dx =
                    bx - ax;

                let dy =
                    by - ay;


                let distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                const minimum =
                    a.radius +
                    b.radius -
                    3;


                if (
                    distance >= minimum
                ) {
                    continue;
                }


                if (
                    distance <
                    .001
                ) {

                    dx =
                        .01;

                    dy =
                        0;

                    distance =
                        .01;
                }


                const overlap =
                    minimum -
                    distance;


                const nx =
                    dx /
                    distance;

                const ny =
                    dy /
                    distance;


                /*
                   Каждый шар получает
                   половину коррекции.
                */

                const correction =
                    overlap *
                    .52;


                a.x -=
                    nx *
                    correction;

                a.y -=
                    ny *
                    correction;


                b.x +=
                    nx *
                    correction;

                b.y +=
                    ny *
                    correction;


                /*
                   Передаём часть импульса.

                   Благодаря этому соседние
                   шарики действительно
                   начинают раскатываться.
                */

                const relativeVX =
                    b.vx -
                    a.vx;

                const relativeVY =
                    b.vy -
                    a.vy;


                const speedAlongNormal =
                    relativeVX *
                    nx +
                    relativeVY *
                    ny;


                if (
                    speedAlongNormal <
                    0
                ) {

                    const impulse =
                        -speedAlongNormal *
                        .44;


                    a.vx -=
                        impulse *
                        nx;

                    a.vy -=
                        impulse *
                        ny;


                    b.vx +=
                        impulse *
                        nx;

                    b.vy +=
                        impulse *
                        ny;
                }
            }
        }
    }
}


/* =========================================================
   BALL BOUNDS
========================================================= */

function keepBallInside(ball) {

    const maxX =
        BALL_PIT_WIDTH -
        ball.size;


    const maxY =
        BALL_PIT_HEIGHT -
        ball.size;


    /*
       Левая стенка.
    */

    if (
        ball.x <
        0
    ) {

        ball.x =
            0;

        ball.vx =
            Math.abs(
                ball.vx
            ) *
            .42;
    }


    /*
       Правая стенка.

       Это граница ДО шахты.
    */

    if (
        ball.x >
        maxX
    ) {

        ball.x =
            maxX;

        ball.vx =
            -Math.abs(
                ball.vx
            ) *
            .42;
    }


    /*
       Дно.
    */

    if (
        ball.y >
        maxY
    ) {

        ball.y =
            maxY;

        ball.vy =
            -Math.abs(
                ball.vy
            ) *
            .18;
    }


    /*
       Верхнюю границу разрешаем
       чуть пересечь во время толчка,
       но не слишком сильно.
    */

    if (
        ball.y <
        -18
    ) {

        ball.y =
            -18;

        ball.vy =
            Math.abs(
                ball.vy
            ) *
            .2;
    }
}


/* =========================================================
   BALL PHYSICS LOOP
========================================================= */

function startBallPhysics() {

    if (
        ballPhysicsRunning
    ) {
        return;
    }


    ballPhysicsRunning =
        true;


    function step() {

        let moving =
            false;


        BALLS.forEach(
            ball => {

                /*
                   Небольшая гравитация.
                */

                ball.vy +=
                    .20;


                /*
                   Сопротивление.
                */

                ball.vx *=
                    .975;

                ball.vy *=
                    .982;


                /*
                   Движение.
                */

                ball.x +=
                    ball.vx;

                ball.y +=
                    ball.vy;


                /*
                   Вращение связано
                   с горизонтальной скоростью.
                */

                ball.angularVelocity +=
                    ball.vx *
                    .035;


                ball.angularVelocity *=
                    .94;


                ball.rotation +=
                    ball.angularVelocity;


                keepBallInside(
                    ball
                );


                if (
                    Math.abs(
                        ball.vx
                    ) >
                    .03 ||
                    Math.abs(
                        ball.vy
                    ) >
                    .03
                ) {

                    moving =
                        true;
                }
            }
        );


        solveBallCollisions();


        BALLS.forEach(
            keepBallInside
        );


        renderBalls();


        if (
            moving
        ) {

            ballAnimationFrame =
                requestAnimationFrame(
                    step
                );

        } else {

            ballPhysicsRunning =
                false;

            ballAnimationFrame =
                null;
        }
    }


    ballAnimationFrame =
        requestAnimationFrame(
            step
        );
}


/* =========================================================
   PUSH BALLS

   Клешня не телепортирует шарики.
   Она даёт импульс ближайшим.

   Они сталкиваются с соседними
   и разливаются дальше по куче.
========================================================= */

function pushBallsForToy(slot) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width /
        2;


    const impactY =
        88;


    BALLS.forEach(
        ball => {

            const centerX =
                ball.x +
                ball.radius;

            const centerY =
                ball.y +
                ball.radius;


            const dx =
                centerX -
                toyCenterX;

            const dy =
                centerY -
                impactY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            const range =
                150;


            if (
                distance >
                range
            ) {
                return;
            }


            const power =
                1 -
                distance /
                range;


            /*
               Если шар прямо под центром,
               выбираем сторону индивидуально.
            */

            let direction;


            if (
                Math.abs(dx) <
                8
            ) {

                direction =
                    ball.id %
                    2 ===
                    0
                        ? -1
                        : 1;

            } else {

                direction =
                    dx <
                    0
                        ? -1
                        : 1;
            }


            const individual =
                .82 +
                (
                    (
                        ball.id *
                        23
                    ) %
                    30
                ) /
                100;


            /*
               Основной горизонтальный импульс.
            */

            ball.vx +=
                direction *
                (
                    2.2 +
                    5.4 *
                    power
                ) *
                individual;


            /*
               Часть шариков чуть
               подбрасывается вверх.
            */

            ball.vy -=
                (
                    .7 +
                    2.8 *
                    power
                ) *
                (
                    .75 +
                    (
                        (
                            ball.id *
                            17
                        ) %
                        25
                    ) /
                    100
                );


            /*
               Вращение.
            */

            ball.angularVelocity +=
                direction *
                (
                    1.5 +
                    power *
                    4
                );
        }
    );


    startBallPhysics();
}


/* =========================================================
   SECONDARY BALL PUSH

   Маленький второй толчок в момент,
   когда лапки закрываются.

   Это создаёт эффект, что шарики
   продолжают перекатываться,
   а не просто один раз разъехались.
========================================================= */

function secondaryBallPush(slot) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width /
        2;


    BALLS.forEach(
        ball => {

            const center =
                ball.x +
                ball.radius;


            const dx =
                center -
                toyCenterX;


            const distance =
                Math.abs(dx);


            if (
                distance >
                115
            ) {
                return;
            }


            const power =
                1 -
                distance /
                115;


            let direction =
                dx <
                0
                    ? -1
                    : 1;


            if (
                Math.abs(dx) <
                5
            ) {

                direction =
                    ball.id %
                    2
                        ? 1
                        : -1;
            }


            ball.vx +=
                direction *
                (
                    .8 +
                    2.5 *
                    power
                );


            ball.vy -=
                .3 +
                power *
                1.1;
        }
    );


    startBallPhysics();
}


/* =========================================================
   BALLS AFTER TOY LEAVES

   После подъёма игрушки куча
   естественно заполняет пустоту.
========================================================= */

function collapseBallsIntoGap(slot) {

    const gapX =
        toyHome[slot].left +
        toyHome[slot].width /
        2;


    BALLS.forEach(
        ball => {

            const center =
                ball.x +
                ball.radius;


            const distance =
                Math.abs(
                    center -
                    gapX
                );


            if (
                distance >
                220
            ) {
                return;
            }


            const power =
                1 -
                distance /
                220;


            const direction =
                center <
                gapX
                    ? 1
                    : -1;


            ball.vx +=
                direction *
                (
                    .5 +
                    2.1 *
                    power
                );


            ball.vy +=
                .2 +
                .6 *
                power;
        }
    );


    startBallPhysics();
}


/* =========================================================
   RESET BALLS

   Между раундами возвращаем кучку
   к аккуратной исходной форме.
========================================================= */

function resetBalls() {

    if (
        ballAnimationFrame !==
        null
    ) {

        cancelAnimationFrame(
            ballAnimationFrame
        );

        ballAnimationFrame =
            null;
    }


    ballPhysicsRunning =
        false;


    BALLS.forEach(
        ball => {

            ball.x =
                ball.homeX;

            ball.y =
                ball.homeY;

            ball.vx =
                0;

            ball.vy =
                0;

            ball.rotation =
                0;

            ball.angularVelocity =
                0;
        }
    );


    renderBalls();
}

/* =========================================================
   RECT
========================================================= */

function getLocalRect(
    element
) {

    const insideRect =
        machineInside
        .getBoundingClientRect();


    const rect =
        element
        .getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}


/* =========================================================
   FREEZE TOY
========================================================= */

function freezeToy(
    toy
) {

    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    toy.classList.add(
        "caught"
    );


    grabbedToy =
        toy;
}


/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const toyRect =
        getLocalRect(
            grabbedToy
        );


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    heldOffsetX =
        toyRect.left -
        anchorX;


    heldOffsetY =
        toyRect.top -
        anchorY;
}


function getHeldTarget() {

    if (
        !grabbedToy
    ) {
        return null;
    }


    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );


    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );


    const anchorX =
        rigX +
        85;


    const anchorY =
        52 +
        cableLength;


    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW
========================================================= */

function followToy() {

    if (
        !grabbedToy
    ) {
        return;
    }


    const target =
        getHeldTarget();


    if (
        !target
    ) {
        return;
    }


    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );


    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }


    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }


    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .42;


    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;


    grabbedToy.style.left =
        `${nextLeft}px`;


    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (
        followFrame !==
        null
    ) {

        cancelAnimationFrame(
            followFrame
        );


        followFrame =
            null;
    }
}


/* =========================================================
   LOWER CLAW
========================================================= */

async function lowerClawToToy(
    toy
) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );


    setCable(
        grabDepth -
        32
    );


    await wait(
        650
    );


    /*
       Первый контакт клешни
       с кучей шариков.
    */

    pushBallsForToy(
        currentSlot
    );


    await wait(
        110
    );


    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";


    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";


    setCable(
        grabDepth
    );


    await wait(
        300
    );


    /*
       Второй импульс.

       Шарики продолжают перекатываться
       друг через друга.
    */

    secondaryBallPush(
        currentSlot
    );


    await wait(
        240
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   GRAB
========================================================= */

async function grabToyNaturally(
    toy
) {

    freezeToy(
        toy
    );


    setClaw(
        "closed"
    );


    /*
       Лапки закрываются,
       шарики возле игрушки
       получают последний лёгкий толчок.
    */

    secondaryBallPush(
        currentSlot
    );


    await wait(
        470
    );


    captureHeldOffset();
}


/* =========================================================
   LIFT
========================================================= */

async function liftGrabbedToy() {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_LIFT
    );


    /*
       Игрушка начинает выходить.

       Шарики по бокам начинают
       закатываться в освободившееся место.
    */

    await wait(
        230
    );


    collapseBallsIntoGap(
        currentSlot
    );


    await wait(
        820
    );
}


/* =========================================================
   SWING
========================================================= */

async function settleSwing(
    toy
) {

    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(
        170
    );


    toy.style.transition =
        "transform .22s ease-in-out";


    toy.style.transform =
        "rotate(2.8deg)";


    await wait(
        220
    );


    toy.style.transition =
        "transform .20s ease-in-out";


    toy.style.transform =
        "rotate(-1.3deg)";


    await wait(
        200
    );


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(
        180
    );


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        120
    );
}


/* =========================================================
   MOVE TO SHAFT
========================================================= */

async function moveToShaft(
    toy
) {

    toy.style.transition =
        "transform .20s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(
        470
    );


    toy.style.transition =
        "transform .28s ease-in-out";


    toy.style.transform =
        "rotate(2deg)";


    await wait(
        450
    );


    await wait(
        260
    );


    await settleSwing(
        toy
    );
}


/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(
    toy
) {

    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(
        760
    );


    cable.style.transition =
        "height .46s ease-out";


    clawAssembly.style.transition =
        "top .46s ease-out";


    setCable(
        CABLE_DROP
    );


    await wait(
        470
    );


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";


    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transition =
        "transform .15s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        220
    );
}


/* =========================================================
   SMOOTH DROP
========================================================= */

function animateSmoothDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const start =
                performance.now();


            function frame(
                now
            ) {

                const progress =
                    Math.min(
                        (
                            now -
                            start
                        ) /
                        duration,
                        1
                    );


                /*
                   Непрерывное ускорение.
                */

                const eased =
                    progress *
                    progress;


                const y =
                    startTop +
                    (
                        endTop -
                        startTop
                    ) *
                    eased;


                toy.style.top =
                    `${y}px`;


                toy.style.transform =
                    `rotate(${progress * 2}deg)
                     scale(${1 - progress * .025})`;


                if (
                    progress <
                    1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );
        }
    );
}


/* =========================================================
   DROP INTO SHAFT
========================================================= */

async function dropIntoShaft(
    toy
) {

    stopFollowingToy();


    const before =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${before.left}px`;


    toy.style.top =
        `${before.top}px`;


    toy.style.bottom =
        "auto";


    toy.style.transform =
        "rotate(0deg)";


    /*
       Точно центрируем игрушку
       над шахтой.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width /
        2;


    toy.style.transition =
        "left .26s cubic-bezier(.22,.65,.35,1)";


    toy.style.left =
        `${fixedLeft}px`;


    await wait(
        280
    );


    const releaseTop =
        parseFloat(
            toy.style.top
        );


    /*
       После этого X больше
       вообще не меняется.
    */

    toy.style.transition =
        "none";


    toy.style.left =
        `${fixedLeft}px`;


    toy.style.top =
        `${releaseTop}px`;


    toy.classList.add(
        "dropping"
    );


    await wait(
        70
    );


    setClaw(
        "open"
    );


    await wait(
        180
    );


    /*
       Одно плавное непрерывное падение.
    */

    await animateSmoothDrop(
        toy,
        releaseTop,
        releaseTop +
        315,
        520
    );


    toy.style.opacity =
        "0";


    await wait(
        70
    );


    toy.classList.remove(
        "dropping"
    );
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(
    toy
) {

    await liftGrabbedToy();


    await settleSwing(
        toy
    );


    await moveToShaft(
        toy
    );


    await lowerOverShaft(
        toy
    );


    await dropIntoShaft(
        toy
    );


    /*
       Игрушка появляется точно
       по центру призовой полочки.
    */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    prizeToy.style.pointerEvents =
        "auto";


    waitingForPrize =
        true;


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    currentSlot =
        1;


    updatePosition();


    await wait(
        930
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();


    await wait(
        32
    );


    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(
        230
    );


    collapseBallsIntoGap(
        index
    );


    await wait(
        490
    );


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(
        150
    );


    setClaw(
        "open"
    );


    await wait(
        190
    );


    stopFollowingToy();


    const pos =
        getLocalRect(
            toy
        );


    toy.style.transition =
        "none";


    toy.style.left =
        `${pos.left}px`;


    toy.style.top =
        `${pos.top}px`;


    toy.style.bottom =
        "auto";


    await wait(
        60
    );


    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    const wrongLockedLeft =
        pos.left;


    toy.style.left =
        `${wrongLockedLeft}px`;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(
        440
    );


    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(
        90
    );


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(
        180
    );


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(
        150
    );


    /*
       Возвращаем игрушку
       в исходную позицию.
    */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught",
        "dropping"
    );


    /*
       После возвращения игрушки
       шарики немного расходятся вокруг неё.
    */

    pushBallsForToy(
        index
    );


    setCable(
        CABLE_HOME
    );


    await wait(
        980
    );


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }


        const toy =
            toys[
                currentSlot
            ];


        if (
            !toy
        ) {
            return;
        }


        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }


        busy =
            true;


        try {

            /*
               1. Открываем.
            */

            await openClaw();


            await wait(
                90
            );


            /*
               2. Опускаемся в шарики.
            */

            await lowerClawToToy(
                toy
            );


            await wait(
                140
            );


            /*
               3. Захватываем.
            */

            await grabToyNaturally(
                toy
            );


            /*
               4. Проверяем.
            */

            const correct =
                toy.dataset.correct ===
                "true";


            if (
                correct
            ) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   SMALL PRIZE CLICK
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }


        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }


        const wonToySrc =
            prizeToy.src;


        prizeToy.style.pointerEvents =
            "none";


        bigPrizeToy.src =
            wonToySrc;


        prizeToy.classList.remove(
            "show"
        );


        addToyToPouch(
            wonToySrc
        );


        prizeOverlay.classList.add(
            "show"
        );


        if (
            roundIndex ===
            ROUNDS.length -
            1
        ) {

            nextButton.style.display =
                "none";


            finalText.style.display =
                "block";
        }
    }
);


/* =========================================================
   NEXT ROUND
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length -
            1
        ) {
            return;
        }


        nextButton.disabled =
            true;


        prizeOverlay.classList.remove(
            "show"
        );


        await wait(
            380
        );


        bigPrizeToy.src =
            "";


        roundIndex++;


        loadRound(
            roundIndex
        );


        nextButton.disabled =
            false;
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

/*
   Сначала создаём шарики.
   Они не требуют никаких файлов.
*/

createBalls();


/*
   Затем загружаем первый раунд.
*/

loadRound(
    roundIndex
);

</script>
