<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
    position: absolute;

    left: 115px;
    top: 145px;

    width: 520px;

    padding: 30px 35px;

    border-radius: 34px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 24px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 42px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}


/* =========================================================
   РАУНД
========================================================= */

.progress {
    position: absolute;

    left: 165px;
    top: 390px;

    width: 420px;

    padding: 20px;

    border-radius: 28px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 27px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
    position: absolute;

    left: 780px;
    top: 25px;

    width: 735px;
    height: 1030px;

    z-index: 10;
}


/* =========================================================
   ВНУТРЕННЯЯ КАМЕРА
========================================================= */

#machineInside {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    border-radius: 12px;

    background:
        radial-gradient(
            ellipse at 50% 5%,
            rgba(255,248,195,.8),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #eefcf9 0%,
            #fafffe 52%,
            #fff9f2 100%
        );

    z-index: 1;
}


/* =========================================================
   СВЕТ
========================================================= */

.inside-light {
    position: absolute;

    left: 50px;
    top: 17px;

    width: 467px;
    height: 11px;

    border-radius: 20px;

    background: #fff5b8;

    box-shadow:
        0 0 15px rgba(255,239,150,.8),
        0 0 30px rgba(255,239,150,.4);

    z-index: 2;
}


/* =========================================================
   ПОЛ ВНУТРИ АВТОМАТА
========================================================= */

.inside-floor {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 100px;

    background:
        linear-gradient(
            180deg,
            #fffdf8 0%,
            #fff7ef 48%,
            #ffe8e4 100%
        );

    border-top:
        4px solid rgba(238,166,181,.42);

    z-index: 3;
}


/* небольшая линия перспективы пола */

.inside-floor::before {
    content: "";

    position: absolute;

    left: 28px;
    right: 28px;
    top: 14px;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(180,120,130,.18),
            transparent
        );
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
    position: absolute;

    left: 42px;
    top: 42px;

    width: 483px;
    height: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #dce4e6 22%,
            #8b969b 52%,
            #606a70 72%,
            #dce3e5 100%
        );

    border:
        2px solid rgba(88,98,103,.45);

    box-shadow:
        0 4px 6px rgba(0,0,0,.14),
        inset 0 2px 2px rgba(255,255,255,.9);

    z-index: 8;
}


/* =========================================================
   МЕХАНИЗМ КЛЕШНИ
========================================================= */

#clawRig {
    --cable: 65px;

    position: absolute;

    left: 188px;
    top: 15px;

    width: 190px;
    height: 550px;

    z-index: 35;

    transition:
        left .75s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   КРЕПЛЕНИЕ ТРОСА
========================================================= */

#cableAnchor {
    position: absolute;

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 34;
}


/* =========================================================
   ТРОС
========================================================= */

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КЛЕШНЯ
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 40;

    transition:
        top .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КОРПУС
========================================================= */

#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;
    height: auto;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


/* =========================================================
   ЛАПКИ
========================================================= */

#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 66px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}

#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 16px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   СОСТОЯНИЯ КЛЕШНИ
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(25deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-25deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-25deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(25deg);
}


/* =========================================================
   ИГРУШКИ

   ВАЖНО:
   теперь они стоят НИЖЕ, прямо на полу.

   Передний бортик перекрывает их снизу,
   поэтому возникает ощущение, что они действительно
   находятся внутри автомата.
========================================================= */

.toy {
    position: absolute;

    bottom: 48px;

    width: 110px;
    height: 130px;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    font-size: 88px;
    line-height: 1;

    z-index: 15;

    transform-origin: 50% 85%;

    will-change: transform, opacity;

    pointer-events: none;
}


/* во время захвата игрушка выше остальных */

.toy.being-carried {
    z-index: 37;
}


/* =========================================================
   ПОЗИЦИИ ИГРУШЕК
========================================================= */

#toy0 {
    left: 73px;
}

#toy1 {
    left: 228px;
}

#toy2 {
    left: 383px;
}


/* =========================================================
   ТЕНИ ПОД ИГРУШКАМИ
========================================================= */

.toy::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -5px;

    width: 75px;
    height: 15px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: rgba(60,60,70,.16);

    filter: blur(5px);

    z-index: -1;
}

.toy.being-carried::after {
    opacity: 0;
}


/* =========================================================
   ШАХТА / ОТВЕРСТИЕ ДЛЯ ПРИЗА

   Оно находится ВНУТРИ камеры справа.
========================================================= */

#prizeChute {
    position: absolute;

    right: 13px;
    bottom: 43px;

    width: 128px;
    height: 82px;

    z-index: 20;

    pointer-events: none;
}


/* настоящая тёмная глубина */

#chuteHole {
    position: absolute;

    left: 8px;
    top: 3px;

    width: 112px;
    height: 58px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 28%,
            #42494c 0%,
            #202427 35%,
            #090a0b 70%,
            #020303 100%
        );

    box-shadow:
        inset 0 12px 15px rgba(0,0,0,.78),
        inset 0 -3px 5px rgba(255,255,255,.08),
        0 3px 7px rgba(70,45,50,.22);

    transform:
        perspective(120px)
        rotateX(13deg);

    z-index: 20;
}


/* внутренний розовый ободок */

#chuteRim {
    position: absolute;

    left: 4px;
    top: -2px;

    width: 120px;
    height: 66px;

    border:
        7px solid rgba(224,132,155,.82);

    border-radius: 50%;

    box-shadow:
        inset 0 3px 3px rgba(255,255,255,.55),
        0 2px 3px rgba(100,50,65,.15);

    z-index: 19;
}


/*
   Передняя половина шахты.

   Она специально находится ПЕРЕД падающей игрушкой.
   Благодаря этому игрушка не просто исчезает,
   а визуально проваливается внутрь.
*/

#chuteFront {
    position: absolute;

    left: 3px;
    top: 30px;

    width: 122px;
    height: 50px;

    border-radius:
        0 0 60px 60px;

    background:
        linear-gradient(
            180deg,
            #efa3b5 0%,
            #dd839a 55%,
            #c96983 100%
        );

    border-left:
        3px solid rgba(174,83,108,.35);

    border-right:
        3px solid rgba(174,83,108,.35);

    border-bottom:
        3px solid rgba(174,83,108,.42);

    box-shadow:
        inset 0 4px 5px rgba(255,255,255,.28),
        0 4px 6px rgba(70,35,45,.12);

    z-index: 42;
}


/* =========================================================
   ПЕРЕДНИЙ БОРТИК ПОЛА

   Ключевой элемент:
   он находится ПЕРЕД игрушками.

   Поэтому игрушки больше не выглядят
   приклеенными поверх автомата.
========================================================= */

#floorFront {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 52px;

    background:
        linear-gradient(
            180deg,
            rgba(255,202,214,.96) 0%,
            rgba(242,166,184,.98) 38%,
            rgba(221,126,151,.98) 100%
        );

    border-top:
        4px solid rgba(255,255,255,.82);

    box-shadow:
        0 -4px 8px rgba(90,45,60,.10),
        inset 0 5px 6px rgba(255,255,255,.30);

    z-index: 41;

    pointer-events: none;
}


/*
   Шахта должна остаться видимой поверх бортика.
*/

#prizeChute {
    z-index: 43;
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    pointer-events: none;

    z-index: 80;
}

#glass::before {
    content: "";

    position: absolute;

    left: 52px;
    top: -100px;

    width: 62px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.21),
            transparent
        );
}

#glass::after {
    content: "";

    position: absolute;

    right: 72px;
    top: -100px;

    width: 32px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* =========================================================
   ПЕРЕДНЯЯ РАМА АВТОМАТА
========================================================= */

#machineFront {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   КНОПКИ
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;
}

#leftButton {
    left: 105px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}

#rightButton {
    left: 225px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}

#grabButton {
    left: 400px;
    top: 810px;

    width: 128px;
    height: 128px;

    border-radius: 50%;
}

.control::after {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: inherit;

    transition:
        transform .1s,
        background .1s;
}

.control:active::after {
    transform: scale(.86);

    background: rgba(0,0,0,.08);
}


/* =========================================================
   ИГРУШКА В ОКНЕ ПРИЗА
========================================================= */

#prizeToy {
    position: absolute;

    left: 493px;
    top: 852px;

    width: 95px;
    height: 95px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 68px;

    opacity: 0;

    transform:
        translateY(-24px)
        scale(.55);

    transition:
        opacity .3s,
        transform .55s cubic-bezier(.2,.9,.3,1.25);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>
</head>


<body>

<div id="viewport">

<div id="game">


    <!-- ===================================================
         ЗАДАНИЕ
    ==================================================== -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <!-- ===================================================
         АВТОМАТ
    ==================================================== -->

    <div id="machine">


        <!-- =================================================
             ВСЁ ЖИВОЕ СОДЕРЖИМОЕ АВТОМАТА
        ================================================== -->

        <div id="machineInside">


            <div class="inside-light"></div>

            <div class="inside-floor"></div>

            <div id="rail"></div>


            <!-- =============================================
                 КЛЕШНЯ
            ============================================== -->

            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <!-- =============================================
                 ИГРУШКИ
            ============================================== -->

            <div
                class="toy"
                id="toy0"
                data-correct="false"
            >
                🦉
            </div>


            <div
                class="toy"
                id="toy1"
                data-correct="true"
            >
                🦊
            </div>


            <div
                class="toy"
                id="toy2"
                data-correct="false"
            >
                🍍
            </div>


            <!-- =============================================
                 ОТВЕРСТИЕ / ШАХТА
            ============================================== -->

            <div id="prizeChute">

                <div id="chuteRim"></div>

                <div id="chuteHole"></div>

                <div id="chuteFront"></div>

            </div>


            <!-- =============================================
                 ПЕРЕДНИЙ БОРТИК
            ============================================== -->

            <div id="floorFront"></div>


        </div>


        <!-- стекло -->

        <div id="glass"></div>


        <!-- передняя картинка автомата -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >


        <!-- игрушка в окошке ПРИЗ -->

        <div id="prizeToy"></div>


        <!-- кнопки -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>


<script>

/* =========================================================
   МАСШТАБ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const clawAssembly =
    document.getElementById("clawAssembly");

const prizeToy =
    document.getElementById("prizeToy");

const prizeChute =
    document.getElementById("prizeChute");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   ПОЗИЦИИ КЛЕШНИ

   Подогнаны так, чтобы центр клешни попадал
   именно в центр каждой игрушки.
========================================================= */

const SLOT_X = [
    33,
    188,
    343
];


/* =========================================================
   ПОЛОЖЕНИЕ ШАХТЫ
========================================================= */

const DROP_X = 343;


/* =========================================================
   ДЛИНЫ ТРОСА
========================================================= */

const CABLE_HOME = 65;

/*
   Лапки доходят непосредственно до игрушки.
*/

const CABLE_GRAB = 250;

/*
   Над шахтой.
*/

const CABLE_DROP = 255;

/*
   Неправильную игрушку поднимаем
   не до самого верха.
*/

const CABLE_WRONG = 155;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentSlot = 1;

let busy = false;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   ТРОС
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   КЛЕШНЯ
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(450);
}


async function openClaw() {

    setClaw("open");

    await wait(450);
}


async function closeClaw() {

    setClaw("closed");

    await wait(450);
}


/* =========================================================
   ОПУСКАЕМ КЛЕШНЮ
========================================================= */

async function lowerClaw() {

    setCable(CABLE_GRAB);

    await wait(950);
}


/* =========================================================
   ПОДНИМАЕМ ПУСТУЮ КЛЕШНЮ
========================================================= */

async function raiseClaw() {

    setCable(CABLE_HOME);

    await wait(950);
}


/* =========================================================
   ПЕРЕМЕЩЕНИЕ ПО X
========================================================= */

function updatePosition() {

    clawRig.style.left =
        SLOT_X[currentSlot] + "px";
}

updatePosition();


/* =========================================================
   КНОПКИ ВЛЕВО / ВПРАВО
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot > 0) {

            currentSlot--;

            updatePosition();
        }
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot < 2) {

            currentSlot++;

            updatePosition();
        }
    }
);


/* =========================================================
   ВАЖНО

   ДАЛЬШЕ НЕТ НИКАКОГО carriedToy.

   Мы двигаем ИМЕННО тот DOM-элемент,
   который ребёнок видит на полу.

   Поэтому подмены картинки больше нет.
========================================================= */


/* =========================================================
   ИСХОДНЫЙ ЦЕНТР ИГРУШКИ
========================================================= */

function getToyBaseCenter(toy) {

    return {

        x:
            toy.offsetLeft +
            toy.offsetWidth / 2,

        y:
            toy.offsetTop +
            toy.offsetHeight / 2
    };
}


/* =========================================================
   ТОЧКА, ГДЕ ИГРУШКУ ДЕРЖАТ ЛАПКИ

   Координаты относительно machineInside.
========================================================= */

function getGripPoint(
    rigX,
    cableLength
) {

    return {

        x:
            rigX + 95,

        y:
            15 +
            58 +
            cableLength +
            86
    };
}


/* =========================================================
   УСТАНАВЛИВАЕМ TRANSFORM ИГРУШКИ

   Никаких display:none.
   Никаких opacity:0 при захвате.
   Никаких копий.
========================================================= */

function moveToyToPoint(
    toy,
    targetX,
    targetY,
    duration,
    rotation = 0,
    scale = 1
) {

    const base =
        getToyBaseCenter(toy);

    const dx =
        targetX - base.x;

    const dy =
        targetY - base.y;


    toy.style.transition =
        `transform ${duration}ms cubic-bezier(.4,0,.2,1)`;


    /*
       Маленькое покачивание даёт ощущение веса.
    */

    toy.style.transform =
        `translate3d(${dx}px, ${dy}px, 0)
         rotate(${rotation}deg)
         scale(${scale})`;
}


/* =========================================================
   МОМЕНТ ЗАХВАТА

   Лапки уже закрылись.

   Мы не телепортируем игрушку в клешню.

   Она лишь на несколько пикселей подтягивается
   в точку захвата.
========================================================= */

async function grabRealToy(toy) {

    toy.classList.add(
        "being-carried"
    );


    const grip =
        getGripPoint(
            SLOT_X[currentSlot],
            CABLE_GRAB
        );


    /*
       Очень короткое мягкое подтягивание.

       Именно оно заменяет старый резкий
       attachToy().
    */

    moveToyToPoint(
        toy,
        grip.x,
        grip.y + 10,
        220,
        -1
    );


    await wait(230);
}


/* =========================================================
   ПОДЪЁМ ИГРУШКИ

   Трос и сама игрушка двигаются ОДНОВРЕМЕННО.
========================================================= */

async function raiseWithToy(toy) {

    const rigX =
        parseFloat(clawRig.style.left) ||
        SLOT_X[currentSlot];


    const grip =
        getGripPoint(
            rigX,
            CABLE_HOME
        );


    /*
       Начинаем движение клешни.
    */

    setCable(CABLE_HOME);


    /*
       В ту же миллисекунду начинает
       двигаться сама игрушка.
    */

    moveToyToPoint(
        toy,
        grip.x,
        grip.y + 10,
        900,
        2
    );


    await wait(920);
}


/* =========================================================
   НЕСЁМ ИГРУШКУ ВПРАВО

   Клешня и игрушка снова двигаются одновременно.
========================================================= */

async function moveToDropWithToy(toy) {

    clawRig.style.left =
        DROP_X + "px";


    const grip =
        getGripPoint(
            DROP_X,
            CABLE_HOME
        );


    moveToyToPoint(
        toy,
        grip.x,
        grip.y + 10,
        750,
        -2
    );


    await wait(780);
}


/* =========================================================
   ОПУСКАЕМСЯ К ШАХТЕ
========================================================= */

async function lowerToChuteWithToy(toy) {

    const grip =
        getGripPoint(
            DROP_X,
            CABLE_DROP
        );


    setCable(CABLE_DROP);


    moveToyToPoint(
        toy,
        grip.x,
        grip.y + 10,
        900,
        1
    );


    await wait(920);
}


/* =========================================================
   ПАДЕНИЕ В ШАХТУ

   Сначала открываются лапки.

   Затем та же игрушка физически падает вниз.

   Передняя часть шахты находится над игрушкой,
   поэтому создаётся ощущение проваливания.
========================================================= */

async function dropIntoChute(toy) {

    /*
       Лапки отпускают игрушку.
    */

    await openClaw();


    const base =
        getToyBaseCenter(toy);


    const chuteRect =
        prizeChute.getBoundingClientRect();

    const insideRect =
        machineInside.getBoundingClientRect();


    /*
       Переводим центр шахты обратно
       в координаты machineInside.
    */

    const chuteCenterX =
        prizeChute.offsetLeft +
        prizeChute.offsetWidth / 2;


    /*
       Игрушка падает значительно ниже
       видимой поверхности отверстия.
    */

    const chuteBottomY =
        prizeChute.offsetTop +
        prizeChute.offsetHeight +
        75;


    const dx =
        chuteCenterX - base.x;

    const dy =
        chuteBottomY - base.y;


    toy.style.transition =
        "transform 560ms cubic-bezier(.45,.05,.8,.35), opacity 180ms 390ms ease";


    toy.style.transform =
        `translate3d(${dx}px, ${dy}px, 0)
         rotate(9deg)
         scale(.88)`;


    /*
       Исчезает только тогда,
       когда большая часть уже ушла
       внутрь отверстия.
    */

    await wait(390);

    toy.style.opacity = "0";


    await wait(190);
}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function correctCycle(toy) {


    /* -----------------------------------------------
       1. Подхватываем ту же самую игрушку
    ------------------------------------------------ */

    await grabRealToy(toy);


    /* -----------------------------------------------
       2. Поднимаем её
    ------------------------------------------------ */

    await raiseWithToy(toy);


    /* -----------------------------------------------
       3. Несём к шахте
    ------------------------------------------------ */

    await moveToDropWithToy(toy);


    /* -----------------------------------------------
       4. Опускаем над отверстием
    ------------------------------------------------ */

    await lowerToChuteWithToy(toy);


    /* -----------------------------------------------
       5. Реально роняем в отверстие
    ------------------------------------------------ */

    await dropIntoChute(toy);


    /* -----------------------------------------------
       6. Только ПОСЛЕ падения появляется приз
    ------------------------------------------------ */

    prizeToy.textContent =
        toy.textContent.trim();


    prizeToy.classList.add(
        "show"
    );


    await wait(650);


    /* -----------------------------------------------
       7. Пустая клешня поднимается
    ------------------------------------------------ */

    await raiseClaw();


    /* -----------------------------------------------
       8. Возвращается в центр
    ------------------------------------------------ */

    currentSlot = 1;

    updatePosition();


    await wait(800);


    /* -----------------------------------------------
       9. Обычное положение лапок
    ------------------------------------------------ */

    await neutralClaw();
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА

   Здесь тоже больше НЕТ подмены.

   Клешня действительно слегка поднимает
   исходную игрушку, отпускает её,
   и она падает обратно на своё место.
========================================================= */

async function wrongCycle(toy) {


    await grabRealToy(toy);


    const rigX =
        SLOT_X[currentSlot];


    const upperGrip =
        getGripPoint(
            rigX,
            CABLE_WRONG
        );


    /*
       Немного поднимаем.
    */

    setCable(CABLE_WRONG);


    moveToyToPoint(
        toy,
        upperGrip.x,
        upperGrip.y + 10,
        650,
        -3
    );


    await wait(680);


    /*
       Лапки раскрываются.
    */

    await openClaw();


    /*
       Игрушка падает именно на свою
       исходную позицию.

       Никакой новой картинки.
    */

    toy.style.transition =
        "transform 480ms cubic-bezier(.35,.05,.55,1.25)";


    toy.style.transform =
        "translate3d(0,0,0) rotate(0deg) scale(1)";


    await wait(500);


    /*
       Маленькое покачивание после падения.
    */

    toy.style.transition =
        "transform 120ms ease";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(120);


    toy.style.transform =
        "rotate(3deg)";


    await wait(120);


    toy.style.transform =
        "rotate(0deg)";


    await wait(130);


    toy.classList.remove(
        "being-carried"
    );


    /*
       Пустая клешня возвращается наверх.
    */

    await raiseClaw();


    await neutralClaw();
}


/* =========================================================
   КРАСНАЯ КНОПКА

   ПОЛНАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ:

   1. нажали
   2. лапки раскрылись
   3. открытая клешня спускается
   4. доходит до игрушки
   5. лапки закрываются ВОКРУГ неё
   6. та же самая игрушка начинает двигаться
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        /*
           Правильная игрушка уже выиграна.
        */

        if (
            toy.style.opacity === "0"
        ) {
            return;
        }


        busy = true;


        try {


            /* =============================================
               1. РАСКРЫВАЕМ ЛАПКИ
            ============================================== */

            await openClaw();


            /* =============================================
               2. ОТКРЫТОЙ КЛЕШНЕЙ ИДЁМ ВНИЗ
            ============================================== */

            await lowerClaw();


            /* =============================================
               3. ЗАКРЫВАЕМ ЛАПКИ ВОКРУГ ИГРУШКИ

               Пока игрушка вообще НЕ двигается.
               Поэтому здесь нет скачка.
            ============================================== */

            await closeClaw();


            /* =============================================
               4. ТЕПЕРЬ ИГРУШКА СЧИТАЕТСЯ СХВАЧЕННОЙ
            ============================================== */

            const correct =
                toy.dataset.correct === "true";


            if (correct) {

                await correctCycle(toy);

            } else {

                await wrongCycle(toy);
            }


        } finally {

            busy = false;
        }
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (event.key === "ArrowLeft") {

            leftButton.click();
        }


        if (event.key === "ArrowRight") {

            rightButton.click();
        }


        if (event.code === "Space") {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   СТАРТОВОЕ СОСТОЯНИЕ
========================================================= */

setCable(CABLE_HOME);

setClaw("neutral");

</script>
