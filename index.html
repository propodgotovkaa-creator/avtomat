<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   ИГРОВОЕ ПОЛЕ
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}


/* =========================================================
   ЗАДАНИЕ
========================================================= */

.task {
    position: absolute;

    left: 115px;
    top: 145px;

    width: 520px;

    padding: 30px 35px;

    border-radius: 34px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 24px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 42px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}


/* =========================================================
   РАУНД
========================================================= */

.progress {
    position: absolute;

    left: 165px;
    top: 390px;

    width: 420px;

    padding: 20px;

    border-radius: 28px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 27px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
    position: absolute;

    left: 780px;
    top: 25px;

    width: 735px;
    height: 1030px;

    z-index: 10;
}


/* =========================================================
   ВНУТРЕННЯЯ КАМЕРА
========================================================= */

#machineInside {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    border-radius: 12px;

    background:
        radial-gradient(
            ellipse at 50% 5%,
            rgba(255,248,195,.8),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #eefcf9 0%,
            #fafffe 52%,
            #fff9f2 100%
        );

    z-index: 1;
}


/* =========================================================
   ВЕРХНИЙ СВЕТ
========================================================= */

.inside-light {
    position: absolute;

    left: 50px;
    top: 17px;

    width: 467px;
    height: 11px;

    border-radius: 20px;

    background: #fff5b8;

    box-shadow:
        0 0 15px rgba(255,239,150,.8),
        0 0 30px rgba(255,239,150,.4);

    z-index: 2;
}


/* =========================================================
   ПОЛ
========================================================= */

.inside-floor {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 72px;

    background:
        linear-gradient(
            180deg,
            #fffdf8 0%,
            #fff5ed 45%,
            #f8dfe3 100%
        );

    border-top:
        3px solid rgba(226,150,170,.45);

    z-index: 3;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
    position: absolute;

    left: 42px;
    top: 42px;

    width: 483px;
    height: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #dce4e6 22%,
            #8b969b 52%,
            #606a70 72%,
            #dce3e5 100%
        );

    border:
        2px solid rgba(88,98,103,.45);

    box-shadow:
        0 4px 6px rgba(0,0,0,.14),
        inset 0 2px 2px rgba(255,255,255,.9);

    z-index: 8;
}


/* =========================================================
   ПРИЁМНЫЙ ЛЮК

   Он находится ВНУТРИ камеры.
========================================================= */

#dropChute {
    position: absolute;

    right: 25px;
    bottom: 67px;

    width: 108px;
    height: 48px;

    z-index: 11;

    pointer-events: none;
}


/* тёмное отверстие */

#dropHole {
    position: absolute;

    left: 7px;
    top: 9px;

    width: 94px;
    height: 31px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 50% 40%,
            #4b3542 0%,
            #261b23 55%,
            #130e12 100%
        );

    box-shadow:
        inset 0 8px 10px rgba(0,0,0,.55),
        0 2px 0 rgba(255,255,255,.7),
        0 0 0 5px #f1b9c7,
        0 0 0 7px rgba(183,104,130,.55);

    z-index: 2;
}


/* передняя кромка люка */

#dropChuteFront {
    position: absolute;

    left: 3px;
    top: 24px;

    width: 102px;
    height: 27px;

    border-radius: 0 0 48px 48px;

    background:
        linear-gradient(
            180deg,
            rgba(226,146,170,.94),
            rgba(191,105,137,.98)
        );

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.45);

    z-index: 60;
}


/* =========================================================
   КЛЕШНЯ
========================================================= */

#clawRig {
    --cable: 65px;

    position: absolute;

    left: 189px;
    top: 15px;

    width: 190px;
    height: 550px;

    z-index: 30;

    transition:
        left .82s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   ТОЧКА ТРОСА
========================================================= */

#cableAnchor {
    position: absolute;

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 34;
}


/* =========================================================
   ТРОС
========================================================= */

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;
    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КОРПУС КЛЕШНИ
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 40;

    transition:
        top .9s cubic-bezier(.45,0,.25,1);
}


#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;
    height: auto;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


/* =========================================================
   ЛЕВАЯ ЛАПКА
========================================================= */

#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 66px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ПРАВАЯ ЛАПКА
========================================================= */

#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin: 16px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ОБЫЧНАЯ КЛЕШНЯ
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


/* =========================================================
   ОТКРЫТАЯ

   Нажали красную кнопку -> открылась.
========================================================= */

#clawAssembly.open #clawLeft {
    transform: rotate(25deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-25deg);
}


/* =========================================================
   ЗАКРЫТАЯ

   Только когда дошла до игрушки.
========================================================= */

#clawAssembly.closed #clawLeft {
    transform: rotate(-25deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(25deg);
}


/* =========================================================
   ИГРУШКИ

   Все стоят НА ПОЛУ.
========================================================= */

.toy {
    position: absolute;

    bottom: 69px;

    width: 108px;
    height: 118px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 15;

    pointer-events: none;

    transform-origin: 50% 50%;

    will-change:
        left,
        top,
        transform;
}


/* =========================================================
   РАСПОЛОЖЕНИЕ

   Справа оставляем место для люка.
========================================================= */

#toy0 {
    left: 66px;
}

#toy1 {
    left: 205px;
}

#toy2 {
    left: 344px;
}


/* =========================================================
   ЗАХВАЧЕННАЯ ИГРУШКА

   Это тот же самый IMG.
========================================================= */

.toy.caught {
    z-index: 43;
}


/* лёгкое естественное покачивание */

.toy.swing {
    animation:
        toySwing .72s ease-in-out infinite alternate;
}

@keyframes toySwing {

    from {
        rotate: -2deg;
    }

    to {
        rotate: 2deg;
    }
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    pointer-events: none;

    z-index: 80;
}

#glass::before {
    content: "";

    position: absolute;

    left: 52px;
    top: -100px;

    width: 62px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.21),
            transparent
        );
}

#glass::after {
    content: "";

    position: absolute;

    right: 72px;
    top: -100px;

    width: 32px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* =========================================================
   ПЕРЕДНЯЯ РАМА
========================================================= */

#machineFront {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   КНОПКИ
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;
}


#leftButton {
    left: 105px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


#rightButton {
    left: 225px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


#grabButton {
    left: 400px;
    top: 810px;

    width: 128px;
    height: 128px;

    border-radius: 50%;
}


.control::after {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: inherit;

    transition:
        transform .1s,
        background .1s;
}


.control:active::after {
    transform: scale(.86);

    background: rgba(0,0,0,.08);
}


/* =========================================================
   ПРИЗ

   На старте пустой.
========================================================= */

#prizeToy {
    position: absolute;

    left: 493px;
    top: 850px;

    width: 95px;
    height: 95px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.75);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}


#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


    <!-- ===================================================
         ЗАДАНИЕ
    ==================================================== -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>



    <!-- ===================================================
         АВТОМАТ
    ==================================================== -->

    <div id="machine">


        <!-- =================================================
             ВНУТРЕННЯЯ КАМЕРА
        ================================================== -->

        <div id="machineInside">


            <div class="inside-light"></div>

            <div class="inside-floor"></div>

            <div id="rail"></div>



            <!-- =============================================
                 КЛЕШНЯ
            ============================================== -->

            <div id="clawRig">


                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">


                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >


                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >


                    </div>

                </div>

            </div>



            <!-- =============================================
                 ИГРУШКИ
            ============================================== -->

            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                alt="Ананас"
                draggable="false"
            >



            <!-- =============================================
                 ПРИЁМНЫЙ ЛЮК
            ============================================== -->

            <div id="dropChute">

                <div id="dropHole"></div>

                <div id="dropChuteFront"></div>

            </div>


        </div>



        <!-- =================================================
             БЛИК СТЕКЛА
        ================================================== -->

        <div id="glass"></div>



        <!-- =================================================
             РАМА
        ================================================== -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >



        <!-- =================================================
             ОКНО ПРИЗА
        ================================================== -->

        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >



        <!-- =================================================
             КНОПКИ
        ================================================== -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>



<script>

/* =========================================================
   ОСНОВНЫЕ РАЗМЕРЫ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 567;
const INSIDE_HEIGHT = 570;



/* =========================================================
   МАСШТАБ
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();



/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");

const dropHole =
    document.getElementById("dropHole");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];



/* =========================================================
   ПОЗИЦИИ ТРЁХ ИГРУШЕК

   Эти позиции безопасны:
   клешня не должна залезать на боковые стенки.
========================================================= */

const SLOT_X = [

    34,     // собака

    173,    // лиса

    312     // ананас

];



/* =========================================================
   ТОЧКА ЛЮКА

   Клешня приезжает сюда,
   оставаясь внутри камеры.
========================================================= */

const DROP_RIG_X = 335;



/* =========================================================
   ТРОС
========================================================= */

const CABLE_HOME = 65;


/*
   Опускание к игрушкам.
*/

const CABLE_GRAB = 278;


/*
   Подняли игрушку.
*/

const CABLE_LIFT = 78;


/*
   Высота перед люком.
*/

const CABLE_DROP = 230;


/*
   Для неправильного ответа
   поднимаем игрушку совсем немного.
*/

const CABLE_WRONG_LIFT = 185;



/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;



/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}



/* =========================================================
   КЛЕШНЯ
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(430);
}


async function openClaw() {

    setClaw("open");

    await wait(470);
}


async function closeClaw() {

    setClaw("closed");

    await wait(470);
}



/* =========================================================
   ТРОС
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}



/* =========================================================
   ДВИЖЕНИЕ КАРЕТКИ
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}



/* =========================================================
   КНОПКИ
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot <= 0) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (busy) {
            return;
        }

        if (currentSlot >= 2) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);



/* =========================================================
   СОХРАНЯЕМ ТОЧНЫЕ ДОМАШНИЕ ПОЗИЦИИ ИГРУШЕК
========================================================= */

const toyHome = toys.map(
    toy => {

        const style =
            getComputedStyle(toy);

        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)

        };
    }
);



/* =========================================================
   ПОЛУЧАЕМ ФАКТИЧЕСКОЕ ПОЛОЖЕНИЕ ИГРУШКИ
   В КООРДИНАТАХ ВНУТРЕННЕЙ КАМЕРЫ
========================================================= */

function getToyLocalPosition(toy) {

    const insideRect =
        machineInside.getBoundingClientRect();

    const toyRect =
        toy.getBoundingClientRect();


    const scale =
        insideRect.width /
        INSIDE_WIDTH;


    return {

        left:
            (toyRect.left - insideRect.left) /
            scale,

        top:
            (toyRect.top - insideRect.top) /
            scale

    };
}



/* =========================================================
   ЗАХВАТ

   КРИТИЧЕСКИ ВАЖНО:

   здесь НЕ создаётся новая игрушка.

   Мы лишь меняем способ позиционирования
   того же самого IMG.

   Перед изменением сначала запоминаем
   его фактическую координату.

   Поэтому скачка быть не должно.
========================================================= */

function attachRealToy(toy) {

    const position =
        getToyLocalPosition(toy);


    /*
       Сначала отключаем transition,
       чтобы перевод bottom -> top
       не создавал никакой анимации.
    */

    toy.style.transition =
        "none";


    /*
       Фиксируем ТОЧНО ту позицию,
       где картинка уже находится.
    */

    toy.style.left =
        `${position.left}px`;

    toy.style.top =
        `${position.top}px`;

    toy.style.bottom =
        "auto";


    /*
       Это всё ещё тот же элемент.
    */

    toy.classList.add(
        "caught"
    );


    grabbedToy = toy;
}



/* =========================================================
   КООРДИНАТЫ ИГРУШКИ ПОД КЛЕШНЁЙ
========================================================= */

function getHeldToyPosition() {

    if (!grabbedToy) {
        return null;
    }


    const rigStyle =
        getComputedStyle(clawRig);

    const cableStyle =
        getComputedStyle(cable);


    const rigX =
        parseFloat(
            rigStyle.left
        );


    const cableLength =
        parseFloat(
            cableStyle.height
        );


    const toyWidth =
        grabbedToy.offsetWidth;


    /*
       Центр троса находится примерно:
       rigX + 95
    */

    const centerX =
        rigX + 95;


    /*
       Игрушка располагается непосредственно
       под корпусом клешни,
       между лапками.
    */

    return {

        left:
            centerX -
            toyWidth / 2,

        top:
            58 +
            cableLength +
            76

    };
}



/* =========================================================
   СЛЕДОВАНИЕ ЗА КЛЕШНЁЙ

   requestAnimationFrame читает реальное положение
   каретки и реальную длину троса каждый кадр.

   Поэтому игрушка едет вместе с механизмом,
   а не отдельной заранее рассчитанной анимацией.
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }


    const position =
        getHeldToyPosition();


    if (position) {

        grabbedToy.style.left =
            `${position.left}px`;

        grabbedToy.style.top =
            `${position.top}px`;
    }


    followFrame =
        requestAnimationFrame(
            followToy
        );
}



function startFollowingToy() {

    stopFollowingToy();

    followToy();
}



function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}



/* =========================================================
   ПЛАВНО ПОДТЯГИВАЕМ ИГРУШКУ В ЦЕНТР ЛАПОК

   Это очень короткое движение.

   Оно нужно только если размеры PNG отличаются
   на несколько пикселей.

   Никаких телепортаций.
========================================================= */

async function settleToyIntoClaw() {

    if (!grabbedToy) {
        return;
    }


    const target =
        getHeldToyPosition();


    if (!target) {
        return;
    }


    grabbedToy.style.transition =
        "left .16s ease-out, top .16s ease-out";


    grabbedToy.style.left =
        `${target.left}px`;

    grabbedToy.style.top =
        `${target.top}px`;


    await wait(170);


    grabbedToy.style.transition =
        "none";
}



/* =========================================================
   ОТКРЫТАЯ КЛЕШНЯ ВНИЗ
========================================================= */

async function lowerOpenClaw() {

    /*
       Здесь состояние лапок НЕ меняется.

       Она уже OPEN.
    */

    setCable(
        CABLE_GRAB
    );

    await wait(950);
}



/* =========================================================
   ПРАВИЛЬНЫЙ ЗАХВАТ
========================================================= */

async function correctSequence(toy) {


    /* =====================================================
       КЛЕШНЯ УЖЕ ЗАКРЫТА ВОКРУГ ИГРУШКИ.

       Теперь подключаем именно существующий PNG.
    ===================================================== */

    attachRealToy(toy);


    /*
       Если центр отличается буквально на несколько px,
       мягко усаживаем игрушку между лапками.
    */

    await settleToyIntoClaw();


    /*
       Теперь начинается непрерывное следование.
    */

    startFollowingToy();


    toy.classList.add(
        "swing"
    );


    /* =====================================================
       ПОДНИМАЕМ
    ===================================================== */

    setCable(
        CABLE_LIFT
    );

    await wait(1000);



    /* =====================================================
       ЕДЕМ К ЛЮКУ
    ===================================================== */

    moveRigTo(
        DROP_RIG_X
    );

    await wait(900);



    /* =====================================================
       ОПУСКАЕМ НАД ЛЮКОМ
    ===================================================== */

    setCable(
        CABLE_DROP
    );

    await wait(900);



    toy.classList.remove(
        "swing"
    );



    /* =====================================================
       ОТКРЫВАЕМ КЛЕШНЮ.

       Именно здесь она отпускает игрушку.
    ===================================================== */

    await openClaw();



    /* =====================================================
       ИГРУШКА БОЛЬШЕ НЕ ПРИВЯЗАНА К КЛЕШНЕ
    ===================================================== */

    stopFollowingToy();



    /* =====================================================
       ПОЛУЧАЕМ ТЕКУЩУЮ КООРДИНАТУ.

       Никаких скачков.
    ===================================================== */

    const currentTop =
        parseFloat(
            getComputedStyle(toy).top
        );


    /*
       Центр отверстия примерно на высоте 500px
       внутри камеры.

       Игрушка должна физически провалиться
       ниже этой линии.
    */

    const holeTargetTop =
        525;


    /* =====================================================
       ПАДЕНИЕ В ЛЮК

       Игрушка не исчезает сразу.
       Она реально идёт вниз.
    ===================================================== */

    toy.style.transition =
        "top .62s cubic-bezier(.55,.02,.78,.35), transform .62s ease";


    toy.style.top =
        `${holeTargetTop}px`;

    toy.style.transform =
        "rotate(7deg) scale(.96)";


    /*
       Благодаря dropChuteFront передняя кромка
       оказывается визуально ПЕРЕД игрушкой.

       Поэтому создаётся эффект,
       что игрушка входит внутрь отверстия.
    */

    await wait(520);



    /*
       Она уже почти полностью внутри.
       Теперь мягко скрываем последние пиксели.
    */

    toy.style.transition =
        "top .20s ease-in, opacity .16s ease-in";


    toy.style.top =
        `${holeTargetTop + 45}px`;

    toy.style.opacity =
        "0";


    await wait(210);



    /* =====================================================
       ИГРУШКА ПРОШЛА ПО ВНУТРЕННЕМУ КАНАЛУ.

       Небольшая пауза.
    ===================================================== */

    await wait(220);



    /* =====================================================
       ПОЯВЛЯЕТСЯ В ОКНЕ ПРИЗА
    ===================================================== */

    prizeToy.src =
        toy.src;

    prizeToy.classList.add(
        "show"
    );


    await wait(650);



    /* =====================================================
       ПУСТАЯ КЛЕШНЯ ПОДНИМАЕТСЯ
    ===================================================== */

    setCable(
        CABLE_HOME
    );

    await wait(950);



    /* =====================================================
       ВОЗВРАЩАЕМ В ЦЕНТР
    ===================================================== */

    currentSlot = 1;

    updatePosition();

    await wait(850);



    /* =====================================================
       ОБЫЧНОЕ ПОЛОЖЕНИЕ ЛАПОК
    ===================================================== */

    await neutralClaw();


    grabbedToy = null;
}



/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА

   Хватаем ТОТ ЖЕ PNG.
   Чуть поднимаем.
   Открываем.
   Он падает обратно на исходное место.
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    attachRealToy(toy);


    await settleToyIntoClaw();


    startFollowingToy();


    toy.classList.add(
        "swing"
    );



    /* =====================================================
       НЕМНОГО ПОДНЯЛИ
    ===================================================== */

    setCable(
        CABLE_WRONG_LIFT
    );

    await wait(720);



    toy.classList.remove(
        "swing"
    );



    /* =====================================================
       ОТПУСКАЕМ
    ===================================================== */

    await openClaw();


    stopFollowingToy();



    /* =====================================================
       ФАКТИЧЕСКАЯ ТЕКУЩАЯ ПОЗИЦИЯ
    ===================================================== */

    const currentTop =
        parseFloat(
            getComputedStyle(toy).top
        );


    /*
       Точное место,
       где игрушка стояла изначально.
    */

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;



    /* =====================================================
       ПАДАЕТ ОБРАТНО
    ===================================================== */

    toy.style.transition =
        "top .55s cubic-bezier(.55,.03,.78,.35), transform .55s ease";


    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(-4deg)";


    await wait(530);



    /* маленькое приземление */

    toy.style.transition =
        "transform .16s ease";

    toy.style.transform =
        "rotate(2deg) scaleY(.97)";


    await wait(150);


    toy.style.transform =
        "rotate(0deg) scaleY(1)";


    await wait(150);



    /* =====================================================
       ВОЗВРАЩАЕМ ИСХОДНОЕ ПОЗИЦИОНИРОВАНИЕ

       Визуально ничего не меняется,
       потому что координата та же.
    ===================================================== */

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";



    /* =====================================================
       КЛЕШНЯ ВВЕРХ
    ===================================================== */

    setCable(
        CABLE_HOME
    );

    await wait(950);


    await neutralClaw();


    grabbedToy = null;
}



/* =========================================================
   КРАСНАЯ КНОПКА

   ТОЧНАЯ МЕХАНИКА:

   ОБЫЧНАЯ
        ↓
   нажали 🔴
        ↓
   ОТКРЫЛАСЬ
        ↓
   открытой идёт вниз
        ↓
   дошла до игрушки
        ↓
   ЗАКРЫЛАСЬ
        ↓
   игрушка начинает двигаться вместе с ней
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        /*
           Уже пойманную правильную игрушку
           повторно брать нельзя.
        */

        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }


        busy = true;



        /* =================================================
           1. НАЖАЛИ КНОПКУ

           РАСКРЫВАЕМ.
        ================================================= */

        await openClaw();



        /* =================================================
           2. ОТКРЫТОЙ СПУСКАЕМ.
        ================================================= */

        await lowerOpenClaw();



        /* =================================================
           3. ДОШЛИ ДО ИГРУШКИ.

           ТОЛЬКО ТЕПЕРЬ ЗАКРЫВАЕМ.
        ================================================= */

        await closeClaw();



        /* =================================================
           4. ТОЛЬКО ПОСЛЕ ЗАКРЫТИЯ
           ИГРУШКА СЧИТАЕТСЯ ЗАХВАЧЕННОЙ.
        ================================================= */

        const correct =
            toy.dataset.correct === "true";


        if (correct) {

            await correctSequence(
                toy
            );

        } else {

            await wrongSequence(
                toy,
                currentSlot
            );
        }


        busy = false;
    }
);



/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (event.key === "ArrowLeft") {

            leftButton.click();
        }


        if (event.key === "ArrowRight") {

            rightButton.click();
        }


        if (event.code === "Space") {

            event.preventDefault();

            grabButton.click();
        }
    }
);



/* =========================================================
   СТАРТОВОЕ СОСТОЯНИЕ
========================================================= */


/*
   ПРИЗ ОБЯЗАТЕЛЬНО ПУСТОЙ.
*/

prizeToy.src = "";

prizeToy.classList.remove(
    "show"
);


/*
   Все игрушки видимы.
*/

toys.forEach(
    toy => {

        toy.style.opacity =
            "1";
    }
);


/*
   Клешня наверху.
*/

setCable(
    CABLE_HOME
);


/*
   Клешня обычная,
   НЕ открытая.
*/

setClaw(
    "neutral"
);


/*
   Начинаем над центральной игрушкой.
*/

currentSlot = 1;

updatePosition();

</script>
