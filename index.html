<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}


/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;

    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}


/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 28px 30px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;
    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 22px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 38px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 960px;

    z-index: 10;
}


/* =========================================================
   BACK
========================================================= */

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 100px;
    top: 150px;

    width: 1085px;
    height: 490px;

    overflow: hidden;

    z-index: 10;
}


/* =========================================================
   CLAW RIG
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 408px;
    top: 20px;

    width: 170px;
    height: 465px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}


/* =========================================================
   CART
========================================================= */

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   CABLE
========================================================= */

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 34;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW
========================================================= */

#clawAssembly {
    position: absolute;

    left: -77px;

    top: calc(var(--cable) - 10px);

    width: 160px;
    height: 180px;

    transition:
        top .92s cubic-bezier(.37,0,.18,1);
}


/* =========================================================
   CLAW BODY
========================================================= */

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 32;

    pointer-events: none;
}


/* =========================================================
   BACK CLAW
========================================================= */

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 58px 15px;

    z-index: 31;

    transition:
        transform .46s cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   FRONT CLAW
========================================================= */

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin: 14px 15px;

    z-index: 55;

    transition:
        transform .46s cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}


/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}


#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}


/* =========================================================
   TOYS
========================================================= */

.toy {
    position: absolute;

    bottom: 22px;

    width: 135px;
    height: 145px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 40;

    pointer-events: none;

    transform-origin: 50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}


/* СОБАКА */

#toy0 {
    left: 120px;
}


/* ЛИСА */

#toy1 {
    left: 435px;
}


/* АНАНАС */

#toy2 {
    left: 650px;
}


.toy.caught {
    z-index: 40;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}


#clawRig.grabbing #clawBody {
    z-index: 32;
}

#clawRig.grabbing #clawLeft {
    z-index: 31;
}

#clawRig.grabbing #clawRight {
    z-index: 55;
}


/* =========================================================
   FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color: transparent;
}

#leftButton {
    left: 230px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#rightButton {
    left: 410px;
    top: 715px;

    width: 145px;
    height: 130px;

    border-radius: 50%;
}

#grabButton {
    left: 690px;
    top: 700px;

    width: 160px;
    height: 150px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}


/* =========================================================
   PRIZE
========================================================= */

#prizeToy {
    position: absolute;

    left: 910px;
    top: 720px;

    width: 170px;
    height: 125px;

    object-fit: contain;

    opacity: 0;

    transform:
        translateY(-18px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s cubic-bezier(.2,.9,.3,1.2);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>

</head>


<body>

<div id="viewport">

<div id="game">


    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <div id="machine">


        <img
            id="machineBack"
            src="machine-back-wide.png"
            alt=""
            draggable="false"
        >


        <div id="machineInside">


            <div id="clawRig">

                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">

                    <div id="cable"></div>


                    <div
                        id="clawAssembly"
                        class="neutral"
                    >

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >

                    </div>

                </div>

            </div>


            <img
                class="toy"
                id="toy0"
                src="toy/sobaka.png"
                data-correct="false"
                data-grab="244"
                alt="Собака"
                draggable="false"
            >


            <img
                class="toy"
                id="toy1"
                src="toy/lisa.png"
                data-correct="true"
                data-grab="238"
                alt="Лиса"
                draggable="false"
            >


            <img
                class="toy"
                id="toy2"
                src="toy/ananas.png"
                data-correct="false"
                data-grab="230"
                alt="Ананас"
                draggable="false"
            >


        </div>


        <img
            id="machineFront"
            src="machine-front-wide.png"
            alt=""
            draggable="false"
        >


        <img
            id="prizeToy"
            src=""
            alt=""
            draggable="false"
        >


        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>


<script>

/* =========================================================
   DIMENSIONS
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const INSIDE_WIDTH = 1085;
const INSIDE_HEIGHT = 490;


/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ELEMENTS
========================================================= */

const machineInside =
    document.getElementById("machineInside");

const clawRig =
    document.getElementById("clawRig");

const cable =
    document.getElementById("cable");

const clawAssembly =
    document.getElementById("clawAssembly");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");

const prizeToy =
    document.getElementById("prizeToy");


const toys = [

    document.getElementById("toy0"),

    document.getElementById("toy1"),

    document.getElementById("toy2")

];


/* =========================================================
   CLAW POSITIONS
========================================================= */

const SLOT_X = [

    102,

    417,

    632

];


/* =========================================================
   SHAFT / DROP POSITION

   ВАЖНО:
   это положение клешни над центром
   чёрного отверстия.

   Было 845 — слишком далеко вправо.
========================================================= */

const DROP_RIG_X = 735;


/* =========================================================
   CABLE
========================================================= */

const CABLE_HOME = 42;

const CABLE_LIFT = 52;

const CABLE_DROP_APPROACH = 185;

const CABLE_DROP = 218;

const CABLE_WRONG_LIFT = 145;


/* =========================================================
   STATE
========================================================= */

let currentSlot = 1;

let busy = false;

let grabbedToy = null;

let followFrame = null;


/*
   НОВОЕ.

   Здесь мы будем хранить реальное положение
   игрушки относительно клешни В МОМЕНТ ЗАХВАТА.

   Благодаря этому никакого скачка не будет.
*/

let heldOffsetX = 0;
let heldOffsetY = 0;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   CLAW STATE
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}


async function neutralClaw() {

    setClaw("neutral");

    await wait(380);
}


async function openClaw() {

    setClaw("open");

    await wait(460);
}


/* =========================================================
   CABLE
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   MOVE CLAW
========================================================= */

function moveRigTo(x) {

    clawRig.style.left =
        `${x}px`;
}


function updatePosition() {

    moveRigTo(
        SLOT_X[currentSlot]
    );
}


/* =========================================================
   LEFT / RIGHT
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot <= 0
        ) {
            return;
        }

        currentSlot--;

        updatePosition();
    }
);


rightButton.addEventListener(
    "click",
    () => {

        if (
            busy ||
            currentSlot >= 2
        ) {
            return;
        }

        currentSlot++;

        updatePosition();
    }
);


/* =========================================================
   HOME POSITIONS
========================================================= */

const toyHome =
    toys.map(toy => {

        const style =
            getComputedStyle(toy);

        return {

            left:
                parseFloat(style.left),

            bottom:
                parseFloat(style.bottom),

            width:
                parseFloat(style.width),

            height:
                parseFloat(style.height)

        };
    });


/* =========================================================
   POSITION HELPERS
========================================================= */

function getInsideScale() {

    const rect =
        machineInside.getBoundingClientRect();

    return rect.width / INSIDE_WIDTH;
}


function getLocalRect(element) {

    const insideRect =
        machineInside.getBoundingClientRect();

    const rect =
        element.getBoundingClientRect();

    const scale =
        getInsideScale();

    return {

        left:
            (rect.left - insideRect.left) / scale,

        top:
            (rect.top - insideRect.top) / scale,

        width:
            rect.width / scale,

        height:
            rect.height / scale

    };
}


/* =========================================================
   FREEZE TOY

   Внешне игрушка вообще не меняет положение.
========================================================= */

function freezeToy(toy) {

    const rect =
        getLocalRect(toy);

    toy.style.transition =
        "none";

    toy.style.left =
        `${rect.left}px`;

    toy.style.top =
        `${rect.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "caught"
    );

    grabbedToy =
        toy;
}


/* =========================================================
   ЗАПОМИНАЕМ РЕАЛЬНЫЙ ЗАХВАТ

   Это ключевое исправление.

   Мы НЕ говорим игрушке:
   "перейди в заранее заданную точку".

   Мы смотрим, где она находится СЕЙЧАС
   относительно центра механизма.

   Это расстояние потом сохраняется.
========================================================= */

function captureHeldOffset() {

    if (!grabbedToy) {
        return;
    }

    const toyRect =
        getLocalRect(grabbedToy);

    const rigRect =
        getLocalRect(clawRig);


    /*
       Точка подвеса.

       Центр rig по X.
       По Y ориентируемся на положение
       самого захвата.
    */

    const anchorX =
        rigRect.left + 85;

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorY =
        rigRect.top +
        52 +
        cableLength;


    /*
       Запоминаем ТОЧНО текущее расстояние.

       Никакого перемещения здесь нет.
    */

    heldOffsetX =
        toyRect.left - anchorX;

    heldOffsetY =
        toyRect.top - anchorY;
}


/* =========================================================
   TARGET

   Теперь положение строится из сохранённого offset.

   Поэтому первый кадр follow совпадает
   с последним кадром захвата.
========================================================= */

function getHeldTarget() {

    if (!grabbedToy) {
        return null;
    }

    const rigRect =
        getLocalRect(clawRig);

    const cableLength =
        parseFloat(
            getComputedStyle(cable).height
        );

    const anchorX =
        rigRect.left + 85;

    const anchorY =
        rigRect.top +
        52 +
        cableLength;


    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}


/* =========================================================
   FOLLOW

   Первое движение абсолютно плавное.

   По Y игрушка почти жёстко следует за клешнёй.
   По X оставляем совсем небольшую массу.
========================================================= */

function followToy() {

    if (!grabbedToy) {
        return;
    }


    const target =
        getHeldTarget();


    if (!target) {
        return;
    }


    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );


    if (!Number.isFinite(currentLeft)) {
        currentLeft = target.left;
    }

    if (!Number.isFinite(currentTop)) {
        currentTop = target.top;
    }


    /*
       Очень мягкая горизонтальная инерция.
    */

    const nextLeft =
        currentLeft +
        (target.left - currentLeft) * .30;


    /*
       Вертикально держим практически
       как единый объект.
    */

    const nextTop =
        currentTop +
        (target.top - currentTop) * .88;


    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;


    followFrame =
        requestAnimationFrame(
            followToy
        );
}


function startFollowingToy() {

    stopFollowingToy();

    followToy();
}


function stopFollowingToy() {

    if (followFrame !== null) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame = null;
    }
}


/* =========================================================
   LOWER CLAW
========================================================= */

async function lowerClawToToy(toy) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );


    setCable(
        grabDepth - 32
    );


    await wait(760);


    /*
       Последние сантиметры медленнее.
    */

    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";

    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";


    setCable(
        grabDepth
    );


    await wait(540);


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}


/* =========================================================
   NATURAL GRAB
========================================================= */

async function grabToyNaturally(toy) {


    /*
       Игрушка остаётся ровно на том месте,
       где она была.
    */

    freezeToy(
        toy
    );


    clawRig.classList.add(
        "grabbing"
    );


    /*
       Закрываем лапки.

       Игрушку пока вообще НЕ двигаем.
    */

    setClaw(
        "closed"
    );


    await wait(470);


    /*
       Небольшая механическая пауза.
    */

    await wait(90);


    /*
       И ВОТ ТЕПЕРЬ запоминаем реальное
       положение игрушки относительно клешни.

       На экране ничего не происходит.
    */

    captureHeldOffset();
}


/* =========================================================
   LIFT

   Ключевой момент:

   follow запускается ДО изменения длины троса.

   Поэтому он начинает с ТОЧНО той же точки,
   где игрушка была при закрытии лапок.
========================================================= */

async function liftGrabbedToy() {


    startFollowingToy();


    /*
       Один кадр браузеру на фиксацию
       текущего положения.
    */

    await wait(32);


    /*
       Теперь начинается настоящий подъём.
    */

    setCable(
        CABLE_LIFT
    );


    await wait(1050);
}


/* =========================================================
   SWING
========================================================= */

async function settleSwing(toy) {


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-4deg)";


    await wait(170);


    toy.style.transition =
        "transform .22s ease-in-out";


    toy.style.transform =
        "rotate(2.8deg)";


    await wait(220);


    toy.style.transition =
        "transform .20s ease-in-out";


    toy.style.transform =
        "rotate(-1.3deg)";


    await wait(200);


    toy.style.transition =
        "transform .18s ease-out";


    toy.style.transform =
        "rotate(.4deg)";


    await wait(180);


    toy.style.transform =
        "rotate(0deg)";


    await wait(120);
}


/* =========================================================
   MOVE TO SHAFT
========================================================= */

async function moveToShaft(toy) {


    /*
       Начало движения.
    */

    toy.style.transition =
        "transform .22s ease-out";


    toy.style.transform =
        "rotate(-3.5deg)";


    moveRigTo(
        DROP_RIG_X
    );


    await wait(480);


    /*
       Игрушка проходит через вертикаль.
    */

    toy.style.transition =
        "transform .27s ease-in-out";


    toy.style.transform =
        "rotate(2.2deg)";


    await wait(450);


    /*
       Даём полностью закончиться
       движению самой каретки.
    */

    await wait(120);


    /*
       Успокаиваем раскачивание.
    */

    await settleSwing(
        toy
    );
}


/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(toy) {


    setCable(
        CABLE_DROP_APPROACH
    );


    await wait(760);


    /*
       Финальное медленное опускание.
    */

    cable.style.transition =
        "height .46s cubic-bezier(.18,.7,.3,1)";

    clawAssembly.style.transition =
        "top .46s cubic-bezier(.18,.7,.3,1)";


    setCable(
        CABLE_DROP
    );


    await wait(480);


    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";


    toy.style.transition =
        "transform .16s ease-out";

    toy.style.transform =
        "rotate(0deg)";


    /*
       Важная пауза.

       Теперь видно:
       клешня действительно остановилась
       над отверстием.
    */

    await wait(220);
}


/* =========================================================
   DROP INTO SHAFT
========================================================= */

async function dropIntoShaft(toy) {


    /*
       Сначала открываем клешню.
    */

    setClaw(
        "open"
    );


    /*
       Пока лапки только расходятся,
       игрушка ещё не падает.
    */

    await wait(180);


    /*
       Освобождаем игрушку.
    */

    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    /*
       Считываем её ТОЧНОЕ положение
       после остановки.

       X больше не меняем вообще.
    */

    const rect =
        getLocalRect(toy);


    toy.style.transition =
        "none";

    toy.style.left =
        `${rect.left}px`;

    toy.style.top =
        `${rect.top}px`;

    toy.style.bottom =
        "auto";

    toy.style.transform =
        "rotate(0deg)";


    /*
       Очень короткая естественная задержка
       после отпускания.
    */

    await wait(70);


    /* =====================================================
       ПАДЕНИЕ 1

       Первые пиксели — медленно.
    ===================================================== */

    toy.style.transition =
        "top .10s cubic-bezier(.4,0,.8,.4)";


    toy.style.top =
        `${rect.top + 9}px`;


    await wait(105);


    /* =====================================================
       ПАДЕНИЕ 2

       Ускоряемся вертикально вниз.

       LEFT НЕ ТРОГАЕМ.
    ===================================================== */

    toy.style.transition =
        "top .24s cubic-bezier(.45,.02,.9,.35),
         transform .24s ease-in";


    toy.style.top =
        `${rect.top + 105}px`;


    toy.style.transform =
        "rotate(2deg)";


    await wait(245);


    /* =====================================================
       ПАДЕНИЕ 3

       Игрушка уходит глубже в чёрный отсек.
    ===================================================== */

    toy.style.transition =
        "top .20s cubic-bezier(.5,.02,.95,.3),
         transform .20s ease-in";


    toy.style.top =
        `${rect.top + 215}px`;


    toy.style.transform =
        "rotate(4deg) scale(.97)";


    await wait(205);


    /*
       К этому моменту front PNG уже должен
       визуально перекрывать игрушку.
    */

    toy.style.opacity =
        "0";


    await wait(250);
}


/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(toy) {


    /* 1. ПЛАВНО ПОДНЯЛИ */

    await liftGrabbedToy();


    /* 2. КАЧАНИЕ */

    await settleSwing(
        toy
    );


    /* 3. ЕДЕМ К ШАХТЕ */

    await moveToShaft(
        toy
    );


    /* 4. ОПУСКАЕМСЯ НАД ШАХТОЙ */

    await lowerOverShaft(
        toy
    );


    /* 5. ВЕРТИКАЛЬНО ПАДАЕМ ВНУТРЬ */

    await dropIntoShaft(
        toy
    );


    /* 6. ПОЯВЛЯЕМСЯ В ПРИЗОВОМ ОКНЕ */

    prizeToy.src =
        toy.src;


    prizeToy.classList.add(
        "show"
    );


    await wait(650);


    /* 7. КЛЕШНЯ ВВЕРХ */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    /* 8. КЛЕШНЯ В ЦЕНТР */

    currentSlot =
        1;


    updatePosition();


    await wait(930);


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {


    /*
       Подъём начинается точно так же,
       без скачка.
    */

    startFollowingToy();


    await wait(32);


    setCable(
        CABLE_WRONG_LIFT
    );


    await wait(720);


    toy.style.transition =
        "transform .17s ease-out";


    toy.style.transform =
        "rotate(-2deg)";


    await wait(150);


    /*
       Отпускаем.
    */

    setClaw(
        "open"
    );


    await wait(180);


    stopFollowingToy();


    clawRig.classList.remove(
        "grabbing"
    );


    /*
       Фиксируем текущее положение,
       чтобы и здесь не было скачка.
    */

    const rect =
        getLocalRect(toy);


    toy.style.transition =
        "none";


    toy.style.left =
        `${rect.left}px`;


    toy.style.top =
        `${rect.top}px`;


    toy.style.bottom =
        "auto";


    await wait(60);


    /*
       Падение на пол.
    */

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;


    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35),
         transform .43s ease-in";


    toy.style.top =
        `${targetTop}px`;


    toy.style.transform =
        "rotate(3deg)";


    await wait(440);


    /*
       Мягкое касание.
    */

    toy.style.transition =
        "transform .09s ease-out";


    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";


    await wait(90);


    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";


    toy.style.transform =
        "rotate(.6deg) scaleY(1)";


    await wait(180);


    toy.style.transition =
        "transform .14s ease-out";


    toy.style.transform =
        "rotate(0deg)";


    await wait(150);


    /*
       Возвращаем исходные координаты.
    */

    toy.style.transition =
        "none";


    toy.style.top =
        "auto";


    toy.style.left =
        `${toyHome[index].left}px`;


    toy.style.bottom =
        `${toyHome[index].bottom}px`;


    toy.style.transform =
        "";


    toy.classList.remove(
        "caught"
    );


    /*
       Клешня домой.
    */

    setCable(
        CABLE_HOME
    );


    await wait(980);


    await neutralClaw();


    grabbedToy =
        null;
}


/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) {
            return;
        }


        const toy =
            toys[currentSlot];


        if (!toy) {
            return;
        }


        if (
            getComputedStyle(toy).opacity === "0"
        ) {
            return;
        }


        busy =
            true;


        try {


            /*
               1. ОТКРЫВАЕМСЯ
            */

            await openClaw();


            await wait(90);


            /*
               2. ОПУСКАЕМСЯ
            */

            await lowerClawToToy(
                toy
            );


            /*
               Остановка около игрушки.
            */

            await wait(140);


            /*
               3. ЗАКРЫВАЕМСЯ ВОКРУГ НЕЁ

               Игрушка всё ещё стоит
               абсолютно неподвижно.
            */

            await grabToyNaturally(
                toy
            );


            /*
               4. РЕЗУЛЬТАТ
            */

            const correct =
                toy.dataset.correct === "true";


            if (correct) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }


        } finally {

            busy =
                false;
        }
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "ArrowLeft"
        ) {

            leftButton.click();
        }


        if (
            event.key === "ArrowRight"
        ) {

            rightButton.click();
        }


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   START
========================================================= */

prizeToy.src =
    "";


prizeToy.classList.remove(
    "show"
);


toys.forEach(
    toy => {

        toy.style.opacity =
            "1";
    }
);


setCable(
    CABLE_HOME
);


setClaw(
    "neutral"
);


currentSlot =
    1;


updatePosition();

</script>
