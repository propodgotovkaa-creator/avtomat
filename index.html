<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background: #eee5df;
  font-family: "Trebuchet MS", Arial, sans-serif;
  user-select: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#viewport {
  position: relative;
  overflow: hidden;
}

#game {
  position: absolute;
  left: 0;
  top: 0;

  width: 1920px;
  height: 1080px;

  overflow: hidden;
  transform-origin: top left;

  background:
    url("fon.png")
    center / cover
    no-repeat;
}

/* =====================================================
   ЗАДАНИЕ
===================================================== */

.task {
  position: absolute;

  left: 115px;
  top: 145px;

  width: 520px;

  padding: 30px 35px;

  border-radius: 34px;

  background: rgba(255,255,255,.93);

  box-shadow:
    0 15px 40px rgba(77,67,72,.13);

  text-align: center;

  color: #40506a;

  z-index: 20;
}

.task-small {
  font-size: 24px;
  font-weight: 800;
  opacity: .72;
}

.task-main {
  margin-top: 8px;

  font-size: 42px;
  line-height: 1.08;

  font-weight: 900;
}

.task-main b {
  color: #ed5573;
}

/* =====================================================
   РАУНД
===================================================== */

.progress {
  position: absolute;

  left: 165px;
  top: 390px;

  width: 420px;

  padding: 20px;

  border-radius: 28px;

  background: rgba(255,255,255,.91);

  box-shadow:
    0 12px 30px rgba(77,67,72,.10);

  text-align: center;

  color: #4c5870;

  font-size: 27px;
  font-weight: 900;

  z-index: 20;
}

/* =====================================================
   АВТОМАТ
===================================================== */

#machine {
  position: absolute;

  left: 780px;
  top: 25px;

  width: 735px;
  height: 1030px;

  z-index: 10;
}

/* =====================================================
   ВНУТРЕННЯЯ КАМЕРА
===================================================== */

#machineInside {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  border-radius: 10px;

  background:
    radial-gradient(
      ellipse at 50% 12%,
      rgba(255,249,211,.95) 0%,
      rgba(255,255,255,0) 37%
    ),
    linear-gradient(
      180deg,
      #e9fbf8 0%,
      #f7fffd 42%,
      #fffdf7 78%,
      #fff4ea 100%
    );

  box-shadow:
    inset 0 18px 35px rgba(93,194,188,.10),
    inset 0 -20px 35px rgba(245,170,181,.08);

  z-index: 1;
}

/* =====================================================
   ВЕРХНЯЯ ПОДСВЕТКА
===================================================== */

.inside-light {
  position: absolute;

  left: 55px;
  top: 18px;

  width: 457px;
  height: 12px;

  border-radius: 20px;

  background: #fff7ca;

  box-shadow:
    0 0 10px rgba(255,239,150,.75),
    0 0 25px rgba(255,239,150,.45);

  z-index: 2;
}

/* =====================================================
   ПОЛ
===================================================== */

.inside-floor {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 92px;

  background:
    linear-gradient(
      180deg,
      #fffdf5 0%,
      #fff3e9 100%
    );

  border-top:
    4px solid rgba(239,170,183,.55);

  box-shadow:
    inset 0 14px 18px rgba(255,255,255,.85);

  z-index: 3;
}

/* =====================================================
   РЕЛЬС
===================================================== */

#rail {
  position: absolute;

  left: 42px;
  top: 45px;

  width: 483px;
  height: 14px;

  border-radius: 20px;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #dce4e6 24%,
      #8d989d 55%,
      #687277 76%,
      #dce3e5 100%
    );

  border:
    2px solid rgba(88,98,103,.45);

  box-shadow:
    0 4px 6px rgba(0,0,0,.14),
    inset 0 2px 2px rgba(255,255,255,.9);

  z-index: 10;
}

/* =====================================================
   КЛЕШНЯ — ВСЯ СИСТЕМА
===================================================== */

#clawSystem {
  position: absolute;

  left: 189px;
  top: 17px;

  width: 190px;
  height: 535px;

  z-index: 30;

  transition:
    left .65s cubic-bezier(.4,0,.2,1);
}

/* =====================================================
   КАРЕТКА
===================================================== */

#clawCart {
  position: absolute;

  left: 34px;
  top: 0;

  width: 122px;
  height: 83px;

  object-fit: contain;

  z-index: 35;

  pointer-events: none;
}

/* =====================================================
   ТРОС
===================================================== */

#cable {
  position: absolute;

  left: 92px;
  top: 62px;

  width: 6px;
  height: 78px;

  border-radius: 5px;

  background:
    repeating-linear-gradient(
      135deg,
      #f7f7f7 0px,
      #f7f7f7 3px,
      #879196 3px,
      #879196 6px
    );

  box-shadow:
    1px 0 2px rgba(0,0,0,.18);

  z-index: 20;

  transition:
    height .78s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   КЛЕШНЯ
===================================================== */

#claw {
  position: absolute;

  left: 18px;
  top: 132px;

  width: 154px;
  height: 170px;

  z-index: 40;

  transition:
    top .78s cubic-bezier(.45,0,.25,1);
}

/* =====================================================
   ЦЕНТРАЛЬНЫЙ КОРПУС
===================================================== */

#clawBody {
  position: absolute;

  left: 50px;
  top: 0;

  width: 54px;
  height: 75px;

  object-fit: contain;

  z-index: 45;

  pointer-events: none;
}

/* =====================================================
   ЛЕВАЯ ЛАПКА
===================================================== */

#clawLeft {
  position: absolute;

  left: 8px;
  top: 31px;

  width: 84px;
  height: 138px;

  object-fit: contain;

  transform-origin: 67px 17px;

  transform: rotate(0deg);

  transition:
    transform .38s cubic-bezier(.4,0,.2,1);

  z-index: 42;

  pointer-events: none;
}

/* =====================================================
   ПРАВАЯ ЛАПКА
===================================================== */

#clawRight {
  position: absolute;

  right: 8px;
  top: 31px;

  width: 84px;
  height: 138px;

  object-fit: contain;

  transform-origin: 17px 17px;

  transform: rotate(0deg);

  transition:
    transform .38s cubic-bezier(.4,0,.2,1);

  z-index: 42;

  pointer-events: none;
}

/* =====================================================
   ОТКРЫТА
===================================================== */

#claw.open #clawLeft {
  transform: rotate(-22deg);
}

#claw.open #clawRight {
  transform: rotate(22deg);
}

/* =====================================================
   ЗАКРЫТА
===================================================== */

#claw.closed #clawLeft {
  transform: rotate(27deg);
}

#claw.closed #clawRight {
  transform: rotate(-27deg);
}

/* =====================================================
   ИГРУШКИ

   Стоят ближе к центру.
===================================================== */

.toy {
  position: absolute;

  bottom: 54px;

  width: 110px;
  height: 130px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  font-size: 88px;

  z-index: 15;

  transform-origin: center center;

  transition:
    left .65s cubic-bezier(.4,0,.2,1),
    top .65s cubic-bezier(.4,0,.2,1),
    bottom .65s cubic-bezier(.4,0,.2,1),
    transform .35s ease,
    opacity .3s ease;
}

/* ЛЕВАЯ */

#toy0 {
  left: 86px;
}

/* ЦЕНТР */

#toy1 {
  left: 228px;
}

/* ПРАВАЯ */

#toy2 {
  left: 370px;
}

/* =====================================================
   ТЕНИ
===================================================== */

.toy::after {
  content: "";

  position: absolute;

  left: 50%;
  bottom: -7px;

  width: 78px;
  height: 16px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: rgba(62,58,70,.13);

  filter: blur(5px);

  z-index: -1;
}

/* =====================================================
   СОСТОЯНИЕ "ИГРУШКА СХВАЧЕНА"

   Игрушку дальше двигает JS.
===================================================== */

.toy.caught {
  z-index: 38;
}

.toy.caught::after {
  opacity: 0;
}

/* =====================================================
   ПАДЕНИЕ НЕПРАВИЛЬНОЙ ИГРУШКИ
===================================================== */

.toy.drop-wobble {
  animation:
    toyWobble .55s ease;
}

@keyframes toyWobble {

  0% {
    transform:
      translateY(-18px)
      rotate(0deg);
  }

  35% {
    transform:
      translateY(3px)
      rotate(-7deg);
  }

  65% {
    transform:
      translateY(-5px)
      rotate(5deg);
  }

  100% {
    transform:
      translateY(0)
      rotate(0deg);
  }
}

/* =====================================================
   СТЕКЛО
===================================================== */

#glass {
  position: absolute;

  left: 84px;
  top: 195px;

  width: 567px;
  height: 570px;

  overflow: hidden;

  pointer-events: none;

  z-index: 80;
}

#glass::before {
  content: "";

  position: absolute;

  left: 45px;
  top: -100px;

  width: 70px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );
}

#glass::after {
  content: "";

  position: absolute;

  right: 75px;
  top: -100px;

  width: 35px;
  height: 800px;

  transform: rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      transparent
    );
}

/* =====================================================
   КОРПУС АВТОМАТА
===================================================== */

#machineFront {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  pointer-events: none;

  z-index: 100;
}

/* =====================================================
   КНОПКИ
===================================================== */

.control {
  position: absolute;

  z-index: 150;

  border: 0;
  padding: 0;

  background: transparent;

  cursor: pointer;
}

#leftButton {
  left: 105px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}

#rightButton {
  left: 225px;
  top: 826px;

  width: 112px;
  height: 100px;

  border-radius: 50%;
}

#grabButton {
  left: 400px;
  top: 810px;

  width: 128px;
  height: 128px;

  border-radius: 50%;
}

.control::after {
  content: "";

  position: absolute;
  inset: 5px;

  border-radius: inherit;

  transition:
    background .1s,
    transform .1s;
}

.control:active::after {
  background: rgba(0,0,0,.09);
  transform: scale(.88);
}

/* =====================================================
   ИГРУШКА В ОКНЕ ПРИЗА

   Этот элемент находится уже поверх machine-front,
   потому что мы должны видеть приз внутри окошка.
===================================================== */

#prizeToy {
  position: absolute;

  left: 493px;
  top: 855px;

  width: 95px;
  height: 95px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 70px;

  opacity: 0;

  transform:
    translateY(-35px)
    scale(.55);

  transition:
    opacity .3s ease,
    transform .55s cubic-bezier(.2,.9,.3,1.25);

  z-index: 125;

  pointer-events: none;
}

#prizeToy.show {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);
}

</style>
</head>

<body>

<div id="viewport">

<div id="game">

  <!-- =================================================
       ЗАДАНИЕ
  ================================================== -->

  <div class="task">

    <div class="task-small">
      Поймай нужную игрушку
    </div>

    <div class="task-main">
      Найди звук <b>С</b><br>
      В СЕРЕДИНЕ слова
    </div>

  </div>

  <div class="progress">
    🧸 Раунд 1 из 10
  </div>

  <!-- =================================================
       АВТОМАТ
  ================================================== -->

  <div id="machine">

    <!-- ===============================================
         ВНУТРЕННЯЯ КАМЕРА
    ================================================ -->

    <div id="machineInside">

      <div class="inside-light"></div>

      <div class="inside-floor"></div>

      <div id="rail"></div>

      <!-- =============================================
           КЛЕШНЯ
      ============================================== -->

      <div id="clawSystem">

        <img
          id="clawCart"
          src="claw-cart.png"
          alt=""
          draggable="false"
        >

        <div id="cable"></div>

        <div id="claw">

          <img
            id="clawBody"
            src="claw-body.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawLeft"
            src="claw-left.png"
            alt=""
            draggable="false"
          >

          <img
            id="clawRight"
            src="claw-right.png"
            alt=""
            draggable="false"
          >

        </div>

      </div>

      <!-- =============================================
           ПОКА ТЕСТОВЫЕ ИГРУШКИ
      ============================================== -->

      <div
        class="toy"
        id="toy0"
        data-correct="false"
      >
        🦉
      </div>

      <div
        class="toy"
        id="toy1"
        data-correct="true"
      >
        🦊
      </div>

      <div
        class="toy"
        id="toy2"
        data-correct="false"
      >
        🍍
      </div>

    </div>

    <!-- СТЕКЛО -->

    <div id="glass"></div>

    <!-- КОРПУС -->

    <img
      id="machineFront"
      src="machine-front.png"
      alt=""
      draggable="false"
    >

    <!-- ПОЙМАННЫЙ ПРИЗ -->

    <div id="prizeToy"></div>

    <!-- КНОПКИ -->

    <button
      id="leftButton"
      class="control"
      aria-label="Влево"
    ></button>

    <button
      id="rightButton"
      class="control"
      aria-label="Вправо"
    ></button>

    <button
      id="grabButton"
      class="control"
      aria-label="Поймать"
    ></button>

  </div>

</div>

</div>

<script>

/* =====================================================
   МАСШТАБ
===================================================== */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
  document.getElementById("viewport");

const game =
  document.getElementById("game");

function resizeGame() {

  const scale =
    Math.min(
      window.innerWidth / GAME_WIDTH,
      window.innerHeight / GAME_HEIGHT
    );

  viewport.style.width =
    GAME_WIDTH * scale + "px";

  viewport.style.height =
    GAME_HEIGHT * scale + "px";

  game.style.transform =
    `scale(${scale})`;
}

window.addEventListener(
  "resize",
  resizeGame
);

resizeGame();

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const clawSystem =
  document.getElementById("clawSystem");

const claw =
  document.getElementById("claw");

const cable =
  document.getElementById("cable");

const leftButton =
  document.getElementById("leftButton");

const rightButton =
  document.getElementById("rightButton");

const grabButton =
  document.getElementById("grabButton");

const prizeToy =
  document.getElementById("prizeToy");

const toys = [
  document.getElementById("toy0"),
  document.getElementById("toy1"),
  document.getElementById("toy2")
];

/* =====================================================
   ТРИ БЕЗОПАСНЫЕ ПОЗИЦИИ

   КЛЕШНЯ НЕ МОЖЕТ УЙТИ К СТЕНКАМ.
===================================================== */

const SLOT_X = [
  53,
  195,
  337
];

let currentSlot = 1;

let busy = false;

/* =====================================================
   ПАРАМЕТРЫ ДВИЖЕНИЯ
===================================================== */

const CLAW_TOP = 132;

const CABLE_TOP_HEIGHT = 78;

/*
  Высота захвата.

  Клешня останавливается над игрушкой,
  а не проваливается в пол.
*/

const CLAW_GRAB_TOP = 348;

const CABLE_GRAB_HEIGHT = 294;

/*
  Позиция справа перед сбросом.

  Она остаётся ВНУТРИ витрины.
*/

const PRIZE_X = 350;

/* =====================================================
   ЗАДЕРЖКА
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );
}

/* =====================================================
   ПОЗИЦИЯ КЛЕШНИ
===================================================== */

function updateClawPosition() {

  clawSystem.style.left =
    SLOT_X[currentSlot] + "px";
}

updateClawPosition();

/* =====================================================
   ДВИЖЕНИЕ ВЛЕВО
===================================================== */

leftButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot > 0) {

      currentSlot--;

      updateClawPosition();
    }
  }
);

/* =====================================================
   ДВИЖЕНИЕ ВПРАВО
===================================================== */

rightButton.addEventListener(
  "click",
  () => {

    if (busy) return;

    if (currentSlot < 2) {

      currentSlot++;

      updateClawPosition();
    }
  }
);

/* =====================================================
   ПОЛОЖЕНИЕ ИГРУШКИ ПОД КЛЕШНЕЙ
===================================================== */

function attachToyToClaw(toy) {

  /*
    Игрушка остаётся внутри machineInside,
    но её координаты начинают следовать за клешнёй.
  */

  toy.classList.add("caught");

  toy.style.bottom = "auto";

  toy.style.left =
    (SLOT_X[currentSlot] + 40) + "px";

  toy.style.top =
    (CLAW_GRAB_TOP + 85) + "px";
}

/* =====================================================
   ПОДНИМАТЬ ИГРУШКУ ВМЕСТЕ С КЛЕШНЕЙ
===================================================== */

function liftToy(toy) {

  toy.style.top =
    (CLAW_TOP + 85) + "px";
}

/* =====================================================
   НЕСТИ ИГРУШКУ ВПРАВО
===================================================== */

function moveToyToPrizeSide(toy) {

  toy.style.left =
    (PRIZE_X + 40) + "px";
}

/* =====================================================
   ВОЗВРАТ НЕПРАВИЛЬНОЙ ИГРУШКИ
===================================================== */

function resetWrongToy(toy, slot) {

  const originalLeft = [
    86,
    228,
    370
  ];

  toy.classList.remove("caught");

  toy.style.top = "";
  toy.style.bottom = "54px";

  toy.style.left =
    originalLeft[slot] + "px";
}

/* =====================================================
   ПРАВИЛЬНЫЙ ЗАХВАТ
===================================================== */

async function correctGrab(toy) {

  /* -----------------------------------------------
     1. ИГРУШКА ЗАХВАЧЕНА
  ------------------------------------------------ */

  attachToyToClaw(toy);

  await wait(200);

  /* -----------------------------------------------
     2. ПОДНИМАЕМ КЛЕШНЮ + ИГРУШКУ
  ------------------------------------------------ */

  cable.style.height =
    CABLE_TOP_HEIGHT + "px";

  claw.style.top =
    CLAW_TOP + "px";

  liftToy(toy);

  await wait(900);

  /* -----------------------------------------------
     3. ЕДЕМ ВПРАВО К ОТСЕКУ ПРИЗА
  ------------------------------------------------ */

  clawSystem.style.left =
    PRIZE_X + "px";

  moveToyToPrizeSide(toy);

  await wait(800);

  /* -----------------------------------------------
     4. НЕМНОГО ОПУСКАЕМСЯ СПРАВА

     Сам отсек находится ниже витрины,
     поэтому создаём иллюзию,
     что игрушку сбрасывают в канал.
  ------------------------------------------------ */

  cable.style.height = "230px";
  claw.style.top = "284px";

  toy.style.top = "370px";

  await wait(700);

  /* -----------------------------------------------
     5. ОТКРЫВАЕМ ЛАПКИ
  ------------------------------------------------ */

  claw.classList.remove("closed");
  claw.classList.add("open");

  await wait(350);

  /* -----------------------------------------------
     6. ИГРУШКА ПАДАЕТ ИЗ ВИТРИНЫ
  ------------------------------------------------ */

  toy.style.top = "525px";
  toy.style.opacity = "0";

  await wait(550);

  /*
    Убираем её из внутренней камеры.
  */

  toy.style.display = "none";

  /* -----------------------------------------------
     7. ПОКАЗЫВАЕМ ЕЁ В ОКОШКЕ ПРИЗ
  ------------------------------------------------ */

  prizeToy.textContent =
    toy.textContent.trim();

  prizeToy.classList.add("show");

  await wait(850);

  /* -----------------------------------------------
     8. КЛЕШНЯ ЗАКРЫВАЕТСЯ ПУСТОЙ
  ------------------------------------------------ */

  claw.classList.remove("open");

  await wait(250);

  /* -----------------------------------------------
     9. ПОДНИМАЕМ
  ------------------------------------------------ */

  cable.style.height =
    CABLE_TOP_HEIGHT + "px";

  claw.style.top =
    CLAW_TOP + "px";

  await wait(800);

  /* -----------------------------------------------
     10. ВОЗВРАЩАЕМ В ЦЕНТР
  ------------------------------------------------ */

  currentSlot = 1;

  updateClawPosition();

  await wait(700);
}

/* =====================================================
   НЕПРАВИЛЬНЫЙ ЗАХВАТ
===================================================== */

async function wrongGrab(toy) {

  const slot = currentSlot;

  /* -----------------------------------------------
     СХВАТИЛИ
  ------------------------------------------------ */

  attachToyToClaw(toy);

  await wait(200);

  /* -----------------------------------------------
     ЧУТЬ ПОДНИМАЕМ
  ------------------------------------------------ */

  cable.style.height = "205px";

  claw.style.top = "260px";

  toy.style.top = "345px";

  await wait(600);

  /* -----------------------------------------------
     ИГРУШКА ВЫСКАЛЬЗЫВАЕТ
  ------------------------------------------------ */

  claw.classList.remove("closed");
  claw.classList.add("open");

  toy.style.top = "430px";

  await wait(350);

  resetWrongToy(
    toy,
    slot
  );

  toy.classList.add(
    "drop-wobble"
  );

  await wait(600);

  toy.classList.remove(
    "drop-wobble"
  );

  /* -----------------------------------------------
     КЛЕШНЯ ВОЗВРАЩАЕТСЯ НАВЕРХ
  ------------------------------------------------ */

  cable.style.height =
    CABLE_TOP_HEIGHT + "px";

  claw.style.top =
    CLAW_TOP + "px";

  await wait(800);

  claw.classList.remove("open");

  await wait(250);
}

/* =====================================================
   КРАСНАЯ КНОПКА
===================================================== */

grabButton.addEventListener(
  "click",
  async () => {

    if (busy) return;

    const toy =
      toys[currentSlot];

    /*
      Если игрушка уже выиграна,
      ничего не делаем.
    */

    if (
      !toy ||
      toy.style.display === "none"
    ) {
      return;
    }

    busy = true;

    /* =============================================
       1. РАСКРЫВАЕМ КЛЕШНЮ
    ============================================== */

    claw.classList.remove("closed");

    claw.classList.add("open");

    await wait(400);

    /* =============================================
       2. СПУСКАЕМ
    ============================================== */

    cable.style.height =
      CABLE_GRAB_HEIGHT + "px";

    claw.style.top =
      CLAW_GRAB_TOP + "px";

    await wait(850);

    /* =============================================
       3. ЗАКРЫВАЕМ ВОКРУГ ИГРУШКИ
    ============================================== */

    claw.classList.remove("open");

    claw.classList.add("closed");

    await wait(450);

    /* =============================================
       4. ПРОВЕРЯЕМ ИГРУШКУ
    ============================================== */

    const correct =
      toy.dataset.correct === "true";

    if (correct) {

      await correctGrab(toy);

    } else {

      await wrongGrab(toy);
    }

    /* =============================================
       НОРМАЛЬНОЕ СОСТОЯНИЕ
    ============================================== */

    claw.classList.remove(
      "open",
      "closed"
    );

    busy = false;
  }
);

/* =====================================================
   КЛАВИАТУРА
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (event.key === "ArrowLeft") {
      leftButton.click();
    }

    if (event.key === "ArrowRight") {
      rightButton.click();
    }

    if (event.code === "Space") {

      event.preventDefault();

      grabButton.click();
    }
  }
);

</script>
