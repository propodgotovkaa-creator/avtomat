<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Автомат с игрушками</title>

<style>

/* =========================================================
   ОБЩЕЕ
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   ИГРА
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;

    transform-origin: top left;

    background:
        url("fon.png")
        center center / cover
        no-repeat;
}


/* =========================================================
   ТЕКСТ СЛЕВА
========================================================= */

.task {
    position: absolute;

    left: 115px;
    top: 145px;

    width: 520px;

    padding: 30px 35px;

    border-radius: 34px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 24px;
    font-weight: 800;
    opacity: .72;
}

.task-main {
    margin-top: 8px;

    font-size: 42px;
    line-height: 1.08;

    font-weight: 900;
}

.task-main b {
    color: #ed5573;
}

.progress {
    position: absolute;

    left: 165px;
    top: 390px;

    width: 420px;

    padding: 20px;

    border-radius: 28px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 27px;
    font-weight: 900;

    z-index: 20;
}


/* =========================================================
   АВТОМАТ
========================================================= */

#machine {
    position: absolute;

    left: 780px;
    top: 25px;

    width: 735px;
    height: 1030px;

    z-index: 10;
}


/* =========================================================
   ВНУТРЕННЕЕ ПРОСТРАНСТВО

   ВСЁ ЖИВОЕ НАХОДИТСЯ ЗДЕСЬ:
   - игрушки
   - рельс
   - клешня
   - трос

   Поэтому ничего не может выйти
   за стекло автомата.
========================================================= */

#machineInside {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    border-radius: 12px;

    background:
        radial-gradient(
            ellipse at 50% 5%,
            rgba(255,248,195,.8),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #eefcf9 0%,
            #fafffe 52%,
            #fff9f2 100%
        );

    z-index: 1;
}


/* =========================================================
   ВНУТРЕННИЙ СВЕТ
========================================================= */

.inside-light {
    position: absolute;

    left: 50px;
    top: 17px;

    width: 467px;
    height: 11px;

    border-radius: 20px;

    background: #fff5b8;

    box-shadow:
        0 0 15px rgba(255,239,150,.8),
        0 0 30px rgba(255,239,150,.4);

    z-index: 2;
}


/* =========================================================
   ПОЛ
========================================================= */

.inside-floor {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 92px;

    background:
        linear-gradient(
            180deg,
            #fffdf7,
            #fff0e6
        );

    border-top:
        4px solid rgba(238,166,181,.5);

    z-index: 3;
}


/* =========================================================
   РЕЛЬС
========================================================= */

#rail {
    position: absolute;

    left: 42px;
    top: 42px;

    width: 483px;
    height: 15px;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #dce4e6 22%,
            #8b969b 52%,
            #606a70 72%,
            #dce3e5 100%
        );

    border:
        2px solid rgba(88,98,103,.45);

    box-shadow:
        0 4px 6px rgba(0,0,0,.14),
        inset 0 2px 2px rgba(255,255,255,.9);

    z-index: 8;
}


/* =========================================================
   КЛЕШНЯ — ВЕСЬ МЕХАНИЗМ

   По горизонтали двигается только rig.
========================================================= */

#clawRig {
    --cable: 65px;

    position: absolute;

    left: 187px;
    top: 15px;

    width: 190px;
    height: 550px;

    z-index: 30;

    transition:
        left .75s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   КАРЕТКА
========================================================= */

#clawCart {
    position: absolute;

    left: 34px;
    top: 0;

    width: 122px;
    height: 83px;

    object-fit: contain;

    z-index: 35;

    pointer-events: none;
}


/* =========================================================
   ТОЧКА, ОТКУДА ВЫХОДИТ ТРОС
========================================================= */

#cableAnchor {
    position: absolute;

    /*
       Центр относительно каретки.
    */

    left: 92px;
    top: 58px;

    width: 6px;

    z-index: 34;
}


/* =========================================================
   ТРОС
========================================================= */

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;
    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px rgba(0,0,0,.2);

    transition:
        height .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   ВЕСЬ БЛОК КЛЕШНИ

   ВАЖНО:

   Он начинается ровно на конце троса.

   Здесь находятся:
   - корпус
   - левая лапка
   - правая лапка
   - захваченная игрушка
========================================================= */

#clawAssembly {
    position: absolute;

    left: -88px;

    top: calc(var(--cable) - 12px);

    width: 182px;
    height: 205px;

    z-index: 40;

    transition:
        top .9s cubic-bezier(.45,0,.25,1);
}


/* =========================================================
   КОРПУС

   ВАЖНОЕ ИЗМЕНЕНИЕ:

   Больше НЕ 54px.

   Корпус увеличен, чтобы реальные
   розовые шарниры корпуса совпадали
   с розовыми шарнирами лапок.
========================================================= */

#clawBody {
    position: absolute;

    left: 47px;
    top: 0;

    width: 88px;
    height: auto;

    object-fit: contain;

    z-index: 48;

    pointer-events: none;
}


/* =========================================================
   ЛЕВАЯ ЛАПКА

   Её розовый кружок кладём ПОВЕРХ
   левого розового шарнира корпуса.
========================================================= */

#clawLeft {
    position: absolute;

    left: 23px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    /*
       Точка вращения находится
       внутри верхнего розового шарнира.
    */

    transform-origin:
        66px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ПРАВАЯ ЛАПКА
========================================================= */

#clawRight {
    position: absolute;

    left: 77px;
    top: 60px;

    width: 82px;
    height: auto;

    object-fit: contain;

    transform-origin:
        16px 17px;

    z-index: 50;

    pointer-events: none;

    transition:
        transform .42s cubic-bezier(.4,0,.2,1);
}


/* =========================================================
   ОБЫЧНОЕ ПОЛОЖЕНИЕ

   ЭТО СТАРТ.

   НЕ РАСКРЫТАЯ.

   Лапки естественно свисают вниз.
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}


/* =========================================================
   OPEN

   Только после красной кнопки.

   Лапки расходятся наружу.
========================================================= */

#clawAssembly.open #clawLeft {
    transform: rotate(-25deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(25deg);
}


/* =========================================================
   CLOSED

   Лапки сходятся вокруг игрушки.
========================================================= */

#clawAssembly.closed #clawLeft {
    transform: rotate(25deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(-25deg);
}


/* =========================================================
   ЗАХВАЧЕННАЯ ИГРУШКА

   Она находится ВНУТРИ clawAssembly.

   Значит при движении клешни
   координаты игрушки отдельно
   считать не нужно.
========================================================= */

#carriedToy {
    position: absolute;

    left: 41px;
    top: 112px;

    width: 100px;
    height: 90px;

    display: none;

    align-items: center;
    justify-content: center;

    font-size: 72px;

    line-height: 1;

    z-index: 44;

    pointer-events: none;
}

#carriedToy.show {
    display: flex;
}


/* =========================================================
   ИГРУШКИ

   ИМЕННО ВНУТРИ machineInside.
========================================================= */

.toy {
    position: absolute;

    bottom: 49px;

    width: 100px;
    height: 115px;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    font-size: 80px;

    line-height: 1;

    z-index: 15;

    transition:
        opacity .2s ease,
        transform .4s ease;
}


/* =========================================================
   ТРИ ИГРУШКИ

   Они сдвинуты внутрь, чтобы клешне
   не приходилось подходить к стенкам.
========================================================= */

#toy0 {
    left: 78px;
}

#toy1 {
    left: 233px;
}

#toy2 {
    left: 388px;
}


/* =========================================================
   ТЕНИ ИГРУШЕК
========================================================= */

.toy::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    width: 70px;
    height: 14px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        rgba(60,60,70,.14);

    filter: blur(5px);

    z-index: -1;
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА ПАДАЕТ
========================================================= */

.toy.wrong-drop {
    animation:
        wrongDrop .65s ease;
}

@keyframes wrongDrop {

    0% {
        transform:
            translateY(-50px)
            rotate(0deg);
    }

    45% {
        transform:
            translateY(5px)
            rotate(-6deg);
    }

    70% {
        transform:
            translateY(-4px)
            rotate(4deg);
    }

    100% {
        transform:
            translateY(0)
            rotate(0deg);
    }
}


/* =========================================================
   СТЕКЛО
========================================================= */

#glass {
    position: absolute;

    left: 84px;
    top: 195px;

    width: 567px;
    height: 570px;

    overflow: hidden;

    pointer-events: none;

    z-index: 80;
}

#glass::before {
    content: "";

    position: absolute;

    left: 52px;
    top: -100px;

    width: 62px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.21),
            transparent
        );
}

#glass::after {
    content: "";

    position: absolute;

    right: 72px;
    top: -100px;

    width: 32px;
    height: 800px;

    transform: rotate(18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );
}


/* =========================================================
   PNG КОРПУСА АВТОМАТА

   Лежит ПОВЕРХ внутреннего пространства.

   Поэтому игрушки и клешня визуально
   находятся ЗА рамой.
========================================================= */

#machineFront {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 100;

    pointer-events: none;
}


/* =========================================================
   КНОПКИ
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;
}


/* ВЛЕВО */

#leftButton {
    left: 105px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


/* ВПРАВО */

#rightButton {
    left: 225px;
    top: 826px;

    width: 112px;
    height: 100px;

    border-radius: 50%;
}


/* КРАСНАЯ */

#grabButton {
    left: 400px;
    top: 810px;

    width: 128px;
    height: 128px;

    border-radius: 50%;
}


/* ЭФФЕКТ НАЖАТИЯ */

.control::after {
    content: "";

    position: absolute;

    inset: 5px;

    border-radius: inherit;

    transition:
        transform .1s,
        background .1s;
}

.control:active::after {
    transform: scale(.86);

    background:
        rgba(0,0,0,.08);
}


/* =========================================================
   ПРИЗ В НИЖНЕМ ОТСЕКЕ
========================================================= */

#prizeToy {
    position: absolute;

    left: 493px;
    top: 852px;

    width: 95px;
    height: 95px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 68px;

    opacity: 0;

    transform:
        translateY(-30px)
        scale(.5);

    transition:
        opacity .3s,
        transform .55s cubic-bezier(.2,.9,.3,1.25);

    z-index: 125;

    pointer-events: none;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

</style>
</head>


<body>

<div id="viewport">

<div id="game">


    <!-- =================================================
         ЗАДАНИЕ
    ================================================= -->

    <div class="task">

        <div class="task-small">
            Поймай нужную игрушку
        </div>

        <div class="task-main">
            Найди звук <b>С</b><br>
            В СЕРЕДИНЕ слова
        </div>

    </div>


    <div class="progress">
        🧸 Раунд 1 из 10
    </div>


    <!-- =================================================
         АВТОМАТ
    ================================================= -->

    <div id="machine">


        <!-- =============================================
             ВНУТРИ АВТОМАТА
        ============================================= -->

        <div id="machineInside">


            <div class="inside-light"></div>

            <div class="inside-floor"></div>

            <div id="rail"></div>


            <!-- =========================================
                 КЛЕШНЯ
            ========================================= -->

            <div id="clawRig">


                <img
                    id="clawCart"
                    src="claw-cart.png"
                    alt=""
                    draggable="false"
                >


                <div id="cableAnchor">


                    <div id="cable"></div>


                    <!--
                        ИЗНАЧАЛЬНО:

                        neutral

                        НЕ open
                    -->

                    <div
                        id="clawAssembly"
                        class="neutral"
                    >


                        <!-- КОРПУС -->

                        <img
                            id="clawBody"
                            src="claw-body.png"
                            alt=""
                            draggable="false"
                        >


                        <!-- ЛЕВАЯ ЛАПКА -->

                        <img
                            id="clawLeft"
                            src="claw-left.png"
                            alt=""
                            draggable="false"
                        >


                        <!-- ПРАВАЯ ЛАПКА -->

                        <img
                            id="clawRight"
                            src="claw-right.png"
                            alt=""
                            draggable="false"
                        >


                        <!-- ЗАХВАЧЕННАЯ ИГРУШКА -->

                        <div id="carriedToy"></div>


                    </div>

                </div>

            </div>


            <!-- =========================================
                 ТРИ ИГРУШКИ

                 ВСЕ ВНУТРИ АВТОМАТА
            ========================================= -->


            <div
                class="toy"
                id="toy0"
                data-correct="false"
            >
                🦉
            </div>


            <div
                class="toy"
                id="toy1"
                data-correct="true"
            >
                🦊
            </div>


            <div
                class="toy"
                id="toy2"
                data-correct="false"
            >
                🍍
            </div>


        </div>


        <!-- СТЕКЛО -->

        <div id="glass"></div>


        <!-- PNG РАМА -->

        <img
            id="machineFront"
            src="machine-front.png"
            alt=""
            draggable="false"
        >


        <!-- ПРИЗ -->

        <div id="prizeToy"></div>


        <!-- КНОПКИ -->

        <button
            id="leftButton"
            class="control"
            aria-label="Влево"
        ></button>


        <button
            id="rightButton"
            class="control"
            aria-label="Вправо"
        ></button>


        <button
            id="grabButton"
            class="control"
            aria-label="Поймать"
        ></button>


    </div>

</div>

</div>


<script>

/* =========================================================
   МАСШТАБ
========================================================= */

const GAME_WIDTH = 1920;
const GAME_HEIGHT = 1080;

const viewport =
    document.getElementById("viewport");

const game =
    document.getElementById("game");


function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth / GAME_WIDTH,
            window.innerHeight / GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH * scale + "px";

    viewport.style.height =
        GAME_HEIGHT * scale + "px";

    game.style.transform =
        `scale(${scale})`;
}


window.addEventListener(
    "resize",
    resizeGame
);

resizeGame();


/* =========================================================
   ЭЛЕМЕНТЫ
========================================================= */

const clawRig =
    document.getElementById("clawRig");

const clawAssembly =
    document.getElementById("clawAssembly");

const carriedToy =
    document.getElementById("carriedToy");

const prizeToy =
    document.getElementById("prizeToy");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const grabButton =
    document.getElementById("grabButton");


const toys = [
    document.getElementById("toy0"),
    document.getElementById("toy1"),
    document.getElementById("toy2")
];


/* =========================================================
   ПОЗИЦИИ КЛЕШНИ

   Центры соответствуют трём игрушкам.
========================================================= */

const SLOT_X = [
    46,
    201,
    356
];


/*
   Сброс справа.

   Клешня всё ещё остаётся
   внутри стекла.
*/

const DROP_X = 356;


/* =========================================================
   ТРОС
========================================================= */

/*
   Старт.

   Клешня находится высоко,
   но не вплотную к каретке.
*/

const CABLE_HOME = 65;


/*
   К игрушке.
*/

const CABLE_GRAB = 280;


/*
   Сброс справа.
*/

const CABLE_DROP = 245;


/*
   При ошибке игрушку
   немного приподнимаем.
*/

const CABLE_WRONG = 175;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let currentSlot = 1;

let busy = false;


/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


/* =========================================================
   ТРОС

   Одна переменная одновременно:

   1. удлиняет трос
   2. двигает клешню

   Поэтому они не разъединяются.
========================================================= */

function setCable(length) {

    clawRig.style.setProperty(
        "--cable",
        `${length}px`
    );
}


/* =========================================================
   СОСТОЯНИЕ ЛАПОК
========================================================= */

function setClaw(state) {

    clawAssembly.classList.remove(
        "neutral",
        "open",
        "closed"
    );

    clawAssembly.classList.add(
        state
    );
}


/* =========================================================
   ОБЫЧНОЕ СОСТОЯНИЕ
========================================================= */

async function neutralClaw() {

    setClaw("neutral");

    await wait(450);
}


/* =========================================================
   ОТКРЫТЬ
========================================================= */

async function openClaw() {

    setClaw("open");

    await wait(450);
}


/* =========================================================
   ЗАКРЫТЬ
========================================================= */

async function closeClaw() {

    setClaw("closed");

    await wait(450);
}


/* =========================================================
   ВНИЗ

   Лапки здесь НЕ меняются.
========================================================= */

async function lowerClaw() {

    setCable(CABLE_GRAB);

    await wait(950);
}


/* =========================================================
   ВВЕРХ

   Лапки здесь НЕ меняются.
========================================================= */

async function raiseClaw() {

    setCable(CABLE_HOME);

    await wait(950);
}


/* =========================================================
   ГОРИЗОНТАЛЬНАЯ ПОЗИЦИЯ
========================================================= */

function updatePosition() {

    clawRig.style.left =
        SLOT_X[currentSlot] + "px";
}


/* =========================================================
   СТРЕЛКА ВЛЕВО
========================================================= */

leftButton.addEventListener(
    "click",
    () => {

        if (busy) return;

        if (currentSlot > 0) {

            currentSlot--;

            updatePosition();
        }
    }
);


/* =========================================================
   СТРЕЛКА ВПРАВО
========================================================= */

rightButton.addEventListener(
    "click",
    () => {

        if (busy) return;

        if (currentSlot < 2) {

            currentSlot++;

            updatePosition();
        }
    }
);


updatePosition();


/* =========================================================
   ПРИКРЕПИТЬ ИГРУШКУ К КЛЕШНЕ
========================================================= */

function attachToy(toy) {

    carriedToy.textContent =
        toy.textContent.trim();

    carriedToy.style.top =
        "112px";

    carriedToy.style.opacity =
        "1";

    carriedToy.classList.add(
        "show"
    );

    toy.style.opacity =
        "0";
}


/* =========================================================
   ОТКРЕПИТЬ
========================================================= */

function detachToy() {

    carriedToy.classList.remove(
        "show"
    );

    carriedToy.textContent = "";

    carriedToy.style.top =
        "112px";

    carriedToy.style.opacity =
        "1";
}


/* =========================================================
   ПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function correctCycle(toy) {


    /* ---------------------------------------------
       Игрушка теперь физически внутри clawAssembly
    --------------------------------------------- */

    attachToy(toy);

    await wait(180);


    /* ---------------------------------------------
       ЗАКРЫТАЯ КЛЕШНЯ + ИГРУШКА ВВЕРХ
    --------------------------------------------- */

    await raiseClaw();


    /* ---------------------------------------------
       ВПРАВО
    --------------------------------------------- */

    clawRig.style.left =
        DROP_X + "px";

    await wait(800);


    /* ---------------------------------------------
       ОПУСКАЕМСЯ НАД СБРОСОМ
    --------------------------------------------- */

    setCable(CABLE_DROP);

    await wait(850);


    /* ---------------------------------------------
       ОТКРЫВАЕМ

       И только сейчас отпускаем игрушку.
    --------------------------------------------- */

    await openClaw();


    /* ---------------------------------------------
       ИГРУШКА ПАДАЕТ
    --------------------------------------------- */

    carriedToy.style.transition =
        "top .5s ease-in, opacity .2s ease";

    carriedToy.style.top =
        "245px";

    await wait(500);

    carriedToy.style.opacity =
        "0";

    await wait(180);


    /* ---------------------------------------------
       УБИРАЕМ ИЗ КЛЕШНИ
    --------------------------------------------- */

    detachToy();

    carriedToy.style.transition = "";


    /* ---------------------------------------------
       ПОКАЗЫВАЕМ В ОТСЕКЕ
    --------------------------------------------- */

    prizeToy.textContent =
        toy.textContent.trim();

    prizeToy.classList.add(
        "show"
    );

    await wait(650);


    /* ---------------------------------------------
       ОТКРЫТАЯ КЛЕШНЯ ВВЕРХ
    --------------------------------------------- */

    await raiseClaw();


    /* ---------------------------------------------
       ВОЗВРАЩАЕМСЯ В ЦЕНТР
    --------------------------------------------- */

    currentSlot = 1;

    updatePosition();

    await wait(800);


    /* ---------------------------------------------
       ОБЫЧНОЕ СОСТОЯНИЕ
    --------------------------------------------- */

    await neutralClaw();
}


/* =========================================================
   НЕПРАВИЛЬНАЯ ИГРУШКА
========================================================= */

async function wrongCycle(toy) {


    /* ---------------------------------------------
       СХВАТИЛА
    --------------------------------------------- */

    attachToy(toy);

    await wait(180);


    /* ---------------------------------------------
       НЕМНОГО ПОДНИМАЕТ
    --------------------------------------------- */

    setCable(CABLE_WRONG);

    await wait(650);


    /* ---------------------------------------------
       ОТКРЫВАЕТСЯ
    --------------------------------------------- */

    await openClaw();


    /* ---------------------------------------------
       ИГРУШКА ВЫСКАЛЬЗЫВАЕТ
    --------------------------------------------- */

    carriedToy.style.transition =
        "top .42s ease-in, opacity .18s ease";

    carriedToy.style.top =
        "215px";

    await wait(420);

    carriedToy.style.opacity =
        "0";

    await wait(180);


    detachToy();

    carriedToy.style.transition = "";


    /* ---------------------------------------------
       ИГРУШКА СНОВА НА ПОЛУ
    --------------------------------------------- */

    toy.style.opacity =
        "1";

    toy.classList.add(
        "wrong-drop"
    );

    await wait(650);

    toy.classList.remove(
        "wrong-drop"
    );


    /* ---------------------------------------------
       КЛЕШНЯ ВВЕРХ
    --------------------------------------------- */

    await raiseClaw();


    /* ---------------------------------------------
       ОБЫЧНОЕ СОСТОЯНИЕ
    --------------------------------------------- */

    await neutralClaw();
}


/* =========================================================
   КРАСНАЯ КНОПКА

   ЭТО ГЛАВНАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ:

   NEUTRAL

       ↓ нажали 🔴

   OPEN

       ↓

   ОТКРЫТАЯ ЕДЕТ ВНИЗ

       ↓

   CLOSE

       ↓

   ЗАХВАТ

       ↓

   ВВЕРХ
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {


        if (busy) return;


        const toy =
            toys[currentSlot];


        if (!toy) return;


        if (toy.style.opacity === "0") {
            return;
        }


        busy = true;


        /* =========================================
           1.

           ДО НАЖАТИЯ КЛЕШНЯ БЫЛА ОБЫЧНАЯ.

           ТОЛЬКО СЕЙЧАС ОТКРЫВАЕМ.
        ========================================= */

        await openClaw();


        /* =========================================
           2.

           ОТКРЫТАЯ КЛЕШНЯ ЛЕТИТ ВНИЗ.
        ========================================= */

        await lowerClaw();


        /* =========================================
           3.

           ДОЕХАЛА ДО ИГРУШКИ.

           ЗАКРЫВАЕТСЯ.
        ========================================= */

        await closeClaw();


        /* =========================================
           4.

           ИГРУШКА СХВАЧЕНА.
        ========================================= */

        const correct =
            toy.dataset.correct === "true";


        if (correct) {

            await correctCycle(toy);

        } else {

            await wrongCycle(toy);
        }


        busy = false;
    }
);


/* =========================================================
   КЛАВИАТУРА
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (event.key === "ArrowLeft") {

            leftButton.click();
        }


        if (event.key === "ArrowRight") {

            rightButton.click();
        }


        if (event.code === "Space") {

            event.preventDefault();

            grabButton.click();
        }
    }
);


/* =========================================================
   СТАРТ

   КЛЕШНЯ ОБЫЧНАЯ.

   НЕ OPEN.
========================================================= */

setCable(CABLE_HOME);

setClaw("neutral");

</script>
