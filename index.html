<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Поймай игрушку</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    display: grid;
    place-items: center;
    background: #eee8e3;
    font-family: "Trebuchet MS", Arial, sans-serif;
    user-select: none;
}

button {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* =========================================================
   GAME
========================================================= */

#viewport {
    position: relative;
    overflow: hidden;
}

#game {
    position: absolute;
    left: 0;
    top: 0;

    width: 1920px;
    height: 1080px;

    overflow: hidden;
    transform-origin: top left;

    background:
        url("fon.png")
        center / cover
        no-repeat;
}

/* =========================================================
   TASK
========================================================= */

.task {
    position: absolute;

    left: 70px;
    top: 155px;

    width: 440px;

    padding: 24px 28px 26px;

    border-radius: 32px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 15px 40px rgba(77,67,72,.13);

    text-align: center;

    color: #40506a;

    z-index: 20;
}

.task-small {
    font-size: 30px;
    font-weight: 900;
}

.task-scheme {
    display: block;

    width: 330px;
    height: 125px;

    margin: 15px auto 0;

    object-fit: contain;

    pointer-events: none;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress {
    position: absolute;

    left: 95px;
    top: 400px;

    width: 390px;

    padding: 18px;

    border-radius: 26px;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 12px 30px rgba(77,67,72,.10);

    text-align: center;

    color: #4c5870;

    font-size: 25px;
    font-weight: 900;

    z-index: 20;
}

/* =========================================================
   POUCH
========================================================= */

#pouch {
    position: absolute;

    left: 55px;
    bottom: 52px;

    width: 465px;
    height: 352px;

    z-index: 25;

    pointer-events: none;
}

#pouchBack,
#pouchFront {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    pointer-events: none;
}

#pouchBack {
    z-index: 1;
}

#pouchToys {
    position: absolute;

    left: 72px;
    top: 95px;

    width: 320px;
    height: 215px;

    overflow: visible;

    z-index: 2;

    pointer-events: none;
}

.pouch-toy {
    position: absolute;

    object-fit: contain;
    object-position: center bottom;

    transform-origin: center bottom;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(45,35,40,.15)
        );

    pointer-events: none;
}

#pouchFront {
    z-index: 3;
}

/* =========================================================
   MACHINE
========================================================= */

#machine {
    position: absolute;

    left: 570px;
    top: 60px;

    width: 1280px;
    height: 906px;

    z-index: 10;
}

#machineBack {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 1;

    pointer-events: none;
}

/* =========================================================
   INNER CHAMBER
========================================================= */

#machineInside {
    position: absolute;

    left: 170px;
    top: 170px;

    width: 940px;
    height: 455px;

    overflow: hidden;

    z-index: 20;
}

/* =========================================================
   FLOOR COVER

   Перекрываем только нижнюю розовую ПЛОСКОСТЬ
   слева от шахты.

   Бортик самой шахты находится правее и
   остаётся видимым.
========================================================= */

#floorCover {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 735px;
    height: 96px;

    z-index: 38;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(247,238,238,.97) 0%,
            rgba(244,231,232,.99) 100%
        );
}

/* =========================================================
   BALL PIT
========================================================= */

#ballPit {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 735px;
    height: 190px;

    overflow: hidden;

    z-index: 48;

    pointer-events: none;
}

.ball {
    position: absolute;

    width: 58px;
    height: 58px;

    object-fit: contain;

    pointer-events: none;

    transform-origin: center center;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(60,50,70,.12)
        );
}

/* =========================================================
   RAIL
========================================================= */

#clawRail {
    position: absolute;

    left: 20px;
    top: 2px;

    width: 900px;
    height: 105px;

    object-fit: fill;

    z-index: 12;

    pointer-events: none;
}

/* =========================================================
   CLAW
========================================================= */

#clawRig {
    --cable: 42px;

    position: absolute;

    left: 295px;
    top: 5px;

    width: 170px;
    height: 445px;

    z-index: 30;

    transition:
        left .92s cubic-bezier(.22,.65,.35,1);
}

#clawCart {
    position: absolute;

    left: 31px;
    top: 0;

    width: 108px;
    height: 74px;

    object-fit: contain;

    z-index: 34;

    pointer-events: none;
}

#cableAnchor {
    position: absolute;

    left: 82px;
    top: 52px;

    width: 6px;

    z-index: 31;
}

#cable {
    position: absolute;

    left: 0;
    top: 0;

    width: 6px;

    height: var(--cable);

    border-radius: 4px;

    background:
        repeating-linear-gradient(
            135deg,
            #fafafa 0,
            #fafafa 3px,
            #7d878c 3px,
            #7d878c 6px
        );

    box-shadow:
        1px 0 2px
        rgba(0,0,0,.2);

    z-index: 31;

    transition:
        height .92s
        cubic-bezier(.37,0,.18,1);
}

#clawAssembly {
    position: absolute;

    left: -77px;

    top:
        calc(
            var(--cable) - 10px
        );

    width: 160px;
    height: 180px;

    z-index: 32;

    transition:
        top .92s
        cubic-bezier(.37,0,.18,1);
}

#clawBody {
    position: absolute;

    left: 42px;
    top: 0;

    width: 77px;

    object-fit: contain;

    z-index: 33;

    pointer-events: none;
}

#clawLeft {
    position: absolute;

    left: 20px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        58px 15px;

    z-index: 32;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

#clawRight {
    position: absolute;

    left: 68px;
    top: 53px;

    width: 72px;

    object-fit: contain;

    transform-origin:
        14px 15px;

    z-index: 32;

    transition:
        transform .46s
        cubic-bezier(.34,1.02,.64,1);

    pointer-events: none;
}

/* =========================================================
   CLAW STATES
========================================================= */

#clawAssembly.neutral #clawLeft {
    transform: rotate(5deg);
}

#clawAssembly.neutral #clawRight {
    transform: rotate(-5deg);
}

#clawAssembly.open #clawLeft {
    transform: rotate(31deg);
}

#clawAssembly.open #clawRight {
    transform: rotate(-31deg);
}

#clawAssembly.closed #clawLeft {
    transform: rotate(-15deg);
}

#clawAssembly.closed #clawRight {
    transform: rotate(15deg);
}

/* =========================================================
   TOYS

   Игрушки находятся В шариках.

   Нижний слой шаров будет перед нижней частью
   игрушки, верхняя часть игрушки остаётся видимой.
========================================================= */

.toy {
    position: absolute;

    bottom: 15px;

    width: 128px;
    height: 138px;

    object-fit: contain;
    object-position: center bottom;

    z-index: 46;

    pointer-events: none;

    transform-origin:
        50% 16%;

    will-change:
        left,
        top,
        transform;

    filter:
        drop-shadow(
            0 8px 5px
            rgba(62,46,54,.16)
        );
}

#toy0 {
    left: 65px;
}

#toy1 {
    left: 315px;
}

#toy2 {
    left: 565px;
}

/*
   После захвата игрушка должна
   оказаться выше шариков.
*/

.toy.caught {
    z-index: 58;

    filter:
        drop-shadow(
            0 6px 5px
            rgba(45,35,40,.14)
        );
}

.toy.dropping {
    z-index: 70;
}

/* =========================================================
   SHAFT
========================================================= */

#machineShaftEdge {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 75;

    pointer-events: none;
}

/* =========================================================
   MACHINE FRONT
========================================================= */

#machineFront {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    z-index: 100;

    pointer-events: none;
}

/* =========================================================
   CONTROLS
========================================================= */

.control {
    position: absolute;

    border: 0;
    padding: 0;

    background: transparent;

    cursor: pointer;

    z-index: 150;

    -webkit-tap-highlight-color:
        transparent;
}

#leftButton {
    left: 275px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#rightButton {
    left: 435px;
    top: 690px;

    width: 125px;
    height: 110px;

    border-radius: 50%;
}

#grabButton {
    left: 680px;
    top: 675px;

    width: 150px;
    height: 140px;

    border-radius: 50%;
}

.control:active {
    transform: scale(.94);
}

/* =========================================================
   PRIZE WINDOW
========================================================= */

#prizeWindow {
    position: absolute;

    left: 948px;
    top: 690px;

    width: 170px;
    height: 132px;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 160;

    pointer-events: none;
}

#prizeToy {
    position: relative;

    display: block;

    width: 125px;
    height: 108px;

    object-fit: contain;
    object-position: center center;

    opacity: 0;

    transform:
        translateY(-12px)
        scale(.72);

    transition:
        opacity .28s ease,
        transform .48s
        cubic-bezier(.2,.9,.3,1.2);

    pointer-events: none;

    cursor: pointer;
}

#prizeToy.show {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

/* =========================================================
   OVERLAY
========================================================= */

#prizeOverlay {
    position: absolute;

    inset: 0;

    z-index: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        rgba(55,48,55,.30);

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

#prizeOverlay.show {
    opacity: 1;
    visibility: visible;

    pointer-events: auto;
}

#bigPrizeWrap {
    position: relative;

    width: 620px;
    height: 680px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.28);

    transition:
        transform .60s
        cubic-bezier(.18,.9,.3,1.18),
        opacity .30s ease;
}

#prizeOverlay.show #bigPrizeWrap {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

#bigPrizeToy {
    display: block;

    width: 390px;
    height: 390px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 22px 18px
            rgba(55,45,50,.22)
        );

    animation:
        prizeFloat
        2.2s
        ease-in-out
        infinite;
}

@keyframes prizeFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-13px)
            rotate(1deg);
    }
}

/* =========================================================
   NEXT
========================================================= */

#nextButton {
    margin-top: 16px;

    min-width: 330px;

    padding:
        21px 40px;

    border: 0;

    border-radius: 28px;

    background:
        #ed5573;

    color:
        #ffffff;

    font-size: 30px;
    font-weight: 900;

    box-shadow:
        0 10px 0 #c83f5c,
        0 18px 30px
        rgba(92,53,65,.22);

    cursor: pointer;
}

#nextButton:active {
    transform:
        translateY(6px);
}

#nextButton:disabled {
    pointer-events: none;
}

#finalText {
    display: none;

    margin-top: 20px;

    padding:
        20px 38px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    color:
        #40506a;

    font-size: 32px;
    font-weight: 900;

    text-align: center;
}
</style>

</head>

<body>

<div id="viewport">

<div id="game">

    <!-- TASK -->

/* =========================================================
   SCALE
========================================================= */

const viewport =
    document.getElementById(
        "viewport"
    );

const game =
    document.getElementById(
        "game"
    );

function resizeGame() {

    const scale =
        Math.min(
            window.innerWidth /
            GAME_WIDTH,

            window.innerHeight /
            GAME_HEIGHT
        );

    viewport.style.width =
        GAME_WIDTH *
        scale +
        "px";

    viewport.style.height =
        GAME_HEIGHT *
        scale +
        "px";

    game.style.transform =
        `scale(${scale})`;
}

window.addEventListener(
    "resize",
    resizeGame
);

/* =========================================================
   WAIT
========================================================= */

function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

/* =========================================================

/* =========================================================

========================================================= */

const BALLS = [];

let ballPhysicsFrame = null;

let ballPhysicsRunning = false;

const BALL_PIT_WIDTH = 735;
const BALL_PIT_HEIGHT = 190;

const BALL_GRAVITY = .21;
const BALL_FRICTION = .986;
const BALL_GROUND_FRICTION = .965;
const BALL_BOUNCE = .34;

/* =========================================================
   BALL COLLISIONS
========================================================= */

function resolveBallCollision(
    a,
    b
) {

    const ar =
        a.size / 2;

    const br =
        b.size / 2;

    const ax =
        a.x + ar;

    const ay =
        a.y + ar;

    const bx =
        b.x + br;

    const by =
        b.y + br;

    let dx =
        bx - ax;

    let dy =
        by - ay;

    let distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const minimum =
        ar + br - 4;

    if (
        distance <= 0
    ) {

        dx = .01;
        dy = 0;

        distance = .01;
    }

    if (
        distance >= minimum
    ) {
        return;
    }

    const nx =
        dx / distance;

    const ny =
        dy / distance;

    const overlap =
        minimum -
        distance;

    /*
       Раздвигаем ОБА шара.

       Поэтому получается эффект
       настоящего рассыпания цепочкой.
    */

    a.x -=
        nx *
        overlap *
        .5;

    a.y -=
        ny *
        overlap *
        .5;

    b.x +=
        nx *
        overlap *
        .5;

    b.y +=
        ny *
        overlap *
        .5;

    const relativeVX =
        b.vx -
        a.vx;

    const relativeVY =
        b.vy -
        a.vy;

    const velocityAlongNormal =
        relativeVX *
        nx +
        relativeVY *
        ny;

    if (
        velocityAlongNormal > 0
    ) {
        return;
    }

    const restitution =
        .42;

    const impulse =
        -(
            1 +
            restitution
        ) *
        velocityAlongNormal /
        2;

    const impulseX =
        impulse *
        nx;

    const impulseY =
        impulse *
        ny;

    a.vx -=
        impulseX;

    a.vy -=
        impulseY;

    b.vx +=
        impulseX;

    b.vy +=
        impulseY;

    a.va +=
        -impulseX *
        .07;

    b.va +=
        impulseX *
        .07;
}

/* =========================================================
   BALL PHYSICS LOOP
========================================================= */

function startBallPhysics() {

    if (
        ballPhysicsRunning
    ) {
        return;
    }

    ballPhysicsRunning =
        true;

    function frame() {

        let active =
            false;

        BALLS.forEach(
            ball => {

                if (
                    ball.sleeping
                ) {
                    return;
                }

                active = true;

                ball.vy +=
                    BALL_GRAVITY;

                ball.vx *=
                    BALL_FRICTION;

                ball.vy *=
                    BALL_FRICTION;

                ball.va *=
                    .97;

                ball.x +=
                    ball.vx;

                ball.y +=
                    ball.vy;

                ball.angle +=
                    ball.va;

                const maxX =
                    BALL_PIT_WIDTH -
                    ball.size;

                const maxY =
                    BALL_PIT_HEIGHT -
                    ball.size;

                /*
                   LEFT WALL
                */

                if (
                    ball.x < 0
                ) {

                    ball.x = 0;

                    ball.vx =
                        Math.abs(
                            ball.vx
                        ) *
                        BALL_BOUNCE;
                }

                /*
                   RIGHT WALL

                   Это ключевой ограничитель:
                   ни один шар не попадает
                   в шахту.
                */

                if (
                    ball.x > maxX
                ) {

                    ball.x =
                        maxX;

                    ball.vx =
                        -Math.abs(
                            ball.vx
                        ) *
                        BALL_BOUNCE;
                }

                /*
                   TOP
                */

                if (
                    ball.y < 0
                ) {

                    ball.y = 0;

                    ball.vy =
                        Math.abs(
                            ball.vy
                        ) *
                        BALL_BOUNCE;
                }

                /*
                   FLOOR
                */

                if (
                    ball.y > maxY
                ) {

                    ball.y =
                        maxY;

                    ball.vy =
                        -Math.abs(
                            ball.vy
                        ) *
                        BALL_BOUNCE;

                    ball.vx *=
                        BALL_GROUND_FRICTION;

                    /*
                       Вращение соответствует
                       направлению катания.
                    */

                    ball.va +=
                        ball.vx *
                        .045;
                }
            }
        );

        /*
           Несколько проходов коллизий
           дают более плотную кучу.
        */

        for (
            let pass = 0;
            pass < 2;
            pass++
        ) {

            for (
                let i = 0;
                i < BALLS.length;
                i++
            ) {

                for (
                    let j = i + 1;
                    j < BALLS.length;
                    j++
                ) {

                    resolveBallCollision(
                        BALLS[i],
                        BALLS[j]
                    );
                }
            }
        }

        /*
           Постепенно усыпляем
           почти остановившиеся шары.
        */

        BALLS.forEach(
            ball => {

                if (
                    ball.sleeping
                ) {
                    return;
                }

                const speed =
                    Math.abs(
                        ball.vx
                    ) +
                    Math.abs(
                        ball.vy
                    ) +
                    Math.abs(
                        ball.va
                    ) *
                    .05;

                if (
                    speed < .11 &&
                    ball.y >=
                    BALL_PIT_HEIGHT -
                    ball.size -
                    1
                ) {

                    ball.vx = 0;
                    ball.vy = 0;
                    ball.va = 0;

                    ball.sleeping =
                        true;
                }
            }
        );

        renderBalls();

        const stillMoving =
            BALLS.some(
                ball =>
                    !ball.sleeping
            );

        if (
            active ||
            stillMoving
        ) {

            ballPhysicsFrame =
                requestAnimationFrame(
                    frame
                );

        } else {

            ballPhysicsRunning =
                false;

            ballPhysicsFrame =
                null;
        }
    }

    ballPhysicsFrame =
        requestAnimationFrame(
            frame
        );
}

/* =========================================================
   SCATTER BALLS

   Клешня как бы входит в кучу.

   Ближайшие шары получают импульс.
   Потом они толкают соседние.
========================================================= */

function scatterBallsAroundToy(
    slot
) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width /
        2;

    BALLS.forEach(
        (ball, index) => {

            const centerX =
                ball.x +
                ball.size /
                2;

            const distance =
                centerX -
                toyCenterX;

            const absDistance =
                Math.abs(
                    distance
                );

            if (
                absDistance >
                145
            ) {
                return;
            }

            const power =
                1 -
                absDistance /
                145;

            let direction =
                distance < 0
                    ? -1
                    : 1;

            if (
                Math.abs(
                    distance
                ) < 7
            ) {

                direction =
                    index %
                    2 === 0
                        ? -1
                        : 1;
            }

            /*
               Не одинаковые скорости.

               Поэтому шарики не выглядят
               как одна анимационная группа.
            */

            const variation =
                .78 +
                (
                    (
                        index *
                        17
                    ) %
                    38
                ) /
                100;

            ball.vx +=
                direction *
                (
                    2.7 +
                    4.8 *
                    power
                ) *
                variation;

            /*
               Лёгкий выброс вверх,
               затем настоящая гравитация
               возвращает шар.
            */

            ball.vy -=
                (
                    1.1 +
                    2.6 *
                    power
                ) *
                variation;

            ball.va +=
                direction *
                (
                    2 +
                    4 *
                    power
                );

            ball.sleeping =
                false;
        }
    );

    startBallPhysics();
}

/* =========================================================
   SECOND BALL IMPULSE

   Когда игрушка реально начинает
   выходить из кучи, даём маленький
   дополнительный толчок нижним шарам.
========================================================= */

function releaseBallsFromToy(
    slot
) {

    const toyCenterX =
        toyHome[slot].left +
        toyHome[slot].width /
        2;

    BALLS.forEach(
        (ball, index) => {

            const centerX =
                ball.x +
                ball.size /
                2;

            const distance =
                centerX -
                toyCenterX;

            const absDistance =
                Math.abs(
                    distance
                );

            if (
                absDistance >
                100
            ) {
                return;
            }

            const direction =
                distance <= 0
                    ? -1
                    : 1;

            const power =
                1 -
                absDistance /
                100;

            ball.vx +=
                direction *
                (
                    .7 +
                    1.8 *
                    power
                );

            ball.vy -=
                .3 +
                .8 *
                power;

            ball.va +=
                direction *
                1.5;

            ball.sleeping =
                false;
        }
    );

    startBallPhysics();
}

/* =========================================================
   RESET BALLS
========================================================= */

function resetBalls() {

    if (
        ballPhysicsFrame !==
        null
    ) {

        cancelAnimationFrame(
            ballPhysicsFrame
        );

        ballPhysicsFrame =
            null;
    }

    ballPhysicsRunning =
        false;

    BALLS.forEach(
        ball => {

            ball.x =
                ball.homeX;

            ball.y =
                ball.homeY;

            ball.vx = 0;
            ball.vy = 0;
            ball.va = 0;

            ball.sleeping =
                true;
        }
    );

    renderBalls();
}

    collectedToys.push(
        src

        POUCH_LAYOUT[

                () => {

                    img.style.opacity =
                        "1";

                    img.style.transform =
                        `translateY(0)
                         rotate(${layout.rotate}deg)
                         scale(1)`;

========================================================= */

function loadRound(index) {

    const round =
        ROUNDS[
            index
        ];

    waitingForPrize =
        false;

    taskScheme.src =
        round.scheme;

    progress.textContent =
        `🧸 Раунд ${index + 1} из ${ROUNDS.length}`;

    prizeToy.classList.remove(
        "show"
    );

    prizeToy.src =
        "";

    prizeToy.style.pointerEvents =
        "none";

    prizeOverlay.classList.remove(
        "show"
    );

    bigPrizeToy.src =
        "";

    nextButton.style.display =
        "block";

    finalText.style.display =
        "none";

    resetBalls();

    toys.forEach(
        (
            toy,
            toyIndex
        ) => {

            toy.src =
                round.toys[
                    toyIndex
                ];

            toy.dataset.correct =
                toyIndex ===
                round.correct
                    ? "true"
                    : "false";

            /*
               Оставляем рабочие глубины
               захвата из твоей версии.
            */

            toy.dataset.grab =
                toyIndex === 0
                    ? "230"
                    : toyIndex === 1
                        ? "225"
                        : "220";

            toy.style.transition =
                "none";

            toy.style.opacity =
                "1";

            toy.style.top =
                "auto";

            toy.style.left =
                `${toyHome[toyIndex].left}px`;

            toy.style.bottom =
                `${toyHome[toyIndex].bottom}px`;

            toy.style.transform =
                "";

            toy.classList.remove(
                "caught",
                "dropping"
            );
        }
    );

    grabbedToy =
        null;

    currentSlot =
        1;

    setCable(
        CABLE_HOME
    );

    setClaw(
        "neutral"
    );

    updatePosition();
}

/* =========================================================
   LOCAL RECT
========================================================= */

function getLocalRect(
    element
) {

    const insideRect =
        machineInside
        .getBoundingClientRect();

    const rect =
        element
        .getBoundingClientRect();

    const scale =
        insideRect.width /
        INSIDE_WIDTH;

    return {

        left:
            (
                rect.left -
                insideRect.left
            ) /
            scale,

        top:
            (
                rect.top -
                insideRect.top
            ) /
            scale,

        width:
            rect.width /
            scale,

        height:
            rect.height /
            scale
    };
}

/* =========================================================
   FREEZE TOY

   Это оставлено по рабочей схеме.
========================================================= */

function freezeToy(
    toy
) {

    const pos =
        getLocalRect(
            toy
        );

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "caught"
    );

    grabbedToy =
        toy;
}

/* =========================================================
   HELD OFFSET
========================================================= */

function captureHeldOffset() {

    if (
        !grabbedToy
    ) {
        return;
    }

    const toyRect =
        getLocalRect(
            grabbedToy
        );

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX +
        85;

    const anchorY =
        52 +
        cableLength;

    heldOffsetX =
        toyRect.left -
        anchorX;

    heldOffsetY =
        toyRect.top -
        anchorY;
}

function getHeldTarget() {

    if (
        !grabbedToy
    ) {
        return null;
    }

    const rigX =
        parseFloat(
            getComputedStyle(
                clawRig
            ).left
        );

    const cableLength =
        parseFloat(
            getComputedStyle(
                cable
            ).height
        );

    const anchorX =
        rigX +
        85;

    const anchorY =
        52 +
        cableLength;

    return {

        left:
            anchorX +
            heldOffsetX,

        top:
            anchorY +
            heldOffsetY
    };
}

/* =========================================================
   FOLLOW TOY

   Рабочая версия.

   Никаких шариков здесь нет.
   Они не могут менять координаты игрушки.
========================================================= */

function followToy() {

    if (
        !grabbedToy
    ) {
        return;
    }

    const target =
        getHeldTarget();

    if (
        !target
    ) {
        return;
    }

    let currentLeft =
        parseFloat(
            grabbedToy.style.left
        );

    let currentTop =
        parseFloat(
            grabbedToy.style.top
        );

    if (
        !Number.isFinite(
            currentLeft
        )
    ) {

        currentLeft =
            target.left;
    }

    if (
        !Number.isFinite(
            currentTop
        )
    ) {

        currentTop =
            target.top;
    }

    const nextLeft =
        currentLeft +
        (
            target.left -
            currentLeft
        ) *
        .42;

    const nextTop =
        currentTop +
        (
            target.top -
            currentTop
        ) *
        .92;

    grabbedToy.style.left =
        `${nextLeft}px`;

    grabbedToy.style.top =
        `${nextTop}px`;

    followFrame =
        requestAnimationFrame(
            followToy
        );
}

function startFollowingToy() {

    stopFollowingToy();

    followToy();
}

function stopFollowingToy() {

    if (
        followFrame !==
        null
    ) {

        cancelAnimationFrame(
            followFrame
        );

        followFrame =
            null;
    }
}

/* =========================================================
   LOWER CLAW

   Основная механика оставлена.

   Шарики получают импульс только
   перед последним участком опускания.
========================================================= */

async function lowerClawToToy(
    toy
) {

    const grabDepth =
        Number(
            toy.dataset.grab
        );

    setCable(
        grabDepth -
        32
    );

    await wait(
        760
    );

    scatterBallsAroundToy(
        currentSlot
    );

    cable.style.transition =
        "height .52s cubic-bezier(.18,.72,.3,1)";

    clawAssembly.style.transition =
        "top .52s cubic-bezier(.18,.72,.3,1)";

    setCable(
        grabDepth
    );

    await wait(
        540
    );

    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";
}

/* =========================================================
   NATURAL GRAB
========================================================= */

async function grabToyNaturally(
    toy
) {

    /*
       Игрушка фиксируется именно там,
       где она была.

       Никакого скачка к клешне.
    */

    freezeToy(
        toy
    );

    setClaw(
        "closed"
    );

    await wait(
        470
    );

    /*
       Игрушка всё ещё стоит.

       Только ПОСЛЕ закрытия
       вычисляем смещение.
    */

    await wait(
        90
    );

    captureHeldOffset();
}

/* =========================================================
   LIFT
========================================================= */

async function liftGrabbedToy() {

    startFollowingToy();

    await wait(
        32
    );

    setCable(
        CABLE_LIFT
    );

    /*
       Когда игрушка выходит из шаров,
       нижние шарики получают ещё
       небольшой естественный импульс.
    */

    await wait(
        220
    );

    releaseBallsFromToy(
        currentSlot
    );

    await wait(
        830
    );
}

/* =========================================================
   SWING
========================================================= */

async function settleSwing(
    toy
) {

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-4deg)";

    await wait(
        170
    );

    toy.style.transition =
        "transform .22s ease-in-out";

    toy.style.transform =
        "rotate(2.8deg)";

    await wait(
        220
    );

    toy.style.transition =
        "transform .20s ease-in-out";

    toy.style.transform =
        "rotate(-1.3deg)";

    await wait(
        200
    );

    toy.style.transition =
        "transform .18s ease-out";

    toy.style.transform =
        "rotate(.4deg)";

    await wait(
        180
    );

    toy.style.transform =
        "rotate(0deg)";

    await wait(
        120
    );
}

/* =========================================================
   MOVE TO SHAFT

   Рабочая механика переноса.
========================================================= */

async function moveToShaft(
    toy
) {

    toy.style.transition =
        "transform .20s ease-out";

    toy.style.transform =
        "rotate(-4deg)";

    moveRigTo(
        DROP_RIG_X
    );

    await wait(
        470
    );

    toy.style.transition =
        "transform .28s ease-in-out";

    toy.style.transform =
        "rotate(2deg)";

    await wait(
        450
    );

    await wait(
        260
    );

    await settleSwing(
        toy
    );
}

/* =========================================================
   LOWER OVER SHAFT
========================================================= */

async function lowerOverShaft(
    toy
) {

    setCable(
        CABLE_DROP_APPROACH
    );

    await wait(
        760
    );

    cable.style.transition =
        "height .46s ease-out";

    clawAssembly.style.transition =
        "top .46s ease-out";

    setCable(
        CABLE_DROP
    );

    await wait(
        470
    );

    cable.style.transition =
        "height .92s cubic-bezier(.37,0,.18,1)";

    clawAssembly.style.transition =
        "top .92s cubic-bezier(.37,0,.18,1)";

    toy.style.transition =
        "transform .15s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(
        220
    );
}

/* =========================================================
   SMOOTH VERTICAL DROP

   КРИТИЧЕСКИ ВАЖНО:

   Здесь вообще нет изменения LEFT.

   Только TOP.
========================================================= */

function animateSmoothVerticalDrop(
    toy,
    startTop,
    endTop,
    duration
) {

    return new Promise(
        resolve => {

            const startTime =
                performance.now();

            function frame(
                now
            ) {

                const t =
                    Math.min(
                        (
                            now -
                            startTime
                        ) /
                        duration,
                        1
                    );

                /*
                   Плавное ускорение
                   под действием "гравитации".
                */

                const eased =
                    t * t;

                const y =
                    startTop +
                    (
                        endTop -
                        startTop
                    ) *
                    eased;

                /*
                   МЕНЯЕМ ТОЛЬКО TOP.
                */

                toy.style.top =
                    `${y}px`;

                /*
                   Небольшой наклон допустим,
                   он не меняет X.
                */

                toy.style.transform =
                    `rotate(${t * 1.5}deg)
                     scale(${1 - t * .02})`;

                if (
                    t < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    resolve();
                }
            }

            requestAnimationFrame(
                frame
            );
        }
    );
}

/* =========================================================
   DROP INTO SHAFT

   1. Следование останавливается.
   2. Игрушка центрируется над шахтой.
   3. LEFT фиксируется.
   4. Клешня открывается.
   5. Меняется ТОЛЬКО TOP.

   Поэтому рывка вправо быть не может.
========================================================= */

async function dropIntoShaft(
    toy
) {

    stopFollowingToy();

    /*
       Получаем реальную позицию
       после остановки.
    */

    const before =
        getLocalRect(
            toy
        );

    toy.style.transition =
        "none";

    toy.style.left =
        `${before.left}px`;

    toy.style.top =
        `${before.top}px`;

    toy.style.bottom =
        "auto";

    toy.style.transform =
        "rotate(0deg)";

    /*
       Один раз вычисляем центр шахты.
    */

    const fixedLeft =
        SHAFT_DROP_CENTER_X -
        before.width /
        2;

    /*
       Последнее горизонтальное
       движение игрушки.
    */

    toy.style.transition =
        "left .26s cubic-bezier(.22,.65,.35,1)";

    toy.style.left =
        `${fixedLeft}px`;

    await wait(
        280
    );

    /*
       Берём реальную текущую позицию
       после центрирования.
    */

    const centered =
        getLocalRect(
            toy
        );

    const releaseTop =
        centered.top;

    /*
       Теперь окончательно фиксируем
       координаты.

       LEFT после этой строки
       НИГДЕ не меняется.
    */

    toy.style.transition =
        "none";

    toy.style.left =
        `${fixedLeft}px`;

    toy.style.top =
        `${releaseTop}px`;

    toy.style.bottom =
        "auto";

    toy.classList.add(
        "dropping"
    );

    await wait(
        70
    );

    /*
       Открываем клешню.

       Игрушка пока стоит.
    */

    setClaw(
        "open"
    );

    await wait(
        180
    );

    /*
       Одно непрерывное вертикальное
       падение.

       Ни фаз.
       Ни пауз.
       Ни изменения X.
    */

    await animateSmoothVerticalDrop(
        toy,
        releaseTop,
        releaseTop + 315,
        520
    );

    toy.style.opacity =
        "0";

    await wait(
        70
    );

    toy.classList.remove(
        "dropping"
    );
}

/* =========================================================
   CORRECT
========================================================= */

async function correctSequence(
    toy
) {

    await liftGrabbedToy();

    await settleSwing(
        toy
    );

    await moveToShaft(
        toy
    );

    await lowerOverShaft(
        toy
    );

    await dropIntoShaft(
        toy
    );

    /*
       ПРИЗ.

       Контейнер flex сам ставит
       игрушку ровно по центру.
    */

    prizeToy.src =
        toy.src;

    prizeToy.classList.add(
        "show"
    );

    prizeToy.style.pointerEvents =
        "auto";

    waitingForPrize =
        true;

    /*
       Клешня вверх.
    */

    setCable(
        CABLE_HOME
    );

    await wait(
        980
    );

    /*
       Возвращаемся в центр.
    */

    currentSlot =
        1;

    updatePosition();

    await wait(
        930
    );

    await neutralClaw();

    grabbedToy =
        null;
}

/* =========================================================
   WRONG
========================================================= */

async function wrongSequence(
    toy,
    index
) {

    startFollowingToy();

    await wait(
        32
    );

    setCable(
        CABLE_WRONG_LIFT
    );

    await wait(
        220
    );

    releaseBallsFromToy(
        index
    );

    await wait(
        500
    );

    toy.style.transition =
        "transform .17s ease-out";

    toy.style.transform =
        "rotate(-2deg)";

    await wait(
        150
    );

    setClaw(
        "open"
    );

    await wait(
        190
    );

    stopFollowingToy();

    const pos =
        getLocalRect(
            toy
        );

    toy.style.transition =
        "none";

    toy.style.left =
        `${pos.left}px`;

    toy.style.top =
        `${pos.top}px`;

    toy.style.bottom =
        "auto";

    await wait(
        60
    );

    const targetTop =
        INSIDE_HEIGHT -
        toyHome[index].bottom -
        toyHome[index].height;

    const lockedLeft =
        pos.left;

    /*
       X неправильной игрушки
       тоже фиксируем.
    */

    toy.style.left =
        `${lockedLeft}px`;

    toy.style.transition =
        "top .43s cubic-bezier(.42,.02,.82,.35), transform .43s ease-in";

    toy.style.top =
        `${targetTop}px`;

    toy.style.transform =
        "rotate(3deg)";

    await wait(
        440
    );

    toy.style.transition =
        "transform .09s ease-out";

    toy.style.transform =
        "rotate(-1deg) scaleY(.965)";

    await wait(
        90
    );

    toy.style.transition =
        "transform .18s cubic-bezier(.2,.8,.3,1.3)";

    toy.style.transform =
        "rotate(.6deg) scaleY(1)";

    await wait(
        180
    );

    toy.style.transition =
        "transform .14s ease-out";

    toy.style.transform =
        "rotate(0deg)";

    await wait(
        150
    );

    /*
       Возвращаем домой.
    */

    toy.style.transition =
        "none";

    toy.style.top =
        "auto";

    toy.style.left =
        `${toyHome[index].left}px`;

    toy.style.bottom =
        `${toyHome[index].bottom}px`;

    toy.style.transform =
        "";

    toy.classList.remove(
        "caught",
        "dropping"
    );

    setCable(
        CABLE_HOME
    );

    await wait(
        980
    );

    await neutralClaw();

    grabbedToy =
        null;
}

/* =========================================================
   GRAB BUTTON
========================================================= */

grabButton.addEventListener(
    "click",
    async () => {

        if (
            busy ||
            waitingForPrize
        ) {
            return;
        }

        const toy =
            toys[
                currentSlot
            ];

        if (
            !toy
        ) {
            return;
        }

        if (
            getComputedStyle(
                toy
            ).opacity ===
            "0"
        ) {
            return;
        }

        busy =
            true;

        try {

            /*
               1. Открываем.
            */

            await openClaw();

            await wait(
                90
            );

            /*
               2. Опускаем открытой.
            */

            await lowerClawToToy(
                toy
            );

            await wait(
                140
            );

            /*
               3. Закрываем вокруг игрушки.
               Игрушка пока не прыгает.
            */

            await grabToyNaturally(
                toy
            );

            /*
               4. Проверяем.
            */

            const correct =
                toy.dataset.correct ===
                "true";

            if (
                correct
            ) {

                await correctSequence(
                    toy
                );

            } else {

                await wrongSequence(
                    toy,
                    currentSlot
                );
            }

        } finally {

            busy =
                false;
        }
    }
);

/* =========================================================
   PRIZE CLICK
========================================================= */

prizeToy.addEventListener(
    "click",
    () => {

        if (
            !waitingForPrize
        ) {
            return;
        }

        if (
            !prizeToy
            .classList
            .contains(
                "show"
            )
        ) {
            return;
        }

        const wonToySrc =
            prizeToy.src;

        prizeToy.style.pointerEvents =
            "none";

        bigPrizeToy.src =
            wonToySrc;

        prizeToy.classList.remove(
            "show"
        );

        addToyToPouch(
            wonToySrc
        );

        prizeOverlay.classList.add(
            "show"
        );

        if (
            roundIndex ===
            ROUNDS.length -
            1
        ) {

            nextButton.style.display =
                "none";

            finalText.style.display =
                "block";
        }
    }
);

/* =========================================================
   NEXT
========================================================= */

nextButton.addEventListener(
    "click",
    async () => {

        if (
            roundIndex >=
            ROUNDS.length -
            1
        ) {
            return;
        }

        nextButton.disabled =
            true;

        prizeOverlay.classList.remove(
            "show"
        );

        await wait(
            380
        );

        bigPrizeToy.src =
            "";

        roundIndex++;

        loadRound(
            roundIndex
        );

        nextButton.disabled =
            false;
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            leftButton.click();
        }

        if (
            event.key ===
            "ArrowRight"
        ) {

            rightButton.click();
        }

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            grabButton.click();
        }
    }
);

/* =========================================================
   START
========================================================= */

createBalls();

loadRound(
    roundIndex
);

</script>
